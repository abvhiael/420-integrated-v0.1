name: 420Automation

on:
  push:
    paths:
      - '420-automation/**'
      - 'docs/420AUTOMATION-ROADMAP.md'
      - 'docs/420AUTOMATION-ARCHITECTURE.md'
      - '.github/workflows/420-automation.yml'
  pull_request:
    paths:
      - '420-automation/**'
      - 'docs/420AUTOMATION-ROADMAP.md'
      - 'docs/420AUTOMATION-ARCHITECTURE.md'
      - '.github/workflows/420-automation.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 420-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm test
