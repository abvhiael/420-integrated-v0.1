name: 420Indexer

on:
  pull_request:
    paths:
      - '420-indexer/**'
      - 'contracts/config/compute-market/cmp-7.10-phase-closeout.json'
      - 'docs/compute-market/CMP-7.10-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-7-10-closeout.py'
      - '.github/workflows/420-indexer.yml'
  push:
    paths:
      - '420-indexer/**'
      - 'contracts/config/compute-market/cmp-7.10-phase-closeout.json'
      - 'docs/compute-market/CMP-7.10-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-7-10-closeout.py'
      - '.github/workflows/420-indexer.yml'

jobs:
  test:
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'audit/') || contains(github.head_ref, '-audit-'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 420-indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm test
