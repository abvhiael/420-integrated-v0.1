name: 420AI Audit Qualification

on:
  pull_request:
    paths:
      - 'contracts/src/ai/**'
      - 'services/420ai-provider/**'
      - 'contracts/config/genesis-dapp-contract-map.json'
      - 'config/ai-genesis.json'
      - 'config/system-addresses.json'
      - 'contracts/config/system-addresses.json'
      - 'contracts/config/deployment-manifest.json'
      - 'contracts/config/genesis-canonical-addresses.json'
      - 'contracts/config/predeploy/predeploy-plan.json'
      - 'contracts/test/AI*420.t.sol'
      - 'docs/420-AI-V1-ARCHITECTURE.md'
      - 'docs/architecture/infrastructure/420ai-compute-infrastructure.md'
      - 'docs/apps/ai/**'
      - 'docs/audit/420AI-**'
      - 'scripts/verify-420ai-audit-state.py'
      - 'scripts/verify-420ai-genesis-compatibility.py'
      - 'scripts/verify-420ai-v1-modules.py'
      - 'scripts/verify-420ai-compute-integration.py'
      - 'scripts/verify-420ai-provider-runtime.py'
      - '.github/workflows/420ai-audit.yml'
  workflow_dispatch:

concurrency:
  group: 420ai-audit-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify durable 420AI audit state
        run: python3 scripts/verify-420ai-audit-state.py

  genesis-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen 420AI Genesis compatibility
        run: python3 scripts/verify-420ai-genesis-compatibility.py

  v1-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify canonical 420AI V1 modules
        run: python3 scripts/verify-420ai-v1-modules.py

  compute-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current ComputeMarket integration
        run: python3 scripts/verify-420ai-compute-integration.py

  provider-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/420ai-provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 420AI provider runtime tests
        run: npm test
      - name: Verify AI-AUDIT-6 provider runtime boundaries
        working-directory: .
        run: python3 scripts/verify-420ai-provider-runtime.py

  focused-ai-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build implemented 420AI contracts
        run: forge build src/ai
      - name: Run implemented 420AI contract suites
        run: forge test --match-path 'test/AI*420.t.sol'
