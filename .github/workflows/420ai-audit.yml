name: 420AI Audit Qualification

on:
  pull_request:
    paths:
      - 'contracts/src/ai/**'
      - 'services/420ai-provider/**'
      - 'docs/apps/ai/developer/api.md'
      - 'scripts/verify-420ai-read-api.py'
      - '420-indexer/**'
      - 'ai/web/**'
      - 'scripts/verify-420ai-client.py'
      - 'contracts/config/genesis-dapp-contract-map.json'
      - 'config/ai-genesis.json'
      - 'config/system-addresses.json'
      - 'contracts/config/system-addresses.json'
      - 'contracts/config/deployment-manifest.json'
      - 'contracts/config/genesis-canonical-addresses.json'
      - 'contracts/config/genesis-address-namespace.json'
      - 'contracts/config/predeploy/predeploy-plan.json'
      - 'contracts/test/AI*420.t.sol'
      - 'docs/420-AI-V1-ARCHITECTURE.md'
      - 'docs/architecture/infrastructure/420ai-compute-infrastructure.md'
      - 'docs/apps/ai/**'
      - 'docs/audit/420AI-**'
      - 'scripts/verify-420ai-audit-state.py'
      - 'scripts/verify-420ai-genesis-compatibility.py'
      - 'scripts/verify-420ai-v1-modules.py'
      - 'scripts/verify-420ai-compute-integration.py'
      - 'scripts/verify-420ai-custody-settlement.py'
      - 'scripts/verify-420ai-deployment-materialization.py'
      - 'contracts/config/ai/**'
      - 'contracts/test/AIDeploymentMaterialization420.t.sol'
      - 'scripts/verify-420ai-provider-runtime.py'
      - 'scripts/verify-420ai-pretestnet.py'
      - '.github/workflows/420ai-audit.yml'
  workflow_dispatch:

concurrency:
  group: 420ai-audit-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify durable 420AI audit state
        run: python3 scripts/verify-420ai-audit-state.py

  genesis-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen 420AI Genesis compatibility
        run: python3 scripts/verify-420ai-genesis-compatibility.py

  v1-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify canonical 420AI V1 modules
        run: python3 scripts/verify-420ai-v1-modules.py

  compute-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current ComputeMarket integration
        run: python3 scripts/verify-420ai-compute-integration.py

  custody-settlement:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Run AI custody/economic reconciliation suite
        run: forge test --match-path 'test/AICustodySettlement420.t.sol'
      - name: Run AI to CMP integration suite
        run: forge test --match-path 'test/AIComputeIntegration420.t.sol'
      - name: Retain CMP Vault funding qualification
        run: forge test --match-path 'test/ComputeEscrowFunding420.t.sol'
      - name: Retain CMP provider payout/refund qualification
        run: forge test --match-path 'test/ComputeVerifiedEntitlement420.t.sol'
      - name: Retain objective dispute slash evidence qualification
        run: forge test --match-path 'test/ComputeVerifierDisputeSlashEvidence420.t.sol'
      - name: Retain objective slash authorization qualification
        run: forge test --match-path 'test/ComputeStakeSlashAuthorization420.t.sol'
      - name: Verify AI-AUDIT-5 custody/settlement/dispute boundaries
        working-directory: .
        run: python3 scripts/verify-420ai-custody-settlement.py


  deployment-materialization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact AI qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build AI deployment graph
        run: forge build src/ai test/AIDeploymentMaterialization420.t.sol
      - name: Materialize frozen predeploys and Registry-resolved V1 graph
        run: forge test --match-path 'test/AIDeploymentMaterialization420.t.sol' -vv
      - name: Verify AI-AUDIT-9 deployment/materialization boundaries
        working-directory: .
        run: python3 scripts/verify-420ai-deployment-materialization.py

  provider-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/420ai-provider
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 420AI provider runtime tests
        run: npm test
      - name: Verify AI-AUDIT-6 provider runtime boundaries
        working-directory: .
        run: python3 scripts/verify-420ai-provider-runtime.py

  ai-read-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact AI qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install 420Indexer dependencies
        working-directory: 420-indexer
        run: npm install --no-audit --no-fund
      - name: Build 420Indexer
        working-directory: 420-indexer
        run: npm run build
      - name: Run AI read/indexer qualification tests
        run: node --test --test-concurrency=1 420-indexer/dist/test/ai420-descriptors.test.js 420-indexer/dist/test/ai420-read-model.test.js 420-indexer/dist/test/api-contract.test.js 420-indexer/dist/test/api-surface.test.js 420-indexer/dist/test/http-transport.test.js 420-indexer/dist/test/reorg.test.js
      - name: Verify AI-AUDIT-7 read API/indexer boundaries
        run: python3 scripts/verify-420ai-read-api.py

  ai-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact AI qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test 420AI browser client
        working-directory: ai/web
        run: npm run build
      - name: Verify AI-AUDIT-8 client boundaries
        run: python3 scripts/verify-420ai-client.py

  focused-ai-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build implemented 420AI contracts
        run: forge build src/ai
      - name: Run implemented 420AI contract suites
        run: forge test --match-path 'test/AI*420.t.sol'


  pretestnet-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact AI qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify clean checkout
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean AI pre-testnet build
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          forge clean
          forge fmt --check src/ai test/AI*420.t.sol test/ComputeEscrowFunding420.t.sol test/ComputeVerifiedEntitlement420.t.sol test/ComputeVerifierDisputeSlashEvidence420.t.sol test/ComputeStakeSlashAuthorization420.t.sol test/RegistryApiReconciliation420.t.sol test/RegistryGenesis420.t.sol test/RegistryIdentityNames420.t.sol test/Identity420Compatibility.t.sol test/Identity420Audit.t.sol
          forge build src/ai test/AI*420.t.sol test/ComputeEscrowFunding420.t.sol test/ComputeVerifiedEntitlement420.t.sol test/ComputeVerifierDisputeSlashEvidence420.t.sol test/ComputeStakeSlashAuthorization420.t.sol test/RegistryApiReconciliation420.t.sol test/RegistryGenesis420.t.sol test/RegistryIdentityNames420.t.sol test/Identity420Compatibility.t.sol test/Identity420Audit.t.sol --sizes
      - name: Run focused AI Foundry inventory
        working-directory: contracts
        run: forge test --match-path 'test/AI*420.t.sol' -vv
      - name: Run required CMP Vault Registry Identity integration
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          for test_file in             test/ComputeEscrowFunding420.t.sol             test/ComputeVerifiedEntitlement420.t.sol             test/ComputeVerifierDisputeSlashEvidence420.t.sol             test/ComputeStakeSlashAuthorization420.t.sol             test/RegistryApiReconciliation420.t.sol             test/RegistryGenesis420.t.sol             test/RegistryIdentityNames420.t.sol             test/Identity420Compatibility.t.sol             test/Identity420Audit.t.sol
          do
            forge test --match-path "$test_file" -vv
          done
      - name: Run AI docs and boundary verifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-420ai-audit-state.py
          python3 scripts/verify-420ai-genesis-compatibility.py
          python3 scripts/verify-420ai-v1-modules.py
          python3 scripts/verify-420ai-compute-integration.py
          python3 scripts/verify-420ai-custody-settlement.py
          python3 scripts/verify-420ai-deployment-materialization.py
          python3 scripts/verify-420ai-provider-runtime.py
          python3 scripts/verify-420ai-read-api.py
          python3 scripts/verify-420ai-client.py
          python3 scripts/verify-420ai-pretestnet.py
      - name: Build and test provider service
        working-directory: services/420ai-provider
        run: npm run build
      - name: Build AI read API
        working-directory: 420-indexer
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run build
          node --test --test-concurrency=1 dist/test/ai420-descriptors.test.js dist/test/ai420-read-model.test.js dist/test/api-contract.test.js dist/test/api-surface.test.js dist/test/http-transport.test.js dist/test/reorg.test.js
      - name: Build and test AI browser application
        working-directory: ai/web
        run: npm run build
      - name: Remove qualification outputs
        run: rm -rf contracts/out contracts/cache 420-indexer/node_modules 420-indexer/dist services/420ai-provider/node_modules ai/web/node_modules
      - name: Verify no repository drift
        run: test -z "$(git status --porcelain --untracked-files=all)"

  pretestnet-security:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FOUNDRY_PROFILE: hardening
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact AI qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Run AI hardening Foundry inventory
        working-directory: contracts
        run: forge test --match-path 'test/AI*420.t.sol' -vv
      - name: Reject dangerous AI primitives
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '\btx\.origin\b|\bselfdestruct\s*\(|\.delegatecall\s*\(' contracts/src/ai; then
            echo 'Forbidden primitive found in 420AI sources' >&2
            exit 1
          fi
      - name: Install Slither
        run: python -m pip install --disable-pip-version-check slither-analyzer
      - name: Targeted AI Slither high-severity gate
        working-directory: contracts
        shell: bash
        run: |
          cat > AI420AuditSlitherTarget.sol <<'SOL'
          // SPDX-License-Identifier: GPL-3.0
          pragma solidity ^0.8.24;
          import "./src/ai/AIProviderRegistry.sol";
          import "./src/ai/AIModelRegistry.sol";
          import "./src/ai/AIJobManager.sol";
          import "./src/ai/AIJobEscrow.sol";
          import "./src/ai/AIReputationRegistry.sol";
          import "./src/ai/AIAuthorization420.sol";
          import "./src/ai/AIPolicyRegistry420.sol";
          import "./src/ai/AIModelDeploymentRegistry420.sol";
          import "./src/ai/AIRequestRegistry420.sol";
          import "./src/ai/AIResultRegistry420.sol";
          import "./src/ai/AIComputeAdapter420.sol";
          import "./src/ai/AIRouter420.sol";
          SOL
          set +e
          slither AI420AuditSlitherTarget.sol --json /tmp/ai-slither.json >/tmp/ai-slither.txt 2>&1
          STATUS=$?
          set -e
          rm -f AI420AuditSlitherTarget.sol
          python - <<'PY'
          import json, pathlib
          report_path=pathlib.Path("/tmp/ai-slither.json")
          log_path=pathlib.Path("/tmp/ai-slither.txt")
          if not report_path.exists():
              print(log_path.read_text(errors="replace"))
              raise SystemExit("Slither did not produce JSON output")
          report=json.loads(report_path.read_text())
          if report.get("success") is not True:
              print(log_path.read_text(errors="replace"))
              raise SystemExit(f"Slither analysis failed: {report.get('error') or 'unknown error'}")
          findings=[]
          high=[]
          for detector in report.get("results",{}).get("detectors",[]):
              ai=[e for e in detector.get("elements",[]) if e.get("source_mapping",{}).get("filename_relative","").startswith("src/ai/")]
              if not ai:
                  continue
              item={"check":detector.get("check"),"impact":detector.get("impact"),"confidence":detector.get("confidence")}
              findings.append(item)
              if detector.get("impact")=="High":
                  high.append(item)
          print(json.dumps({"aiFindings":findings,"highSeverity":high},indent=2))
          if high:
              raise SystemExit("High-severity Slither finding in AI source")
          PY
