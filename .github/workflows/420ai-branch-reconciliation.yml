name: 420AI Branch Reconciliation
on:
  pull_request:
    paths:
      - 'scripts/verify-420ai-branch-reconciliation.py'
      - '.github/workflows/420ai-branch-reconciliation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Capture full branch snapshot
        run: |
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git ls-remote --heads origin > /tmp/remote-heads.txt
          python3 - <<'PY'
          import subprocess
          remote = {r.split()[1].removeprefix("refs/heads/"):r.split()[0] for r in open("/tmp/remote-heads.txt")}
          local = {}
          for r in subprocess.check_output(["git","for-each-ref","--format=%(objectname) %(refname)","refs/remotes/origin"],text=True).splitlines():
              sha,ref = r.split()
              if ref != "refs/remotes/origin/HEAD":
                  local[ref.removeprefix("refs/remotes/origin/")] = sha
          if remote != local:
              raise SystemExit("Branch snapshot moved during capture; retry with fresh refs")
          print(f"Verified {len(local)} remote refs")
          PY
      - name: Reconcile every branch and distinct HEAD
        run: python3 scripts/verify-420ai-branch-reconciliation.py --main origin/main --output /tmp/420ai-branch-reconciliation.json
      - uses: actions/upload-artifact@v4
        with:
          name: 420ai-branch-reconciliation
          path: |
            /tmp/420ai-branch-reconciliation.json
            /tmp/remote-heads.txt
          if-no-files-found: error
