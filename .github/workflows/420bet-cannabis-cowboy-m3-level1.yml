name: Cannabis Cowboy M3 targeted Level 1
on:
  pull_request:
    paths:
      - 'clients/420bet-lobby/src/cannabis-cowboy-*.js'
      - 'clients/420bet-lobby/src/cannabis-cowboy.css'
      - 'clients/420bet-lobby/src/main.js'
      - 'clients/420bet-lobby/src/slots-lobby.js'
      - 'clients/420bet-lobby/tests/cannabis-cowboy-*.test.mjs'
      - 'clients/420bet-lobby/tests/slots-lobby.test.mjs'
      - '.github/workflows/420bet-cannabis-cowboy-m3-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cowboy-m3-level1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated dependencies
        working-directory: clients/420bet-lobby
        run: npm install --no-audit --no-fund
      - name: Run affected M1-M3 targeted tests
        working-directory: clients/420bet-lobby
        run: node --test tests/slots-lobby.test.mjs tests/cannabis-cowboy-m2.test.mjs tests/cannabis-cowboy-m3.test.mjs
      - name: Compile Vite application
        working-directory: clients/420bet-lobby
        run: npm run build
