name: Cannabis Cowboy M4 targeted Level 1
on:
  pull_request:
    paths:
      - 'clients/420bet-lobby/src/cannabis-cowboy-engine.js'
      - 'clients/420bet-lobby/src/cannabis-cowboy-game.js'
      - 'clients/420bet-lobby/src/cannabis-cowboy-ui.js'
      - 'clients/420bet-lobby/src/cannabis-cowboy.css'
      - 'clients/420bet-lobby/tests/cannabis-cowboy-*.test.mjs'
      - '.github/workflows/420bet-cannabis-cowboy-m4-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cowboy-m4-level1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated lobby dependencies
        working-directory: clients/420bet-lobby
        run: npm install --no-audit --no-fund
      - name: Run only affected M2–M4 test files
        working-directory: clients/420bet-lobby
        run: node --test tests/cannabis-cowboy-m2.test.mjs tests/cannabis-cowboy-m3.test.mjs tests/cannabis-cowboy-m4.test.mjs
      - name: Verify application production build
        working-directory: clients/420bet-lobby
        run: npm run build
