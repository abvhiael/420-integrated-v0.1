name: Cannabis Cowboy M8 math audit
on:
  pull_request:
    paths:
      - 'clients/420bet-lobby/src/cannabis-cowboy-engine.js'
      - 'clients/420bet-lobby/src/cannabis-cowboy-road-trip.js'
      - 'clients/420bet-lobby/scripts/cannabis-cowboy-m8-*.mjs'
      - 'clients/420bet-lobby/tests/cannabis-cowboy-m8.test.mjs'
      - '.github/workflows/420bet-cannabis-cowboy-m8-math.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cowboy-m8-math:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated dependencies
        working-directory: clients/420bet-lobby
        run: npm install --no-audit --no-fund
      - name: Qualify affected M3–M8 engine regressions
        working-directory: clients/420bet-lobby
        run: node --test tests/cannabis-cowboy-m3.test.mjs tests/cannabis-cowboy-m4.test.mjs tests/cannabis-cowboy-m5.test.mjs tests/cannabis-cowboy-m6.test.mjs tests/cannabis-cowboy-m8.test.mjs
      - name: Verify production build after M8 engine calibration
        working-directory: clients/420bet-lobby
        run: npm run build
      - name: Run deterministic RTP audits across wager levels
        working-directory: clients/420bet-lobby
        run: |
          node scripts/cannabis-cowboy-m8-audit.mjs --samples 200000 --seed 7654321 --bet 10 --output artifacts/cannabis-cowboy-m8/rtp-bet10.json
          node scripts/cannabis-cowboy-m8-audit.mjs --samples 200000 --seed 7654321 --bet 20 --output artifacts/cannabis-cowboy-m8/rtp-bet20.json
          node scripts/cannabis-cowboy-m8-audit.mjs --samples 200000 --seed 7654321 --bet 50 --output artifacts/cannabis-cowboy-m8/rtp-bet50.json
      - name: Exact-trigger weighted RTP and bonus-tail qualification
        working-directory: clients/420bet-lobby
        run: |
          node scripts/cannabis-cowboy-m8-stratified.mjs --base 1000000 --feature3 250000 --feature4 40000 --feature5 8000 --feature6 2000 --seed 7654321 --bet 10 --output artifacts/cannabis-cowboy-m8/stratified-bet10.json
          node scripts/cannabis-cowboy-m8-stratified.mjs --base 1000000 --feature3 250000 --feature4 40000 --feature5 8000 --feature6 2000 --seed 7654321 --bet 20 --output artifacts/cannabis-cowboy-m8/stratified-bet20.json
          node scripts/cannabis-cowboy-m8-stratified.mjs --base 1000000 --feature3 250000 --feature4 40000 --feature5 8000 --feature6 2000 --seed 7654321 --bet 50 --output artifacts/cannabis-cowboy-m8/stratified-bet50.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cowboy-m8-math-diagnostic
          path: clients/420bet-lobby/artifacts/cannabis-cowboy-m8/
          retention-days: 14
