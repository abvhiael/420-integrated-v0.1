name: Cannabis Cowboy M8 narrow-interval precision
on:
  pull_request:
    paths:
      - '.github/workflows/420bet-cannabis-cowboy-m8-precision.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m8-precision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated dependencies
        working-directory: clients/420bet-lobby
        run: npm install --no-audit --no-fund
      - name: Independently qualify minimum and maximum bet confidence intervals
        working-directory: clients/420bet-lobby
        run: |
          node scripts/cannabis-cowboy-m8-stratified.mjs --base 1000000 --feature3 500000 --feature4 80000 --feature5 16000 --feature6 4000 --seed 7654321 --bet 10 --output artifacts/cannabis-cowboy-m8/precision-bet10.json
          node scripts/cannabis-cowboy-m8-stratified.mjs --base 1000000 --feature3 500000 --feature4 80000 --feature5 16000 --feature6 4000 --seed 7654321 --bet 50 --output artifacts/cannabis-cowboy-m8/precision-bet50.json
          node --input-type=module -e "import {readFileSync} from 'node:fs'; for(const b of [10,50]){const r=JSON.parse(readFileSync('artifacts/cannabis-cowboy-m8/precision-bet'+b+'.json')); console.log('BET',b,'RTP',r.expected.totalRtp,'95%CI',r.expected.ci95,'REJECTIONS',r.rejections); if(!r.qualified)process.exitCode=1;}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cowboy-m8-precision-math
          path: clients/420bet-lobby/artifacts/cannabis-cowboy-m8/precision-*.json
          retention-days: 14
