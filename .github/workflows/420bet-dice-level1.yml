name: 420Bet Dice Level 1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/420bet-dice-level1.yml'
      - 'clients/420bet-dice-v1/scripts/local-deploy-smoke.mjs'
      - 'contracts/src/bet/**'
      - 'contracts/test/BetDice*.t.sol'
      - 'contracts/test/BetWagerAcceptance420.t.sol'
      - 'contracts/test/BetRandomness420.t.sol'
      - 'contracts/test/BetRandomnessTerminal420.t.sol'
      - 'contracts/test/BetSettlementEngine420.t.sol'
      - 'contracts/test/BetBankrollRisk420.t.sol'
      - 'contracts/test/BetTerminalPathInvariant420.t.sol'
      - 'contracts/test/BetCasinoSettlementInvariant420.t.sol'
      - 'contracts/test/BetCasinoSolvencyConvergence420.t.sol'

concurrency:
  group: 420bet-dice-level1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dice-level1:
    name: Dice targeted Foundry qualification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - name: Checkout exact input
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record and verify exact implementation SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'Implementation SHA: %s\n' "$actual"
          test "$actual" = "$EXPECTED_SHA"
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Preflight mandatory Dice suite discovery (no compilation)
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          names = ('BetDiceV1420 BetDiceVerticalSlice420 BetDiceV1View420 BetDicePostSettlementVerification420 '
                   'BetWagerAcceptance420 BetRandomness420 BetRandomnessTerminal420 BetSettlementEngine420 '
                   'BetBankrollRisk420 BetTerminalPathInvariant420 BetCasinoSettlementInvariant420 '
                   'BetCasinoSolvencyConvergence420').split()
          assert len(names) == len(set(names)) == 12
          for name in names:
              path = Path('test') / f'{name}.t.sol'
              assert path.is_file(), f'missing required suite: {path}'
              content = path.read_text()
              assert re.search(r'\\bcontract\\s+' + re.escape(name + 'Test') + r'\\s+is\\b', content), f'missing required test contract: {path}'
              assert re.search(r'\\bfunction\\s+(?:test|invariant|statefulFuzz)\\w*\\s*\\(', content), f'no tests/invariants: {path}'
              print(f'DISCOVERED: {path}::{name}Test')
          print('Preflight PASS: all 12 required test contracts and test functions present')
          PY
      - name: Run all required Dice and shared suites in one Foundry invocation
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          suites=(
            BetDiceV1420
            BetDiceVerticalSlice420
            BetDiceV1View420
            BetDicePostSettlementVerification420
            BetWagerAcceptance420
            BetRandomness420
            BetRandomnessTerminal420
            BetSettlementEngine420
            BetBankrollRisk420
            BetTerminalPathInvariant420
            BetCasinoSettlementInvariant420
            BetCasinoSolvencyConvergence420
          )
          for suite in "${suites[@]}"; do
            file="test/${suite}.t.sol"
            test -f "$file" || { echo "::error::Missing required suite $file"; exit 1; }
            grep -Eq 'function[[:space:]]+(test|invariant|statefulFuzz)' "$file" || {
              echo "::error::No test/invariant function in $file"; exit 1;
            }
          done
          # Compile once and execute once. Verify the actual JSON result keys,
          # rather than trusting a green command with empty test selection.
          # Foundry --match-path is a glob, not a regex. Match exact verified
          # test CONTRACT names with Foundry's regex-based --match-contract.
          regex='^(BetDiceV1420|BetDiceVerticalSlice420|BetDiceV1View420|BetDicePostSettlementVerification420|BetWagerAcceptance420|BetRandomness420|BetRandomnessTerminal420|BetSettlementEngine420|BetBankrollRisk420|BetTerminalPathInvariant420|BetCasinoSettlementInvariant420|BetCasinoSolvencyConvergence420)Test$'
          forge test --match-contract "$regex" --json > "$RUNNER_TEMP/dice-level1.json"
          python3 - "$RUNNER_TEMP/dice-level1.json" <<'PY'
          import json, sys
          path=sys.argv[1]
          expected=[
              "BetDiceV1420", "BetDiceVerticalSlice420", "BetDiceV1View420",
              "BetDicePostSettlementVerification420", "BetWagerAcceptance420",
              "BetRandomness420", "BetRandomnessTerminal420",
              "BetSettlementEngine420", "BetBankrollRisk420",
              "BetTerminalPathInvariant420", "BetCasinoSettlementInvariant420",
              "BetCasinoSolvencyConvergence420",
          ]
          data=json.load(open(path))
          seen=set()
          count=0
          failures=[]
          for key, val in data.items():
              if not isinstance(val, dict) or not isinstance(val.get("test_results"), dict):
                  continue
              for name in expected:
                  if f"test/{name}.t.sol:" in key:
                      seen.add(name)
              for test, outcome in val["test_results"].items():
                  count += 1
                  if outcome.get("status") != "Success":
                      failures.append((key, test, outcome.get("status")))
          missing=set(expected)-seen
          print(f"Executed {count} tests across {len(seen)}/12 required suites")
          for name in sorted(seen):
              print(f"  PASS inventory: {name}")
          if missing or failures or count < 12:
              print("Missing required suites:", sorted(missing))
              print("Non-success tests:", failures)
              sys.exit(1)
          PY

          forge test --match-path "$regex" --json > "$RUNNER_TEMP/dice-level1.json"
          python3 - "$RUNNER_TEMP/dice-level1.json" <<'PY'
          import json, sys
          path=sys.argv[1]
          expected=[
              "BetDiceV1420", "BetDiceVerticalSlice420", "BetDiceV1View420",
              "BetDicePostSettlementVerification420", "BetWagerAcceptance420",
              "BetRandomness420", "BetRandomnessTerminal420",
              "BetSettlementEngine420", "BetBankrollRisk420",
              "BetTerminalPathInvariant420", "BetCasinoSettlementInvariant420",
              "BetCasinoSolvencyConvergence420",
          ]
          data=json.load(open(path))
          seen=set()
          count=0
          failures=[]
          for key, val in data.items():
              if not isinstance(val, dict) or not isinstance(val.get("test_results"), dict):
                  continue
              for name in expected:
                  if f"test/{name}.t.sol:" in key:
                      seen.add(name)
              for test, outcome in val["test_results"].items():
                  count += 1
                  if outcome.get("status") != "Success":
                      failures.append((key, test, outcome.get("status")))
          missing=set(expected)-seen
          print(f"Executed {count} tests across {len(seen)}/12 required suites")
          for name in sorted(seen):
              print(f"  PASS inventory: {name}")
          if missing or failures or count < 12:
              print("Missing required suites:", sorted(missing))
              print("Non-success tests:", failures)
              sys.exit(1)
          PY
