name: 420Bet Dice Level 1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/420bet-dice-level1.yml'
      - 'clients/420bet-dice-v1/scripts/local-deploy-smoke.mjs'
      - 'contracts/src/bet/**'
      - 'contracts/test/BetDice*.t.sol'
      - 'contracts/test/BetWagerAcceptance420.t.sol'
      - 'contracts/test/BetRandomness420.t.sol'
      - 'contracts/test/BetRandomnessTerminal420.t.sol'
      - 'contracts/test/BetSettlementEngine420.t.sol'
      - 'contracts/test/BetBankrollRisk420.t.sol'
      - 'contracts/test/BetTerminalPathInvariant420.t.sol'
      - 'contracts/test/BetCasinoSettlementInvariant420.t.sol'
      - 'contracts/test/BetCasinoSolvencyConvergence420.t.sol'

concurrency:
  group: 420bet-dice-level1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dice-level1:
    name: Dice targeted Foundry qualification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - name: Checkout exact input
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record and verify exact implementation SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'Implementation SHA: %s\n' "$actual"
          test "$actual" = "$EXPECTED_SHA"
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build Dice protocol contracts
        working-directory: contracts
        run: forge build src/bet/DiceV1420.sol src/bet/DiceV1View420.sol
      - name: Run exact Dice and affected shared suites
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          suites=(
            BetDiceV1420
            BetDiceVerticalSlice420
            BetDiceV1View420
            BetDicePostSettlementVerification420
            BetWagerAcceptance420
            BetRandomness420
            BetRandomnessTerminal420
            BetSettlementEngine420
            BetBankrollRisk420
            BetTerminalPathInvariant420
            BetCasinoSettlementInvariant420
            BetCasinoSolvencyConvergence420
          )
          for suite in "${suites[@]}"; do
            file="test/${suite}.t.sol"
            test -f "$file" || { echo "::error::Missing mandatory test suite $file"; exit 1; }
            grep -Eq 'function[[:space:]]+(test|invariant|statefulFuzz)' "$file" || {
              echo "::error::No test functions in mandatory suite $file"
              exit 1
            }
            echo "::group::Qualify $suite"
            forge test --match-path "$file" -vvv
            echo "::endgroup::"
          done
