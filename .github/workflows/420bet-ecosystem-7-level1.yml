name: BET-AUDIT-7 ecosystem reconciliation Level 1
on:
  pull_request:
    paths:
      - 'clients/420bet-lobby/server/ecosystem.mjs'
      - 'clients/420bet-lobby/server/wallet-identity-sessions.mjs'
      - 'clients/420bet-lobby/server/wallet-signature-verifier.mjs'
      - 'clients/420bet-lobby/server/wallet-session-http.mjs'
      - 'clients/420bet-lobby/src/wallet-session.js'
      - 'clients/420bet-lobby/tests/wallet-session-http.test.mjs'
      - 'clients/420bet-lobby/server/canonical-identity-eligibility.mjs'
      - 'clients/420bet-lobby/tests/wallet-identity-integration.test.mjs'
      - 'clients/420bet-lobby/server/indexer-event-*.mjs'
      - 'clients/420bet-lobby/server/sync-indexer-events.mjs'
      - 'clients/420bet-lobby/tests/indexer-event-reader.test.mjs'
      - 'clients/420bet-lobby/package.json'
      - 'clients/420bet-lobby/tests/ecosystem.test.mjs'
      - 'docs/bet/BET-AUDIT-7-ECOSYSTEM-INTEGRATIONS.md'
      - 'docs/bet/BET-AUDIT-7-INDEXER-WORKSTREAM.md'
      - 'docs/bet/BET-AUDIT-7-WALLET-IDENTITY.md'
      - '.github/workflows/420bet-ecosystem-7-level1.yml'
  workflow_dispatch:
jobs:
  ecosystem-reconciliation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused event reconciliation tests
        run: node --test clients/420bet-lobby/tests/ecosystem.test.mjs clients/420bet-lobby/tests/indexer-event-reader.test.mjs clients/420bet-lobby/tests/history-service.test.mjs clients/420bet-lobby/tests/wallet-identity-integration.test.mjs clients/420bet-lobby/tests/wallet-session-http.test.mjs
      - name: Syntax validation
        run: |
          node --check clients/420bet-lobby/server/ecosystem.mjs
          node --check clients/420bet-lobby/server/wallet-identity-sessions.mjs
          node --check clients/420bet-lobby/server/wallet-signature-verifier.mjs
          node --check clients/420bet-lobby/server/wallet-session-http.mjs
          node --check clients/420bet-lobby/src/wallet-session.js
          node --check clients/420bet-lobby/tests/wallet-session-http.test.mjs
          node --check clients/420bet-lobby/server/canonical-identity-eligibility.mjs
          node --check clients/420bet-lobby/tests/wallet-identity-integration.test.mjs
          node --check clients/420bet-lobby/server/indexer-event-abi.mjs
          node --check clients/420bet-lobby/server/indexer-event-reader.mjs
          node --check clients/420bet-lobby/server/sync-indexer-events.mjs
          node --check clients/420bet-lobby/tests/indexer-event-reader.test.mjs
          node --check clients/420bet-lobby/tests/ecosystem.test.mjs
