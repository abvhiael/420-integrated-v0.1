name: 420Bet game and platform local qualification
on:
  pull_request:
    paths:
      - 'scripts/qualify-420bet-game-platform.py'
      - 'tests/test_420bet_game_platform_qualification.py'
      - 'docs/bet/BET-GAME-PLATFORM-QUALIFICATION.md'
      - '.github/workflows/420bet-game-platform-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-reference-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Fail-closed economics and release-inventory tests
        run: python3 -m unittest discover -s tests -p 'test_420bet_game_platform_qualification.py' -v
