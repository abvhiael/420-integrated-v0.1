name: 420Bet Genesis Capitalization
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/420bet-genesis-capitalization.yml'
      - 'contracts/src/bet/BetGenesisCapitalization420.sol'
      - 'contracts/src/bet/BankrollVault420.sol'
      - 'contracts/src/bet/VaultAccounting420.sol'
      - 'contracts/src/bet/BetAuthorization420.sol'
      - 'contracts/src/bet/BetIds420.sol'
      - 'contracts/src/bet/WithdrawalQueue420.sol'
      - 'contracts/src/treasury/**'
      - 'contracts/src/vault/**'
      - 'contracts/src/apps/ProtocolRegistry.sol'
      - 'contracts/src/system/**'
      - 'contracts/src/interfaces/**'
      - 'contracts/src/libraries/**'
      - 'contracts/test/BetGenesisCapitalization420.t.sol'
      - 'contracts/foundry.toml'
      - 'contracts/remappings.txt'
      - 'contracts/lib/**'
permissions:
  contents: read
jobs:
  capitalization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Exact-head focused capitalization integration
        working-directory: contracts
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FOUNDRY_PROFILE: pr
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          scope="$(mktemp -d "$PWD/.capitalization.XXXXXX")"
          trap 'rm -rf "$scope"' EXIT
          cp test/BetGenesisCapitalization420.t.sol "$scope/"
          export FOUNDRY_SRC="$scope/empty-src" FOUNDRY_TEST="$scope" FOUNDRY_SCRIPT="$scope/empty-script"
          mkdir -p "$FOUNDRY_SRC" "$FOUNDRY_SCRIPT"
          forge test --match-contract '^BetGenesisCapitalization420Test$' --json > "$RUNNER_TEMP/capitalization.json"
          python3 - "$RUNNER_TEMP/capitalization.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          suites = [v["test_results"] for k,v in data.items() if k.endswith(":BetGenesisCapitalization420Test")]
          assert len(suites) == 1 and len(suites[0]) >= 11
          assert all(v["status"] == "Success" for v in suites[0].values())
          print(f"PASS: {len(suites[0])} capitalization integration tests")
          PY
