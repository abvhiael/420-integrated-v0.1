name: 420Bet Poker Architecture 5A.1 Level 1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/bet/BET-AUDIT-5A.1-POKER-ARCHITECTURE.md'
      - 'scripts/bet/verify-5a-1-poker-architecture.mjs'
      - '.github/workflows/420bet-poker-5a-1-level1.yml'
permissions:
  contents: read
concurrency:
  group: 420bet-poker-5a-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Architecture, trust and authority scope acceptance
        run: node scripts/bet/verify-5a-1-poker-architecture.mjs
