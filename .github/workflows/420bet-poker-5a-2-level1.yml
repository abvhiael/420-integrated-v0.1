name: 420Bet Poker Table Registry 5A.2 Level 1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/420bet-poker-5a-2-level1.yml'
      - 'contracts/src/bet/PokerTableRegistry420.sol'
      - 'contracts/test/BetPokerTableRegistry52.t.sol'
permissions:
  contents: read
concurrency:
  group: 420bet-poker-5a-2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  table-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact implementation SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Qualify scoped table-registry authorization and lifecycle
        working-directory: contracts
        run: forge test --match-contract '^BetPokerTableRegistry52Test$' -vv
