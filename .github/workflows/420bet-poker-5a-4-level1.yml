name: 420Bet Poker Confidential Deal 5A.4 Scoped Level 1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'contracts/src/bet/PokerConfidentialDeal420.sol'
      - 'contracts/test/BetPokerConfidentialDeal54.t.sol'
      - 'contracts/src/bet/PokerDeckDisclosure420.sol'
      - 'contracts/src/bet/PokerRecipientKeys420.sol'
      - 'contracts/src/bet/PokerHandFinality420.sol'
      - 'contracts/test/BetPokerHandFinality54.t.sol'
      - 'contracts/src/bet/PokerHandAccountingProof420.sol'
      - 'contracts/test/BetPokerHandAccountingProof54.t.sol'
      - 'contracts/src/bet/PokerVerifiedTerminalGate420.sol'
      - 'contracts/test/BetPokerVerifiedTerminalGate54.t.sol'
      - 'contracts/src/bet/PokerPrivateShuffleGate420.sol'
      - 'contracts/test/BetPokerPrivateShuffleGate54.t.sol'
      - 'contracts/src/bet/PokerActionKeys420.sol'
      - 'contracts/test/BetPokerActionKeys54.t.sol'
      - 'contracts/src/bet/PokerFinalCardOpenings420.sol'
      - 'contracts/test/BetPokerFinalCardOpenings54.t.sol'
      - 'contracts/src/bet/PokerActionDisputeClock420.sol'
      - 'contracts/test/BetPokerActionDisputeClock54.t.sol'
      - 'contracts/src/bet/PokerCanonicalRake420.sol'
      - 'contracts/test/BetPokerCanonicalRake54.t.sol'
      - 'contracts/src/bet/PokerCanonicalEvidence420.sol'
      - 'contracts/test/BetPokerCanonicalEvidence54.t.sol'
      - 'contracts/src/bet/PokerVerifierVersions420.sol'
      - 'contracts/test/BetPokerVerifierVersions54.t.sol'
      - 'contracts/src/bet/PokerInitialEncryptedDeck420.sol'
      - 'contracts/src/bet/PokerGnarkElGamalAdapters420.sol'
      - 'contracts/src/bet/PokerNLHEBetting420.sol'
      - 'contracts/src/bet/PokerNativeOutcome420.sol'
      - 'contracts/test/BetPokerNativeOutcome54.t.sol'
      - 'contracts/src/bet/PokerHandRank420.sol'
      - 'contracts/test/BetPokerHandRank54.t.sol'
      - 'contracts/src/bet/PokerGnarkCardRevealAdapters420.sol'
      - 'contracts/src/bet/PokerGnarkEncryptedShareDeliveryAdapter420.sol'
      - 'contracts/src/bet/PokerGnarkRecipientKeyPoPAdapter420.sol'
      - 'contracts/src/bet/PokerDeliveryProofBook420.sol'
      - 'contracts/src/bet/PokerProviderAccountability420.sol'
      - 'contracts/src/bet/PokerGnarkThresholdKeyAggregateAdapter420.sol'
      - 'contracts/src/bet/PokerLiveCardReveals420.sol'
      - 'contracts/test/BetPokerLiveCardReveals54.t.sol'
      - 'contracts/test/BetPokerNLHEBetting54.t.sol'
      - 'contracts/test/BetPokerGnarkElGamalAdapters54.t.sol'
      - 'contracts/src/bet/PokerCanonicalSettlement420.sol'
      - 'contracts/test/BetPokerCanonicalSettlement54.t.sol'
      - 'contracts/src/bet/PokerSeatLedger420.sol'
      - 'contracts/test/BetPokerLedgerReentrancy54.t.sol'
      - 'contracts/test/BetPokerDeckDisclosure54.t.sol'
      - 'scripts/verify-420bet-poker-5a-4-state-model.py'
      - 'clients/420bet-poker/crypto/**'
      - 'clients/420bet-poker/zkshuffle/**'
      - '.github/workflows/420bet-poker-5a-4-level1.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: 420bet-poker-5a-4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  commitment-envelope:
    runs-on: ubuntu-latest
    env:
      # Solc 0.8.24 via-IR Yul stack-allocation failure is a compiler backend
      # issue; keep optimizer enabled and ALL test assertions intact.
      # This owner builds reproducible 420Bet bytecode using the legacy backend.
      FOUNDRY_VIA_IR: 'true'
      FOUNDRY_PROFILE: pr
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind tested SHA
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Exhaustive bounded delivery and recovery state-machine specification
        run: python3 scripts/verify-420bet-poker-5a-4-state-model.py
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare source-identical scoped poker Foundry test tree
        working-directory: contracts
        run: |
          set -e
          mkdir -p test/poker-l1
          find test -maxdepth 1 -type f -name '*Poker*.t.sol' -exec cp -t test/poker-l1/ {} +
          python3 -c "from pathlib import Path; files=Path('test/poker-l1').glob('*.t.sol'); [(p.write_text(p.read_text().replace('../src/', '../../src/'))) for p in files]"
          test -s test/poker-l1/BetPokerNLHEBetting54.t.sol
      - name: Verify inherited scoped Solidity integration and adversarial evidence
        id: solidity_scope
        run: |
          set -eu
          QUALIFIED=b600353cefdd4e2374f00a75361b626464aaf2ca
          git fetch --no-tags --depth=1 origin "$QUALIFIED"
          changed_files=$(git diff --name-only "$QUALIFIED" HEAD -- contracts/src/bet contracts/test clients/420bet-poker/crypto scripts/verify-420bet-poker-5a-4-state-model.py)
          if test -n "$changed_files"; then
            echo "$changed_files"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Source-identical funded and adversarial steps passed in run 39738506148 at $QUALIFIED; no repeat"
          fi
      - name: Qualify funded native hand and provider collateral integration
        if: steps.solidity_scope.outputs.changed == 'true'
        working-directory: contracts
        env:
          FOUNDRY_SRC: src/bet
          FOUNDRY_TEST: test/poker-l1
        run: forge test --match-path 'test/poker-l1/BetPokerNLHEBetting54.t.sol' -vv
      - name: Scope commitment adversarial + inherited seating/table regression
        if: steps.solidity_scope.outputs.changed == 'true'
        working-directory: contracts
        env:
          FOUNDRY_SRC: src/bet
          FOUNDRY_TEST: test/poker-l1
        run: forge test --match-contract '^(PokerNativeOutcome54Test|PokerHandRank54Test|PokerLiveCardReveals54Test|PokerGnarkElGamalAdapters54Test|PokerCanonicalSettlement54Test|PokerVerifierVersions54Test|PokerCanonicalEvidence54Test|PokerCanonicalRake54Test|PokerActionDisputeClock54Test|PokerFinalCardOpenings54Test|PokerActionKeys54Test|PokerPrivateShuffleGate54Test|PokerVerifiedTerminalGate54Test|PokerHandAccountingProof54Test|PokerHandFinality54Test|PokerDeckDisclosure54Test|PokerConfidentialDeal54Test|PokerSeatLedger53Test|BetPokerTableRegistry52Test)$' -vv
      - name: Verify confidential shuffle and encrypted seat delivery
        if: steps.solidity_scope.outputs.changed == 'true'
        run: node --test clients/420bet-poker/crypto/confidential-deal.test.mjs clients/420bet-poker/crypto/nlhe-replay.test.mjs clients/420bet-poker/crypto/nlhe-betting.test.mjs clients/420bet-poker/crypto/nlhe-verify-hand.test.mjs clients/420bet-poker/crypto/nlhe-economics.test.mjs clients/420bet-poker/crypto/nlhe-differential.test.mjs clients/420bet-poker/crypto/nlhe-pot-differential.test.mjs
      - name: Preserve inherited funded and adversarial step provenance
        if: steps.solidity_scope.outputs.changed == 'false'
        run: |
          mkdir -p artifacts/420bet-5a-4
          {
            echo 'original_integration_sha=b600353cefdd4e2374f00a75361b626464aaf2ca'
            echo 'original_integration_run=39738506148'
            echo 'original_integration_job=119690153849'
            echo 'inherited_steps=funded NLHE, scoped contract adversarial, confidential crypto client'
            echo 'qualification_note=source-identical steps passed; original overall job failed later during Go compile'
            echo "current_sha=$(git rev-parse HEAD)"
          } > artifacts/420bet-5a-4/inherited-solidity-step-provenance.txt
      - name: Upload inherited funded and adversarial step evidence
        if: steps.solidity_scope.outputs.changed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: 420bet-inherited-funded-step-provenance
          path: artifacts/420bet-5a-4/inherited-solidity-step-provenance.txt
          retention-days: 90
          if-no-files-found: error
      - name: Detect changes to previously qualified cryptographic sources
        id: cryptoscope
        run: |
          QUALIFIED=50f662efe92537b807f138f40a3871b01b0e84eb
          git fetch --no-tags --depth=1 origin "$QUALIFIED"
          changed_files=$(git diff --name-only "$QUALIFIED" HEAD -- clients/420bet-poker/zkshuffle | grep -Ev '(encrypted_share_delivery_circuit|recipient_key_possession_circuit|threshold_key_aggregate_circuit|make_private_delivery_adapter_forge_test|triage_slither_poker\.py)' || true)
          if test -z "$changed_files"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Unmodified Go cryptography inherits proof evidence run 39351176585 at $QUALIFIED"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Real Groth16 52-card permutation circuit qualification
        if: steps.cryptoscope.outputs.changed == 'true'
        env:
          POKER_ZK_ARTIFACT_DIR: ../../../artifacts/420bet-5a-4
        working-directory: clients/420bet-poker/zkshuffle
        run: go test -mod=mod -timeout 35m ./...
      - name: Retrieve proven original exact-SHA cryptographic artifacts
        if: steps.cryptoscope.outputs.changed == 'false'
        uses: actions/download-artifact@v4
        with:
          name: 420bet-5a-4-cryptographic-provenance
          run-id: 39351176585
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/420bet-5a-4
      - name: Verify recipient Groth16 qualification ownership
        id: recipient_scope
        run: |
          set -eu
          QUALIFIED=a7c212dfada23c1c9155f7e8d9f7b414c0113a73
          git fetch --no-tags --depth=1 origin "$QUALIFIED"
          changed_files=$(git diff --name-only "$QUALIFIED" HEAD -- \
            clients/420bet-poker/zkshuffle/encrypted_share_delivery_circuit.go \
            clients/420bet-poker/zkshuffle/encrypted_share_delivery_circuit_test.go \
            clients/420bet-poker/zkshuffle/recipient_key_possession_circuit.go \
            clients/420bet-poker/zkshuffle/recipient_key_possession_circuit_test.go \
            clients/420bet-poker/zkshuffle/threshold_key_aggregate_circuit.go \
            clients/420bet-poker/zkshuffle/threshold_key_aggregate_circuit_test.go \
            clients/420bet-poker/zkshuffle/go.mod \
            clients/420bet-poker/zkshuffle/go.sum \
            clients/420bet-poker/zkshuffle/make_groth16_forge_test.py \
            clients/420bet-poker/zkshuffle/make_private_delivery_adapter_forge_test.py \
            contracts/src/bet/PokerGnarkEncryptedShareDeliveryAdapter420.sol \
            contracts/src/bet/PokerGnarkRecipientKeyPoPAdapter420.sol \
            contracts/src/bet/PokerGnarkThresholdKeyAggregateAdapter420.sol \
            contracts/src/bet/PokerVerifierVersions420.sol)
          if test -n "$changed_files"; then
            printf '%s\n' "$changed_files"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Recipient Groth16 inputs unchanged; inherit passing owner run 39716632965 at $QUALIFIED"
          fi
      - name: Qualify new recipient Groth16 proof families
        if: steps.cryptoscope.outputs.changed == 'false' && steps.recipient_scope.outputs.changed == 'true'
        env:
          POKER_ZK_ARTIFACT_DIR: ../../../artifacts/420bet-5a-4
        working-directory: clients/420bet-poker/zkshuffle
        run: go test -mod=mod -timeout 20m -run '^(TestEncryptedShareDeliveryProofAndAdversarialRejections|TestRecipientPublicKeyProofOfPossession|TestGenuineProviderKeyAggregateProof)$' ./...
      - name: Record new proof digests
        if: steps.cryptoscope.outputs.changed == 'true' || steps.recipient_scope.outputs.changed == 'true'
        run: |
          mkdir -p artifacts/420bet-5a-4
          printf 'implementation_sha=%s\n' "$(git rev-parse HEAD)" > artifacts/420bet-5a-4/recipient-proof-provenance.txt
          sha256sum clients/420bet-poker/zkshuffle/encrypted_share_delivery_circuit.go clients/420bet-poker/zkshuffle/recipient_key_possession_circuit.go clients/420bet-poker/zkshuffle/threshold_key_aggregate_circuit.go > artifacts/420bet-5a-4/recipient-proof-source-sha256.txt
          sha256sum artifacts/420bet-5a-4/EXPERIMENTAL-EncryptedShareDeliveryVerifier.sol artifacts/420bet-5a-4/EXPERIMENTAL-RecipientKeyPossessionVerifier.sol artifacts/420bet-5a-4/EXPERIMENTAL-ThresholdKeyAggregateVerifier.sol > artifacts/420bet-5a-4/recipient-proof-artifact-sha256.txt
      - name: Upload new proof provenance
        if: steps.cryptoscope.outputs.changed == 'true' || steps.recipient_scope.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 420bet-5a-4-recipient-proof-provenance
          path: artifacts/420bet-5a-4/recipient-proof-*.txt
          retention-days: 90
          if-no-files-found: error
      - name: Record exact-SHA cryptographic provenance
        if: steps.cryptoscope.outputs.changed == 'true'
        run: |
          mkdir -p artifacts/420bet-5a-4
          git rev-parse HEAD > artifacts/420bet-5a-4/qualified-sha.txt
          sha256sum clients/420bet-poker/zkshuffle/circuit.go clients/420bet-poker/zkshuffle/reencryption_circuit.go clients/420bet-poker/zkshuffle/circuit_test.go clients/420bet-poker/zkshuffle/reencryption_circuit_test.go clients/420bet-poker/zkshuffle/reencryption_full52_test.go clients/420bet-poker/zkshuffle/initial_deck_circuit.go clients/420bet-poker/zkshuffle/initial_deck_circuit_test.go clients/420bet-poker/zkshuffle/initial_full52_test.go clients/420bet-poker/zkshuffle/proof_export_test.go clients/420bet-poker/zkshuffle/partial_decryption_circuit.go clients/420bet-poker/zkshuffle/partial_decryption_circuit_test.go clients/420bet-poker/zkshuffle/ciphertext_merkle.go clients/420bet-poker/zkshuffle/ciphertext_merkle_test.go clients/420bet-poker/zkshuffle/card_unmask_circuit.go clients/420bet-poker/zkshuffle/card_unmask_circuit_test.go clients/420bet-poker/zkshuffle/go.mod clients/420bet-poker/zkshuffle/encrypted_share_delivery_circuit.go clients/420bet-poker/zkshuffle/encrypted_share_delivery_circuit_test.go clients/420bet-poker/zkshuffle/recipient_key_possession_circuit.go clients/420bet-poker/zkshuffle/recipient_key_possession_circuit_test.go clients/420bet-poker/zkshuffle/threshold_key_aggregate_circuit.go clients/420bet-poker/zkshuffle/threshold_key_aggregate_circuit_test.go > artifacts/420bet-5a-4/cryptographic-source-sha256.txt
          cd clients/420bet-poker/zkshuffle
          go list -mod=mod -m all > ../../../artifacts/420bet-5a-4/go-module-versions.txt
          cp go.sum ../../../artifacts/420bet-5a-4/go.sum
          sha256sum ../../../artifacts/420bet-5a-4/EXPERIMENTAL-Reencrypt52Verifier.sol ../../../artifacts/420bet-5a-4/EXPERIMENTAL-Reencrypt52VerifyingKey.bin ../../../artifacts/420bet-5a-4/EXPERIMENTAL-Reencrypt52Proof.bin ../../../artifacts/420bet-5a-4/EXPERIMENTAL-Reencrypt52SolidityFixture.json ../../../artifacts/420bet-5a-4/EXPERIMENTAL-InitialDeck52Verifier.sol ../../../artifacts/420bet-5a-4/EXPERIMENTAL-InitialDeck52VK.bin ../../../artifacts/420bet-5a-4/EXPERIMENTAL-InitialDeck52Proof.bin > ../../../artifacts/420bet-5a-4/generated-proof-sha256.txt
          sha256sum ../../../artifacts/420bet-5a-4/EXPERIMENTAL-PartialShareVerifier.sol ../../../artifacts/420bet-5a-4/EXPERIMENTAL-PartialShareProof.bin ../../../artifacts/420bet-5a-4/EXPERIMENTAL-CardUnmaskVerifier.sol ../../../artifacts/420bet-5a-4/EXPERIMENTAL-CardUnmaskProof.bin >> ../../../artifacts/420bet-5a-4/generated-proof-sha256.txt
          sha256sum ../../../artifacts/420bet-5a-4/EXPERIMENTAL-EncryptedShareDeliveryVerifier.sol ../../../artifacts/420bet-5a-4/EXPERIMENTAL-EncryptedShareDeliveryProof.bin ../../../artifacts/420bet-5a-4/EXPERIMENTAL-EncryptedShareDeliverySolidityFixture.json >> ../../../artifacts/420bet-5a-4/generated-proof-sha256.txt
          sha256sum ../../../artifacts/420bet-5a-4/EXPERIMENTAL-RecipientKeyPossessionVerifier.sol ../../../artifacts/420bet-5a-4/EXPERIMENTAL-RecipientKeyPossessionProof.bin ../../../artifacts/420bet-5a-4/EXPERIMENTAL-RecipientKeyPossessionSolidityFixture.json >> ../../../artifacts/420bet-5a-4/generated-proof-sha256.txt
          sha256sum ../../../artifacts/420bet-5a-4/EXPERIMENTAL-ThresholdKeyAggregateVerifier.sol ../../../artifacts/420bet-5a-4/EXPERIMENTAL-ThresholdKeyAggregateProof.bin ../../../artifacts/420bet-5a-4/EXPERIMENTAL-ThresholdKeyAggregateSolidityFixture.json >> ../../../artifacts/420bet-5a-4/generated-proof-sha256.txt
          sha256sum go.sum >> ../../../artifacts/420bet-5a-4/cryptographic-source-sha256.txt
      - name: Upload exact-SHA proof provenance
        if: steps.cryptoscope.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 420bet-5a-4-cryptographic-provenance
          path: artifacts/420bet-5a-4/
          retention-days: 90
          if-no-files-found: error
      - name: Compile exact generated 52-card Solidity verifier
        if: steps.cryptoscope.outputs.changed == 'true'
        working-directory: contracts
        run: |
          mkdir -p src/bet/generated
          cp ../artifacts/420bet-5a-4/EXPERIMENTAL-Reencrypt52Verifier.sol src/bet/generated/ExperimentalReencrypt52Verifier.sol
          forge build src/bet/generated/ExperimentalReencrypt52Verifier.sol
          cp ../artifacts/420bet-5a-4/EXPERIMENTAL-InitialDeck52Verifier.sol src/bet/generated/ExperimentalInitialDeck52Verifier.sol
          forge build src/bet/generated/ExperimentalInitialDeck52Verifier.sol
      - name: Verify genuine 52-card proof against generated Solidity verifier
        if: steps.cryptoscope.outputs.changed == 'true'
        working-directory: contracts
        run: |
          python3 ../clients/420bet-poker/zkshuffle/make_full52_forge_test.py \
            src/bet/generated/ExperimentalReencrypt52Verifier.sol \
            ../artifacts/420bet-5a-4/EXPERIMENTAL-Reencrypt52SolidityFixture.json \
            test/PokerGeneratedProofAcceptance.t.sol
          python3 ../clients/420bet-poker/zkshuffle/make_groth16_forge_test.py \
            src/bet/generated/ExperimentalReencrypt52Verifier.sol \
            ../artifacts/420bet-5a-4/EXPERIMENTAL-Reencrypt52StageBSolidityFixture.json \
            test/PokerGeneratedStageBProof.t.sol PokerGeneratedStageBProofTest 3 2
          forge test --match-contract '^(PokerGeneratedProofAcceptanceTest|PokerGeneratedStageBProofTest)
          rm test/PokerGeneratedProofAcceptance.t.sol
      - name: Validate genuine initial-deck and selective-card Groth16 verifiers together
        if: steps.cryptoscope.outputs.changed == 'true'
        working-directory: contracts
        env:
          FOUNDRY_SRC: src/bet
          FOUNDRY_TEST: test/initial52-groth16
        run: |
          set -eu
          mkdir -p src/bet/generated test/initial52-groth16
          for kind in InitialDeck52 PartialShare CardUnmask; do
            cp "../artifacts/420bet-5a-4/EXPERIMENTAL-${kind}Verifier.sol" "src/bet/generated/Experimental${kind}Verifier.sol"
          done
          python3 ../clients/420bet-poker/zkshuffle/make_groth16_forge_test.py src/bet/generated/ExperimentalInitialDeck52Verifier.sol ../artifacts/420bet-5a-4/EXPERIMENTAL-InitialDeck52SolidityFixture.json test/initial52-groth16/PokerGeneratedInitialProof.t.sol PokerInitial52GeneratedVerifierAcceptanceTest 1 0
          python3 ../clients/420bet-poker/zkshuffle/make_initial52_adapter_forge_test.py src/bet/generated/ExperimentalInitialDeck52Verifier.sol ../artifacts/420bet-5a-4/EXPERIMENTAL-InitialDeck52SolidityFixture.json test/initial52-groth16/PokerActualInitial52AdapterProof.t.sol
          python3 ../clients/420bet-poker/zkshuffle/make_groth16_forge_test.py src/bet/generated/ExperimentalPartialShareVerifier.sol ../artifacts/420bet-5a-4/EXPERIMENTAL-PartialShareSolidityFixture.json test/initial52-groth16/PokerGeneratedShareProof.t.sol PokerShareGeneratedVerifierAcceptanceTest 0 1
          python3 ../clients/420bet-poker/zkshuffle/make_groth16_forge_test.py src/bet/generated/ExperimentalCardUnmaskVerifier.sol ../artifacts/420bet-5a-4/EXPERIMENTAL-CardUnmaskSolidityFixture.json test/initial52-groth16/PokerGeneratedUnmaskProof.t.sol PokerUnmaskGeneratedVerifierAcceptanceTest 0 1
          sed -i 's#../src/#../../src/#g' test/initial52-groth16/*.t.sol
          forge test -vv
          rm -rf test/initial52-groth16
      - name: Qualify genuine encrypted-share recipient-key aggregate adapters together
        if: steps.cryptoscope.outputs.changed == 'true' || steps.recipient_scope.outputs.changed == 'true'
        working-directory: contracts
        env:
          FOUNDRY_SRC: src/bet
          FOUNDRY_TEST: test/recipient-groth16
        run: |
          set -eu
          mkdir -p src/bet/generated test/recipient-groth16
          for kind in EncryptedShareDelivery RecipientKeyPossession ThresholdKeyAggregate; do
            cp "../artifacts/420bet-5a-4/EXPERIMENTAL-${kind}Verifier.sol" "src/bet/generated/Experimental${kind}Verifier.sol"
          done
          python3 ../clients/420bet-poker/zkshuffle/make_groth16_forge_test.py src/bet/generated/ExperimentalEncryptedShareDeliveryVerifier.sol ../artifacts/420bet-5a-4/EXPERIMENTAL-EncryptedShareDeliverySolidityFixture.json test/recipient-groth16/PokerGeneratedEncryptedDeliveryProof.t.sol PokerEncryptedDeliveryGeneratedVerifierAcceptanceTest 0 1
          python3 ../clients/420bet-poker/zkshuffle/make_groth16_forge_test.py src/bet/generated/ExperimentalRecipientKeyPossessionVerifier.sol ../artifacts/420bet-5a-4/EXPERIMENTAL-RecipientKeyPossessionSolidityFixture.json test/recipient-groth16/PokerGeneratedRecipientKeyProof.t.sol PokerRecipientKeyGeneratedVerifierAcceptanceTest 0 1
          python3 ../clients/420bet-poker/zkshuffle/make_private_delivery_adapter_forge_test.py delivery src/bet/generated/ExperimentalEncryptedShareDeliveryVerifier.sol ../artifacts/420bet-5a-4/EXPERIMENTAL-EncryptedShareDeliverySolidityFixture.json test/recipient-groth16/PokerActualDeliveryAdapterProof.t.sol
          python3 ../clients/420bet-poker/zkshuffle/make_private_delivery_adapter_forge_test.py recipient src/bet/generated/ExperimentalRecipientKeyPossessionVerifier.sol ../artifacts/420bet-5a-4/EXPERIMENTAL-RecipientKeyPossessionSolidityFixture.json test/recipient-groth16/PokerActualRecipientAdapterProof.t.sol
          python3 ../clients/420bet-poker/zkshuffle/make_groth16_forge_test.py src/bet/generated/ExperimentalThresholdKeyAggregateVerifier.sol ../artifacts/420bet-5a-4/EXPERIMENTAL-ThresholdKeyAggregateSolidityFixture.json test/recipient-groth16/PokerGeneratedAggregateProof.t.sol PokerAggregateGeneratedVerifierAcceptanceTest 0 1
          python3 ../clients/420bet-poker/zkshuffle/make_private_delivery_adapter_forge_test.py aggregate src/bet/generated/ExperimentalThresholdKeyAggregateVerifier.sol ../artifacts/420bet-5a-4/EXPERIMENTAL-ThresholdKeyAggregateSolidityFixture.json test/recipient-groth16/PokerActualAggregateAdapterProof.t.sol
          sed -i 's#../src/#../../src/#g' test/recipient-groth16/*.t.sol
          forge test -vv
          rm -rf test/recipient-groth16
      - name: Record inherited recipient-adapter evidence
        if: steps.cryptoscope.outputs.changed == 'false' && steps.recipient_scope.outputs.changed == 'false'
        run: |
          set -eu
          mkdir -p artifacts/420bet-5a-4
          {
