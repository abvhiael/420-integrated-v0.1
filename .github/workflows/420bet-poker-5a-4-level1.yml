name: 420Bet Poker Confidential Deal 5A.4 Scoped Level 1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'contracts/src/bet/PokerConfidentialDeal420.sol'
      - 'contracts/test/BetPokerConfidentialDeal54.t.sol'
      - 'contracts/src/bet/PokerDeckDisclosure420.sol'
      - 'contracts/src/bet/PokerRecipientKeys420.sol'
      - 'contracts/src/bet/PokerHandFinality420.sol'
      - 'contracts/test/BetPokerHandFinality54.t.sol'
      - 'contracts/src/bet/PokerHandAccountingProof420.sol'
      - 'contracts/test/BetPokerHandAccountingProof54.t.sol'
      - 'contracts/src/bet/PokerVerifiedTerminalGate420.sol'
      - 'contracts/test/BetPokerVerifiedTerminalGate54.t.sol'
      - 'contracts/src/bet/PokerPrivateShuffleGate420.sol'
      - 'contracts/test/BetPokerPrivateShuffleGate54.t.sol'
      - 'contracts/src/bet/PokerActionKeys420.sol'
      - 'contracts/test/BetPokerActionKeys54.t.sol'
      - 'contracts/src/bet/PokerFinalCardOpenings420.sol'
      - 'contracts/test/BetPokerFinalCardOpenings54.t.sol'
      - 'contracts/src/bet/PokerActionDisputeClock420.sol'
      - 'contracts/test/BetPokerActionDisputeClock54.t.sol'
      - 'contracts/src/bet/PokerCanonicalRake420.sol'
      - 'contracts/test/BetPokerCanonicalRake54.t.sol'
      - 'contracts/test/BetPokerDeckDisclosure54.t.sol'
      - 'clients/420bet-poker/crypto/**'
      - 'clients/420bet-poker/zkshuffle/**'
      - '.github/workflows/420bet-poker-5a-4-level1.yml'
permissions:
  contents: read
concurrency:
  group: 420bet-poker-5a-4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  commitment-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind tested SHA
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify confidential shuffle and encrypted seat delivery
        run: node --test clients/420bet-poker/crypto/confidential-deal.test.mjs clients/420bet-poker/crypto/nlhe-replay.test.mjs clients/420bet-poker/crypto/nlhe-betting.test.mjs clients/420bet-poker/crypto/nlhe-verify-hand.test.mjs clients/420bet-poker/crypto/nlhe-economics.test.mjs clients/420bet-poker/crypto/nlhe-differential.test.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Real Groth16 52-card permutation circuit qualification
        working-directory: clients/420bet-poker/zkshuffle
        run: go test -mod=mod -timeout 15m ./...
      - name: Scope commitment adversarial + inherited seating/table regression
        working-directory: contracts
        run: forge test --match-contract '^(PokerCanonicalRake54Test|PokerActionDisputeClock54Test|PokerFinalCardOpenings54Test|PokerActionKeys54Test|PokerPrivateShuffleGate54Test|PokerVerifiedTerminalGate54Test|PokerHandAccountingProof54Test|PokerHandFinality54Test|PokerDeckDisclosure54Test|PokerConfidentialDeal54Test|PokerSeatLedger53Test|BetPokerTableRegistry52Test)$' -vv
