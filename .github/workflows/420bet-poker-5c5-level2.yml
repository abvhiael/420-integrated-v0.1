name: 420Bet Poker 5C.5 genuine tournament Level 1 and 2
on:
  push:
    branches: ['bet/5c5-elimination-standings-final-table']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: poker-5c5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  funded-tournament-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: clients/420bet-poker/zkshuffle/go.sum
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - name: Install pinned analyzer and compiler
        run: |
          python -m pip install slither-analyzer==0.11.6 pycryptodome==3.23.0
          solc-select install 0.8.30
          solc-select use 0.8.30
      - name: Bind exact implementation SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Execute genuine funded hands, adversarial cases and inherited regression
        run: python scripts/bet/qualify-poker-5c5.py --output artifacts/poker-5c5
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: poker-5c5-${{ github.sha }}
          path: artifacts/poker-5c5/**
          if-no-files-found: error
