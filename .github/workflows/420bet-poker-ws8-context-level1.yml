name: 420Bet WS8 Frozen Funded Hand Context Level 1
on:
  pull_request:
    paths:
      - 'contracts/test/BetPokerWS8*.sol'
      - 'contracts/src/bet/generated/WS8*.sol'
      - 'clients/420bet-poker/zkshuffle/fixtures/ws8/**'
      - '.github/workflows/420bet-poker-ws8-context-level1.yml'
      - 'scripts/bet/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-funded-hand:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOUNDRY_PROFILE: pr
      FOUNDRY_VIA_IR: 'true'
      FOUNDRY_SRC: src/bet
      FOUNDRY_TEST: test/ws8-focused
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - name: Prepare genuine verifier evidence and scoped test closure
        run: |
          python3 scripts/bet/prepare-ws8-verifiers.py --committed
          python3 scripts/bet/prepare-ws8-test-owner.py
          mkdir -p artifacts/ws8-context
      - name: Execute canonical funded context and verifier-identity checks
        working-directory: contracts
        run: |
          set -euo pipefail
          forge test --use 0.8.30 --match-contract BetPokerWS8FrozenHandContext54Test --match-test testFreezeCanonicalFundedHandContext -vvvv | tee ../artifacts/ws8-context/context.log
          python3 ../scripts/bet/export-ws8-context.py ../artifacts/ws8-context/context.log ../artifacts/ws8-context/exported
          cmp ../artifacts/ws8-context/exported/context.bin ../artifacts/contracts/ws8/context.bin
          python3 ../scripts/bet/inspect-ws8-proof-context.py ../artifacts/ws8-context/context.log ../artifacts/ws8-context/compatibility.json
          git rev-parse HEAD > ../artifacts/ws8-context/candidate-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 420bet-ws8-production-funded-context-level1
          path: artifacts/ws8-context/
          if-no-files-found: error
