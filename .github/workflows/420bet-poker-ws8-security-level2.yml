name: 420Bet Poker WS8 Security Milestone Level 2
on:
  pull_request:
    paths:
      - '.github/workflows/420bet-poker-ws8-security-level2.yml'
      - 'contracts/test/BetPokerIntegratedAdversarial54.t.sol'
      - 'scripts/bet/verify-ws8-integrated-security.py'
      - 'clients/420bet-poker/zkshuffle/**'
      - 'contracts/src/bet/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inherited-proof-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify source equivalence to inherited cryptographic qualification
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git fetch --no-tags origin 0bf8aede5ed1675493017d5e054f972abcede24c
          test -z "$(git diff --name-only 0bf8aede5ed1675493017d5e054f972abcede24c HEAD -- contracts/src/bet clients/420bet-poker/zkshuffle clients/420bet-poker/crypto)"
      - name: Validate immutable passing inherited run and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          def get(path):
            req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          run=40054572031
          data=get(f'actions/runs/{run}')
          assert data['conclusion']=='success'
          names={j['name'] for j in get(f'actions/runs/{run}/jobs?per_page=100')['jobs'] if j['conclusion']=='success'}
          assert {'cryptographic-attacks','replay-and-economics','consolidated-gate'}<=names
          names={a['name'] for a in get(f'actions/runs/{run}/artifacts?per_page=100')['artifacts'] if not a['expired']}
          assert {'ws7-crypto-exact-sha','ws7-native-exact-sha'}<=names
          PY
  real-funded-hand-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FOUNDRY_PROFILE: pr
      FOUNDRY_VIA_IR: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/download-artifact@v4
        with:
          name: 420bet-ws2-real-two-stage-exact-sha
          run-id: 40003702620
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/420bet-ws2
      - uses: actions/download-artifact@v4
        with:
          name: 420bet-ws3-real-eight-share-exact-sha
          run-id: 40013195917
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/420bet-ws3
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Run real generated verifier and delivery admission control
        working-directory: contracts
        env:
          FOUNDRY_SRC: src/bet
          FOUNDRY_TEST: test/ws8-real
        run: |
          set -eu
          mkdir -p src/bet/generated test/ws8-real
          python3 ../clients/420bet-poker/zkshuffle/make_ws3_full_onchain_book_test.py \
            ../artifacts/420bet-ws3/EXPERIMENTAL-WS3FullDeliveryVerifier.sol \
            ../artifacts/420bet-ws3/EXPERIMENTAL-WS3EightShareFixtures.json \
            ../artifacts/420bet-ws3/EXPERIMENTAL-WS3FullRecipientPoPVerifier.sol \
            ../artifacts/420bet-ws3/EXPERIMENTAL-WS3TwoRecipientPoPFixtures.json \
            ../artifacts/420bet-ws3/EXPERIMENTAL-WS3FullAggregateVerifier.sol \
            ../artifacts/420bet-ws3/EXPERIMENTAL-WS3AggregateFixture.json \
            ../artifacts/420bet-ws2/EXPERIMENTAL-Reencrypt52AvailabilityFixture.json \
            test/ws8-real/WS3FullActualDeliveryBook.t.sol
          forge test --match-contract '^WS3FullActualDeliveryBookTest$' -vv
      - name: Hash every inherited verifier and proof fixture
        run: |
          set -eu
          mkdir -p artifacts/ws8-security
          git rev-parse HEAD > artifacts/ws8-security/candidate-sha.txt
          find artifacts/420bet-ws2 artifacts/420bet-ws3 -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/ws8-security/input-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ws8-real-verifier-admission-provenance
          path: artifacts/ws8-security/
          if-no-files-found: error
  integrated-adversarial-attacks:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FOUNDRY_PROFILE: pr
      FOUNDRY_VIA_IR: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enforce real verifier test-owner coverage
        run: python3 scripts/bet/verify-ws8-integrated-security.py
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Run mandatory real admission through terminal atomic settlement and attacks
        working-directory: contracts
        env:
          FOUNDRY_SRC: src/bet
          FOUNDRY_TEST: test
        run: forge test --match-path 'test/BetPokerIntegratedAdversarial54.t.sol' -vv
  security-evidence-certificate:
    needs: [inherited-proof-provenance,real-funded-hand-integration,integrated-adversarial-attacks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every actual owner to pass (no documentation assertions)
        env:
          A: ${{ needs.inherited-proof-provenance.result }}
          B: ${{ needs.real-funded-hand-integration.result }}
          C: ${{ needs.integrated-adversarial-attacks.result }}
        run: |
          test "$A" = success
          test "$B" = success
          test "$C" = success
  milestone-gate:
    needs: [security-evidence-certificate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on any incomplete security evidence
        env:
          ACCEPT: ${{ needs.security-evidence-certificate.result }}
        run: test "$ACCEPT" = success
