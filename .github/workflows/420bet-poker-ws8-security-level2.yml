name: 420Bet Poker 5A.5â€“5A.9 and WS8 Security Milestone Level 2
on:
  pull_request:
    paths:
      - '.github/workflows/420bet-poker-ws8-*.yml'
      - 'contracts/test/BetPokerIntegratedAdversarial54.t.sol'
      - 'contracts/test/BetPokerWS8*.sol'
      - 'contracts/test/BetPokerBettingRounds55.t.sol'
      - 'contracts/test/BetPokerEvaluation56.t.sol'
      - 'contracts/test/BetPokerShowdown57.t.sol'
      - 'contracts/test/BetPokerPlayerLifecycle58.t.sol'
      - 'contracts/test/BetPokerAbuseProtection59.t.sol'
      - 'contracts/test/BetPokerMultiplayerSecurity610.t.sol'
      - 'contracts/test/PokerEvaluationVectors56.sol'
      - 'contracts/test/BetPokerNLHEBetting54.t.sol'
      - 'contracts/test/BetPokerNativeOutcome54.t.sol'
      - 'clients/420bet-poker/crypto/nlhe-*.mjs'
      - 'contracts/src/bet/**'
      - 'clients/420bet-poker/zkshuffle/**'
      - 'scripts/bet/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: poker-ws8-level2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scoped-level1-static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scoped analyzer and compiler
        run: |
          mkdir -p artifacts/poker-5a5-static
          python3 -m pip install slither-analyzer==0.11.6 web3==7.13.0 eth-abi==5.2.0 eth-typing==5.2.1 eth-utils==5.3.1
          python3 -m pip freeze > artifacts/poker-5a5-static/python-modules.txt
          solc-select install 0.8.30
          solc-select use 0.8.30
      - name: Analyze actual module, proof and custody graphs; reject every unresolved High/Medium finding
        run: |
          set -euo pipefail
          mkdir -p artifacts/poker-5a5-static
          for target in PokerNativeOutcome420 PokerCanonicalSettlement420 PokerDeliveryProofBook420 PokerPlayerRecovery420 PokerAbuseControls420; do
            slither "contracts/src/bet/$target.sol" --compile-force-framework solc --solc-args '--optimize --optimize-runs 200 --via-ir --evm-version cancun' --json "artifacts/poker-5a5-static/$target.json" > "artifacts/poker-5a5-static/$target.log" 2>&1 || {
              test -s "artifacts/poker-5a5-static/$target.json" || { cat "artifacts/poker-5a5-static/$target.log"; exit 1; }
            }
          done
          python3 clients/420bet-poker/zkshuffle/triage_slither_poker.py artifacts/poker-5a5-static/PokerNativeOutcome420.json artifacts/poker-5a5-static/PokerCanonicalSettlement420.json artifacts/poker-5a5-static/PokerDeliveryProofBook420.json artifacts/poker-5a5-static/PokerPlayerRecovery420.json artifacts/poker-5a5-static/PokerAbuseControls420.json artifacts/poker-5a5-static/execution.json
      - uses: actions/upload-artifact@v4
        with:
          name: poker-5a5-level1-static-execution
          path: artifacts/poker-5a5-static/
          if-no-files-found: error
  scoped-level1-betting-and-turns:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      FOUNDRY_PROFILE: pr
      FOUNDRY_VIA_IR: 'true'
      FOUNDRY_SRC: src/bet
      FOUNDRY_TEST: test/poker-5a5-focused
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare actual new and affected native owners
        run: |
          python3 scripts/bet/package-ws8-evidence.py --verify
          python3 scripts/bet/package-poker-5a7-evidence.py --verify
          node scripts/bet/generate-poker-5a6-vectors.mjs --check
          python3 scripts/bet/prepare-poker-5a5-owner.py
          mkdir -p artifacts/poker-5a5
      - name: Execute independent betting, turn timing and replay models
        run: |
          set -euo pipefail
          node --test --test-reporter=tap clients/420bet-poker/crypto/nlhe-*.test.mjs | tee artifacts/poker-5a5/node.tap
      - name: Execute 5A.5 kernel and genuine funded-hand owners
        working-directory: contracts
        run: |
          set -euo pipefail
          forge test --use 0.8.30 --match-contract PokerMultiplayerSecurity610Test --match-test '^(test610|testFuzz610)' --json > ../artifacts/poker-5a5/foundry-610.json
          forge test --use 0.8.30 --match-contract PokerMultiplayerSecurity610Test --match-test test610GenuineNinePlayerAllInSidePotsAndSettlement -vvvv | tee ../artifacts/poker-5a5/multiplayer-trace.log
          node ../scripts/bet/verify-poker-5a10-multiplayer.mjs ../artifacts/poker-5a5/multiplayer-trace.log ../artifacts/poker-5a5/multiplayer-replay.json
          forge test --use 0.8.30 --match-contract PokerAbuseProtection59Test --match-test '^test59' --json > ../artifacts/poker-5a5/foundry-59.json
          forge test --use 0.8.30 --match-contract PokerAbuseProtection59Test --match-test test59LegitimateProtectedFundedHandAndGovernedRestriction -vvvv | tee ../artifacts/poker-5a5/abuse-trace.log
          node ../scripts/bet/verify-ws8-transcript.mjs ../artifacts/poker-5a5/abuse-trace.log ../artifacts/poker-5a5/abuse-independent-outcome.json abuse59
          node ../scripts/bet/verify-poker-5a9-abuse.mjs ../artifacts/poker-5a5/abuse-trace.log ../artifacts/poker-5a5/abuse-independent-outcome.json ../artifacts/poker-5a5/abuse-replay.json
          forge test --use 0.8.30 --match-contract PokerPlayerLifecycle58Test --match-test '^test58' --json > ../artifacts/poker-5a5/foundry-58.json
          forge test --use 0.8.30 --match-contract PokerPlayerLifecycle58Test --match-test test58DisconnectedTurnReconnectionAndTimeoutEvidence -vvvv | tee ../artifacts/poker-5a5/lifecycle-trace.log
          node ../scripts/bet/verify-poker-5a8-reconnect.mjs ../artifacts/poker-5a5/lifecycle-trace.log ../artifacts/poker-5a5/lifecycle-replay.json
          forge test --use 0.8.30 --match-contract '^(PokerSeatLedger53Test|PokerConfidentialDeal54Test)$' --json > ../artifacts/poker-5a5/foundry-lifecycle-regressions.json
          forge test --use 0.8.30 --match-contract PokerShowdown57Test --match-test '^test57' --json > ../artifacts/poker-5a5/foundry-57.json
          forge test --use 0.8.30 --match-contract PokerShowdown57Test --match-test test57GenuineSingleWinnerShowdown -vvvv | tee ../artifacts/poker-5a5/winner-trace.log
          node ../scripts/bet/verify-ws8-transcript.mjs ../artifacts/poker-5a5/winner-trace.log ../artifacts/poker-5a5/winner-independent-outcome.json winner57
          forge test --use 0.8.30 --match-contract PokerEvaluation56Test --json > ../artifacts/poker-5a5/foundry-56.json
          forge test --use 0.8.30 --match-contract 'PokerBetting(Kernel|Rounds)55Test' --json > ../artifacts/poker-5a5/foundry-55.json
          forge test --use 0.8.30 --match-contract PokerBettingRounds55Test --match-test test55ProductionConstructorFitsSixteenMillionGasBudget -vvvv | tee ../artifacts/poker-5a5/constructor.log
      - name: Fresh execution of changed engine native regressions
        working-directory: contracts
        run: |
          set -euo pipefail
          forge test --use 0.8.30 --match-path 'test/poker-5a5-focused/BetPokerNLHEBetting54.t.sol' --json > ../artifacts/poker-5a5/foundry-betting54.json
          forge test --use 0.8.30 --match-contract 'PokerNativeOutcome54Test|PokerLiveCardReveals54Test|PokerWS5Recovery54Test' --json > ../artifacts/poker-5a5/foundry-outcome54.json
          forge test --use 0.8.30 --match-contract 'PokerActionDisputeClock54Test|PokerLedgerReentrancy54Test|PokerCanonicalSettlement54Test|PokerHandRank54Test' --json > ../artifacts/poker-5a5/foundry-clock54.json
      - name: Require every mandatory actual execution and source identity
        run: |
          python3 scripts/bet/verify-poker-5a5-execution.py artifacts/poker-5a5 artifacts/poker-5a5/execution.json
          python3 scripts/bet/record-poker-runtime-size.py artifacts/poker-5a5/runtime-size.json artifacts/poker-5a5/constructor.log
      - uses: actions/upload-artifact@v4
        with:
          name: poker-5a5-level1-native-execution
          path: artifacts/poker-5a5/
          if-no-files-found: error
  inherited-proof-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify unchanged historical sources and cryptographic evidence; changed native owners execute separately
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 scripts/bet/verify-ws8-inheritance.py
  scoped-level1-cryptography:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMEMLIMIT: 2GiB
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Verify actual compiled relations, VK-generated Solidity and all 41 genuine proofs
        working-directory: clients/420bet-poker/zkshuffle
        run: |
          set -euo pipefail
          mkdir -p ../../../artifacts/ws8-crypto
          python3 ../../../scripts/bet/package-ws8-evidence.py --verify
          go test -mod=readonly -timeout 10m -count=1 -json -run '^TestWS8CommittedCryptographicEvidence$' . | tee ../../../artifacts/ws8-crypto/go-execution.jsonl
          python3 ../../../scripts/bet/verify-ws8-execution.py go ../../../artifacts/ws8-crypto/go-execution.jsonl ../../../artifacts/ws8-crypto/execution.json
          python3 ../../../scripts/bet/package-poker-5a10-evidence.py --verify
          go test -mod=readonly -timeout 10m -count=1 -json -run '^TestPoker5A10MultiplayerCommittedCryptographicEvidence$' . | tee ../../../artifacts/ws8-crypto/multiplayer-go-execution.jsonl
          python3 ../../../scripts/bet/verify-ws8-execution.py go610 ../../../artifacts/ws8-crypto/multiplayer-go-execution.jsonl ../../../artifacts/ws8-crypto/multiplayer-execution.json
          python3 ../../../scripts/bet/package-poker-5a7-evidence.py --verify
          go test -mod=readonly -timeout 10m -count=1 -json -run '^TestPoker5A7WinnerCommittedCryptographicEvidence$' . | tee ../../../artifacts/ws8-crypto/winner-go-execution.jsonl
          python3 ../../../scripts/bet/verify-ws8-execution.py go57 ../../../artifacts/ws8-crypto/winner-go-execution.jsonl ../../../artifacts/ws8-crypto/winner-execution.json
          go list -m all > ../../../artifacts/ws8-crypto/go-modules.txt
          diff -u fixtures/ws8/historical-go-modules.txt ../../../artifacts/ws8-crypto/go-modules.txt
          git rev-parse HEAD > ../../../artifacts/ws8-crypto/candidate-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ws8-level1-genuine-cryptography
          path: artifacts/ws8-crypto/
          if-no-files-found: error
  real-funded-hand-and-adversarial-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOUNDRY_PROFILE: pr
      FOUNDRY_VIA_IR: 'true'
      FOUNDRY_SRC: src/bet
      FOUNDRY_TEST: test/ws8-focused
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare checksum-verified genuine proof fixtures and isolated actual test owners
        run: |
          python3 scripts/bet/prepare-ws8-verifiers.py --committed
          python3 scripts/bet/prepare-ws8-test-owner.py
          python3 scripts/bet/verify-ws8-integrated-security.py
          mkdir -p artifacts/ws8-funded
      - name: Execute funded context and record actual verifier identities and runtime code hashes
        working-directory: contracts
        run: |
          set -euo pipefail
          forge test --use 0.8.30 --match-contract BetPokerWS8FrozenHandContext54Test --match-test testFreezeCanonicalFundedHandContext -vvvv | tee ../artifacts/ws8-funded/context.log
          python3 ../scripts/bet/export-ws8-context.py ../artifacts/ws8-funded/context.log ../artifacts/ws8-funded/exported-context
          cmp ../artifacts/ws8-funded/exported-context/context.bin ../artifacts/contracts/ws8/context.bin
          python3 ../scripts/bet/inspect-ws8-proof-context.py ../artifacts/ws8-funded/context.log ../artifacts/ws8-funded/context-compatibility.json
      - name: Execute legitimate control, all ten attacks and inherited green registry/fixture cases
        working-directory: contracts
        run: |
          set -euo pipefail
          forge test --use 0.8.30 --match-path 'test/ws8-focused/BetPokerIntegratedAdversarial54.t.sol' --json > ../artifacts/ws8-funded/foundry-execution.json
          python3 ../scripts/bet/verify-ws8-execution.py foundry ../artifacts/ws8-funded/foundry-execution.json ../artifacts/ws8-funded/execution.json
      - name: Independently replay the actual authenticated hand and export every accepted public statement
        working-directory: contracts
        run: |
          set -euo pipefail
          forge test --use 0.8.30 --match-contract BetPokerIntegratedFundedAdversarial54Test --match-test testLegitimateFundedHandSettlement -vvvv | tee ../artifacts/ws8-funded/legitimate-trace.log
          node ../scripts/bet/verify-ws8-transcript.mjs ../artifacts/ws8-funded/legitimate-trace.log ../artifacts/ws8-funded/independent-outcome.json
          git rev-parse HEAD > ../artifacts/ws8-funded/candidate-sha.txt
          find src/bet -type f -name '*.sol' -print0 | sort -z | xargs -0 -r sha256sum > ../artifacts/ws8-funded/source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ws8-level2-funded-hand-execution
          path: artifacts/ws8-funded/
          if-no-files-found: error
  security-evidence-certificate:
    needs: [inherited-proof-provenance,scoped-level1-cryptography,real-funded-hand-and-adversarial-integration,scoped-level1-betting-and-turns,scoped-level1-static-security]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every actual owner to pass
        env:
          A: ${{ needs.inherited-proof-provenance.result }}
          B: ${{ needs.scoped-level1-cryptography.result }}
          C: ${{ needs.real-funded-hand-and-adversarial-integration.result }}
          D: ${{ needs.scoped-level1-betting-and-turns.result }}
          E: ${{ needs.scoped-level1-static-security.result }}
        run: |
          test "$A" = success
          test "$B" = success
          test "$C" = success
          test "$D" = success
          test "$E" = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: ws8-level1-genuine-cryptography
          path: artifacts/ws8-crypto
      - uses: actions/download-artifact@v4
        with:
          name: ws8-level2-funded-hand-execution
          path: artifacts/ws8-funded
      - uses: actions/download-artifact@v4
        with:
          name: poker-5a5-level1-native-execution
          path: artifacts/poker-5a5
      - uses: actions/download-artifact@v4
        with:
          name: poker-5a5-level1-static-execution
          path: artifacts/poker-5a5-static
      - name: Certify matching exact-SHA actual execution records
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/bet/certify-ws8-level2.py
      - uses: actions/upload-artifact@v4
        with:
          name: ws8-level2-exact-sha-certificate
          path: artifacts/ws8-certificate/
          if-no-files-found: error
  milestone-gate:
    needs: [security-evidence-certificate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on incomplete exact-SHA security evidence
        env:
          ACCEPT: ${{ needs.security-evidence-certificate.result }}
        run: test "$ACCEPT" = success
