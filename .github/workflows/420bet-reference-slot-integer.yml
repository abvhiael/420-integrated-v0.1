name: 420Bet Reference Slot Integer Math
on:
  pull_request:
    paths:
      - 'scripts/verify-420bet-reference-slot-integer.py'
      - 'scripts/verify-420bet-reference-slot-approvals.py'
      - '.github/workflows/420bet-reference-slot-integer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integer-math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify integer-exact candidate arithmetic
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 scripts/verify-420bet-reference-slot-integer.py --samples 25000 > "$RUNNER_TEMP/slot-integer-math.json"
          python3 - "$RUNNER_TEMP/slot-integer-math.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='NOT_APPROVED'
          assert x['maxNetBankrollLiabilitySmallestUnits']==4900000000
          assert x['grossCapSmallestUnits']==5000000000
          assert x['samples']==25000
          print(json.dumps(x,indent=2,sort_keys=True))
          PY
