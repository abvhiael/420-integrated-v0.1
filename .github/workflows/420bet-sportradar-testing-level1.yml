name: 420Bet Sportradar testing Level 1
on:
  push:
    branches: ['bet/5b2-sportradar-testing']
    paths:
      - 'clients/420bet-fantasy/**'
      - 'scripts/fantasy/qualify-sportradar.py'
      - '.github/workflows/420bet-sportradar-testing-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-provider-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r clients/420bet-fantasy/requirements.txt
      - name: Execute exact-SHA offline provider and real cryptographic client tests
        run: python scripts/fantasy/qualify-sportradar.py --output artifacts/sportradar-testing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sportradar-testing-${{ github.sha }}
          path: artifacts/sportradar-testing/
          if-no-files-found: error
