name: 420Bet Sports 5D.5 market lifecycle
on:
  push:
    branches: ['bet/5d5-market-lifecycle']
  pull_request:
    paths:
      - 'contracts/src/bet/sports/**'
      - 'contracts/test/sports-5d5/**'
      - '.github/workflows/420bet-sports-5d5.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sports-5d5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - name: Bounded 5D.5 and inherited funded-ticket adversarial tests
        working-directory: contracts
        run: forge test --match-contract SportsMarketLifecycle420Test -vvv
