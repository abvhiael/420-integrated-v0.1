name: 420Bet Sportsbook wallpaper and marquee Level 1
on:
  pull_request:
    paths:
      - 'clients/420bet-lobby/src/sportsbook-ui.js'
      - 'clients/420bet-lobby/src/sportsbook.css'
      - 'clients/420bet-lobby/tests/sportsbook-ui.test.mjs'
      - 'clients/420bet-lobby/src/main.js'
      - 'docs/bet/BET-SPORTSBOOK-UI-STYLE-BIBLE.md'
      - '.github/workflows/420bet-sportsbook-ui-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sportsbook-ui-level1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lobby dependencies
        working-directory: clients/420bet-lobby
        run: npm install --no-audit --no-fund
      - name: Check sportsbook navigation and verified feed boundary
        working-directory: clients/420bet-lobby
        run: node --test tests/sportsbook-ui.test.mjs
      - name: Build 420Bet lobby
        working-directory: clients/420bet-lobby
        run: npm run build
