name: 420Bet Video Poker Secure Draw and Economics Level 1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/420bet-video-poker-5-3-level1.yml'
      - 'contracts/src/bet/VideoPokerDrawV1420.sol'
      - 'contracts/src/bet/VideoPokerJacksOrBetter420.sol'
      - 'contracts/src/bet/VideoPokerResolverV1420.sol'
      - 'contracts/src/bet/SettlementEngine420.sol'
      - 'contracts/test/BetVideoPokerSecureDraw.t.sol'
      - 'contracts/test/BetSettlementEngine420.t.sol'
      - 'scripts/verify-420bet-video-poker-optimal-rtp.cpp'
permissions:
  contents: read
concurrency:
  group: 420bet-video-poker-5-3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  video-poker-secure-draw-and-economics:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-SHA and fixture preflight
        working-directory: contracts
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f src/bet/VideoPokerDrawV1420.sol
          test -f src/bet/VideoPokerJacksOrBetter420.sol
          test -f src/bet/VideoPokerResolverV1420.sol
          test -f test/BetVideoPokerSecureDraw.t.sol
          echo "Qualified input SHA: $EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Scoped Video Poker tests and funded expiry conservation
        working-directory: contracts
        run: |
          set -euo pipefail
          python3 ../scripts/verify-420bet-video-poker-standpat-rtp.py
          forge test --match-contract 'BetVideoPoker.*Test' -vv
          forge test --match-contract 'BetSettlementEngine420Test' --match-test 'testVideoPokerFundedExpiryRefundAndConservation' -vv
      - name: Full exhaustive optimal hold-strategy RTP
        run: |
          set -euo pipefail
          g++ -std=c++17 -O3 -Wall -Wextra -pedantic scripts/verify-420bet-video-poker-optimal-rtp.cpp -o /tmp/420bet-video-poker-optimal
          /tmp/420bet-video-poker-optimal | tee /tmp/420bet-video-poker-optimal.out
          sha256sum /tmp/420bet-video-poker-optimal.out
