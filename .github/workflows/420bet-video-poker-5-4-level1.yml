name: 420Bet Video Poker Paytable Level 1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/420bet-video-poker-5-4-level1.yml'
      - 'contracts/src/bet/VideoPokerJacksOrBetter420.sol'
      - 'contracts/test/BetVideoPokerPaytable54.t.sol'
permissions:
  contents: read
concurrency:
  group: 420bet-video-poker-5-4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  paytable-level1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Freeze exact tested SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Qualified input SHA: $EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Focused evaluator and paytable regressions
        working-directory: contracts
        run: |
          set -euo pipefail
          forge test --match-contract 'BetVideoPokerPaytable54Test' -vv
          forge test --match-contract 'BetVideoPokerEconomicsTest' -vv
          forge test --match-contract 'BetVideoPokerSecureDrawTest' -vv
