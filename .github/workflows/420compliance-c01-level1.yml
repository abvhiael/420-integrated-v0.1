name: 420Compliance C07.1 Level 1
on:
  push:
    branches: ['audit/420compliance-*']
    paths:
      - 'services/complianceauth/**'
      - 'docs/compliance/C07.1-*'
      - '.github/workflows/420compliance-c01-level1.yml'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compliance-c071-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protected-storage-level1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: compliance_test
          POSTGRES_PASSWORD: compliance_test
          POSTGRES_DB: compliance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compliance_test -d compliance_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      EXPECTED_SHA: ${{ github.sha }}
      COMPLIANCE_POSTGRES_TEST_DSN: 'postgres://compliance_test:compliance_test@localhost:5432/compliance_test?sslmode=verify-full&sslrootcert=/tmp/c071-ca.crt&connect_timeout=5'
    steps:
      - name: Checkout exact C07.1 implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact implementation SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure isolated PostgreSQL with verified TLS
        env:
          PG_SERVICE: ${{ job.services.postgres.id }}
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/c071-server.key -out /tmp/c071-server.crt -days 2 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          cp /tmp/c071-server.crt /tmp/c071-ca.crt
          docker cp /tmp/c071-server.key "$PG_SERVICE:/var/lib/postgresql/data/server.key"
          docker cp /tmp/c071-server.crt "$PG_SERVICE:/var/lib/postgresql/data/server.crt"
          docker exec --user root "$PG_SERVICE" chown postgres:postgres /var/lib/postgresql/data/server.key /var/lib/postgresql/data/server.crt
          docker exec --user root "$PG_SERVICE" chmod 600 /var/lib/postgresql/data/server.key
          docker exec --user postgres "$PG_SERVICE" psql -U compliance_test -d compliance_test -c "ALTER SYSTEM SET ssl = 'on';"
          docker exec --user postgres "$PG_SERVICE" psql -U compliance_test -d compliance_test -c "SELECT pg_reload_conf();"
      - name: Static security and affected package compilation
        run: go vet ./services/complianceauth
      - name: C07.1 encryption migrations RLS quotas and retained database regressions
        shell: bash
        run: |
          go test -race ./services/complianceauth -run '^(TestC071|TestC038|TestC064|TestC065|TestC067)' -count=1 -v 2>&1 | tee /tmp/compliance-c071-tests.log
          python3 - <<'PY'
          from pathlib import Path
          log=Path('/tmp/compliance-c071-tests.log').read_text()
          assert '--- SKIP:' not in log, 'required database test skipped'
          for test in ['TestC071AuthenticatedEncryptionBoundaries','TestC071PostgreSQLProductionStorage']:
              assert '--- PASS: '+test+' ' in log, 'required C07.1 acceptance absent: '+test
          PY
      - name: Record C07.1 exact-SHA Level 1 result and source manifest
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          files=sorted(list(Path('services/complianceauth').glob('*.go'))+list(Path('services/complianceauth/migrations').glob('*.sql'))+[Path('.github/workflows/420compliance-c01-level1.yml')])
          evidence={'step':'C07.1','qualification_level':1,'status':'PASS','implementation_sha':os.environ['EXPECTED_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'private_storage':'PASS','production_tls':'PASS','migration_atomicity_and_checksums':'PASS','role_bound_tenant_isolation':'PASS','encryption_corruption_and_rotation':'PASS','storage_quota_concurrency':'PASS','retained_affected_database_regressions':'PASS','skipped_required_tests':0,'source_sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files},'live_production_acceptance':'DEFERRED C09/C10'}
          Path('/tmp/compliance-c071-level1.json').write_text(json.dumps(evidence,indent=2)+'\n')
          PY
      - name: Retain C07.1 exact-SHA evidence
        uses: actions/upload-artifact@v4
        with:
          name: compliance-c071-level1-${{ env.EXPECTED_SHA }}
          path: |
            /tmp/compliance-c071-level1.json
            /tmp/compliance-c071-tests.log
          if-no-files-found: error
