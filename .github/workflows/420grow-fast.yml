name: 420Grow fast qualification
on:
  pull_request:
    paths:
      - 'docs/audit/420GROW-*.md'
      - 'scripts/verify-grow-01.py'
      - 'scripts/verify-grow-02.py'
      - 'config/genesis-applications.json'
      - 'config/genesis-consumer-services.json'
      - 'config/420location-events-genesis.json'
      - 'contracts/src/libraries/ServiceIds420.sol'
      - 'docs/420WALLET-W14.5-APP-CATALOG.md'
      - '.github/workflows/420grow-fast.yml'
  push:
    paths:
      - 'docs/audit/420GROW-*.md'
      - 'scripts/verify-grow-01.py'
      - 'scripts/verify-grow-02.py'
      - 'config/genesis-applications.json'
      - 'config/genesis-consumer-services.json'
      - 'config/420location-events-genesis.json'
      - 'contracts/src/libraries/ServiceIds420.sol'
      - 'docs/420WALLET-W14.5-APP-CATALOG.md'
      - '.github/workflows/420grow-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-definition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: GROW-01 bounded canonical definition verifier
        run: python3 scripts/verify-grow-01.py
      - name: GROW-02 canonical identity verifier
        run: python3 scripts/verify-grow-02.py
      - name: Python verifier syntax
        run: python3 -m py_compile scripts/verify-grow-01.py scripts/verify-grow-02.py
