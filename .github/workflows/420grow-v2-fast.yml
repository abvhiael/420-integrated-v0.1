name: 420Grow V2 fast qualification
on:
  pull_request:
    paths:
      - 'docs/audit/420GROW-V2-*.md'
      - 'scripts/verify-grow-v2-*.py'
      - 'grow/security/**'
      - '.github/workflows/420grow-v2-fast.yml'
  push:
    paths:
      - 'docs/audit/420GROW-V2-*.md'
      - 'scripts/verify-grow-v2-01.py'
      - '.github/workflows/420grow-v2-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v2-app-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check verifier syntax
        run: python3 -m py_compile scripts/verify-grow-v2-01.py
      - name: GROW-V2-01 product scope and non-promotion verification
        run: python3 scripts/verify-grow-v2-01.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: GROW-V2-02 authorization negative tests and static checks
        run: |
          go test -count=1 ./grow/security
          go test -race -count=1 ./grow/security
          go vet ./grow/security
      - name: GROW-V2-02 scope and boundary verifier
        run: |
          python3 -m py_compile scripts/verify-grow-v2-02.py
          python3 scripts/verify-grow-v2-02.py
