name: HZ-GCA-11 Voting Level 1
on:
  pull_request:
    paths:
      - 'hz/generate/src/award-voting.js'
      - 'hz/generate/test/award-voting.test.js'
      - 'hz/generate/src/index.js'
      - 'hz/generate/package.json'
      - '.github/workflows/420hz-gca-11.yml'
  push:
    branches:
      - 'feature/420hz-generate-community-awards-*'
    paths:
      - 'hz/generate/src/award-voting.js'
      - 'hz/generate/test/award-voting.test.js'
      - 'hz/generate/src/index.js'
      - 'hz/generate/package.json'
      - '.github/workflows/420hz-gca-11.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voting:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retained Generate Awards and voting tests
        working-directory: hz/generate
        run: npm run qualify
      - name: Frozen Awards model verification
        run: python3 scripts/verify-420hz-gca-1-12.py
      - name: Frozen nomination and voting policy verification
        run: python3 scripts/verify-420hz-gca-1-13.py
