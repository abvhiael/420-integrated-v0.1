name: HZ-GCA-13 Rewards Level 1
on:
  pull_request:
    paths:
      - 'hz/generate/src/award-prizes.js'
      - 'hz/generate/test/award-prizes.test.js'
      - 'hz/generate/src/index.js'
      - 'hz/generate/package.json'
      - '.github/workflows/420hz-gca-13.yml'
  push:
    branches:
      - 'feature/420hz-generate-community-awards-*'
    paths:
      - 'hz/generate/src/award-prizes.js'
      - 'hz/generate/test/award-prizes.test.js'
      - 'hz/generate/src/index.js'
      - 'hz/generate/package.json'
      - '.github/workflows/420hz-gca-13.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retained Generate and Rewards qualification
        working-directory: hz/generate
        run: npm run qualify
