name: HZ-GCA-14 Cross-Service Level 1
on:
  pull_request:
    paths:
      - 'hz/generate/src/cross-service.js'
      - 'hz/generate/test/cross-service.test.js'
      - 'hz/generate/src/index.js'
      - 'hz/generate/package.json'
      - '.github/workflows/420hz-gca-14.yml'
  push:
    branches:
      - 'feature/420hz-generate-community-awards-*'
    paths:
      - 'hz/generate/src/cross-service.js'
      - 'hz/generate/test/cross-service.test.js'
      - 'hz/generate/src/index.js'
      - 'hz/generate/package.json'
      - '.github/workflows/420hz-gca-14.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-service:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact SHA verification
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retained Generate and cross-service regressions
        working-directory: hz/generate
        run: npm run qualify
