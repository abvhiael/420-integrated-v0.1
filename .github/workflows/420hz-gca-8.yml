name: HZ-GCA-8 Community Level 1

on:
  pull_request:
    paths:
      - 'hz/generate/src/community.js'
      - 'hz/generate/test/community.test.js'
      - 'hz/generate/src/index.js'
      - 'hz/generate/package.json'
      - 'docs/architecture/420hz/HZ-GCA-8-COMMUNITY.md'
      - '.github/workflows/420hz-gca-8.yml'
  push:
    branches:
      - 'feature/420hz-generate-community-awards-*'
    paths:
      - 'hz/generate/src/community.js'
      - 'hz/generate/test/community.test.js'
      - 'hz/generate/src/index.js'
      - 'hz/generate/package.json'
      - 'docs/architecture/420hz/HZ-GCA-8-COMMUNITY.md'
      - '.github/workflows/420hz-gca-8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  community:
    name: HZ-GCA-8 targeted qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact implementation SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check hz/generate/src/community.js
      - name: Run Community adversarial tests
        run: node --test hz/generate/test/community.test.js
      - name: Run retained generation module tests
        working-directory: hz/generate
        run: npm run qualify
