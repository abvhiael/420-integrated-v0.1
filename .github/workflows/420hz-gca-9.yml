name: HZ-GCA-9 Charts Level 1
on:
  pull_request:
    paths:
      - 'hz/generate/src/charts.js'
      - 'hz/generate/test/charts.test.js'
      - 'hz/generate/src/index.js'
      - 'hz/generate/package.json'
      - '.github/workflows/420hz-gca-9.yml'
  push:
    branches:
      - 'feature/420hz-generate-community-awards-*'
    paths:
      - 'hz/generate/src/charts.js'
      - 'hz/generate/test/charts.test.js'
      - 'hz/generate/src/index.js'
      - 'hz/generate/package.json'
      - '.github/workflows/420hz-gca-9.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  charts:
    name: HZ-GCA-9 exact SHA targeted qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact SHA assertion
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retained 420Hz generate and charts tests
        working-directory: hz/generate
        run: npm run qualify
      - name: Frozen chart policy verifier
        run: python3 scripts/verify-420hz-gca-1-11.py
