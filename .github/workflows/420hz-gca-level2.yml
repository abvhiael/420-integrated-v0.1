name: 420Hz GCA Level 2 Milestone

on:
  pull_request:
    paths:
      - 'hz/config/gca-level2-milestone-v1.json'
      - 'docs/architecture/420hz/HZ-GCA-1.20-LEVEL2-MILESTONE.md'
      - 'docs/420HZ-GENERATE-COMMUNITY-AWARDS-ROADMAP.md'
      - 'scripts/verify-420hz-gca-1-20.py'
      - '.github/workflows/420hz-gca-level2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  level2:
    name: HZ-GCA Level 2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact qualification head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Verify reconciled current main ancestry
        shell: bash
        run: git merge-base --is-ancestor dbe29983986fefb77a4e78ff96a3689c8589f956 HEAD

      - name: Validate all GCA manifests
        run: |
          for f in hz/config/gca-*.json; do
            python3 -m json.tool "$f" >/dev/null
          done

      - name: Retain complete HZ-GCA-1 architecture verifier inventory
        run: |
          for n in $(seq 1 19); do
            python3 "scripts/verify-420hz-gca-1-$n.py"
          done

      - name: Verify HZ-GCA-1.20 milestone integration
        run: python3 scripts/verify-420hz-gca-1-20.py

      - name: Retain 420Hz web qualification
        run: python3 scripts/verify-420hz-web.py

      - name: Retain 420AI Compute integration boundaries
        run: python3 scripts/verify-420ai-compute-integration.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Retain 420AI provider runtime
        working-directory: services/420ai-provider
        run: npm test

      - name: Verify 420AI provider runtime boundaries
        run: python3 scripts/verify-420ai-provider-runtime.py

      - name: Retain reconciled Compute SDK suite
        working-directory: packages/420-sdk
        run: npm install --no-audit --no-fund && npm test

      - name: Build reconciled Compute SDK for API
        working-directory: packages/420-sdk
        run: npm run build

      - name: Retain reconciled Compute API suite
        working-directory: services/compute-api
        run: npm install --no-audit --no-fund && npm test

      - name: Retain reconciled Compute Indexer suite
        working-directory: 420-indexer
        run: npm install --no-audit --no-fund && npm test
