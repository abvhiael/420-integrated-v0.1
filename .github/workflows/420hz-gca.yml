name: 420Hz GCA Qualification

on:
  pull_request:
    paths:
      - 'hz/config/gca-*.json'
      - 'hz/generate/**'
      - 'docs/architecture/420hz/**'
      - 'docs/420HZ-GENERATE-COMMUNITY-AWARDS-ROADMAP.md'
      - 'scripts/verify-420hz-gca-*.py'
      - '.github/workflows/420hz-gca.yml'
  push:
    branches:
      - 'feature/420hz-generate-community-awards-*'
      - 'audit/420hz-gca-*'
    paths:
      - 'hz/config/gca-*.json'
      - 'hz/generate/**'
      - 'docs/architecture/420hz/**'
      - 'docs/420HZ-GENERATE-COMMUNITY-AWARDS-ROADMAP.md'
      - 'scripts/verify-420hz-gca-*.py'
      - '.github/workflows/420hz-gca.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  level1:
    name: HZ-GCA Level 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact pull-request head
        if: github.event_name == 'pull_request'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Validate GCA JSON manifests
        shell: bash
        run: |
          for f in hz/config/gca-*.json; do
            python3 -m json.tool "$f" >/dev/null
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Qualify HZ-GCA-2 generation provider abstraction
        working-directory: hz/generate
        run: npm run qualify

      - name: Verify HZ-GCA-2 generation provider abstraction
        run: python3 scripts/verify-420hz-gca-2.py

      - name: Verify HZ-GCA-3 Compute execution adapter
        run: python3 scripts/verify-420hz-gca-3.py

      - name: Verify HZ-GCA-4 provenance consent AI rights
        run: python3 scripts/verify-420hz-gca-4.py

      - name: Verify HZ-GCA-5 project workspace storage
        run: python3 scripts/verify-420hz-gca-5.py

      - name: Verify HZ-GCA-6 Generate Studio UX
        run: python3 scripts/verify-420hz-gca-6.py

      - name: Retain 420AI Compute integration boundaries for HZ-GCA-3
        run: python3 scripts/verify-420ai-compute-integration.py

      - name: Retain 420AI provider runtime for HZ-GCA-3
        working-directory: services/420ai-provider
        run: npm test

      - name: Verify 420AI provider runtime boundaries for HZ-GCA-3
        run: python3 scripts/verify-420ai-provider-runtime.py

      - name: Retain Compute SDK compatibility for HZ-GCA-3
        working-directory: packages/420-sdk
        run: npm install --no-audit --no-fund && npm test

      - name: Build Compute SDK for HZ-GCA-3 API compatibility
        working-directory: packages/420-sdk
        run: npm run build

      - name: Retain Compute API compatibility for HZ-GCA-3
        working-directory: services/compute-api
        run: npm install --no-audit --no-fund && npm test

      - name: Verify HZ-GCA-1.1 product boundaries
        run: python3 scripts/verify-420hz-gca-1-1.py

      - name: Verify HZ-GCA-1.2 canonical object model
        run: python3 scripts/verify-420hz-gca-1-2.py

      - name: Verify HZ-GCA-1.3 Generate lifecycle
        run: python3 scripts/verify-420hz-gca-1-3.py

      - name: Verify HZ-GCA-1.4 AI disclosure
        run: python3 scripts/verify-420hz-gca-1-4.py

      - name: Verify HZ-GCA-1.5 provenance model
        run: python3 scripts/verify-420hz-gca-1-5.py

      - name: Verify HZ-GCA-1.6 rights consent boundaries
        run: python3 scripts/verify-420hz-gca-1-6.py

      - name: Verify HZ-GCA-1.7 privacy model
        run: python3 scripts/verify-420hz-gca-1-7.py

      - name: Verify HZ-GCA-1.8 storage retention
        run: python3 scripts/verify-420hz-gca-1-8.py

      - name: Verify HZ-GCA-1.9 generation economics
        run: python3 scripts/verify-420hz-gca-1-9.py

      - name: Verify HZ-GCA-1.10 Community authority model
        run: python3 scripts/verify-420hz-gca-1-10.py

      - name: Verify HZ-GCA-1.11 Charts rules
        run: python3 scripts/verify-420hz-gca-1-11.py

      - name: Verify HZ-GCA-1.12 Awards architecture
        run: python3 scripts/verify-420hz-gca-1-12.py

      - name: Verify HZ-GCA-1.13 nomination voting policy
        run: python3 scripts/verify-420hz-gca-1-13.py

      - name: Verify HZ-GCA-1.14 moderation dispute boundaries
        run: python3 scripts/verify-420hz-gca-1-14.py

      - name: Verify HZ-GCA-1.15 threat model
        run: python3 scripts/verify-420hz-gca-1-15.py

      - name: Verify HZ-GCA-1.16 API event interface contracts
        run: python3 scripts/verify-420hz-gca-1-16.py

      - name: Verify HZ-GCA-1.17 failure recovery semantics
        run: python3 scripts/verify-420hz-gca-1-17.py

      - name: Verify HZ-GCA-1.18 architecture documentation consolidation
        run: python3 scripts/verify-420hz-gca-1-18.py

      - name: Verify HZ-GCA-1.19 Phase-1 adversarial review
        run: python3 scripts/verify-420hz-gca-1-19.py

  level2:
    name: HZ-GCA Level 2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect HZ-GCA-1.20 milestone change
        id: scope
        shell: bash
        run: |
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -Eq '^(hz/config/gca-level2-milestone-v1.json|docs/architecture/420hz/HZ-GCA-1.20-LEVEL2-MILESTONE.md)$'; then
            echo "level2=true" >> "$GITHUB_OUTPUT"
          else
            echo "level2=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify exact qualification head
        if: steps.scope.outputs.level2 == 'true'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Verify reconciled current main ancestry
        if: steps.scope.outputs.level2 == 'true'
        run: git merge-base --is-ancestor 0993ff5b5b3b213a0768dbde90e4734df5ab4cc0 HEAD

      - name: Start Level-2 PostgreSQL
        if: steps.scope.outputs.level2 == 'true'
        run: |
          docker run -d --name hz-gca-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=indexer420 \
            -p 5432:5432 postgres:16
          for i in $(seq 1 30); do
            if docker exec hz-gca-postgres pg_isready -U postgres -d indexer420; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Validate all GCA manifests
        if: steps.scope.outputs.level2 == 'true'
        run: |
          for f in hz/config/gca-*.json; do
            python3 -m json.tool "$f" >/dev/null
          done

      - name: Retain complete HZ-GCA-1 verifier inventory
        if: steps.scope.outputs.level2 == 'true'
        run: |
          for n in $(seq 1 19); do
            python3 "scripts/verify-420hz-gca-1-$n.py"
          done

      - name: Verify HZ-GCA-1.20 milestone integration
        if: steps.scope.outputs.level2 == 'true'
        run: python3 scripts/verify-420hz-gca-1-20.py

      - name: Retain 420Hz web qualification
        if: steps.scope.outputs.level2 == 'true'
        run: python3 scripts/verify-420hz-web.py

      - name: Retain 420AI Compute integration boundaries
        if: steps.scope.outputs.level2 == 'true'
        run: python3 scripts/verify-420ai-compute-integration.py

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.level2 == 'true'
        with:
          node-version: '22'

      - name: Retain 420AI provider runtime
        if: steps.scope.outputs.level2 == 'true'
        working-directory: services/420ai-provider
        run: npm test

      - name: Verify 420AI provider runtime boundaries
        if: steps.scope.outputs.level2 == 'true'
        run: python3 scripts/verify-420ai-provider-runtime.py

      - name: Retain reconciled Compute SDK suite
        if: steps.scope.outputs.level2 == 'true'
        working-directory: packages/420-sdk
        run: npm install --no-audit --no-fund && npm test

      - name: Build reconciled Compute SDK for API
        if: steps.scope.outputs.level2 == 'true'
        working-directory: packages/420-sdk
        run: npm run build

      - name: Retain reconciled Compute API suite
        if: steps.scope.outputs.level2 == 'true'
        working-directory: services/compute-api
        run: npm install --no-audit --no-fund && npm test

      - name: Retain reconciled Compute Indexer suite
        if: steps.scope.outputs.level2 == 'true'
        working-directory: 420-indexer
        env:
          INDEXER_PG_URL: postgresql://postgres:postgres@localhost:5432/indexer420
        run: npm install --no-audit --no-fund && npm test
; then
            echo "qualify=true" >> "$GITHUB_OUTPUT"
          else
            echo "qualify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Qualify HZ-GCA-2 generation provider abstraction
        working-directory: hz/generate
        run: npm run qualify

      - name: Verify HZ-GCA-2 generation provider abstraction
        run: python3 scripts/verify-420hz-gca-2.py

      - name: Verify HZ-GCA-1.1 product boundaries
        run: python3 scripts/verify-420hz-gca-1-1.py

      - name: Verify HZ-GCA-1.2 canonical object model
        run: python3 scripts/verify-420hz-gca-1-2.py

      - name: Verify HZ-GCA-1.3 Generate lifecycle
        run: python3 scripts/verify-420hz-gca-1-3.py

      - name: Verify HZ-GCA-1.4 AI disclosure
        run: python3 scripts/verify-420hz-gca-1-4.py

      - name: Verify HZ-GCA-1.5 provenance model
        run: python3 scripts/verify-420hz-gca-1-5.py

      - name: Verify HZ-GCA-1.6 rights consent boundaries
        run: python3 scripts/verify-420hz-gca-1-6.py

      - name: Verify HZ-GCA-1.7 privacy model
        run: python3 scripts/verify-420hz-gca-1-7.py

      - name: Verify HZ-GCA-1.8 storage retention
        run: python3 scripts/verify-420hz-gca-1-8.py

      - name: Verify HZ-GCA-1.9 generation economics
        run: python3 scripts/verify-420hz-gca-1-9.py

      - name: Verify HZ-GCA-1.10 Community authority model
        run: python3 scripts/verify-420hz-gca-1-10.py

      - name: Verify HZ-GCA-1.11 Charts rules
        run: python3 scripts/verify-420hz-gca-1-11.py

      - name: Verify HZ-GCA-1.12 Awards architecture
        run: python3 scripts/verify-420hz-gca-1-12.py

      - name: Verify HZ-GCA-1.13 nomination voting policy
        run: python3 scripts/verify-420hz-gca-1-13.py

      - name: Verify HZ-GCA-1.14 moderation dispute boundaries
        run: python3 scripts/verify-420hz-gca-1-14.py

      - name: Verify HZ-GCA-1.15 threat model
        run: python3 scripts/verify-420hz-gca-1-15.py

      - name: Verify HZ-GCA-1.16 API event interface contracts
        run: python3 scripts/verify-420hz-gca-1-16.py

      - name: Verify HZ-GCA-1.17 failure recovery semantics
        run: python3 scripts/verify-420hz-gca-1-17.py

      - name: Verify HZ-GCA-1.18 architecture documentation consolidation
        run: python3 scripts/verify-420hz-gca-1-18.py

      - name: Verify HZ-GCA-1.19 Phase-1 adversarial review
        run: python3 scripts/verify-420hz-gca-1-19.py

  level2:
    name: HZ-GCA Level 2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect HZ-GCA-1.20 milestone change
        id: scope
        shell: bash
        run: |
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -Eq '^(hz/config/gca-level2-milestone-v1.json|docs/architecture/420hz/HZ-GCA-1.20-LEVEL2-MILESTONE.md)$'; then
            echo "level2=true" >> "$GITHUB_OUTPUT"
          else
            echo "level2=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify exact qualification head
        if: steps.scope.outputs.level2 == 'true'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Verify reconciled current main ancestry
        if: steps.scope.outputs.level2 == 'true'
        run: git merge-base --is-ancestor 0993ff5b5b3b213a0768dbde90e4734df5ab4cc0 HEAD

      - name: Start Level-2 PostgreSQL
        if: steps.scope.outputs.level2 == 'true'
        run: |
          docker run -d --name hz-gca-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=indexer420 \
            -p 5432:5432 postgres:16
          for i in $(seq 1 30); do
            if docker exec hz-gca-postgres pg_isready -U postgres -d indexer420; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Validate all GCA manifests
        if: steps.scope.outputs.level2 == 'true'
        run: |
          for f in hz/config/gca-*.json; do
            python3 -m json.tool "$f" >/dev/null
          done

      - name: Retain complete HZ-GCA-1 verifier inventory
        if: steps.scope.outputs.level2 == 'true'
        run: |
          for n in $(seq 1 19); do
            python3 "scripts/verify-420hz-gca-1-$n.py"
          done

      - name: Verify HZ-GCA-1.20 milestone integration
        if: steps.scope.outputs.level2 == 'true'
        run: python3 scripts/verify-420hz-gca-1-20.py

      - name: Retain 420Hz web qualification
        if: steps.scope.outputs.level2 == 'true'
        run: python3 scripts/verify-420hz-web.py

      - name: Retain 420AI Compute integration boundaries
        if: steps.scope.outputs.level2 == 'true'
        run: python3 scripts/verify-420ai-compute-integration.py

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.level2 == 'true'
        with:
          node-version: '22'

      - name: Retain 420AI provider runtime
        if: steps.scope.outputs.level2 == 'true'
        working-directory: services/420ai-provider
        run: npm test

      - name: Verify 420AI provider runtime boundaries
