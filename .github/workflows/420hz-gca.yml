name: 420Hz GCA Qualification

on:
  pull_request:
    paths:
      - 'hz/config/gca-*.json'
      - 'docs/architecture/420hz/**'
      - 'docs/420HZ-GENERATE-COMMUNITY-AWARDS-ROADMAP.md'
      - 'scripts/verify-420hz-gca-*.py'
      - '.github/workflows/420hz-gca.yml'
  push:
    branches:
      - 'feature/420hz-generate-community-awards-*'
      - 'audit/420hz-gca-*'
    paths:
      - 'hz/config/gca-*.json'
      - 'docs/architecture/420hz/**'
      - 'docs/420HZ-GENERATE-COMMUNITY-AWARDS-ROADMAP.md'
      - 'scripts/verify-420hz-gca-*.py'
      - '.github/workflows/420hz-gca.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  level1:
    name: HZ-GCA Level 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact pull-request head
        if: github.event_name == 'pull_request'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Validate GCA JSON manifests
        shell: bash
        run: |
          for f in hz/config/gca-*.json; do
            python3 -m json.tool "$f" >/dev/null
          done

      - name: Verify HZ-GCA-1.1 product boundaries
        run: python3 scripts/verify-420hz-gca-1-1.py

      - name: Verify HZ-GCA-1.2 canonical object model
        run: python3 scripts/verify-420hz-gca-1-2.py

      - name: Verify HZ-GCA-1.3 Generate lifecycle
        run: python3 scripts/verify-420hz-gca-1-3.py

      - name: Verify HZ-GCA-1.4 AI disclosure
        run: python3 scripts/verify-420hz-gca-1-4.py

      - name: Verify HZ-GCA-1.5 provenance model
        run: python3 scripts/verify-420hz-gca-1-5.py
