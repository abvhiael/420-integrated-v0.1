name: 420Hz Web Qualification

on:
  pull_request:
    paths:
      - 'hz/web/**'
      - 'docs/420HZ-WEB.md'
      - 'scripts/verify-420hz-web.py'
      - '.github/workflows/420hz-web.yml'
  push:
    branches:
      - 'feature/420hz-web-*'
    paths:
      - 'hz/web/**'
      - 'docs/420HZ-WEB.md'
      - 'scripts/verify-420hz-web.py'
      - '.github/workflows/420hz-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        if: github.event_name == 'pull_request'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Verify 420Hz web
        run: python3 scripts/verify-420hz-web.py
