name: 420Hz Web Qualification

on:
  pull_request:
    paths:
      - 'hz/web/**'
      - 'hz/generate/**'
      - 'hz/config/gca-compute-execution-adapter-v1.json'
      - 'scripts/verify-420hz-gca-3.py'
      - 'docs/architecture/420hz/HZ-GCA-3-COMPUTE-EXECUTION-ADAPTER.md'
      - 'docs/420HZ-WEB.md'
      - 'scripts/verify-420hz-web.py'
      - '.github/workflows/420hz-web.yml'
  push:
    branches:
      - 'feature/420hz-web-*'
    paths:
      - 'hz/web/**'
      - 'hz/generate/**'
      - 'hz/config/gca-compute-execution-adapter-v1.json'
      - 'scripts/verify-420hz-gca-3.py'
      - 'docs/architecture/420hz/HZ-GCA-3-COMPUTE-EXECUTION-ADAPTER.md'
      - 'docs/420HZ-WEB.md'
      - 'scripts/verify-420hz-web.py'
      - '.github/workflows/420hz-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        if: github.event_name == 'pull_request'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Verify 420Hz web
        run: python3 scripts/verify-420hz-web.py


  gca3:
    name: HZ-GCA-3 Level 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact qualification head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Qualify 420Hz generation module
        working-directory: hz/generate
        run: npm run qualify

      - name: Verify HZ-GCA-2 retained provider abstraction
        run: python3 scripts/verify-420hz-gca-2.py

      - name: Verify HZ-GCA-3 execution adapter
        run: python3 scripts/verify-420hz-gca-3.py

      - name: Verify canonical 420AI Compute integration boundary
        run: python3 scripts/verify-420ai-compute-integration.py

      - name: Retain 420AI provider runtime
        working-directory: services/420ai-provider
        run: npm test

      - name: Verify 420AI provider runtime boundary
        run: python3 scripts/verify-420ai-provider-runtime.py

      - name: Retain Compute SDK
        working-directory: packages/420-sdk
        run: npm install --no-audit --no-fund && npm test

      - name: Build Compute SDK
        working-directory: packages/420-sdk
        run: npm run build

      - name: Retain Compute API
        working-directory: services/compute-api
        run: npm install --no-audit --no-fund && npm test
