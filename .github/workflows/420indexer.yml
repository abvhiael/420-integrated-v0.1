jobs:
  qualify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: indexer420
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d indexer420"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test indexer
        run: go test ./indexer/...
      - name: Vet indexer
        run: go vet ./indexer/...
      - name: Test TypeScript 420Indexer
        working-directory: 420-indexer
        env:
          INDEXER_PG_URL: postgresql://postgres:postgres@localhost:5432/indexer420
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Test Explorer indexer consumer
        run: go test ./explorer/...
      - name: Vet Explorer indexer consumer
        run: go vet ./explorer/...
      - name: Validate readiness JSON
        run: python -m json.tool config/420indexer-v1.json >/dev/null && python -m json.tool contracts/config/420explorer-genesis.json >/dev/null && python -m json.tool testnet/public-services/indexer/readiness.json >/dev/null && python -m json.tool testnet/public-services/explorer/readiness.json >/dev/null
      - name: Verify GEN-11.1 readiness contract
        run: python scripts/verify-420indexer.py
      - name: Verify 420Explorer shared-indexer consumer contract
        run: python scripts/verify-explorer-indexer-consumer.py
      - name: EXP-0.1.2 shared Indexer route/dependency reconciliation
        run: python scripts/verify-exp-0-1-2-indexer-dependencies.py
      - name: EXP-0.1.3 contract ABI and frozen-address dependency reconciliation
        run: python scripts/verify-exp-0-1-3-contract-dependencies.py
      - name: EXP-0.2.1 required Genesis capability matrix
        run: python scripts/verify-exp-0-2-1-capability-matrix.py
      - name: EXP-0.2.2 Genesis user-workflow acceptance matrix
        run: python scripts/verify-exp-0-2-2-user-workflows.py
      - name: EXP-0.2.3 canonical data and authority requirements
        run: python scripts/verify-exp-0-2-3-canonical-authority.py
      - name: EXP-0.2.4 dependency readiness matrix
        run: python scripts/verify-exp-0-2-4-dependency-readiness.py
      - name: EXP-0.2.5 Genesis blocker and qualification-gap register
        run: python scripts/verify-exp-0-2-5-genesis-gaps.py
      - name: EXP-0.2.6 Genesis acceptance criteria ownership map
        run: python scripts/verify-exp-0-2-6-genesis-acceptance.py
      - name: EXP-0.3.1 authoritative Genesis requirement inventory
        run: python scripts/verify-exp-0-3-1-authoritative-requirements.py
      - name: EXP-0.3.2 mandatory capability implementation paths
        run: python scripts/verify-exp-0-3-2-capability-paths.py
      - name: EXP-0.3.3 mandatory capability acceptance-test mapping
        run: python scripts/verify-exp-0-3-3-acceptance-tests.py
      - name: EXP-0.3.4 qualification-status freeze
        run: python scripts/verify-exp-0-3-4-status-freeze.py
      - name: EXP-0.3.5 optional and post-Genesis exclusions
        run: python scripts/verify-exp-0-3-5-nonblocking-exclusions.py
      - name: EXP-0.3.6 scope-conflict resolution register
        run: python scripts/verify-exp-0-3-6-scope-conflicts.py
      - name: EXP-0.3.7 bidirectional Genesis traceability
        run: python scripts/verify-exp-0-3-7-traceability.py
      - name: EXP-0.1.1 pinned-tree exhaustive inventory
        if: always()
        run: python scripts/exp-0-1-1-inventory.py --commit 95a83a961286701b6e8c064de1deccad10f41fd7
      - name: Upload EXP-0.1.1 full-tree and candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-0-1-1-pinned-tree-inventory
          path: exp-0-1-1-evidence/
          if-no-files-found: error
      - name: Upload EXP-0.1.3 contract ABI address evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-0-1-3-pinned-contract-dependencies
          path: exp-0-1-3-evidence/
          if-no-files-found: error
      - name: Upload EXP-0.2.1 capability matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-0-2-1-genesis-capability-matrix
          path: exp-0-2-1-evidence/
