concurrency:
  group: 420indexer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      recovery: ${{ steps.paths.outputs.recovery }}
      accounting: ${{ steps.paths.outputs.accounting }}
      qualified_tree: ${{ steps.paths.outputs.qualified_tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
