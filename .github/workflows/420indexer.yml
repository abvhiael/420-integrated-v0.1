          --health-cmd "pg_isready -U postgres -d indexer420"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p stake-9-3-evidence
          git rev-parse HEAD > stake-9-3-evidence/candidate-sha.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Qualify canonical file recovery and Explorer projection consumer
        run: |
          set -o pipefail
          go version > stake-9-3-evidence/go-version.txt
          GOFLAGS='-race -v' go test ./indexer/... 2>&1 | tee stake-9-3-evidence/go-tests.log
          go vet ./indexer/...
          go test ./explorer/... 2>&1 | tee stake-9-3-evidence/explorer-tests.log
          go vet ./explorer/...
      - name: Qualify transactional Stake lifecycle recovery against PostgreSQL
        working-directory: 420-indexer
        env:
          INDEXER_PG_URL: postgresql://postgres:postgres@localhost:5432/indexer420
        run: |
          set -o pipefail
          node --version > ../stake-9-3-evidence/node-version.txt
          npm install --no-package-lock --no-audit --no-fund
          npm test 2>&1 | tee ../stake-9-3-evidence/node-tests.log
      - name: Retain canonical ingestion and authority regressions
        run: |
          set -o pipefail
          python scripts/verify-420indexer.py 2>&1 | tee stake-9-3-evidence/indexer-verifier.log
          python scripts/verify-exp-1-3-canonical-indexing.py 2>&1 | tee stake-9-3-evidence/canonical-verifier.log
          python scripts/verify-stake-audit-6-indexer-explorer-sdk.py 2>&1 | tee stake-9-3-evidence/stake-verifier.log
      - name: Retain Stake recovery qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stake-audit-9-3-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: stake-9-3-evidence/
          if-no-files-found: error
          retention-days: 14

  stake-accounting:
    needs: scope
    if: needs.scope.outputs.accounting == 'true' && needs.scope.outputs.qualified_tree != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Record exact candidate and tools
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          mkdir -p stake-9-4-evidence
          git rev-parse HEAD > stake-9-4-evidence/candidate-sha.txt
          go version > stake-9-4-evidence/go-version.txt
          forge --version > stake-9-4-evidence/forge-version.txt
      - name: Pinned Solidity compiler
        run: |
          curl -fL https://github.com/ethereum/solidity/releases/download/v0.8.24/solc-static-linux -o "$RUNNER_TEMP/solc-0.8.24"
          echo "fb03a29a517452b9f12bcf459ef37d0a543765bb3bbc911e70a87d6a37c30d5f  $RUNNER_TEMP/solc-0.8.24" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/solc-0.8.24"
      - name: Real financial events versus independent getters
        run: python3 scripts/qualify-stake-accounting.py --solc "$RUNNER_TEMP/solc-0.8.24" --output stake-9-4-evidence
      - name: Consensus history, authenticated observation and Indexer integration
        run: |
          set -o pipefail
          go test -race -tags blst -count=1 -v ./indexer/... ./consensus/cmd/stake-reconcile 2>&1 | tee stake-9-4-evidence/integration.log
          go vet -tags blst ./consensus/accounting ./consensus/cmd/stake-reconcile ./consensus/recovery ./consensus/engine ./indexer/...
          go build -tags blst -o bin/stake-reconcile ./consensus/cmd/stake-reconcile
          python3 scripts/verify-exp-1-8-runtime-negative-divergence.py
      - name: Build production Indexer with the real BLS verifier
        run: |
          set -o pipefail
          git archive HEAD | docker build --tag stake-indexer-qualified --file docker/Dockerfile.420indexer - 2>&1 | tee stake-9-4-evidence/indexer-image.log
          docker image inspect stake-indexer-qualified > stake-9-4-evidence/indexer-image.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stake-audit-9-4-accounting-${{ github.event.pull_request.head.sha || github.sha }}
          path: stake-9-4-evidence/
