name: 420-IS audit qualification

on:
  pull_request:
    paths:
      - 'contracts/src/interfaces/I420IS.sol'
      - 'contracts/src/interop/**'
      - 'contracts/test/Interop*.t.sol'
      - 'contracts/src/libraries/ServiceIds420.sol'
      - 'contracts/config/genesis-dapp-contract-map.json'
      - 'contracts/config/genesis-address-namespace.json'
      - 'scripts/verify-420is-audit.py'
      - 'docs/audit/420IS-*'
      - 'docs/architecture/protocols/registry-names-identity-420is.md'
      - '.github/workflows/420is-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 420is-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Verify canonical repository model
        run: python3 scripts/verify-420is-audit.py
      - name: Check 420-IS formatting
        working-directory: contracts
        run: forge fmt --check src/interfaces/I420IS.sol src/interop test/InteropGenesis420.t.sol test/InteropAudit420.t.sol
      - name: Build 420-IS graph
        working-directory: contracts
        run: forge build src/interop test/InteropGenesis420.t.sol test/InteropAudit420.t.sol --sizes
      - name: Run 420-IS qualification suites
        working-directory: contracts
        run: forge test --match-path 'test/Interop*.t.sol' -vvv
      - name: Reject dangerous 420-IS primitives
        run: |
          set -euo pipefail
          if grep -R -nE '\btx\.origin\b|\bselfdestruct\s*\(|\.delegatecall\s*\(' contracts/src/interop contracts/src/interfaces/I420IS.sol; then
            echo 'Forbidden primitive found in 420-IS sources' >&2
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOUNDRY_PROFILE: hardening
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Run 420-IS hardening suite
        working-directory: contracts
        run: forge test --match-path 'test/Interop*.t.sol' -vvv
      - name: Install Slither
        run: python -m pip install --disable-pip-version-check slither-analyzer
      - name: Targeted 420-IS Slither high-severity gate
        working-directory: contracts
        shell: bash
        run: |
          cat > InteropAuditSlitherTarget.sol <<'SOL'
          // SPDX-License-Identifier: GPL-3.0
          pragma solidity ^0.8.24;
          import "./src/interfaces/I420IS.sol";
          import "./src/interop/InteropIds420.sol";
          import "./src/interop/InteropProviderRegistry420.sol";
          import "./src/interop/InteropNamespaceRegistry420.sol";
          import "./src/interop/InteropCheckpointRegistry420.sol";
          import "./src/interop/InteropRouter420.sol";
          SOL
          set +e
          slither InteropAuditSlitherTarget.sol --json /tmp/420is-slither.json >/tmp/420is-slither.txt 2>&1
          set -e
          rm -f InteropAuditSlitherTarget.sol
          python - <<'PY'
          import json, pathlib
          report_path = pathlib.Path("/tmp/420is-slither.json")
          log_path = pathlib.Path("/tmp/420is-slither.txt")
          if not report_path.exists():
              print(log_path.read_text(errors="replace"))
              raise SystemExit("Slither did not produce JSON output")
          report = json.loads(report_path.read_text())
          if report.get("success") is not True:
              print(log_path.read_text(errors="replace"))
              raise SystemExit(f"Slither analysis failed: {report.get('error') or 'unknown error'}")
          high = []
          findings = []
          for detector in report.get("results", {}).get("detectors", []):
              scoped = [
                  e for e in detector.get("elements", [])
                  if (
                      e.get("source_mapping", {}).get("filename_relative", "").startswith("src/interop/")
                      or e.get("source_mapping", {}).get("filename_relative", "") == "src/interfaces/I420IS.sol"
                  )
              ]
              if not scoped:
                  continue
              item = {
                  "check": detector.get("check"),
                  "impact": detector.get("impact"),
                  "confidence": detector.get("confidence"),
              }
              findings.append(item)
              if detector.get("impact") == "High":
                  high.append(item)
          print(json.dumps({"420isFindings": findings, "highSeverity": high}, indent=2))
          if high:
              raise SystemExit("High-severity Slither finding in 420-IS source")
          PY
