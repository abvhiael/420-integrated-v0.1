name: 420Mail Audit Qualification

on:
  pull_request:
    paths:
      - 'mail/**'
      - 'config/420mail-service-v1.json'
      - 'config/genesis-consumer-services.json'
      - 'config/genesis-applications.json'
      - 'docs/420MAIL.md'
      - 'docs/420MAIL-PHASE2-ROADMAP.md'
      - 'docs/audit/420MAIL-AUDIT-REMEDIATION-ROADMAP.md'
      - 'scripts/verify-420mail-audit.py'
      - 'testnet/public-services/mail/readiness.json'
      - '.github/workflows/420mail-audit.yml'
  workflow_dispatch:

jobs:
  mail-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Exact head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Go format
        run: test -z "$(gofmt -l mail)"
      - name: Go test
        run: go test ./mail/...
      - name: Go race test
        run: go test -race ./mail/...
      - name: Go vet
        run: go vet ./mail/...
      - name: Static audit verifier
        run: python3 scripts/verify-420mail-audit.py
