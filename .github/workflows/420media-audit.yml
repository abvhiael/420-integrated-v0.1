name: 420Media audit

on:
  pull_request:
    paths:
      - "contracts/src/media/**"
      - "contracts/test/MediaPhase1*420.t.sol"
      - "media/**"
      - "cmd/420media-node/**"
      - "config/genesis-consumer-services.json"
      - "config/genesis-applications.json"
      - "docs/420-MEDIA-*"
      - "docs/420MEDIA-*"
      - "scripts/420media-anvil-integration.sh"
      - "scripts/verify-420media-audit.py"
      - ".github/workflows/420media-audit.yml"
  workflow_dispatch:

concurrency:
  group: 420media-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  media-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact implementation SHA
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Verify canonical Media audit baseline
        run: python3 scripts/verify-420media-audit.py
      - name: Report Media Go formatting drift
        run: |
          bad="$(gofmt -l media/discovery media/controlplane)"
          if [ -n "$bad" ]; then
            printf 'gofmt required for MEDIA-AUDIT-3 packages:\n%s\n' "$bad"
          fi
      - name: Test Media Go packages
        run: go test ./media/... ./cmd/420media-node
      - name: Vet Media Go packages
        run: go vet ./media/... ./cmd/420media-node
      - name: Build Media contracts
        working-directory: contracts
        run: forge build src/media
      - name: Test Media Phase 1 protocol
        working-directory: contracts
        run: forge test --match-path "test/MediaPhase1*420.t.sol" -vvv
      - name: Run Media Anvil integration
        run: bash ./scripts/420media-anvil-integration.sh
