name: 420Messenger Audit Qualification

on:
  push:
    branches:
      - 'messenger-remediation-*'
    paths:
      - 'contracts/src/messenger/**'
      - 'contracts/test/Messenger*420.t.sol'
      - 'contracts/config/420messenger-*.json'
      - 'contracts/config/genesis-dapp-contract-map.json'
      - 'contracts/config/genesis-address-namespace.json'
      - 'contracts/src/libraries/ServiceIds420.sol'
      - 'testnet/public-services/messenger/**'
      - 'docs/420MESSENGER*'
      - 'docs/audit/420MESSENGER*'
      - 'docs/architecture/protocols/messenger-notifications-attention.md'
      - 'scripts/verify-genesis-dapps.py'
      - 'scripts/verify-420messenger-audit.py'
      - '.github/workflows/420messenger-audit.yml'
  pull_request:
    paths:
      - 'contracts/src/messenger/**'
      - 'contracts/test/Messenger*420.t.sol'
      - 'contracts/config/420messenger-*.json'
      - 'contracts/config/genesis-dapp-contract-map.json'
      - 'contracts/config/genesis-address-namespace.json'
      - 'contracts/src/libraries/ServiceIds420.sol'
      - 'testnet/public-services/messenger/**'
      - 'docs/420MESSENGER*'
      - 'docs/audit/420MESSENGER*'
      - 'docs/architecture/protocols/messenger-notifications-attention.md'
      - 'scripts/verify-genesis-dapps.py'
      - 'scripts/verify-420messenger-audit.py'
      - '.github/workflows/420messenger-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Messenger formatting
        working-directory: contracts
        run: forge fmt --check test/MessengerAudit420.t.sol
      - name: Build Messenger graph
        working-directory: contracts
        run: forge build src/messenger test/MessengerGenesis420.t.sol test/MessengerAudit420.t.sol --sizes
      - name: Run focused Messenger tests
        working-directory: contracts
        run: forge test --match-path 'test/Messenger*420.t.sol' -vvv
      - name: Shared Genesis verification
        run: python3 scripts/verify-genesis-dapps.py
      - name: Messenger audit verification
        run: python3 scripts/verify-420messenger-audit.py
      - name: Reject dangerous Messenger primitives
        run: |
          set -euo pipefail
          if grep -R -nE '\btx\.origin\b|\bselfdestruct\s*\(|\.delegatecall\s*\(' contracts/src/messenger; then
            echo 'Forbidden primitive found in Messenger sources' >&2
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install Slither
        run: python -m pip install --disable-pip-version-check slither-analyzer
      - name: Targeted Messenger Slither high-severity gate
        working-directory: contracts
        shell: bash
        run: |
          cat > MessengerAuditSlitherTarget.sol <<'SOL'
          // SPDX-License-Identifier: GPL-3.0
          pragma solidity ^0.8.24;
          import "./src/messenger/MessengerIds420.sol";
          import "./src/messenger/MessengerAuthorization420.sol";
          import "./src/messenger/MessengerEndpointRegistry420.sol";
          import "./src/messenger/MessengerBlockRegistry420.sol";
          import "./src/messenger/MessengerConversationRegistry420.sol";
          import "./src/messenger/MessengerEnvelopeRegistry420.sol";
          import "./src/messenger/MessengerReceiptRegistry420.sol";
          import "./src/messenger/MessengerRouter420.sol";
          SOL
          set +e
          slither MessengerAuditSlitherTarget.sol --json /tmp/420messenger-slither.json >/tmp/420messenger-slither.txt 2>&1
          status=$?
          set -e
          rm -f MessengerAuditSlitherTarget.sol
          python - <<'PY'
          import json, pathlib
          report_path = pathlib.Path("/tmp/420messenger-slither.json")
          log_path = pathlib.Path("/tmp/420messenger-slither.txt")
          if not report_path.exists():
              print(log_path.read_text(errors="replace"))
              raise SystemExit("Slither did not produce JSON output")
          report = json.loads(report_path.read_text())
          if report.get("success") is not True:
              print(log_path.read_text(errors="replace"))
              raise SystemExit("Slither analysis failed")
          high = []
          for detector in report.get("results", {}).get("detectors", []):
              scoped = [
                  e for e in detector.get("elements", [])
                  if e.get("source_mapping", {}).get("filename_relative", "").startswith("src/messenger/")
              ]
              if scoped and detector.get("impact") in {"High", "Critical"}:
                  high.append((detector.get("check"), detector.get("impact")))
          if high:
              for finding in high:
                  print(f"{finding[1]}: {finding[0]}")
              raise SystemExit("High/Critical Messenger Slither finding")
          print("No High/Critical Messenger Slither findings")
          PY
