name: 420Notifications Native Delivery API Level 1
on:
  pull_request:
    paths:
      - 'notifications/runtime/delivery_*.go'
      - 'notifications/cmd/notifications420/main.go'
      - 'notifications/runtime/DELIVERY-API.md'
      - '.github/workflows/420notifications-native-api-level1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-delivery-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Native API and existing 420Notifications tests
        run: go test -count=1 ./notifications/...
      - name: Race safety
        run: go test -race -count=1 ./notifications/...
      - name: Go vet
        run: go vet ./notifications/...
      - name: Build actual native service
        run: go build ./notifications/cmd/notifications420
