name: 420Pay audit qualification

on:
  push:
    branches:
      - 'audit/420pay-*'
    paths:
      - 'contracts/src/pay/**'
      - 'contracts/src/swap/CanonicalSwapExecutor420.sol'
      - 'contracts/src/system/ReplayProtectionConsumer420.sol'
      - 'contracts/src/interfaces/ICanonicalSettlement420.sol'
      - 'contracts/src/interfaces/genesis/IReplayConsumer420.sol'
      - 'contracts/config/pay/**'
      - 'contracts/config/420pay-genesis-wiring.json'
      - 'contracts/config/420pay-genesis-wiring-check.md'
      - 'contracts/config/interfaces/420pay-dependency-reconciliation.json'
      - 'contracts/test/*Pay*.t.sol'
      - 'contracts/test/Payment*.t.sol'
      - 'contracts/test/InvoiceRegistry420Fuzz.t.sol'
      - 'contracts/test/SettlementRouter420*.t.sol'
      - 'contracts/test/RefundManager420Fuzz.t.sol'
      - 'contracts/test/RefundManager420Funded.t.sol'
      - 'contracts/test/GasSponsor420*.t.sol'
      - 'contracts/test/ReplayProtectionConsumer420.t.sol'
      - '420-indexer/src/abi-manifest.ts'
      - '420-indexer/src/lifecycle-reducer.ts'
      - '420-indexer/src/pay-accounting-export.ts'
      - '420-indexer/test/abi-manifest.test.ts'
      - '420-indexer/test/lifecycle-reducer.test.ts'
      - '420-indexer/test/pay-accounting-export.test.ts'
      - 'scripts/verify-420pay-*.py'
      - 'scripts/qualify-pay-regression.py'
      - 'scripts/pay_regression_inventory.py'
      - 'scripts/test_pay_regression_inventory.py'
      - 'contracts/foundry.toml'
      - 'contracts/test/fixtures/cadc/upstream/**'
      - 'scripts/generate-420pay-audit-6-deployment.py'
      - 'scripts/420pay-audit-6-*.py'
      - 'docs/420PAY-*'
      - 'docs/audit/420PAY-*'
      - 'docs/apps/pay/deployment-operations.md'
      - 'config/protocol.json'
      - '.github/workflows/420pay-audit.yml'
  pull_request:
    paths:
      - 'contracts/src/pay/**'
      - 'contracts/src/swap/CanonicalSwapExecutor420.sol'
      - 'contracts/src/system/ReplayProtectionConsumer420.sol'
      - 'contracts/config/pay/**'
      - 'contracts/config/420pay-genesis-wiring.json'
      - 'contracts/config/interfaces/420pay-dependency-reconciliation.json'
      - 'contracts/test/*Pay*.t.sol'
      - 'contracts/test/Payment*.t.sol'
      - 'contracts/test/InvoiceRegistry420Fuzz.t.sol'
      - 'contracts/test/SettlementRouter420*.t.sol'
      - 'contracts/test/RefundManager420Fuzz.t.sol'
      - 'contracts/test/GasSponsor420*.t.sol'
      - 'contracts/test/ReplayProtectionConsumer420.t.sol'
      - '420-indexer/src/abi-manifest.ts'
      - '420-indexer/src/lifecycle-reducer.ts'
      - '420-indexer/src/pay-accounting-export.ts'
      - '420-indexer/test/abi-manifest.test.ts'
      - '420-indexer/test/lifecycle-reducer.test.ts'
      - '420-indexer/test/pay-accounting-export.test.ts'
      - 'scripts/verify-420pay-*.py'
      - 'scripts/qualify-pay-regression.py'
      - 'scripts/pay_regression_inventory.py'
      - 'scripts/test_pay_regression_inventory.py'
      - 'contracts/foundry.toml'
      - 'contracts/test/fixtures/cadc/upstream/**'
      - 'scripts/generate-420pay-audit-6-deployment.py'
      - 'scripts/420pay-audit-6-*.py'
      - 'docs/420PAY-*'
      - 'docs/audit/420PAY-*'
      - 'docs/apps/pay/deployment-operations.md'
      - 'config/protocol.json'
      - '.github/workflows/420pay-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pay-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'audit/420pay-') || github.head_ref == 'feature/pay-app-0-genesis-product'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify independent inventory discovery regressions
        run: python3 -m unittest discover -s scripts -p test_pay_regression_inventory.py -v
      - name: Reconcile exact-head Pay inventory without Solidity execution
        env:
          GH_TOKEN: ${{ github.token }}
          RETAINED_HEAD: fa8cc74c0d5529ecd9032eba6afbe0f4b9247041
          RETAINED_ARTIFACT: '14447571280'
          RETAINED_DIGEST: 357b189af9a6571c982fc71356e337478be09c75558847be834394fec6013777
        run: |
          set -euo pipefail
          args=()
          archive="$RUNNER_TEMP/pay-regression-baseline.zip"
          if git merge-base --is-ancestor "$RETAINED_HEAD" HEAD && git diff --quiet "$RETAINED_HEAD" HEAD -- contracts/foundry.toml; then
            if curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$RETAINED_ARTIFACT/zip" -o "$archive"; then
              printf '%s  %s\n' "$RETAINED_DIGEST" "$archive" | sha256sum -c -
              args=(--baseline-archive "$archive" --baseline-sha256 "$RETAINED_DIGEST")
              echo "PAY_RETAINED_DIGEST=$RETAINED_DIGEST" >> "$GITHUB_ENV"
            else
              rm -f "$archive"
              echo 'Retained artifact unavailable; no inherited result will be assumed.'
            fi
          fi
          python3 scripts/qualify-pay-regression.py --profile ci --inventory-only --output pay-inventory-evidence "${args[@]}"
      - name: Retain independent test inventory and source identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pay-inventory-${{ github.event.pull_request.head.sha || github.sha }}
          path: pay-inventory-evidence/
          if-no-files-found: warn
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Static Pay verification
        run: |
          python3 scripts/verify-420pay-parameters.py
          python3 scripts/verify-420pay-implementation.py
          python3 scripts/verify-420pay-hardening.py
          python3 scripts/verify-420pay-audit.py
          python3 scripts/verify-genesis-interface-layer.py
      - name: Check Pay Solidity formatting
        working-directory: contracts
        run: forge fmt --check test/PayAudit6DeploymentPackage420.t.sol
      - name: Build Pay and required settlement boundary
        working-directory: contracts
        run: forge build src/pay src/swap/CanonicalSwapExecutor420.sol src/system/ReplayProtectionConsumer420.sol
      - name: Materialize and verify PAY-AUDIT-6 runtime identities
        run: |
          python3 scripts/generate-420pay-audit-6-deployment.py --check --output pay-audit-6-derived.json --print
          python3 scripts/verify-420pay-audit-6-deployment.py
          python3 scripts/420pay-audit-6-smoke.py
      - name: Retain PAY-AUDIT-6 compiled artifact identities
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          names = [
              "MerchantRegistry420", "InvoiceRegistry420", "PaymentRegistry420",
              "PaymentRouter420", "SettlementRouter420", "RefundManager420",
              "GasSponsor420", "CanonicalSettlementAdapter420", "CanonicalSwapHealthAdapter420",
          ]
          records = []
          for name in names:
              path = Path("contracts/out") / f"{name}.sol" / f"{name}.json"
              payload = path.read_bytes()
              artifact = json.loads(payload)
              runtime = artifact.get("deployedBytecode", {}).get("object", "")
              if runtime.startswith("0x"):
                  runtime = runtime[2:]
              records.append({
                  "contract": name,
                  "artifact_sha256": hashlib.sha256(payload).hexdigest(),
                  "compiler_runtime_template_sha256": hashlib.sha256(bytes.fromhex(runtime)).hexdigest(),
              })
          print("PAY_AUDIT_6_ARTIFACT_IDENTITIES=" + json.dumps(records, sort_keys=True))
          PY
      - name: Retain PAY-AUDIT-6 derived runtime manifest
        uses: actions/upload-artifact@v4
        with:
          name: pay-audit-6-derived-${{ github.event.pull_request.head.sha || github.sha }}
          path: pay-audit-6-derived.json
          if-no-files-found: error
      - name: Run PAY-AUDIT-6 Level 1 deployment qualification
        run: python3 scripts/qualify-pay-regression.py --profile pr --match PayAudit6DeploymentPackage420.t.sol --match ReplayProtectionConsumer420.t.sol --output pay-level1-evidence
      - name: Identify V3-only changes to qualified Pay regression inputs
        id: v3-regression
        env:
          QUALIFIED_HEAD: c3fb2cf48b3429a9d7e8da96b2e204d7c452863d
        run: |
          if git merge-base --is-ancestor "$QUALIFIED_HEAD" HEAD &&
             git diff --quiet "$QUALIFIED_HEAD" HEAD -- '*.sol' contracts/foundry.toml scripts/pay_regression_inventory.py scripts/qualify-pay-regression.py ':(exclude)contracts/test/PayAudit6DeploymentPackage420.t.sol' &&
             python3 scripts/verify-genesis-config-commitment.py; then
            echo "v3_only=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Requalify the configuration-sensitive Pay owner under the full CI profile
        if: steps.v3-regression.outputs.v3_only == 'true'
        run: python3 scripts/qualify-pay-regression.py --profile ci --match PayAudit6DeploymentPackage420.t.sol --output pay-regression-evidence
      - name: Full applicable Pay contract regression qualification
        if: steps.v3-regression.outputs.v3_only != 'true'
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${PAY_RETAINED_DIGEST:-}" ]]; then
            args=(--baseline-archive "$RUNNER_TEMP/pay-regression-baseline.zip" --baseline-sha256 "$PAY_RETAINED_DIGEST")
          fi
          python3 scripts/qualify-pay-regression.py --profile ci --output pay-regression-evidence "${args[@]}"
      - name: Retain Pay regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pay-regression-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            pay-level1-evidence/
            pay-regression-evidence/
          if-no-files-found: warn
      - name: Forbidden primitive scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '\btx\.origin\b|\bselfdestruct\s*\(|\.delegatecall\s*\(' contracts/src/pay; then
            echo 'Forbidden primitive found in 420Pay sources' >&2
            exit 1
          fi
      - name: Build and test 420Indexer Pay reconciliation
        working-directory: 420-indexer
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run build
          node --test --test-concurrency=1 dist/test/lifecycle-reducer.test.js dist/test/abi-manifest.test.js dist/test/pay-accounting-export.test.js
