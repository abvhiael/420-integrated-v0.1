name: 420Randomness audit qualification

on:
  push:
    branches:
      - 'audit/420randomness-*'
    paths:
      - 'contracts/src/randomness/**'
      - 'contracts/src/interfaces/IRandomness*.sol'
      - 'contracts/test/Randomness*.t.sol'
      - 'contracts/config/genesis-dapp-contract-map.json'
      - 'contracts/config/genesis-address-namespace.json'
      - 'contracts/config/predeploy/predeploy-plan.json'
      - 'scripts/verify-420randomness-audit.py'
      - 'docs/audit/420RANDOMNESS-*'
      - 'docs/apps/randomness/**'
      - '.github/workflows/420randomness-audit.yml'
  pull_request:
    paths:
      - 'contracts/src/randomness/**'
      - 'contracts/src/interfaces/IRandomness*.sol'
      - 'contracts/test/Randomness*.t.sol'
      - 'contracts/config/genesis-dapp-contract-map.json'
      - 'contracts/config/genesis-address-namespace.json'
      - 'contracts/config/predeploy/predeploy-plan.json'
      - 'scripts/verify-420randomness-audit.py'
      - 'docs/audit/420RANDOMNESS-*'
      - 'docs/apps/randomness/**'
      - '.github/workflows/420randomness-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: randomness-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format_once:
    if: github.event_name == 'push' && github.ref_name == 'audit/420randomness-remediation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/420randomness-remediation
          fetch-depth: 0
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Apply deterministic Randomness formatting
        working-directory: contracts
        run: forge fmt src/randomness src/interfaces/IRandomnessRouter420.sol src/interfaces/IRandomnessVerifier420.sol test/Randomness420.t.sol test/RandomnessAudit420.t.sol test/RandomnessDraw420.t.sol
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- contracts/src/randomness contracts/src/interfaces/IRandomnessRouter420.sol contracts/src/interfaces/IRandomnessVerifier420.sol contracts/test/Randomness420.t.sol contracts/test/RandomnessAudit420.t.sol contracts/test/RandomnessDraw420.t.sol; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/src/randomness contracts/src/interfaces/IRandomnessRouter420.sol contracts/src/interfaces/IRandomnessVerifier420.sol contracts/test/Randomness420.t.sol contracts/test/RandomnessAudit420.t.sol contracts/test/RandomnessDraw420.t.sol
          git commit -m "RANDOM-AUDIT-2: normalize retained Randomness formatting"
          git push origin HEAD:audit/420randomness-remediation

  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Verify canonical Randomness inventory and Genesis wiring
        run: python3 scripts/verify-420randomness-audit.py
      - name: Check Randomness Solidity formatting
        working-directory: contracts
        run: forge fmt --check src/randomness src/interfaces/IRandomnessRouter420.sol src/interfaces/IRandomnessVerifier420.sol test/Randomness420.t.sol test/RandomnessAudit420.t.sol test/RandomnessDraw420.t.sol
      - name: Build canonical Randomness graph
        working-directory: contracts
        run: forge build src/randomness src/interfaces/IRandomnessRouter420.sol src/interfaces/IRandomnessVerifier420.sol
      - name: Run Randomness qualification suite
        working-directory: contracts
        run: forge test --match-path 'test/Randomness*.t.sol' -vvv
      - name: Forbidden primitive scan
        run: |
          set -euo pipefail
          if grep -R -nE '\btx\.origin\b|\bselfdestruct\s*\(|\.delegatecall\s*\(' contracts/src/randomness; then
            echo 'Forbidden primitive found in 420Randomness sources' >&2
            exit 1
          fi
