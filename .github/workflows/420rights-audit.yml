name: 420Rights audit qualification

on:
  pull_request:
    paths:
      - 'contracts/src/rights/**'
      - 'contracts/test/Rights*.t.sol'
      - 'contracts/config/420rights-genesis.json'
      - 'contracts/config/genesis-address-namespace.json'
      - '420-indexer/descriptors/rights420-v1.json'
      - '420-indexer/src/rights-descriptors.ts'
      - '420-indexer/src/lifecycle-reducer.ts'
      - '420-indexer/src/abi-manifest.ts'
      - '420-indexer/src/index.ts'
      - '420-indexer/test/rights420-descriptors.test.ts'
      - '420-indexer/test/lifecycle-reducer.test.ts'
      - 'scripts/verify-420rights-audit.py'
      - 'docs/audit/420RIGHTS-*'
      - '.github/workflows/420rights-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rights-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check canonical Rights formatting
        working-directory: contracts
        run: forge fmt --check src/rights test/RightsGenesis420.t.sol test/RightsFocusedHardening420.t.sol
      - name: Build canonical Rights graph
        working-directory: contracts
        run: forge build src/rights test/RightsGenesis420.t.sol test/RightsFocusedHardening420.t.sol --sizes
      - name: Verify Rights inventory, ABI descriptors, lifecycle and address authority
        run: python3 scripts/verify-420rights-audit.py
      - name: Run Rights contract qualification suite
        working-directory: contracts
        run: forge test --match-path 'test/Rights*.t.sol' -vvv
      - name: Reject dangerous Rights primitives
        run: |
          set -euo pipefail
          if grep -R -nE '\btx\.origin\b|\bselfdestruct\s*\(|\.delegatecall\s*\(' contracts/src/rights; then
            echo 'Forbidden primitive found in 420Rights sources' >&2
            exit 1
          fi
      - name: Install 420Indexer dependencies
        working-directory: 420-indexer
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Build 420Indexer
        working-directory: 420-indexer
        run: npm run build
      - name: Run Rights Indexer descriptor and lifecycle qualification
        working-directory: 420-indexer
        run: node --test --test-concurrency=1 dist/test/rights420-descriptors.test.js dist/test/lifecycle-reducer.test.js

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOUNDRY_PROFILE: hardening
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Run Rights hardening suite
        working-directory: contracts
        run: forge test --match-path 'test/Rights*.t.sol' -vvv
      - name: Install Slither
        run: python -m pip install --disable-pip-version-check slither-analyzer
      - name: Targeted Rights Slither high-severity gate
        working-directory: contracts
        shell: bash
        run: |
          cat > RightsAuditSlitherTarget.sol <<'SOL'
          // SPDX-License-Identifier: GPL-3.0
          pragma solidity ^0.8.24;
          import "./src/rights/RightsIds420.sol";
          import "./src/rights/RightsAuthorization420.sol";
          import "./src/rights/RightsPolicyRegistry420.sol";
          import "./src/rights/RightsAssetRegistry420.sol";
          import "./src/rights/RightsClaimRegistry420.sol";
          import "./src/rights/RightsLicenseRegistry420.sol";
          import "./src/rights/RightsRouter420.sol";
          SOL
          set +e
          slither RightsAuditSlitherTarget.sol --json /tmp/rights-slither.json >/tmp/rights-slither.txt 2>&1
          STATUS=$?
          set -e
          rm -f RightsAuditSlitherTarget.sol
          python - <<'PY'
          import json, pathlib
          report_path=pathlib.Path("/tmp/rights-slither.json")
          log_path=pathlib.Path("/tmp/rights-slither.txt")
          if not report_path.exists():
              print(log_path.read_text(errors="replace"))
              raise SystemExit("Slither did not produce JSON output")
          report=json.loads(report_path.read_text())
          if report.get("success") is not True:
              print(log_path.read_text(errors="replace"))
              raise SystemExit(f"Slither analysis failed: {report.get('error') or 'unknown error'}")
          high=[]
          findings=[]
          for detector in report.get("results",{}).get("detectors",[]):
              rights=[e for e in detector.get("elements",[]) if e.get("source_mapping",{}).get("filename_relative","").startswith("src/rights/")]
              if not rights: continue
              item={"check":detector.get("check"),"impact":detector.get("impact"),"confidence":detector.get("confidence")}
              findings.append(item)
              if detector.get("impact")=="High": high.append(item)
          print(json.dumps({"rightsFindings":findings,"highSeverity":high},indent=2))
          if high: raise SystemExit("High-severity Slither finding in Rights source")
          PY
