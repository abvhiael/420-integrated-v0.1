name: 420Rights one-shot formatter

on:
  push:
    branches:
      - 'audit/420rights-complete-20261003'
    paths:
      - '.github/workflows/420rights-format.yml'
      - 'contracts/src/rights/**'
      - 'contracts/test/RightsGenesis420.t.sol'
      - 'contracts/test/RightsFocusedHardening420.t.sol'

permissions:
  contents: write

concurrency:
  group: rights-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Apply forge fmt to Rights scope only
        working-directory: contracts
        run: forge fmt src/rights test/RightsGenesis420.t.sol test/RightsFocusedHardening420.t.sol
      - name: Commit exact formatter output when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- contracts/src/rights contracts/test/RightsGenesis420.t.sol contracts/test/RightsFocusedHardening420.t.sol; then
            echo "Rights scope already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/src/rights contracts/test/RightsGenesis420.t.sol contracts/test/RightsFocusedHardening420.t.sol
          git commit -m "style(420rights): apply forge fmt"
          git push origin HEAD:audit/420rights-complete-20261003
