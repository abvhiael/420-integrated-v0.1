name: 420Token audit qualification

on:
  pull_request:
    paths:
      - 'contracts/src/token/**'
      - 'contracts/test/Token*.t.sol'
      - 'contracts/config/420token-genesis.json'
      - 'contracts/config/token/**'
      - 'contracts/config/genesis-canonical-addresses.json'
      - 'contracts/config/genesis-address-namespace.json'
      - 'contracts/src/libraries/ServiceIds420.sol'
      - 'docs/420TOKEN.md'
      - 'docs/apps/token/**'
      - 'docs/audit/420TOKEN-*'
      - 'scripts/verify-420token-audit.py'
      - 'scripts/stage-420token-qualification.py'
      - 'wallet/web/core/token-*.js'
      - 'wallet/web/core/config.js'
      - 'wallet/web/core/genesis-app-catalog.js'
      - 'wallet/web/core/genesis-wallet-integration420.js'
      - 'wallet/web/runtime-config.json'
      - 'wallet/web/scripts/generate-runtime-config.mjs'
      - 'wallet/web/app.js'
      - 'wallet/web/apps-page.js'
      - 'wallet/web/token-catalogue-ui.js'
      - 'wallet/web/token-erc20-wizard-ui.js'
      - 'wallet/web/apps.css'
      - 'wallet/web/test/apps.test.js'
      - 'wallet/web/test/runtime-config-generator.test.js'
      - 'wallet/web/test/token-*.js'
      - 'testnet/public-services/token/readiness.json'
      - '.github/workflows/420token-audit.yml'
      - '!contracts/test/TokenGatewayRouterIntegration420.t.sol'
      - '!contracts/test/TokenGatewaySemantics420.t.sol'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: token-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.paths.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Classify exact contract qualification inputs
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [ "$EVENT" != pull_request ]; then
            echo 'contracts=true' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE...HEAD" > "$RUNNER_TEMP/token-paths.txt"
            if grep -Eq '^(contracts/|scripts/stage-420token-qualification\.py$)' "$RUNNER_TEMP/token-paths.txt"; then
              echo 'contracts=true' >> "$GITHUB_OUTPUT"
            else
              echo 'contracts=false' >> "$GITHUB_OUTPUT"
            fi
          fi
  wallet-sdk:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact qualification head and Token repository contract
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 scripts/verify-420token-audit.py
      - name: Run Wallet Token SDK and runtime qualification
        run: node --test wallet/web/test/token-runtime.test.js wallet/web/test/token-sdk.test.js wallet/web/test/token-discovery.test.js wallet/web/test/token-catalogue.test.js wallet/web/test/token-erc20-wizard.test.js wallet/web/test/w15-8-genesis-integration.test.js wallet/web/test/apps.test.js wallet/web/test/runtime-config-generator.test.js wallet/web/test/core.test.js wallet/web/test/gas-runtime-config.test.js wallet/web/test/genesis-app-catalog.test.js
  qualify:
    needs: scope
    if: needs.scope.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Check Token formatting
        working-directory: contracts
        run: forge fmt --check src/token test/TokenGenesis420.t.sol test/TokenAudit420.t.sol test/TokenVaultIntegration420.t.sol test/TokenDeploymentBinding420.t.sol test/TokenCompliance420.t.sol test/TokenTemplateInvariant420.t.sol
      - name: Stage exact Token test and source closure
        run: python3 scripts/stage-420token-qualification.py "$RUNNER_TEMP/token-contracts"
      - name: Build Token graph
        run: forge build --root "$RUNNER_TEMP/token-contracts" --sizes
      - name: Verify Token repository contract
        run: python3 scripts/verify-420token-audit.py
      - name: Verify shared Genesis dApp and address authority
        run: |
          python3 scripts/verify-genesis-dapps.py
          python3 scripts/verify-reg-audit-4-genesis-address-namespace.py
          python3 scripts/test-reg-audit-4-genesis-address-namespace.py
      - name: Run Token Foundry qualification
        run: forge test --root "$RUNNER_TEMP/token-contracts" --match-path 'test/Token*.t.sol' -vvv
      - name: Reject dangerous Token primitives
        run: |
          set -euo pipefail
          if grep -R -nE '\btx\.origin\b|\bselfdestruct\s*\(|\.delegatecall\s*\(' contracts/src/token; then
            echo 'Forbidden primitive found in 420Token sources' >&2
            exit 1
          fi

  security:
    needs: scope
    if: needs.scope.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOUNDRY_PROFILE: hardening
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Stage exact Token test and source closure
        run: python3 scripts/stage-420token-qualification.py "$RUNNER_TEMP/token-contracts"
      - name: Run Token hardening suite
        run: forge test --root "$RUNNER_TEMP/token-contracts" --match-path 'test/Token*.t.sol' -vvv
      - name: Install Slither
        run: python -m pip install --disable-pip-version-check slither-analyzer
      - name: Targeted Token Slither high-severity gate
        working-directory: ${{ runner.temp }}/token-contracts
        shell: bash
        run: |
          cat > TokenAuditSlitherTarget.sol <<'SOL'
          // SPDX-License-Identifier: GPL-3.0
          pragma solidity ^0.8.24;
          import "./src/token/TokenIds420.sol";
          import "./src/token/TokenTemplateRegistry420.sol";
          import "./src/token/TokenFactory420.sol";
          import "./src/token/ERC20Template420.sol";
          import "./src/token/ERC721Template420.sol";
          import "./src/token/ERC1155Template420.sol";
          SOL
          set +e
          slither TokenAuditSlitherTarget.sol --compile-force-framework solc \
            --solc "$HOME/.svm/0.8.24/solc-0.8.24" \
            --solc-args '--optimize --optimize-runs 200 --via-ir --evm-version cancun' \
            --json /tmp/token-slither.json >/tmp/token-slither.txt 2>&1
          set -e
          rm -f TokenAuditSlitherTarget.sol
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/token-slither.json')
          if not p.exists(): raise SystemExit(pathlib.Path('/tmp/token-slither.txt').read_text(errors='replace'))
          report=json.loads(p.read_text())
          if report.get('success') is not True: raise SystemExit(report.get('error') or 'Slither analysis failed')
          findings=[]
          for d in report.get('results',{}).get('detectors',[]):
              src=[e for e in d.get('elements',[]) if e.get('source_mapping',{}).get('filename_relative','').startswith('src/token/')]
              if src: findings.append((d.get('impact'),d.get('check'),d.get('description')))
          print(json.dumps(findings,indent=2))
          if any(x[0]=='High' for x in findings): raise SystemExit('High-severity Slither finding in Token source')
          PY
