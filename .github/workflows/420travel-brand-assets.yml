name: 420Travel brand assets
on:
  workflow_dispatch:
  push:
    branches:
      - feature/gen-svc-3-travel-implementation
    paths:
      - web/travel/assets/brand/420travel-logo.png
      - web/travel/scripts/generate_brand_assets.py
      - .github/workflows/420travel-brand-assets.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install 'Pillow==11.3.0'
      - name: Generate brand assets from approved source only
        run: python web/travel/scripts/generate_brand_assets.py
      - name: Validate generated files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('web/travel')
          required = {'favicon-16x16.png': (16,16), 'favicon-32x32.png': (32,32), 'favicon-48x48.png': (48,48), 'apple-touch-icon.png': (180,180), 'icon-192.png': (192,192), 'icon-512.png': (512,512), 'maskable-icon-512.png': (512,512), 'assets/brand/header-van.png': (256,256), 'assets/brand/og-420travel.png': (1200,630)}
          for name, dimensions in required.items():
              with Image.open(root/name) as image:
                  assert image.size == dimensions, (name, image.size, dimensions)
                  image.verify()
          with Image.open(root/'favicon.ico') as image:
              assert image.format == 'ICO'
              assert {(16,16),(32,32),(48,48)} <= set(image.info['sizes'])
          print('420Travel logo-derived assets validated')
          PY
      - name: Commit exact-source-derived exports to existing branch
        run: |
          git add web/travel/favicon.ico web/travel/favicon-*.png web/travel/apple-touch-icon.png web/travel/icon-*.png web/travel/maskable-icon-512.png web/travel/assets/brand/header-van.png web/travel/assets/brand/420travel-van-icon-master.png web/travel/assets/brand/og-420travel.png web/travel/assets/brand/ASSET-MANIFEST.json
          if git diff --cached --quiet; then
            echo 'No branding asset changes'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'WEB-BRAND-1: refresh derived icons from approved 420Travel logo'
          git push origin HEAD:feature/gen-svc-3-travel-implementation
