name: 420Travel Web Qualification
on:
  pull_request:
    paths:
      - 'web/travel/**'
      - '.github/workflows/420travel-web-qualification.yml'
  push:
    branches:
      - feature/gen-svc-3-travel-implementation
    paths:
      - 'web/travel/**'
      - '.github/workflows/420travel-web-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public preview markup, assets and service gates
        run: python3 web/travel/check_site.py
