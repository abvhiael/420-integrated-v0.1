name: AI Native Partial Qualification

on:
  pull_request:
    paths:
      - "contracts/src/ai/AINativePartialSettlementPlan420.sol"
      - "contracts/src/ai/AINativeSplitSettlement420.sol"
      - "contracts/src/ai/AIJobManager.sol"
      - "contracts/src/ai/AIJobEscrow.sol"
      - "contracts/src/ai/AINativeVaultFundingAdapter420.sol"
      - "contracts/src/ai/AIProviderRegistry.sol"
      - "contracts/src/vault/**"
      - "contracts/test/AINativePartialSettlementPlan420.t.sol"
      - "contracts/test/AINativeSplitSettlement420.t.sol"
      - "contracts/test/AINativeSplitRealVault420.t.sol"
      - "contracts/test/AINativeSplitProtocol420.t.sol"
      - "contracts/test/AINativeSplitAdversarial420.t.sol"
      - "contracts/test/AINativeSettlementRoutes420.t.sol"
      - ".github/workflows/ai-native-partial-qualification.yml"
  workflow_dispatch:

concurrency:
  group: ai-native-partial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build planner settlement real Vault protocol and adversarial harness
        working-directory: contracts
        run: |
          forge build test/AINativePartialSettlementPlan420.t.sol --sizes
          forge build test/AINativeSplitSettlement420.t.sol --sizes
          forge build test/AINativeSplitRealVault420.t.sol --sizes
          forge build test/AINativeSplitProtocol420.t.sol --sizes
          forge build test/AINativeSplitAdversarial420.t.sol --sizes
          forge build test/AINativeSettlementRoutes420.t.sol --sizes
      - name: Test planner settlement real Vault protocol and adversarial rollback
        working-directory: contracts
        run: |
          forge test --match-path test/AINativePartialSettlementPlan420.t.sol -vvv
          forge test --match-path test/AINativeSplitSettlement420.t.sol -vvv
          forge test --match-path test/AINativeSplitRealVault420.t.sol -vvv
          forge test --match-path test/AINativeSplitProtocol420.t.sol -vvv
          forge test --match-path test/AINativeSplitAdversarial420.t.sol -vvv
          forge test --match-path test/AINativeSettlementRoutes420.t.sol -vvv
