name: 420 AI Provider Runtime

on:
  push:
    branches: [ main ]
    paths:
      - "420-ai-provider/**"
      - ".github/workflows/ai-provider.yml"
  pull_request:
    paths:
      - "420-ai-provider/**"
      - ".github/workflows/ai-provider.yml"
  workflow_dispatch:

concurrency:
  group: ai-provider-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-ai-provider:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: 420-ai-provider
        run: npm install --ignore-scripts
      - name: Build and test
        working-directory: 420-ai-provider
        run: npm test
      - name: Security boundary checks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'privateKey|mnemonic|seedPhrase|eth_sendRawTransaction' 420-ai-provider/src
          grep -Rni 'authoritative: false' 420-ai-provider/src
          grep -Rni 'payload commitment does not match canonical compute request' 420-ai-provider/src
