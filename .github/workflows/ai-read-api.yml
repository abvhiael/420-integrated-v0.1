name: 420 AI Read API

on:
  push:
    branches: [ main ]
    paths:
      - "420-ai-api/**"
      - "420-indexer/**"
      - "developer-hub/**"
      - ".github/workflows/ai-read-api.yml"
  pull_request:
    paths:
      - "420-ai-api/**"
      - "420-indexer/**"
      - "developer-hub/**"
      - ".github/workflows/ai-read-api.yml"
  workflow_dispatch:

concurrency:
  group: ai-read-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-ai-read-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: AI API install
        working-directory: 420-ai-api
        run: npm install --ignore-scripts
      - name: AI API build and tests
        working-directory: 420-ai-api
        run: npm test
      - name: Developer Hub discovery tests
        working-directory: developer-hub
        run: npm test
      - name: Indexer install
        working-directory: 420-indexer
        run: npm install --ignore-scripts
      - name: Indexer build and tests
        working-directory: 420-indexer
        run: npm test
      - name: Non-authority boundary checks
        shell: bash
        run: |
          set -euo pipefail
          grep -Rni "authoritative: false" 420-ai-api/src
          grep -Rni "source = 'hybrid'" 420-ai-api/src
          grep -Rni "idx_ai_state" 420-indexer/sql
          grep -Rni "'ai'" developer-hub/src/network-discovery.mjs
