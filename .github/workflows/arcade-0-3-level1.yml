name: 420Arcade ARC-0.3 Level 1 proposal integrity
on:
  pull_request:
    paths:
      - "docs/arcade/ARC-0.3-GENESIS-INCLUSION-RECONCILIATION.md"
      - "scripts/arcade/verify-arc-0-3.mjs"
      - ".github/workflows/arcade-0-3-level1.yml"
  workflow_dispatch:
jobs:
  genesis-proposal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify proposal integrity and frozen Genesis boundary
        run: node scripts/arcade/verify-arc-0-3.mjs
