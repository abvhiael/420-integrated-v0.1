name: 420Arcade ARC-0.4 Level 1 identity and namespace
on:
  pull_request:
    paths:
      - "config/arcade-game-identities.json"
      - "docs/arcade/ARC-0.4-CANONICAL-GAME-IDENTITIES.md"
      - "scripts/arcade/verify-arc-0-4.mjs"
      - ".github/workflows/arcade-0-4-level1.yml"
  workflow_dispatch:
jobs:
  arcade-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate canonical Arcade game identities and adversarial cases
        run: node scripts/arcade/verify-arc-0-4.mjs
