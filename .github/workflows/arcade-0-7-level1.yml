name: 420Arcade ARC-0.7 Level 1 scope freeze
on:
  pull_request:
    paths:
      - "config/arcade-0-7-scope-freeze.json"
      - "config/arcade-game-identities.json"
      - "config/arcade-platform-requirements.json"
      - "config/arcade-module-architecture.json"
      - "docs/arcade/ARC-0.7-SCOPE-ACCEPTANCE-FREEZE.md"
      - "scripts/arcade/verify-arc-0-7.mjs"
      - ".github/workflows/arcade-0-7-level1.yml"
  workflow_dispatch:
jobs:
  arcade-scope-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact frozen sources scope and adversarial contracts
        run: node scripts/arcade/verify-arc-0-7.mjs
