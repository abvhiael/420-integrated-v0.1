name: 420Arcade ARC-1.1 Level 1 application bootstrap
on:
  pull_request:
    paths:
      - 'apps/arcade-web/**'
      - '.github/workflows/arcade-1-1-level1.yml'
      - 'config/arcade-game-identities.json'
      - 'config/arcade-0-7-scope-freeze.json'
  workflow_dispatch:
jobs:
  arcade-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned lockfile for initial bootstrap
        working-directory: apps/arcade-web
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo LOCK_BEGIN
          base64 -w0 package-lock.json
          echo
          echo LOCK_END
      - name: Install dependencies
        run: npm install --prefix apps/arcade-web --ignore-scripts --no-audit --no-fund
      - name: Syntax and security checks
        run: npm run check --prefix apps/arcade-web && npm run lint --prefix apps/arcade-web
      - name: Typecheck
        run: npm run typecheck --prefix apps/arcade-web
      - name: Unit and adversarial tests
        run: npm run test --prefix apps/arcade-web
      - name: Production build
        run: npm run build --prefix apps/arcade-web
      - name: Verify deployable output
        run: node --input-type=module -e "import fs from 'node:fs';const p='apps/arcade-web/dist/';if(!fs.existsSync(p+'index.html')||!fs.readdirSync(p+'assets').some(x=>x.endsWith('.js')))throw Error('missing build');"
