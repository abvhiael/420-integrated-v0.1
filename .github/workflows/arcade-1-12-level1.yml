name: 420Arcade ARC-1.12 Level 1 retained runtime qualification
on:
  pull_request:
    paths:
      - 'packages/arcade-testing/**'
      - '.github/workflows/arcade-1-12-level1.yml'
  workflow_dispatch:
jobs:
  arcade-runtime-retained:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/arcade-web/package-lock.json
      - name: Validate runner syntax and inventory
        run: node --check packages/arcade-testing/scripts/qualify.mjs && node --check packages/arcade-testing/test/runtime-qualification.test.mjs
      - name: Arcade consolidated runtime, security and regression tests
        run: node packages/arcade-testing/scripts/qualify.mjs
      - name: Browser launcher and production compatibility
        run: |
          npm ci --prefix apps/arcade-web --ignore-scripts --no-audit --no-fund
          npm run check --prefix apps/arcade-web
          npm run lint --prefix apps/arcade-web
          npm run typecheck --prefix apps/arcade-web
          npm run test --prefix apps/arcade-web
          npm run build --prefix apps/arcade-web
