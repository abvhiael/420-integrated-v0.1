name: 420Arcade ARC-1.8 Level 1 local saves
on:
  pull_request:
    paths:
      - 'packages/arcade-saves/**'
      - '.github/workflows/arcade-1-8-level1.yml'
  workflow_dispatch:
jobs:
  arcade-local-saves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/arcade-web/package-lock.json
      - name: Save scope, migration, replay and corruption tests
        run: node --check packages/arcade-saves/src/index.mjs && node --test packages/arcade-saves/test/*.test.mjs
      - name: Retained Arcade adapters
        run: node --test packages/arcade-input/test/*.test.mjs packages/arcade-core/test/*.test.mjs packages/arcade-phaser/test/*.test.mjs packages/arcade-audio/test/*.test.mjs
      - name: Launcher compatibility
        run: |
          npm ci --prefix apps/arcade-web --ignore-scripts --no-audit --no-fund
          npm run lint --prefix apps/arcade-web
          npm run typecheck --prefix apps/arcade-web
          npm run test --prefix apps/arcade-web
          npm run build --prefix apps/arcade-web
