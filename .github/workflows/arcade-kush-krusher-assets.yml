name: Arcade Kush Krusher Phase F asset qualification
on:
  pull_request:
    paths:
      - 'assets/arcade/mad-buds/kush-krusher/animations/**'
      - 'scripts/arcade/qualify-kush-krusher-assets.py'
      - '.github/workflows/arcade-kush-krusher-assets.yml'
  workflow_dispatch:
jobs:
  qualify-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PNG inspector
        run: python -m pip install Pillow==11.1.0
      - name: Qualify 15 Kush Krusher animation sets
        run: python scripts/arcade/qualify-kush-krusher-assets.py
      - name: Preserve scoped audit even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kush-krusher-phase-f-audit
          path: kk-animation-qualification.json
          if-no-files-found: warn
