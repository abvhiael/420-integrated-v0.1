name: 420ID Shared Account and Authentication
on:
  pull_request:
    paths:
      - 'services/420id/**'
      - 'cmd/420id/**'
      - '.github/workflows/auth-1-shared-account.yml'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: auth-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: account420_test
          POSTGRES_USER: account420_test
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U account420_test -d account420_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACCOUNT420_TEST_DSN: postgres://account420_test:local_test_only@127.0.0.1:5432/account420_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact implementation head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Shared account and authentication unit and PostgreSQL qualification
        run: go test -race -tags account420_integration -count=1 -v ./services/420id
      - name: Bounded WebAuthn CBOR fuzz qualification
        run: |
          go test ./services/420id -run '^$' -fuzz '^FuzzWebAuthnBoundedAttestation$' -fuzztime=5s -parallel=2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser WebAuthn adapter
        run: node --test services/420id/browser.test.mjs
      - name: Mail transport configuration tests
        run: go test -race -count=1 -v ./cmd/420id
      - name: Build restricted HTTPS acceptance service
        run: go build -o /tmp/420id ./cmd/420id
      - name: Verify startup fails closed without configuration
        run: |
          if env -u AUTH420_MODE /tmp/420id; then
            echo "Service started without explicit activation"
            exit 1
          fi
      - name: Static analysis
        run: go vet -tags account420_integration ./services/420id ./cmd/420id
