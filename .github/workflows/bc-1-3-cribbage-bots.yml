name: BC-1.3 Cribbage Computer Opponents
on:
  pull_request:
    paths:
      - 'services/bong-goggles-account-social/classic_cribbage_bots*.go'
      - 'docs/games/classics/BC-1-3-QUALIFICATION.md'
      - 'docs/BONG-GOGGLES-CLASSICS-ROADMAP.md'
      - '.github/workflows/bc-1-3-cribbage-bots.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cribbage-bots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Focused private-view, legal-move, strategy and full-match race tests
        run: go test -race -count=1 -timeout=9m -run '^TestBC13' -v ./services/bong-goggles-account-social
      - name: Focused service static analysis
        run: go vet ./services/bong-goggles-account-social
