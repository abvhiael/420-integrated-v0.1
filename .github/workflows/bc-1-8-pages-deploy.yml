name: BC-1.8 BongGoggles restricted Cloudflare Pages activation and production deployment
on:
  push:
    branches:
      - feature/bc-1-8-release-activation-and-live-evidence
    paths:
      - '.github/workflows/bc-1-8-pages-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bc-1-8-bonggoggles-pages-production
  cancel-in-progress: false
jobs:
  activate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact branch and source
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "feature/bc-1-8-release-activation-and-live-evidence"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned web dependencies
        working-directory: bong-goggles/web
        run: npm install --no-audit --no-fund
      - name: Verify focused computer-match and immutable release gate
        working-directory: bong-goggles/web
        run: |
          npm run check
          node --test test/cribbage-practice.test.js test/classics-release-qualification.test.js test/classics-menu.test.js test/cribbage-frontend.test.js test/cribbage-multiplayer.test.js
      - name: Build and qualify the actual production static files
        working-directory: bong-goggles/web
        env:
          BG_ACCOUNT_SOCIAL_ACTIVATION: 'true'
          BG_CLASSIC_ROOMS_ACTIVATION: 'true'
          BG_CLASSIC_COMMUNICATIONS_ACTIVATION: 'true'
        run: |
          npm run build
          node scripts/verify-account-social-output.mjs enabled
          node scripts/qualify-web.mjs
      - name: Verify Cloudflare production settings and enable only the two public flags
        working-directory: bong-goggles/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/activate-pages-cribbage.mjs
      - name: Publish qualified frontend to the existing production Pages project
        working-directory: bong-goggles/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy ./dist --project-name=bonggoggles --branch=main --commit-hash="$GITHUB_SHA" --commit-message="BC-1.8 restricted Cribbage computer-opponent testing"
      - name: Verify real deployed page, flags and healthy same-origin Worker
        working-directory: bong-goggles/web
        shell: bash
        run: |
          for i in $(seq 1 18); do
            if node test/cribbage-public-target.mjs; then
              echo "Production BongGoggles Pages release verified from the public hostname"
              exit 0
            fi
            if [ "$i" -lt 18 ]; then sleep 10; fi
          done
          echo "::error::Cloudflare Pages production never exposed the verified Classic rooms and communication flags"
          exit 1
