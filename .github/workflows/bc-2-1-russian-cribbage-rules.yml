name: BC-2.1 Russian Cribbage Rules Specification
on:
  pull_request:
    paths:
      - 'docs/games/classics/BC-2-1-RUSSIAN-CRIBBAGE-*.md'
      - 'docs/games/classics/BC-2-1-RUSSIAN-CRIBBAGE-*.json'
      - 'docs/games/classics/BC-2-1-QUALIFICATION.md'
      - 'docs/BONG-GOGGLES-CLASSICS-ROADMAP.md'
      - 'bong-goggles/web/core/russian-cribbage-rules.js'
      - 'bong-goggles/web/core/classics.js'
      - 'bong-goggles/web/test/russian-cribbage-rules.test.js'
      - '.github/workflows/bc-2-1-russian-cribbage-rules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  russian-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact tested source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test BC-2.1 Russian Cribbage and BC-1.1 standard isolation
        run: node --test bong-goggles/web/test/russian-cribbage-rules.test.js bong-goggles/web/test/cribbage-rules-spec.test.js
      - name: Validate standalone source syntax and static security
        run: |
          node --check bong-goggles/web/core/russian-cribbage-rules.js
          node bong-goggles/web/scripts/check.mjs
