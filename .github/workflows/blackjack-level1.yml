name: Blackjack practice targeted Level 1
on:
  pull_request:
    paths:
      - 'clients/420bet-lobby/src/blackjack-*.js'
      - 'clients/420bet-lobby/src/blackjack.css'
      - 'clients/420bet-lobby/src/main.js'
      - 'clients/420bet-lobby/public/assets/420bet/blackjack/**'
      - 'clients/420bet-lobby/tests/blackjack.test.mjs'
      - '.github/workflows/blackjack-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blackjack-level1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scoped lobby dependencies
        working-directory: clients/420bet-lobby
        run: npm install --no-audit --no-fund
      - name: Run Blackjack practice qualification
        working-directory: clients/420bet-lobby
        run: node --test tests/blackjack.test.mjs
      - name: Build 420Bet game lobby
        working-directory: clients/420bet-lobby
        run: npm run build
