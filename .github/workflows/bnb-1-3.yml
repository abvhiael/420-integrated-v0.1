name: 420BnB BNB-1.3 Domain and M1
on:
  pull_request:
    paths:
      - 'docs/bnb/**'
      - 'scripts/validate-bnb-1-1.py'
      - 'scripts/validate-bnb-1-2.py'
      - 'scripts/validate-bnb-1-3.py'
      - '.github/workflows/bnb-1-3.yml'
      - 'config/420travel-genesis.json'
      - 'config/genesis-consumer-services.json'
      - 'genesis/svc3/travelapp/compatibility.go'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bnb-m1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert exact PR implementation SHA
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$SHA" = "$EXPECTED"
          echo "Qualified PR branch implementation SHA: $SHA"
          echo "GitHub event SHA (may be a synthetic merge): $GITHUB_SHA"
      - name: BNB-1.1 source boundary
        run: python3 scripts/validate-bnb-1-1.py
      - name: BNB-1.2 product contract
        run: python3 scripts/validate-bnb-1-2.py
      - name: BNB-1.3 domain state machines and M1 consistency
        run: python3 scripts/validate-bnb-1-3.py
