name: 420BnB BNB-1.5 Financial Architecture M2
on:
  pull_request:
    paths:
      - 'docs/bnb/**'
      - 'scripts/validate-bnb-1-*.py'
      - '.github/workflows/bnb-1-5.yml'
      - 'config/420travel-genesis.json'
      - 'config/genesis-consumer-services.json'
      - 'genesis/svc3/travelapp/compatibility.go'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  financial-m2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact PR head
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$SHA" = "$EXPECTED"
          echo "Qualified BNB M2 implementation SHA: $SHA"
          echo "GitHub event SHA: $GITHUB_SHA"
      - name: Verify BNB-1.1 through BNB-1.5 and M2 financial authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-bnb-1-1.py
          python3 scripts/validate-bnb-1-2.py
          python3 scripts/validate-bnb-1-3.py
          python3 scripts/validate-bnb-1-4.py
          python3 scripts/validate-bnb-1-5.py
