name: 420BnB BNB-1.6 Backend Architecture
on:
  pull_request:
    paths:
      - 'docs/bnb/**'
      - 'scripts/validate-bnb-1-6.py'
      - '.github/workflows/bnb-1-6.yml'
      - 'docs/genesis-services/GEN-SVC-0-ROADMAP.md'
      - 'config/420travel-genesis.json'
      - 'config/genesis-consumer-services.json'
      - 'genesis/svc3/travelapp/compatibility.go'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact implementation SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "BNB-1.6 exact implementation SHA: $(git rev-parse HEAD)"
      - name: Targeted BNB-1.6 Level 1
        run: python3 scripts/validate-bnb-1-6.py
