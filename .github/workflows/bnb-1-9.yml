name: 420BnB BNB-1.9 Deployment Operations
on:
  pull_request:
    paths:
      - 'docs/bnb/**'
      - 'scripts/validate-bnb-1-9.py'
      - '.github/workflows/bnb-1-9.yml'
      - 'docs/apps/pay/deployment-operations.md'
      - 'config/420travel-genesis.json'
      - 'config/genesis-consumer-services.json'
      - 'genesis/svc3/travelapp/compatibility.go'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operations-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact PR implementation SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "BNB-1.9 exact SHA: $(git rev-parse HEAD)"
      - name: Targeted BNB-1.9 Level 1 verification
        run: python3 scripts/validate-bnb-1-9.py
