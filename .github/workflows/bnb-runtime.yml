name: 420BnB Runtime Slice
on:
  pull_request:
    paths:
      - 'services/420bnb/**'
      - 'web/bnb/**'
      - '.github/workflows/bnb-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bnb
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: bnb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bnb -d bnb"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BNB_DATABASE_URL: postgresql://bnb:test-only@localhost:5432/bnb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install runtime dependencies
        run: python -m pip install -r services/420bnb/requirements.txt
      - name: Apply PostgreSQL schema
        run: python -c "import os,psycopg,pathlib; c=psycopg.connect(os.environ['BNB_DATABASE_URL']); c.execute(pathlib.Path('services/420bnb/migrations/001_initial.sql').read_text()); c.execute(pathlib.Path('services/420bnb/migrations/002_identity_access.sql').read_text()); c.execute(pathlib.Path('services/420bnb/migrations/003_recovery_claims.sql').read_text()); c.execute(pathlib.Path('services/420bnb/migrations/004_authority_replay.sql').read_text()); c.execute(pathlib.Path('services/420bnb/migrations/005_host_management.sql').read_text()); c.execute(pathlib.Path('services/420bnb/migrations/006_host_policy_media.sql').read_text()); c.execute(pathlib.Path('services/420bnb/migrations/007_media_review_nonce.sql').read_text()); c.execute(pathlib.Path('services/420bnb/migrations/008_unit_hold_allocation.sql').read_text()); c.execute(pathlib.Path('services/420bnb/migrations/009_availability_sync.sql').read_text()); c.execute(pathlib.Path('services/420bnb/migrations/010_minimum_stay_policy.sql').read_text()); c.execute(pathlib.Path('services/420bnb/migrations/011_quote_pricing.sql').read_text()); c.execute(pathlib.Path('services/420bnb/migrations/012_hold_quote_binding.sql').read_text()); c.execute(pathlib.Path('services/420bnb/migrations/013_booking_requests.sql').read_text()); c.execute(pathlib.Path('services/420bnb/migrations/014_pending_reservation_expiry.sql').read_text()); c.execute(pathlib.Path('services/420bnb/migrations/015_pay_swap_intents.sql').read_text()); c.execute(pathlib.Path('services/420bnb/migrations/016_settlement_refund_payout.sql').read_text()); c.execute(pathlib.Path('services/420bnb/migrations/017_guest_experience.sql').read_text()); c.execute(pathlib.Path('services/420bnb/migrations/018_travel_authority.sql').read_text()); c.execute(pathlib.Path('services/420bnb/migrations/019_reviews_reputation_messaging.sql').read_text()); c.commit();c.close()"
      - name: Runtime security and API tests
        run: pytest -q services/420bnb/tests
      - name: Compile runtime module
        run: python -m py_compile services/420bnb/api.py
      - name: Build non-root BnB container
        run: docker build -f services/420bnb/Dockerfile -t bnb-test:${{ github.sha }} .
      - name: Container staging smoke (isolated CI PostgreSQL)
        run: |
          set -euo pipefail
          docker run -d --name bnb-smoke --network host \
            -e BNB_DATABASE_URL="$BNB_DATABASE_URL" \
            bnb-test:${{ github.sha }}
          trap 'docker logs bnb-smoke; docker rm -f bnb-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready | grep -q '"status":"ready"'; then
              curl --fail --silent http://127.0.0.1:8080/v1/bnb/listings
              exit 0
            fi
            sleep 1
          done
          echo 'Container readiness failed' >&2; exit 1
      - name: Validate host UI script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          content = Path('web/bnb/index.html').read_text()
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', content, flags=re.S)
          assert scripts, 'Host UI script missing'
          with tempfile.TemporaryDirectory() as directory:
              for index, script in enumerate(scripts):
                  target = Path(directory) / f'bnb-host-{index}.js'
                  target.write_text(script)
                  subprocess.run(['node', '--check', str(target)], check=True)
          PY
      - name: Host browser accessibility smoke
        run: |
          npm install --no-save --no-package-lock axe-core@4.10.3
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python services/420bnb/tests/browser_accessibility.py
      - name: Verify front-end surfaces
        run: python -c "from pathlib import Path; s=Path('web/bnb/index.html').read_text(); assert 'aria-live' in s and 'Payments' not in s.split('<script>')[0] or 'disabled' in s"
