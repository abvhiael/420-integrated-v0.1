name: Bong Goggles Messaging Verification

on:
  pull_request:
    paths:
      - 'services/bong-goggles-messaging-v1/**'
      - 'docs/BONG-GOGGLES-BG-14.md'
      - '.github/workflows/bong-goggles-messaging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-messaging:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/bong-goggles-messaging-v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run BG-14 messaging tests
        run: npm test
