name: BongGoggles live 420ID sign-in smoke
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bonggoggles-live-auth-smoke.yml
      - services/bong-goggles-account-social/bridge.go
      - services/bong-goggles-account-social/http.go
      - bong-goggles/web/core/account-social-controller.js
      - bong-goggles/web/core/account-social.js

permissions:
  contents: read

jobs:
  public-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe live identity, social ingress, and SSO redirect (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          probe() {
            local name="$1" url="$2" expected="$3" attempt status
            for attempt in {1..9}; do
              : > "$headers"
              status="$(curl --silent --show-error --max-time 25 --max-redirs 0 --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url" || true)"
              echo "$name attempt $attempt: HTTP ${status:-network error} (expected $expected)"
              if [[ "$status" == "$expected" ]]; then
                return 0
              fi
              [[ "$attempt" -eq 9 ]] && break
              sleep 15
            done
            echo "::error::$name remained unavailable after bounded requests. Check Render runtime and Cloudflare route."
            return 1
          }
          probe "420ID health" "https://auth.420integrated.org/healthz" 200
          probe "BongGoggles social health" "https://bonggoggles.420integrated.org/social-api/healthz" 200
          probe "BongGoggles login entry" "https://bonggoggles.420integrated.org/social-api/auth/start" 303
          if ! grep -Eqi '^location:[[:space:]]*https://auth[.]420integrated[.]org/sso/authorize[?]' "$headers"; then
            echo "::error::Login did not redirect to the canonical 420ID SSO authorize endpoint."
            exit 1
          fi
          if ! grep -Eqi '^set-cookie:[[:space:]]*__Host-bg_social_flow=' "$headers"; then
            echo "::error::Login redirect did not issue the secure flow cookie."
            exit 1
          fi
          echo "SSO initiation is reachable; user consent, callback and authenticated session still require interactive browser acceptance."
      - name: Check published read-only wake-up recovery
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            js_status="$(curl --silent --show-error --location --max-time 20 --output /tmp/bg-social-client.js --write-out '%{http_code}' "https://bonggoggles.420integrated.org/core/account-social.js?release=${GITHUB_SHA}" || true)"
            ctl_status="$(curl --silent --show-error --location --max-time 20 --output /tmp/bg-social-controller.js --write-out '%{http_code}' "https://bonggoggles.420integrated.org/core/account-social-controller.js?release=${GITHUB_SHA}" || true)"
            if [[ "$js_status" == "200" && "$ctl_status" == "200" ]] &&
               grep -Fq "if(method==='GET'&&[502,503,504].includes(response.status))" /tmp/bg-social-client.js &&
               grep -Fq 'const WAKE_RETRY_DELAYS_MS' /tmp/bg-social-controller.js &&
               grep -Fq 'if(temporaryGateway(me))return this.transient(gen)' /tmp/bg-social-controller.js; then
              echo "PASS: live BongGoggles serves bounded read-only session/feed recovery."
              exit 0
            fi
            echo "Live recovery attempt $attempt/24: client HTTP $js_status, controller HTTP $ctl_status; waiting for the Pages deploy."
            [[ "$attempt" -eq 24 ]] && break
            sleep 15
          done
          echo "::error::BongGoggles Pages has not published the verified cold-start fix."
          exit 1
