name: 420Bridge BRIDGE-AUDIT-2 Shared Core Qualification

on:
  pull_request:
    paths:
      - "contracts/src/bridge/BridgeAccountingRegistry.sol"
      - "contracts/src/bridge/BridgeValueCustody420.sol"
      - "contracts/src/bridge/BridgeRepresentation420.sol"
      - "contracts/src/interfaces/IBridgeValueCustody420.sol"
      - "contracts/src/interfaces/IBridgeExposureEvidence420.sol"
      - "contracts/test/helpers/ValueCustodyFixture420.sol"
      - "contracts/src/bridge/BridgeAssetRegistry.sol"
      - "contracts/src/bridge/BridgeChainRegistry420.sol"
      - "contracts/src/bridge/BridgeIds420.sol"
      - "contracts/src/bridge/BridgeRiskManager.sol"
      - "contracts/src/bridge/BridgeRouteRegistry.sol"
      - "contracts/src/bridge/BridgeTransferRegistry.sol"
      - "contracts/src/bridge/GatewayRouter420.sol"
      - "contracts/src/bridge/VerifiedGateway420.sol"
      - "contracts/test/Bridge*.t.sol"
      - "contracts/test/GovernanceAccountingRecoveryHardening420.t.sol"
      - "contracts/test/PaySwapBridgeGenesisIntegration420.t.sol"
      - "contracts/test/ExchangeBridgeQualification420.t.sol"
      - "contracts/config/genesis-dapp-contract-map.json"
      - ".github/workflows/bridge-audit-2.yml"
  workflow_dispatch:

concurrency:
  group: bridge-audit-2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared-bridge-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Qualify shared Bridge core, accounting, and downstream compatibility
        run: |
          python3 scripts/qualify-pay-regression.py --profile pr \
            --match 'test/Bridge*.t.sol' \
            --match GovernanceAccountingRecoveryHardening420.t.sol \
            --match PaySwapBridgeGenesisIntegration420.t.sol \
            --match ExchangeBridgeQualification420.t.sol \
            --output /tmp/bridge-audit-2-solidity
