name: Pirate Chain Bridge Proof Qualification
on:
  pull_request:
    paths:
      - 'contracts/src/bridge/verifiers/PirateChainFinalityVerifier420.sol'
      - 'contracts/src/bridge/verifiers/pirate/**'
      - 'contracts/src/bridge/adapters/PirateChainBridgeAdapter420.sol'
      - 'contracts/src/interfaces/IPirateChainFinalityVerifier420.sol'
      - 'contracts/src/bridge/verifiers/AuthenticatedCheckpoint420.sol'
      - 'contracts/src/bridge/verifiers/BridgeCrypto420.sol'
      - 'contracts/src/bridge/verifiers/BridgeWire420.sol'
      - 'contracts/src/accounts/ECDSA420.sol'
      - 'contracts/src/system/SystemAccess.sol'
      - 'contracts/config/bridge/pirate-mainnet-v12.5.12.json'
      - 'contracts/test/Pirate*.t.sol'
      - 'contracts/test/fixtures/pirate/**'
      - 'scripts/qualify-pirate.py'
      - 'scripts/pirate/**'
      - 'docs/audit/BRIDGE-AUDIT-3-V-13-PIRATE.md'
      - 'docs/audit/pirate-qualification/**'
      - '.github/workflows/bridge-pirate-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pirate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Affected Solidity and public evidence
        run: |
          python -m pip install -r scripts/pirate/requirements.txt
          python scripts/qualify-pirate.py
          python scripts/pirate/verify_history.py
          python -m unittest discover -s scripts/pirate -p 'test_*.py' -v
          sha256sum -c contracts/test/fixtures/pirate/SHA256SUMS
      - name: Exact pinned native cryptography
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/pirate-rust-target
        run: |
          cargo build --release --locked --manifest-path scripts/pirate/shielded/Cargo.toml
          python scripts/pirate/fetch_params.py "$RUNNER_TEMP/pirate-params"
          python scripts/pirate/qualify_shielded.py --binary "$CARGO_TARGET_DIR/release/pirate-shielded420" --params "$RUNNER_TEMP/pirate-params"
