name: Budtender 3.16 Filename Normalization
on:
  push:
    branches:
      - feature/budtender-3-16-hotspots-integration
    paths:
      - ".github/workflows/budtender-316-normalize.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Normalize 37 paths without removing original designs
        run: node scripts/budtender/normalize-phase316-artwork.mjs
      - name: Commit only Phase 3.16 rename results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/budtender/phase-3.16
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "assets(budtender): normalize Phase 3.16 filenames and preserve variants"
          git push
