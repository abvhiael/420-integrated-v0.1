name: Budtender 3.17 scoped PNG resize
on:
  push:
    branches: [budtender/phase-3.17-assets-level1]
    paths:
      - .github/workflows/budtender-317-resize.yml
      - clients/budtender-web-v1/scripts/resize-phase-317.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resize:
    if: github.ref == 'refs/heads/budtender/phase-3.17-assets-level1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processor
        run: python -m pip install 'Pillow==11.3.0'
      - name: Resize only undersized 3.17 RGBA images
        run: python clients/budtender-web-v1/scripts/resize-phase-317.py
      - name: Confirm only Phase 3.17 images and registry changed
        shell: bash
        run: |
          git diff --name-only | while IFS= read -r p; do
            case "$p" in
              assets/budtender/phase-3.17/*.png|assets/budtender/phase-3.17/registry.json) ;;
              *) echo "Unexpected file changed: $p"; exit 1 ;;
            esac
          done
      - name: Commit bounded resize
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/budtender/phase-3.17/*.png assets/budtender/phase-3.17/registry.json
          git commit -m "Budtender 3.17: resize undersized RGBA assets to 256px height"
          git push origin HEAD:budtender/phase-3.17-assets-level1
