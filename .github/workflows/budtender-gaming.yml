name: Budtender Qualification

on:
  pull_request:
    paths:
      - "src/budtender/**"
      - "test/budtender/**"
      - "clients/budtender-access-v1/**"
      - "clients/budtender-web-v1/**"
      - "packages/420-gaming-sdk/**"
      - "contracts/src/gaming/**"
      - "contracts/test/GamingProtocol420*.t.sol"
      - "docs/budtender/**"
      - "docs/gaming/420GP-12-BUDTENDER.md"
      - ".github/workflows/budtender-gaming.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budtender-qualification-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Syntax-check Budtender TypeScript core
        run: |
          for file in src/budtender/*.ts test/budtender/*.spec.ts; do
            node --experimental-strip-types --check "$file"
          done
      - name: Test Budtender BUD-1 through BUD-4 core
        run: node --experimental-strip-types --test test/budtender/*.spec.ts

  web-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check Budtender web client
        working-directory: clients/budtender-web-v1
        run: npm run check
      - name: Verify approved artwork files against manifest
        working-directory: clients/budtender-web-v1
        run: npm run assets
      - name: Test Budtender web client
        working-directory: clients/budtender-web-v1
        run: npm test
      - name: Browser smoke — decode storefront sprites and capture screenshot
        working-directory: clients/budtender-web-v1
        run: |
          set -euo pipefail
          node --experimental-strip-types src/server.ts > /tmp/budtender-web.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4207/readyz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4207/readyz
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,960 --virtual-time-budget=10000 --dump-dom http://127.0.0.1:4207/ > /tmp/budtender-storefront-dom.html
          grep -q 'artwork library connected · 416 assets' /tmp/budtender-storefront-dom.html
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,960 --virtual-time-budget=10000 --screenshot=/tmp/budtender-storefront-desktop.png http://127.0.0.1:4207/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=10000 --screenshot=/tmp/budtender-storefront-mobile.png http://127.0.0.1:4207/
          test "$(stat -c%s /tmp/budtender-storefront-desktop.png)" -gt 10000
          test "$(stat -c%s /tmp/budtender-storefront-mobile.png)" -gt 5000
      - name: Preserve browser artwork evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budtender-storefront-visual-evidence
          path: |
            /tmp/budtender-storefront-desktop.png
            /tmp/budtender-storefront-mobile.png
            /tmp/budtender-storefront-dom.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Budtender web security controls
        working-directory: clients/budtender-web-v1
        run: npm run security
      - name: Verify Budtender deployment operations controls
        working-directory: clients/budtender-web-v1
        run: npm run ops

  gaming-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Test shared gaming SDK
        working-directory: packages/420-gaming-sdk
        run: npm test
      - name: Test Budtender gaming integration
        working-directory: clients/budtender-access-v1
        run: npm test

  gaming-client-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run Gaming client hostile-state and four-game E2E suite
        working-directory: packages/420-gaming-client-hardening
        run: npm test
      - name: Run Gaming cross-game qualification
        working-directory: packages/420-gaming-cross-game-qualification
        run: npm test

  gaming-contract-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build shared Gaming Protocol security targets
        working-directory: contracts
        run: |
          forge build test/GamingProtocol420Hardening.t.sol --force
          forge build test/GamingProtocol420AuthorityIsolation.t.sol --force
      - name: Run shared Gaming Protocol adversarial suite
        working-directory: contracts
        run: forge test --match-path 'test/GamingProtocol420*.t.sol' -vvv
