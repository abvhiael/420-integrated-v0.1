name: CCC Atlas One-Time Source Correction
on:
  push:
    branches:
      - feature/ccc-account-multiplayer-delivery
    paths:
      - .github/workflows/ccc-atlas-source-correction.yml
permissions:
  contents: write
jobs:
  convert-approved-atlases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ccc-account-multiplayer-delivery
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Sharp conversion dependency
        working-directory: bong-goggles/web
        run: npm install --no-audit --no-fund
      - name: Convert exact three approved PNG-masquerading-as-WebP uploads
        working-directory: bong-goggles/web
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import sharp from 'sharp';
          const master={
            east:'508aa63f621c52430d8583d2152bb4ae927df17d',
            ontario:'6f92f4c032722762143e8a1bdf6fe8cfffec2541',
            west:'26c5db581aa199a867ef5f9126b717c97490ca4f'
          };
          for(const [region,gitBlobSha] of Object.entries(master)){
            const path='assets/games/cross-country-chaos/maps/'+region+'-atlas-underlay.webp';
            const input=await readFile(path);
            const calculated=createHash('sha1').update('blob '+input.length).update(Buffer.from([0])).update(input).digest('hex');
            if(calculated!==gitBlobSha)throw Error('Refusing to alter unrecognized atlas: '+region);
            const source=await sharp(input).metadata();
            if(source.format!=='png'||source.width!==1907||source.height!==825)
              throw Error('Unexpected approved PNG source format: '+region);
            const output=await sharp(input).resize(1920,830,{fit:'fill'})
              .webp({quality:92,effort:6}).toBuffer();
            const meta=await sharp(output).metadata();
            if(meta.format!=='webp'||meta.width!==1920||meta.height!==830||meta.hasAlpha||output.length>4*1024*1024)
              throw Error('Failed output WebP quality checks: '+region);
            await writeFile(path,output);
            console.log(region+': '+input.length+' B PNG -> '+output.length+' B genuine WebP');
          }
          NODE
      - name: Commit corrected binary source images to PR branch only
        run: |
          git add bong-goggles/web/assets/games/cross-country-chaos/maps/*-atlas-underlay.webp
          git -c user.name='CCC Artwork Automation' -c user.email='ccc-artwork@users.noreply.github.com' commit -m 'CCC: convert approved atlas originals to genuine 1920x830 WebP masters'
          git push origin HEAD:refs/heads/feature/ccc-account-multiplayer-delivery
