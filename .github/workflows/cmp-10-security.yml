name: CMP 10 Security Readiness
on:
  pull_request:
    paths:
      - 'compute/ingestion/**'
      - '.github/workflows/cmp-10-security.yml'
  workflow_dispatch:
jobs:
  security-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CMP-10 security preflight and retained ingestion qualification
        working-directory: compute/ingestion
        run: npm run qualify
