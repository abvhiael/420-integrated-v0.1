name: CMP 9.14 Soak Readiness
on:
  pull_request:
    paths:
      - 'compute/ingestion/**'
      - '.github/workflows/cmp-9-14-soak.yml'
  workflow_dispatch:
jobs:
  soak-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check exact implementation SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run app-scoped soak gate and retained regression
        working-directory: compute/ingestion
        run: npm run qualify
