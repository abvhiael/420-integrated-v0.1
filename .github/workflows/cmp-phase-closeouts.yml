name: CMP Phase Closeout Scoped Qualification

# Closeout inventories automatically requalify on their own changes; comprehensive
# integrated Level 3 qualification remains explicit workflow_dispatch only.
on:
  pull_request:
    paths:
      - 'contracts/config/compute-market/cmp-4.10-phase-closeout.json'
      - 'docs/compute-market/CMP-4.10-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-4-10-closeout.py'
      - 'contracts/config/compute-market/cmp-5.8-phase-closeout.json'
      - 'docs/compute-market/CMP-5.8-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-5-8-closeout.py'
      - 'contracts/config/compute-market/cmp-6.8-phase-closeout.json'
      - 'docs/compute-market/CMP-6.8-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-6-8-closeout.py'
      - 'contracts/config/compute-market/cmp-7.10-phase-closeout.json'
      - 'docs/compute-market/CMP-7.10-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-7-10-closeout.py'
      - 'contracts/config/compute-market/cmp-8-phase-closeout.json'
      - 'docs/compute-market/CMP-8-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-8-closeout.py'
      - '.github/workflows/cmp-phase-closeouts.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/config/compute-market/cmp-4.10-phase-closeout.json'
      - 'docs/compute-market/CMP-4.10-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-4-10-closeout.py'
      - 'contracts/config/compute-market/cmp-5.8-phase-closeout.json'
      - 'docs/compute-market/CMP-5.8-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-5-8-closeout.py'
      - 'contracts/config/compute-market/cmp-6.8-phase-closeout.json'
      - 'docs/compute-market/CMP-6.8-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-6-8-closeout.py'
      - 'contracts/config/compute-market/cmp-7.10-phase-closeout.json'
      - 'docs/compute-market/CMP-7.10-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-7-10-closeout.py'
      - 'contracts/config/compute-market/cmp-8-phase-closeout.json'
      - 'docs/compute-market/CMP-8-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-8-closeout.py'
      - '.github/workflows/cmp-phase-closeouts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-closeouts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify CMP-4.10 closeout inventory
        run: python scripts/verify-cmp-4-10-closeout.py
      - name: Verify CMP-5.8 closeout inventory
        run: python scripts/verify-cmp-5-8-closeout.py
      - name: Verify CMP-6.8 closeout inventory
        run: python scripts/verify-cmp-6-8-closeout.py
      - name: Verify CMP-7.10 closeout inventory
        run: python scripts/verify-cmp-7-10-closeout.py
      - name: Verify CMP-8 closeout inventory
        run: python scripts/verify-cmp-8-closeout.py
