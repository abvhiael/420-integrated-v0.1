name: CMP S-10 Operational Handoff
on:
  pull_request:
    paths:
      - 'compute/ingestion/**'
      - '.github/workflows/cmp-s10-handoff.yml'
  workflow_dispatch:
jobs:
  operational-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact implementation SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: S-10 targeted and retained S-02 to S-09 tests
        working-directory: compute/ingestion
        run: npm run qualify
