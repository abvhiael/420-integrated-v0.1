name: CMP External Science Read Endpoint
on:
  pull_request:
    paths:
      - 'indexer/api/external_science*'
      - 'indexer/api/backend.go'
      - 'indexer/api/server.go'
      - 'compute/web/**'
      - '.github/workflows/cmp-science-read-endpoint.yml'
  workflow_dispatch:
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      science: ${{ steps.changed.outputs.science }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY_SCOPE'
          import os,subprocess
          files=subprocess.check_output(['git','diff','--name-only',os.environ['BASE'],'HEAD'],text=True).splitlines() if os.environ['BASE'] else ['compute/web/']
          science=any(p.startswith(('compute/web/','indexer/api/external_science')) or p in ('indexer/api/backend.go','indexer/api/server.go') for p in files)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('science='+str(science).lower()+'\n')
          PY_SCOPE
  science-read:
    needs: scope
    if: needs.scope.outputs.science == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify qualified implementation SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Targeted Indexer science API and runtime tests
        run: go test ./indexer/api ./indexer/cmd/indexer420 -count=1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 420Compute UI build and science behavior tests
        working-directory: compute/web
        run: npm run build
