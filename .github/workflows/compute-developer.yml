name: Compute Developer Surfaces

on:
  pull_request:
    paths:
      - 'packages/420-sdk/**'
      - 'packages/420-cli/**'
      - 'services/compute-api/**'
      - '420-indexer/**'
      - 'docs/compute-market/CMP-7*'
      - '.github/workflows/compute-developer.yml'
  push:
    branches: [ main ]
    paths:
      - 'packages/420-sdk/**'
      - 'packages/420-cli/**'
      - 'services/compute-api/**'
      - '420-indexer/**'
      - 'docs/compute-market/CMP-7*'
      - '.github/workflows/compute-developer.yml'

concurrency:
  group: compute-developer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.paths.outputs.sdk }}
      api: ${{ steps.paths.outputs.api }}
      indexer: ${{ steps.paths.outputs.indexer }}
      cli: ${{ steps.paths.outputs.cli }}
      api_milestone: ${{ steps.paths.outputs.api_milestone }}
      full_milestone: ${{ steps.paths.outputs.full_milestone }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: paths
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            files="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          else
            files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          fi
          latest="$(git diff --name-only HEAD^ HEAD)"
          sdk=false; api=false; indexer=false; cli=false
          api_milestone=false; full_milestone=false
          grep -qE '^packages/420-sdk/' <<<"$files" && sdk=true || true
          grep -qE '^services/compute-api/' <<<"$files" && api=true || true
          grep -qE '^420-indexer/' <<<"$files" && indexer=true || true
          grep -qE '^packages/420-cli/' <<<"$files" && cli=true || true
          grep -qE '^docs/compute-market/CMP-7\.5-RESEARCH-PROJECT-API\.md$' <<<"$latest" && api_milestone=true || true
          grep -qE '^docs/compute-market/CMP-7\.9-CLI\.md$' <<<"$latest" && full_milestone=true || true
          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "indexer=$indexer" >> "$GITHUB_OUTPUT"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
          echo "api_milestone=$api_milestone" >> "$GITHUB_OUTPUT"
          echo "full_milestone=$full_milestone" >> "$GITHUB_OUTPUT"

  sdk:
    needs: classify
    if: needs.classify.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: packages/420-sdk
        run: npm install --no-audit --no-fund && npm test

  api:
    needs: classify
    if: needs.classify.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: packages/420-sdk
        run: npm install --no-audit --no-fund && npm run build
      - working-directory: services/compute-api
        run: npm install --no-audit --no-fund && npm test

  indexer:
    needs: classify
    if: needs.classify.outputs.indexer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: 420-indexer
        run: npm install --no-audit --no-fund && npm test

  cli:
    needs: classify
    if: needs.classify.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: packages/420-sdk
        run: npm install --no-audit --no-fund && npm run build
      - working-directory: packages/420-cli
        run: npm install --no-audit --no-fund && npm test

  api-integration:
    needs: classify
    if: needs.classify.outputs.api_milestone == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retained Compute SDK suite
        working-directory: packages/420-sdk
        run: npm install --no-audit --no-fund && npm test
      - name: Retained Compute API suite
        working-directory: services/compute-api
        run: npm install --no-audit --no-fund && npm test

  full-integration:
    needs: classify
    if: needs.classify.outputs.full_milestone == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SDK
        working-directory: packages/420-sdk
        run: npm install --no-audit --no-fund && npm test
      - name: API
        working-directory: services/compute-api
        run: npm install --no-audit --no-fund && npm test
      - name: Indexer
        working-directory: 420-indexer
        run: npm install --no-audit --no-fund && npm test
      - name: CLI
        working-directory: packages/420-cli
        run: npm install --no-audit --no-fund && npm test
