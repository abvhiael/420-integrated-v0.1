name: Compute Market Qualification

on:
  pull_request:
    paths:
      - 'contracts/src/compute/**'
      - 'contracts/test/Compute*.t.sol'
      - 'contracts/config/compute-market/**'
      - 'docs/compute-market/**'
      - 'docs/420-COMPUTE-MARKET-V1-ARCHITECTURE.md'
      - 'scripts/verify-cmp-*.py'
      - 'scripts/test-cmp-*.py'
      - '.github/workflows/compute-market.yml'
  push:
    branches: [ main ]
    paths:
      - 'contracts/src/compute/**'
      - 'contracts/test/Compute*.t.sol'
      - 'contracts/config/compute-market/**'
      - 'docs/compute-market/**'
      - 'docs/420-COMPUTE-MARKET-V1-ARCHITECTURE.md'
      - 'scripts/verify-cmp-*.py'
      - 'scripts/test-cmp-*.py'
      - '.github/workflows/compute-market.yml'
  workflow_dispatch:

concurrency:
  group: compute-market-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build Compute Market contracts
        working-directory: contracts
        run: forge build src/compute

      - name: Run retained Compute Market Solidity suite
        working-directory: contracts
        run: forge test --match-path 'test/Compute*.t.sol' -vvv

      - name: Compile Compute Market verification scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find scripts -maxdepth 1 -type f \( -name 'verify-cmp-*.py' -o -name 'test-cmp-*.py' \) -print | sort)
          if (("${#scripts[@]}" > 0)); then
            python -m py_compile "${scripts[@]}"
          fi

      - name: Retain CMP-1.4 architecture freeze
        run: python scripts/verify-cmp-1-4-0-verifier-architecture.py

      - name: Verify CMP-1.4.1 verifier identity lifecycle
        run: python scripts/verify-cmp-1-4-1-verifier-lifecycle.py

      - name: Verify CMP-1.4.2 verifier classes and workload capabilities
        run: python scripts/verify-cmp-1-4-2-verifier-capabilities.py

      - name: Verify CMP-1.4.3 verification policy registry
        run: python scripts/verify-cmp-1-4-3-verification-policy.py

      - name: Verify CMP-1.4.4 signed verdict provenance
        run: python scripts/verify-cmp-1-4-4-signed-verdict-provenance.py

      - name: Verify CMP-1.4.5 independent verifier selection
        run: python scripts/verify-cmp-1-4-5-independent-selection.py

      - name: Verify CMP-1.4.6 replicated N-of-M verification
        run: python scripts/verify-cmp-1-4-6-replicated-verification.py

      - name: Verify CMP-1.4.7 deterministic verification adapters
        run: python scripts/verify-cmp-1-4-7-deterministic-adapters.py

      - name: Verify CMP-1.4.8 scientific/probabilistic verification
        run: python scripts/verify-cmp-1-4-8-scientific-verification.py

      - name: Verify CMP-1.4.9 challenge and appeal hooks
        run: python scripts/verify-cmp-1-4-9-challenge-appeal-hooks.py

      - name: Verify CMP-1.4.10 cross-verifier adversarial qualification
        run: python scripts/verify-cmp-1-4-10-cross-verifier-adversarial.py

      - name: Verify CMP-1.4.11 verifier repository release readiness
        run: python scripts/verify-cmp-1-4-11-verifier-release-candidate.py --repository-ready

      - name: Verify CMP-1.4.11 live readiness remains fail-closed
        shell: bash
        run: |
          if python scripts/verify-cmp-1-4-11-verifier-release-candidate.py; then
            echo "live verifier readiness unexpectedly passed"
            exit 1
          fi

      - name: Verify CMP-1.4.12 phase closeout reconciliation
        run: python scripts/verify-cmp-1-4-12-closeout.py

      - name: Verify CMP-1.5.0 stake architecture
        run: python scripts/verify-cmp-1-5-0-stake-architecture.py

      - name: Verify CMP-1.5.1 worker collateral
        run: python scripts/verify-cmp-1-5-1-worker-collateral.py

      - name: Verify CMP-1.5.2 verifier collateral
        run: python scripts/verify-cmp-1-5-2-verifier-collateral.py

      - name: Verify CMP-1.5.3 policy-specific minimum collateral
        run: python scripts/verify-cmp-1-5-3-policy-minimum-collateral.py

      - name: Verify CMP-1.5.4 exit queue and withdrawal delay
        run: python scripts/verify-cmp-1-5-4-exit-queue-withdrawal-delay.py

      - name: Verify CMP-1.5.5 objective slash authorization
        run: python scripts/verify-cmp-1-5-5-objective-slash-authorization.py

      - name: Verify CMP-1.5.6 slash distribution
        run: python scripts/verify-cmp-1-5-6-slash-distribution.py

      - name: Verify CMP-1.5.7 reward accounting
        run: python scripts/verify-cmp-1-5-7-reward-accounting.py

      - name: Verify CMP-1.5.8 dispute stake integration
        run: python scripts/verify-cmp-1-5-8-dispute-stake-integration.py

      - name: Verify CMP-1.5.9 WorkerRegistry stake-source integration
        run: python scripts/verify-cmp-1-5-9-workerregistry-stake-source-integration.py

      - name: Verify CMP-1.2.10 closeout after stake-slash integration
        run: python scripts/verify-cmp-1-2-10-closeout.py

      - name: Verify CMP-1.5.10 ComputeEscrow slash redistribution
        run: python scripts/verify-cmp-1-5-10-computeescrow-slash-redistribution.py

      - name: Verify CMP-1.5.11 hostile economic qualification
        run: python scripts/verify-cmp-1-5-11-hostile-economic-qualification.py

      - name: Verify CMP-1.5.12 repository release candidate
        run: python scripts/verify-cmp-1-5-12-release-candidate.py --repository-ready

      - name: Verify CMP-1.5.12 live readiness remains fail-closed
        shell: bash
        run: |
          if python scripts/verify-cmp-1-5-12-release-candidate.py; then
            echo "CMP-1.5.12 live readiness unexpectedly passed"
            exit 1
          fi

      - name: Verify CMP-1.5.13 phase closeout inventory
        run: python scripts/verify-cmp-1-5-13-closeout.py

      - name: Verify CMP-2.1 worker offers
        run: python scripts/verify-cmp-2-1-worker-offers.py

      - name: Verify CMP-2.2 compute requests
        run: python scripts/verify-cmp-2-2-compute-requests.py

      - name: Verify CMP-2.3 replaceable matching engine
        run: python scripts/verify-cmp-2-3-replaceable-matching.py

      - name: Verify CMP-2.4 pricing model
        run: python scripts/verify-cmp-2-4-pricing-model.py

      - name: Verify CMP-2.5 capacity-aware assignment
        run: python scripts/verify-cmp-2-5-capacity-aware-assignment.py

      - name: Verify CMP-2.6 scheduler redundancy and non-authority
        run: python scripts/verify-cmp-2-6-scheduler-redundancy.py

      - name: Verify CMP-2.7 market adversarial qualification
        run: python scripts/verify-cmp-2-7-market-adversarial.py

      - name: Verify CMP-2.8 phase closeout inventory
        run: python scripts/verify-cmp-2-8-phase-closeout.py

      - name: Verify CMP-4.1 scientific work-unit specification
        run: python scripts/verify-cmp-4-1-scientific-work-unit.py

      - name: Test CMP-4.1 scientific work-unit boundaries
        run: python scripts/test-cmp-4-1-scientific-work-unit.py

      - name: Verify CMP-4.2 Research Project Registry
        run: python scripts/verify-cmp-4-2-research-project-registry.py

      - name: Verify CMP-4.3 researcher / institution identity
        run: python scripts/verify-cmp-4-3-research-identity.py

      - name: Verify CMP-4.4 dataset manifests
        run: python scripts/verify-cmp-4-4-dataset-manifests.py

      - name: Verify CMP-4.5 reproducible execution environments
        run: python scripts/verify-cmp-4-5-execution-environments.py

      - name: Verify CMP-4.6 result provenance
        run: python scripts/verify-cmp-4-6-result-provenance.py

      - name: Verify CMP-4.7 scientific metadata and lineage
        run: python scripts/verify-cmp-4-7-scientific-metadata-lineage.py

      - name: Verify CMP-4.8 publication and retention policy
        run: python scripts/verify-cmp-4-8-publication-retention.py

      - name: Verify CMP-4.9 research dashboard
        run: python scripts/verify-cmp-4-9-research-dashboard.py

      - name: Verify CMP-4.10 phase closeout inventory
        run: python scripts/verify-cmp-4-10-closeout.py

      - name: Verify CMP-5.1 Folding@home adapter
        run: python scripts/verify-cmp-5-1-folding-at-home-adapter.py

      - name: Verify CMP-5.2 BOINC adapter
        run: python scripts/verify-cmp-5-2-boinc-adapter.py

      - name: Verify CMP-5.3 Research-cluster adapter
        run: python scripts/verify-cmp-5-3-research-cluster-adapter.py

      - name: Verify CMP-5.4 University/HPC gateway
        run: python scripts/verify-cmp-5-4-university-hpc-gateway.py

      - name: Verify CMP-5.5 External proof/credit adapters
        run: python scripts/verify-cmp-5-5-external-proof-credit-adapters.py

      - name: Verify CMP-5.6 Double-reward prevention
        run: python scripts/verify-cmp-5-6-double-reward-prevention.py

      - name: Setup Node for affected Compute SDK
        if: github.head_ref == 'cmp-1.5.13-phase-closeout-20261002' || github.head_ref == 'cmp-2.1-worker-offers-20261002'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and test affected @420/sdk Compute surface
        if: github.head_ref == 'cmp-1.5.13-phase-closeout-20261002' || github.head_ref == 'cmp-2.1-worker-offers-20261002'
        working-directory: packages/420-sdk
        run: |
          npm install --no-audit --no-fund
          npm test
