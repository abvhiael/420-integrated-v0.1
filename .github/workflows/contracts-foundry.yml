name: Solidity Contracts

on:
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - "scripts/setup-foundry.sh"
      - ".github/workflows/contracts-foundry.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-foundry.yml"
  workflow_dispatch:

concurrency:
  group: solidity-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundry:
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: ${{ github.event_name == 'pull_request' && 'pr' || 'ci' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Tool versions
        working-directory: contracts
        run: |
          forge --version
          cast --version
          forge config

      - name: Discover PR Solidity qualification scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/contracts
          BASE_SHA='${{ github.event.pull_request.base.sha }}'
          HEAD_SHA='${{ github.event.pull_request.head.sha }}'
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee artifacts/contracts/pr-changed-files.txt

          mapfile -t ADAPTER_FILES < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
              | grep -E '^contracts/src/bridge/adapters/[^/]+BridgeAdapter420\.sol$' \
              | sort -u || true
          )
          mapfile -t ADAPTER_TESTS < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
              | grep -E '^contracts/test/[^/]+BridgeAdapter420\.t\.sol$' \
              | sed 's#^contracts/##' \
              | sort -u || true
          )

          for src in "${ADAPTER_FILES[@]}"; do
            base="$(basename "$src" .sol)"
            candidate="test/${base}.t.sol"
            if [ -f "contracts/$candidate" ]; then
              ADAPTER_TESTS+=("$candidate")
            fi
          done

          if ((${#ADAPTER_TESTS[@]})); then
            mapfile -t ADAPTER_TESTS < <(printf '%s\n' "${ADAPTER_TESTS[@]}" | sort -u)
            printf '%s\n' "${ADAPTER_TESTS[@]}" | tee artifacts/contracts/pr-adapter-targets.txt
            echo 'PR_ADAPTER_MODE=true' >> "$GITHUB_ENV"
            {
              echo 'PR_ADAPTER_TARGETS<<EOF'
              printf '%s\n' "${ADAPTER_TESTS[@]}"
              echo 'EOF'
            } >> "$GITHUB_ENV"
          else
            echo 'PR_ADAPTER_MODE=false' >> "$GITHUB_ENV"
            : > artifacts/contracts/pr-adapter-targets.txt
          fi

      - name: PR adapter build qualification
        if: github.event_name == 'pull_request' && env.PR_ADAPTER_MODE == 'true'
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/contracts
          : > ../artifacts/contracts/foundry-build.txt
          while IFS= read -r target; do
            [ -n "$target" ] || continue
            echo "=== BUILD $target ===" | tee -a ../artifacts/contracts/foundry-build.txt
            forge clean
            forge build "$target" --sizes 2>&1 | tee -a ../artifacts/contracts/foundry-build.txt
          done <<< "$PR_ADAPTER_TARGETS"

      - name: PR adapter tests
        if: github.event_name == 'pull_request' && env.PR_ADAPTER_MODE == 'true'
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/contracts
          : > ../artifacts/contracts/foundry-tests.txt
          while IFS= read -r target; do
            [ -n "$target" ] || continue
            echo "=== TEST $target ===" | tee -a ../artifacts/contracts/foundry-tests.txt
            forge clean
            forge test --match-path "$target" -vvv 2>&1 | tee -a ../artifacts/contracts/foundry-tests.txt
          done <<< "$PR_ADAPTER_TARGETS"

          echo "=== BRIDGE SHARED SMOKE ===" | tee -a ../artifacts/contracts/foundry-tests.txt
          forge clean
          forge test --match-path test/BridgeGenesisIntegration420.t.sol -vvv 2>&1 \
            | tee -a ../artifacts/contracts/foundry-tests.txt

      - name: Full PR build
        if: github.event_name == 'pull_request' && env.PR_ADAPTER_MODE != 'true'
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/contracts
          set -o pipefail
          forge build --sizes 2>&1 | tee ../artifacts/contracts/foundry-build.txt

      - name: Full PR tests
        if: github.event_name == 'pull_request' && env.PR_ADAPTER_MODE != 'true'
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/contracts
          set -o pipefail
          forge test -vvv 2>&1 | tee ../artifacts/contracts/foundry-tests.txt

      - name: Full main build
        if: github.event_name != 'pull_request'
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/contracts
          set -o pipefail
          forge build --force --sizes 2>&1 | tee ../artifacts/contracts/foundry-build.txt

      - name: Full main tests
        if: github.event_name != 'pull_request'
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/contracts
          set -o pipefail
          forge test -vvv 2>&1 | tee ../artifacts/contracts/foundry-tests.txt

      - name: Upload Foundry diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-diagnostics-${{ github.sha }}
          path: |
            artifacts/contracts/foundry-build.txt
            artifacts/contracts/foundry-tests.txt
            artifacts/contracts/pr-changed-files.txt
            artifacts/contracts/pr-adapter-targets.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Decision #10 deploy/seed harness
        if: github.event_name != 'pull_request'
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/contracts
          forge script script/Decision10DeploySeed420.s.sol:Decision10DeploySeed420 --sig "run()" -vvv
          test -s ../artifacts/contracts/creative-kernel-v1.fixture.json
          jq -e '
            .schema == "420.creative.kernel.fixture.v1"
            and .workId == 1
            and .originalRecordingId == 1
            and .remixRecordingId == 2
            and .remixOfferId == 1
            and .remixLicenseId == 1
            and .rightsTransferId == 1
            and .scheduleVersion == 1
            and .workRightsVersion == 1
            and .originalRightsVersion == 2
            and .remixRightsVersion == 1
            and .expectedWorkPoolWei == "30000000000000000000"
            and .expectedOriginalPoolWei == "151000000000000000000"
            and .expectedRemixPoolWei == "72500000000000000000"
            and .expectedTreasuryWei == "6500000000000000000"
            and .expectedVaultBalanceWei == "260000000000000000000"
          ' ../artifacts/contracts/creative-kernel-v1.fixture.json

      - name: Upload Decision #10 fixture manifest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: creative-kernel-v1-fixture
          path: artifacts/contracts/creative-kernel-v1.fixture.json
          if-no-files-found: error

      - name: Coverage
        if: github.event_name != 'pull_request'
        continue-on-error: true
        working-directory: contracts
        run: FOUNDRY_PROFILE=coverage forge coverage --ir-minimum --report summary
