name: Solidity Contracts

on:
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - "scripts/setup-foundry.sh"
      - ".github/workflows/contracts-foundry.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-foundry.yml"
  workflow_dispatch:

concurrency:
  group: solidity-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundry:
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: ${{ github.event_name == 'pull_request' && 'pr' || 'ci' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Tool versions
        working-directory: contracts
        run: |
          forge --version
          cast --version
          forge config

      - name: Recursively bisect Yul failure across tests
        working-directory: contracts
        shell: bash
        run: |
          set +e
          mkdir -p ../artifacts/contracts
          LOG=../artifacts/contracts/yul-test-bisect.txt
          : > "$LOG"
          YUL_SIG='Yul exception:Variable _94 is 1 too deep in the stack'

          probe_group() {
            local label="$1"
            shift
            local tmp
            tmp="$(mktemp)"

            echo "=== $label ===" | tee -a "$LOG"
            echo "COUNT $#" | tee -a "$LOG"
            printf 'TARGETS' | tee -a "$LOG"
            printf ' %q' "$@" | tee -a "$LOG"
            echo | tee -a "$LOG"

            forge clean
            forge build "$@" 2>&1 | tee "$tmp" | tee -a "$LOG"
            local forge_rc=${PIPESTATUS[0]}

            if grep -Fq "$YUL_SIG" "$tmp"; then
              echo "RESULT $label yul94=1 forge_rc=$forge_rc" | tee -a "$LOG"
              rm -f "$tmp"
              return 42
            fi

            echo "RESULT $label yul94=0 forge_rc=$forge_rc" | tee -a "$LOG"
            rm -f "$tmp"
            if (( forge_rc == 0 )); then
              return 0
            fi
            return 2
          }

          bisect_known_bad() {
            local label="$1"
            shift
            local -a files=("$@")
            local n=${#files[@]}

            echo "BISECT $label count=$n" | tee -a "$LOG"
            if (( n == 1 )); then
              echo "CULPRIT ${files[0]}" | tee -a "$LOG"
              return 0
            fi

            local mid=$((n / 2))
            local -a left=("${files[@]:0:mid}")
            local -a right=("${files[@]:mid}")
            local left_rc right_rc

            probe_group "$label.L" "${left[@]}"
            left_rc=$?
            probe_group "$label.R" "${right[@]}"
            right_rc=$?

            if (( left_rc == 42 && right_rc == 0 )); then
              bisect_known_bad "$label.L" "${left[@]}"
              return $?
            fi

            if (( right_rc == 42 && left_rc == 0 )); then
              bisect_known_bad "$label.R" "${right[@]}"
              return $?
            fi

            if (( left_rc == 42 && right_rc == 42 )); then
              echo "MULTIPLE_FAILING_BRANCHES $label" | tee -a "$LOG"
              bisect_known_bad "$label.L" "${left[@]}"
              bisect_known_bad "$label.R" "${right[@]}"
              return 0
            fi

            if (( left_rc == 0 && right_rc == 0 )); then
              echo "INTERACTION_ONLY $label count=$n" | tee -a "$LOG"
              echo "Neither half alone reproduces _94; the failure requires files from both halves." | tee -a "$LOG"
              return 0
            fi

            echo "NON_YUL_COMPILE_FAILURE $label left_rc=$left_rc right_rc=$right_rc" | tee -a "$LOG"
            return 0
          }

          mapfile -t TEST_FILES < <(find test -type f -name '*.t.sol' | sort)
          echo "TOTAL_TEST_FILES ${#TEST_FILES[@]}" | tee -a "$LOG"

          if (( ${#TEST_FILES[@]} == 0 )); then
            echo "ERROR no .t.sol files found" | tee -a "$LOG"
            exit 1
          fi

          # The preceding diagnostic run established that the complete test tree
          # reproduces _94. Start from that known-bad set and recursively split it.
          bisect_known_bad "test-root" "${TEST_FILES[@]}"

          echo "Recursive test bisect complete; full build follows." | tee -a "$LOG"
          exit 0

      - name: Build
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/contracts
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            forge build --sizes 2>&1 | tee ../artifacts/contracts/foundry-build.txt
          else
            forge build --force --sizes 2>&1 | tee ../artifacts/contracts/foundry-build.txt
          fi

      - name: Tests
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/contracts
          set -o pipefail
          forge test -vvv 2>&1 | tee ../artifacts/contracts/foundry-tests.txt

      - name: Upload Foundry diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-diagnostics-${{ github.sha }}
          path: |
            artifacts/contracts/foundry-build.txt
            artifacts/contracts/foundry-tests.txt
            artifacts/contracts/yul-test-bisect.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Decision #10 deploy/seed harness
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/contracts
          forge script script/Decision10DeploySeed420.s.sol:Decision10DeploySeed420 --sig "run()" -vvv
          test -s ../artifacts/contracts/creative-kernel-v1.fixture.json
          jq -e '
            .schema == "420.creative.kernel.fixture.v1"
            and .workId == 1
            and .originalRecordingId == 1
            and .remixRecordingId == 2
            and .remixOfferId == 1
            and .remixLicenseId == 1
            and .rightsTransferId == 1
            and .scheduleVersion == 1
            and .workRightsVersion == 1
            and .originalRightsVersion == 2
            and .remixRightsVersion == 1
            and .expectedWorkPoolWei == "30000000000000000000"
            and .expectedOriginalPoolWei == "151000000000000000000"
            and .expectedRemixPoolWei == "72500000000000000000"
            and .expectedTreasuryWei == "6500000000000000000"
            and .expectedVaultBalanceWei == "260000000000000000000"
          ' ../artifacts/contracts/creative-kernel-v1.fixture.json

      - name: Upload Decision #10 fixture manifest
        uses: actions/upload-artifact@v4
        with:
          name: creative-kernel-v1-fixture
          path: artifacts/contracts/creative-kernel-v1.fixture.json
          if-no-files-found: error

      - name: Coverage
        if: github.event_name != 'pull_request'
        continue-on-error: true
        working-directory: contracts
        run: FOUNDRY_PROFILE=coverage forge coverage --ir-minimum --report summary
