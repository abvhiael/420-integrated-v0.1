# RR-10 exact-head Level 3 canonical qualification trigger; no coverage or job semantics changed.
name: Solidity Contracts

on:
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - "scripts/setup-foundry.sh"
      - ".github/workflows/contracts-foundry.yml"
      - "docs/audit/420LAUNCHPAD-PHASE-CLOSEOUT.md"
      - "docs/audit/420VERIFY-PHASE-CLOSEOUT.md"
      - "docs/puffbuddies/PB-0.20-PHASE-CLOSEOUT.md"
      - "docs/puffbuddies/PB-1.14-PHASE-CLOSEOUT.md"
      - "docs/puffbuddies/PB-2.14-PHASE-CLOSEOUT.md"
      - "docs/audit/420MEDIA-PHASE-CLOSEOUT.md"
      - "docs/audit/DOOBTUBE-PHASE-CLOSEOUT.md"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-foundry.yml"
      - "docs/audit/420LAUNCHPAD-PHASE-CLOSEOUT.md"
      - "docs/audit/420VERIFY-PHASE-CLOSEOUT.md"
      - "docs/puffbuddies/PB-0.20-PHASE-CLOSEOUT.md"
      - "docs/puffbuddies/PB-1.14-PHASE-CLOSEOUT.md"
      - "docs/puffbuddies/PB-2.14-PHASE-CLOSEOUT.md"
      - "docs/audit/420MEDIA-PHASE-CLOSEOUT.md"
      - "docs/audit/DOOBTUBE-PHASE-CLOSEOUT.md"
  workflow_dispatch:

concurrency:
  group: solidity-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      compute_only: ${{ steps.scope.outputs.compute_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Classify pull-request scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          # Checkout fetched full history; never introduce a shallow boundary at main.
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          scope_files="$RUNNER_TEMP/compute-pr-files.txt"
          # Materialize first so a missing merge base is a fatal classification error.
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$scope_files"
          cat "$scope_files"
          compute_only=true
          while IFS= read -r file; do
            case "$file" in
              contracts/src/compute/*|contracts/src/interfaces/ICompute*.sol|contracts/test/Compute*.t.sol|contracts/config/compute-market/*|docs/compute-market/*|docs/420-COMPUTE-MARKET-V1-ARCHITECTURE.md|scripts/verify-cmp-*|scripts/test-cmp-*|packages/420-sdk/src/compute.ts|packages/420-sdk/test/compute-sdk.test.mjs|packages/420-sdk/test/fixtures/compute-*|.github/workflows/compute-market.yml|.github/workflows/contracts-foundry.yml)
                ;;
              *)
                compute_only=false
                ;;
            esac
          done < "$scope_files"
          # CMP-2.8 is the Compute marketplace Level 3 phase-closeout boundary.
          # Force the canonical four-shard repository inventory even though the
          # changed surface is otherwise Compute-scoped.
          if grep -Fxq 'contracts/config/compute-market/cmp-2.8-phase-closeout.json' "$scope_files" || \
             grep -Fxq 'contracts/config/compute-market/cmp-3.14-phase-closeout.json' "$scope_files" || \
             grep -Fxq 'contracts/config/compute-market/cmp-4.10-phase-closeout.json' "$scope_files" || \
             grep -Fxq 'contracts/config/compute-market/cmp-5.8-phase-closeout.json' "$scope_files" || \
             grep -Fxq 'contracts/config/compute-market/cmp-6.8-phase-closeout.json' "$scope_files" || \
             grep -Fxq 'contracts/config/compute-market/cmp-7.10-phase-closeout.json' "$scope_files" || \
             grep -Fxq 'contracts/config/compute-market/cmp-8-phase-closeout.json' "$scope_files"; then
            compute_only=false
          fi
          echo "compute_only=$compute_only" >> "$GITHUB_OUTPUT"

  compute-fast:
    needs: classify-pr
    if: github.event_name == 'pull_request' && needs.classify-pr.outputs.compute_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build Compute Market contracts
        working-directory: contracts
        run: forge build src/compute
      - name: Run retained Compute Market Solidity suite
        working-directory: contracts
        run: forge test --match-path 'test/Compute*.t.sol' -vvv

  # Non-Compute or mixed Solidity PRs still qualify the complete inventory.
  pr-shards:
    needs: classify-pr
    if: github.event_name == 'pull_request' && needs.classify-pr.outputs.compute_only != 'true' && (!(startsWith(github.head_ref, 'audit/') || contains(github.head_ref, '-audit-')) || github.head_ref == 'audit/420launchpad-remediation' || github.head_ref == 'audit/420verify-20261003' || github.head_ref == 'audit/420token-complete-20261004' || github.head_ref == 'audit/420town-complete-20261004' || github.head_ref == 'audit/420media-complete-20261006' || github.head_ref == 'audit/doobtube-baseline-20261006')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Runner-aware Level 3 inventory: four balanced shards cover the same
      # deterministic source/test/script inventory without 16 cold-start jobs.
      matrix:
        shard: [0, 1, 2, 3]
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile assigned Solidity sources and run assigned tests
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/contracts
          bash scripts/qualify-foundry-shard.sh '${{ matrix.shard }}' '4' 2>&1 | tee '../artifacts/contracts/shard-${{ matrix.shard }}.log'
      - name: Upload per-shard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-pr-shard-${{ matrix.shard }}-${{ github.sha }}
          path: |
            artifacts/contracts/shard-${{ matrix.shard }}.log
            artifacts/contracts/shard-${{ matrix.shard }}-targets.txt
          if-no-files-found: warn
          retention-days: 30

  # Manual Level 3 uses the same complete primary inventory across four shards,
  # with the full CI fuzz/invariant settings. The fixture runs only after all
  # shards succeed and their combined inventory matches the repository exactly.
  level3-shards:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'audit/420commerce-com-2-upstream-adaptations')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Runner-aware Level 3 inventory: four balanced shards cover the same
      # deterministic source/test/script inventory without 16 cold-start jobs.
      matrix:
        shard: [0, 1, 2, 3]
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: ci
      FOUNDRY_SPARSE_MODE: 'true'
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile assigned Solidity sources and run assigned tests
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/contracts
          bash scripts/qualify-foundry-shard.sh '${{ matrix.shard }}' '4' 2>&1 | tee '../artifacts/contracts/shard-${{ matrix.shard }}.log'
      - name: Upload per-shard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-level3-shard-${{ matrix.shard }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/contracts/shard-${{ matrix.shard }}.log
            artifacts/contracts/shard-${{ matrix.shard }}-targets.txt
          if-no-files-found: warn
          retention-days: 30

  level3-fixture:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'audit/420commerce-com-2-upstream-adaptations')
    needs: level3-shards
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: ci
      FOUNDRY_SPARSE_MODE: 'true'
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Download all four mandatory shard inventories
        uses: actions/download-artifact@v4
        with:
          pattern: foundry-level3-shard-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/contracts/shards
          merge-multiple: true
      - name: Verify complete and unique primary inventory
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/contracts
          find src test script -type f -name '*.sol' | LC_ALL=C sort > ../artifacts/contracts/expected-inventory.txt
          for shard in 0 1 2 3; do
            test -s "../artifacts/contracts/shards/shard-${shard}-targets.txt"
          done
          cat ../artifacts/contracts/shards/shard-*-targets.txt | LC_ALL=C sort > ../artifacts/contracts/qualified-inventory.txt
          diff -u ../artifacts/contracts/expected-inventory.txt ../artifacts/contracts/qualified-inventory.txt
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Decision #10 deploy/seed harness
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/contracts
          forge script script/Decision10DeploySeed420.s.sol:Decision10DeploySeed420 --sig "run()" -vvv
          test -s ../artifacts/contracts/creative-kernel-v1.fixture.json
          jq -e '
            .schema == "420.creative.kernel.fixture.v1"
            and .workId == 1
            and .originalRecordingId == 1
            and .remixRecordingId == 2
            and .remixOfferId == 1
            and .remixLicenseId == 1
            and .rightsTransferId == 1
            and .scheduleVersion == 1
            and .workRightsVersion == 1
            and .originalRightsVersion == 2
            and .remixRightsVersion == 1
            and .expectedWorkPoolWei == "30000000000000000000"
            and .expectedOriginalPoolWei == "151000000000000000000"
            and .expectedRemixPoolWei == "72500000000000000000"
            and .expectedTreasuryWei == "6500000000000000000"
            and .expectedVaultBalanceWei == "260000000000000000000"
          ' ../artifacts/contracts/creative-kernel-v1.fixture.json

      - name: Upload Decision #10 fixture manifest
        uses: actions/upload-artifact@v4
        with:
          name: creative-kernel-v1-fixture
          path: artifacts/contracts/creative-kernel-v1.fixture.json
          if-no-files-found: error

      - name: Coverage
        continue-on-error: true
        working-directory: contracts
        run: FOUNDRY_PROFILE=coverage forge coverage --ir-minimum --report summary


  # Preserve the existing main/push qualification and Decision #10 fixture.
  # Pull requests must not also run the monolithic build in this job.
  foundry:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Tool versions
        working-directory: contracts
        run: |
          forge --version
          cast --version
          forge config

      - name: Full main build
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/contracts
          set -o pipefail
          forge build --force --sizes 2>&1 | tee ../artifacts/contracts/foundry-build.txt

      - name: Full main tests
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/contracts
          set -o pipefail
          forge test -vvv 2>&1 | tee ../artifacts/contracts/foundry-tests.txt

      - name: Upload Foundry diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-diagnostics-${{ github.sha }}
          path: |
            artifacts/contracts/foundry-build.txt
            artifacts/contracts/foundry-tests.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Decision #10 deploy/seed harness
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/contracts
          forge script script/Decision10DeploySeed420.s.sol:Decision10DeploySeed420 --sig "run()" -vvv
          test -s ../artifacts/contracts/creative-kernel-v1.fixture.json
          jq -e '
            .schema == "420.creative.kernel.fixture.v1"
            and .workId == 1
            and .originalRecordingId == 1
            and .remixRecordingId == 2
            and .remixOfferId == 1
            and .remixLicenseId == 1
            and .rightsTransferId == 1
            and .scheduleVersion == 1
            and .workRightsVersion == 1
            and .originalRightsVersion == 2
            and .remixRightsVersion == 1
            and .expectedWorkPoolWei == "30000000000000000000"
            and .expectedOriginalPoolWei == "151000000000000000000"
            and .expectedRemixPoolWei == "72500000000000000000"
            and .expectedTreasuryWei == "6500000000000000000"
            and .expectedVaultBalanceWei == "260000000000000000000"
          ' ../artifacts/contracts/creative-kernel-v1.fixture.json

      - name: Upload Decision #10 fixture manifest
        uses: actions/upload-artifact@v4
        with:
          name: creative-kernel-v1-fixture
          path: artifacts/contracts/creative-kernel-v1.fixture.json
          if-no-files-found: error

      - name: Coverage
        continue-on-error: true
        working-directory: contracts
        run: FOUNDRY_PROFILE=coverage forge coverage --ir-minimum --report summary
