name: Solidity Contracts

on:
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - "scripts/setup-foundry.sh"
      - ".github/workflows/contracts-foundry.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-foundry.yml"
  workflow_dispatch:

concurrency:
  group: solidity-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      compute_only: ${{ steps.scope.outputs.compute_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Classify pull-request scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          compute_only=true
          while IFS= read -r file; do
            case "$file" in
              contracts/src/compute/*|contracts/test/Compute*.t.sol|contracts/config/compute-market/*|docs/compute-market/*|docs/420-COMPUTE-MARKET-V1-ARCHITECTURE.md|scripts/verify-cmp-*|scripts/test-cmp-*|.github/workflows/compute-market.yml)
                ;;
              *)
                compute_only=false
                ;;
            esac
          done < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "compute_only=$compute_only" >> "$GITHUB_OUTPUT"

  compute-fast:
    needs: classify-pr
    if: github.event_name == 'pull_request' && needs.classify-pr.outputs.compute_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build Compute Market contracts
        working-directory: contracts
        run: forge build src/compute
      - name: Run retained Compute Market Solidity suite
        working-directory: contracts
        run: forge test --match-path 'test/Compute*.t.sol' -vvv

  # Non-Compute or mixed Solidity PRs still qualify the complete inventory.
  pr-shards:
    needs: classify-pr
    if: github.event_name == 'pull_request' && needs.classify-pr.outputs.compute_only != 'true' && !startsWith(github.head_ref, 'audit/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Runner-aware Level 3 inventory: four balanced shards cover the same
      # deterministic source/test/script inventory without 16 cold-start jobs.
      matrix:
        shard: [0, 1, 2, 3]
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile assigned Solidity sources and run assigned tests
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/contracts
          bash scripts/qualify-foundry-shard.sh '${{ matrix.shard }}' '4' 2>&1 | tee '../artifacts/contracts/shard-${{ matrix.shard }}.log'
      - name: Upload per-shard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-pr-shard-${{ matrix.shard }}-${{ github.sha }}
          path: |
            artifacts/contracts/shard-${{ matrix.shard }}.log
            artifacts/contracts/shard-${{ matrix.shard }}-targets.txt
          if-no-files-found: warn
          retention-days: 30

  # Preserve the existing main/push qualification and Decision #10 fixture.
  # Pull requests must not also run the monolithic build in this job.
  foundry:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Tool versions
        working-directory: contracts
        run: |
          forge --version
          cast --version
          forge config

      - name: Full main build
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/contracts
          set -o pipefail
          forge build --force --sizes 2>&1 | tee ../artifacts/contracts/foundry-build.txt

      - name: Full main tests
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/contracts
          set -o pipefail
          forge test -vvv 2>&1 | tee ../artifacts/contracts/foundry-tests.txt

      - name: Upload Foundry diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-diagnostics-${{ github.sha }}
          path: |
            artifacts/contracts/foundry-build.txt
            artifacts/contracts/foundry-tests.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Decision #10 deploy/seed harness
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/contracts
          forge script script/Decision10DeploySeed420.s.sol:Decision10DeploySeed420 --sig "run()" -vvv
          test -s ../artifacts/contracts/creative-kernel-v1.fixture.json
          jq -e '
            .schema == "420.creative.kernel.fixture.v1"
            and .workId == 1
            and .originalRecordingId == 1
            and .remixRecordingId == 2
            and .remixOfferId == 1
            and .remixLicenseId == 1
            and .rightsTransferId == 1
            and .scheduleVersion == 1
            and .workRightsVersion == 1
            and .originalRightsVersion == 2
            and .remixRightsVersion == 1
            and .expectedWorkPoolWei == "30000000000000000000"
            and .expectedOriginalPoolWei == "151000000000000000000"
            and .expectedRemixPoolWei == "72500000000000000000"
            and .expectedTreasuryWei == "6500000000000000000"
            and .expectedVaultBalanceWei == "260000000000000000000"
          ' ../artifacts/contracts/creative-kernel-v1.fixture.json

      - name: Upload Decision #10 fixture manifest
        uses: actions/upload-artifact@v4
        with:
          name: creative-kernel-v1-fixture
          path: artifacts/contracts/creative-kernel-v1.fixture.json
          if-no-files-found: error

      - name: Coverage
        continue-on-error: true
        working-directory: contracts
        run: FOUNDRY_PROFILE=coverage forge coverage --ir-minimum --report summary
