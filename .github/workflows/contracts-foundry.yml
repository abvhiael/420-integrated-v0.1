# Canonical exact-head Level 3 qualification; coverage is a mandatory gate.
name: Solidity Contracts

on:
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - "scripts/setup-foundry.sh"
      - ".github/workflows/contracts-foundry.yml"
      - "docs/audit/420LAUNCHPAD-PHASE-CLOSEOUT.md"
      - "docs/audit/420VERIFY-PHASE-CLOSEOUT.md"
      - "docs/puffbuddies/PB-0.20-PHASE-CLOSEOUT.md"
      - "docs/puffbuddies/PB-1.14-PHASE-CLOSEOUT.md"
      - "docs/puffbuddies/PB-2.14-PHASE-CLOSEOUT.md"
      - "docs/audit/420MEDIA-PHASE-CLOSEOUT.md"
      - "docs/audit/DOOBTUBE-PHASE-CLOSEOUT.md"
      - "docs/audit/DOOBR-PHASE-CLOSEOUT.md"
      - "docs/bnb/BNB-3.12-PHASE3-LEVEL3-CLOSEOUT.md"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-foundry.yml"
      - "docs/audit/420LAUNCHPAD-PHASE-CLOSEOUT.md"
      - "docs/audit/420VERIFY-PHASE-CLOSEOUT.md"
      - "docs/puffbuddies/PB-0.20-PHASE-CLOSEOUT.md"
      - "docs/puffbuddies/PB-1.14-PHASE-CLOSEOUT.md"
      - "docs/puffbuddies/PB-2.14-PHASE-CLOSEOUT.md"
      - "docs/audit/420MEDIA-PHASE-CLOSEOUT.md"
      - "docs/audit/DOOBTUBE-PHASE-CLOSEOUT.md"
      - "docs/audit/DOOBR-PHASE-CLOSEOUT.md"
      - "docs/bnb/BNB-3.12-PHASE3-LEVEL3-CLOSEOUT.md"
  workflow_dispatch:

concurrency:
  group: solidity-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      compute_only: ${{ steps.scope.outputs.compute_only }}
      organization_only: ${{ steps.scope.outputs.organization_only }}
      cooperative_only: ${{ steps.scope.outputs.cooperative_only }}
      competition_only: ${{ steps.scope.outputs.competition_only }}
      sports_5d3_only: ${{ steps.scope.outputs.sports_5d3_only }}
      sports_5d4_only: ${{ steps.scope.outputs.sports_5d4_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Classify pull-request scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          # Checkout fetched full history; never introduce a shallow boundary at main.
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          scope_files="$RUNNER_TEMP/compute-pr-files.txt"
          # Materialize first so a missing merge base is a fatal classification error.
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$scope_files"
          cat "$scope_files"
          compute_only=true
          organization_only=true
          cooperative_only=true
          competition_only=true
          sports_5d3_only=true
          sports_5d3_changed=false
          sports_5d4_only=true
          sports_5d4_changed=false
          competition_changed=false
          cooperative_changed=false
          organization_changed=false
          while IFS= read -r file; do
            case "$file" in
              contracts/src/bet/sports/SportsBetAcceptance420.sol|contracts/test/sports-5d4/*) sports_5d4_changed=true ;;
            esac
            case "$file" in
              contracts/src/bet/sports/SportsBetAcceptance420.sol|contracts/test/sports-5d4/*|contracts/test/sports-5d3/SportsOddsIngestion420.t.sol|docs/bet/BET-AUDIT-5D.4-ACCEPTANCE-LIABILITY.md|.github/workflows/420bet-sports-5d4.yml|.github/workflows/contracts-foundry.yml) ;;
              *) sports_5d4_only=false ;;
            esac
            case "$file" in
              contracts/src/bet/sports/SportsOddsIngestion420.sol|contracts/test/sports-5d3/*|contracts/test/sports-5d2/SportsRegistry420.t.sol) sports_5d3_changed=true ;;
            esac
            case "$file" in
              contracts/src/bet/sports/SportsOddsIngestion420.sol|contracts/test/sports-5d3/*|contracts/test/sports-5d2/SportsRegistry420.t.sol|docs/bet/BET-AUDIT-5D.3-ODDS-INGESTION-PROVENANCE.md|.github/workflows/420bet-sports-5d3.yml|.github/workflows/contracts-foundry.yml) ;;
              *) sports_5d3_only=false ;;
            esac
            case "$file" in
              contracts/src/highcountry/competition/*|contracts/test/highcountry/unit/competition/*) competition_changed=true ;;
            esac
            case "$file" in
              contracts/src/highcountry/competition/*|contracts/test/highcountry/unit/competition/*|docs/highcountry/HC-NEXT-7.1-COMPETITION-FOUNDATIONS.md|.github/workflows/highcountry-competition-next-7-1.yml|.github/workflows/contracts-foundry.yml) ;;
              *) competition_only=false ;;
            esac
            case "$file" in
              contracts/src/highcountry/cooperative/*|contracts/test/highcountry/unit/cooperative/*) cooperative_changed=true ;;
            esac
            case "$file" in
              contracts/src/highcountry/organization/*|contracts/test/highcountry/unit/organization/*) organization_changed=true ;;
            esac
            case "$file" in
              contracts/src/highcountry/cooperative/*|contracts/test/highcountry/unit/cooperative/*|docs/highcountry/HC-NEXT-6.4-COOPERATIVES-GOVERNANCE.md|.github/workflows/highcountry-cooperatives-next-6-4.yml|.github/workflows/contracts-foundry.yml) ;;
              *) cooperative_only=false ;;
            esac
            case "$file" in
              contracts/src/highcountry/organization/*|contracts/test/highcountry/unit/organization/*|docs/highcountry/HC-NEXT-6.3-ORGANIZATIONS.md|.github/workflows/highcountry-organizations-next-6-3.yml|.github/workflows/contracts-foundry.yml) ;;
              *) organization_only=false ;;
            esac
            case "$file" in
              contracts/src/compute/*|contracts/src/interfaces/ICompute*.sol|contracts/test/Compute*.t.sol|contracts/config/compute-market/*|docs/compute-market/*|docs/420-COMPUTE-MARKET-V1-ARCHITECTURE.md|scripts/verify-cmp-*|scripts/test-cmp-*|packages/420-sdk/src/compute.ts|packages/420-sdk/test/compute-sdk.test.mjs|packages/420-sdk/test/fixtures/compute-*|.github/workflows/compute-market.yml|.github/workflows/contracts-foundry.yml)
                ;;
              *)
                compute_only=false
                ;;
            esac
          done < "$scope_files"
          # CMP-2.8 is the Compute marketplace Level 3 phase-closeout boundary.
          # Force the canonical four-shard repository inventory even though the
          # changed surface is otherwise Compute-scoped.
          if grep -Fxq 'contracts/config/compute-market/cmp-2.8-phase-closeout.json' "$scope_files" || \
             grep -Fxq 'contracts/config/compute-market/cmp-3.14-phase-closeout.json' "$scope_files" || \
             grep -Fxq 'contracts/config/compute-market/cmp-4.10-phase-closeout.json' "$scope_files" || \
             grep -Fxq 'contracts/config/compute-market/cmp-5.8-phase-closeout.json' "$scope_files" || \
             grep -Fxq 'contracts/config/compute-market/cmp-6.8-phase-closeout.json' "$scope_files" || \
             grep -Fxq 'contracts/config/compute-market/cmp-7.10-phase-closeout.json' "$scope_files" || \
             grep -Fxq 'contracts/config/compute-market/cmp-8-phase-closeout.json' "$scope_files"; then
            compute_only=false
          fi
          if [[ "$organization_changed" != true ]]; then organization_only=false; fi
          if [[ "$cooperative_changed" != true ]]; then cooperative_only=false; fi
          if [[ "$competition_changed" != true ]]; then competition_only=false; fi
          if [[ "$sports_5d3_changed" != true ]]; then sports_5d3_only=false; fi
          if [[ "$sports_5d4_changed" != true ]]; then sports_5d4_only=false; fi
          echo "compute_only=$compute_only" >> "$GITHUB_OUTPUT"
          echo "organization_only=$organization_only" >> "$GITHUB_OUTPUT"
          echo "cooperative_only=$cooperative_only" >> "$GITHUB_OUTPUT"
          echo "competition_only=$competition_only" >> "$GITHUB_OUTPUT"
          echo "sports_5d3_only=$sports_5d3_only" >> "$GITHUB_OUTPUT"
          echo "sports_5d4_only=$sports_5d4_only" >> "$GITHUB_OUTPUT"

  compute-fast:
    needs: classify-pr
    if: github.event_name == 'pull_request' && needs.classify-pr.outputs.compute_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build Compute Market contracts
        working-directory: contracts
        run: forge build src/compute
      - name: Run retained Compute Market Solidity suite
        working-directory: contracts
        run: forge test --match-path 'test/Compute*.t.sol' -vvv

  # Organization-only PRs are qualified by the canonical R04.10 Foundry gate.
  # Keep exact SHA and enforce that the dedicated security workflow exists and
  # is part of the same PR; never mark an unqualified scope as exempt.
  organization-fast:
    needs: classify-pr
    if: github.event_name == 'pull_request' && needs.classify-pr.outputs.organization_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Canonical organization contract build and adversarial tests
        working-directory: contracts
        run: |
          forge build src/highcountry/organization --sizes
          forge fmt --check src/highcountry/organization test/highcountry/unit/organization
          forge lint src/highcountry/organization --severity high med low
          forge test --match-path 'test/highcountry/unit/organization/*.t.sol' -vv

  # Cooperative-only changes use their canonical R04.11 Foundry adversarial suite.
  cooperative-fast:
    needs: classify-pr
    if: github.event_name == 'pull_request' && needs.classify-pr.outputs.cooperative_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Canonical cooperative contract build and adversarial tests
        working-directory: contracts
        run: |
          forge build src/highcountry/cooperative --sizes
          forge fmt --check src/highcountry/cooperative test/highcountry/unit/cooperative
          forge lint src/highcountry/cooperative --severity high med low
          forge test --match-path 'test/highcountry/unit/cooperative/*.t.sol' -vv

  # Competition-only PRs use the existing canonical R04.12 and R04 Level 2
  # security/integration gates. Mixed changes and phase closeouts retain the
  # repository-wide four-shard inventory; no assertions or coverage are removed.
  competition-fast:
    needs: classify-pr
    if: github.event_name == 'pull_request' && needs.classify-pr.outputs.competition_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile, format, lint and run retained competition adversarial suite
        working-directory: contracts
        env:
          FOUNDRY_SRC: src/highcountry
          FOUNDRY_TEST: test/highcountry
          FOUNDRY_SCRIPT: script/highcountry
        run: |
          forge build src/highcountry/competition --sizes
          forge fmt --check src/highcountry/competition test/highcountry/unit/competition
          forge lint src/highcountry/competition --severity high med low
          forge test --match-path 'test/highcountry/unit/competition/*.t.sol' -vv

  # Scoped 5D.3 changes retain their dedicated exact-head Foundry qualification.
  # Mixed changes always retain the full shard inventory.
  # Non-Compute or mixed Solidity PRs still qualify the complete inventory.
  pr-shards:
    needs: classify-pr
    if: github.event_name == 'pull_request' && github.head_ref != 'qualification/bnb-phase3-level3-20261013' && github.head_ref != 'qualification/highcountry-r04-level3-main-20261013' && needs.classify-pr.outputs.compute_only != 'true' && needs.classify-pr.outputs.organization_only != 'true' && needs.classify-pr.outputs.cooperative_only != 'true' && needs.classify-pr.outputs.competition_only != 'true' && needs.classify-pr.outputs.sports_5d3_only != 'true' && needs.classify-pr.outputs.sports_5d4_only != 'true' && (!(startsWith(github.head_ref, 'audit/') || contains(github.head_ref, '-audit-')) || github.head_ref == 'audit/420launchpad-remediation' || github.head_ref == 'audit/420verify-20261003' || github.head_ref == 'audit/420token-complete-20261004' || github.head_ref == 'audit/420town-complete-20261004' || github.head_ref == 'audit/420media-complete-20261006' || github.head_ref == 'audit/doobtube-baseline-20261006')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Runner-aware Level 3 inventory: four balanced shards cover the same
      # deterministic source/test/script inventory without 16 cold-start jobs.
      matrix:
        shard: [0, 1, 2, 3]
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile assigned Solidity sources and run assigned tests
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/contracts
          bash scripts/qualify-foundry-shard.sh '${{ matrix.shard }}' '4' 2>&1 | tee '../artifacts/contracts/shard-${{ matrix.shard }}.log'
      - name: Upload per-shard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-pr-shard-${{ matrix.shard }}-${{ github.sha }}
          path: |
            artifacts/contracts/shard-${{ matrix.shard }}.log
            artifacts/contracts/shard-${{ matrix.shard }}-targets.txt
          if-no-files-found: warn
          retention-days: 30

  # Manual Level 3 uses the same complete primary inventory across four shards,
  # with the full CI fuzz/invariant settings. The fixture runs only after all
  # shards succeed and their combined inventory matches the repository exactly.
  level3-shards:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.head_ref == 'audit/420commerce-com-2-upstream-adaptations' || github.head_ref == 'audit/doobr-audit-1-inventory-20261009' || github.head_ref == 'review/high-country-complete-audit-20261009' || github.head_ref == 'qualification/highcountry-r03-main-merge-20261010' || github.head_ref == 'qualification/bnb-phase3-level3-20261013' || github.head_ref == 'qualification/highcountry-r04-level3-main-20261013' || github.head_ref == 'audit/highcountry-r06-1-browser-shell-20261014'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Runner-aware Level 3 inventory: four balanced shards cover the same
      # deterministic source/test/script inventory without 16 cold-start jobs.
      matrix:
        shard: [0, 1, 2, 3]
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: ci
      FOUNDRY_SPARSE_MODE: 'true'
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Qualification harness boundary checks
        working-directory: contracts
        run: |
          python3 scripts/test-coverage-solc.py
          python3 scripts/test-coverage-partition.py

      - name: Compile assigned Solidity sources and run assigned tests
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/contracts
          bash scripts/qualify-foundry-shard.sh '${{ matrix.shard }}' '4' 2>&1 | tee '../artifacts/contracts/shard-${{ matrix.shard }}.log'
      - name: Mandatory coverage of the same canonical partition
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/coverage-foundry-shard.py '${{ matrix.shard }}' '4'
      - name: Upload per-shard diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-level3-shard-${{ matrix.shard }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/contracts/shard-${{ matrix.shard }}.log
            artifacts/contracts/shard-${{ matrix.shard }}-targets.txt
            artifacts/contracts/primary-inventory-shard-${{ matrix.shard }}.txt
            artifacts/contracts/compilation-graph-shard-${{ matrix.shard }}.json
            artifacts/contracts/coverage-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30

  level3-fixture:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.head_ref == 'audit/420commerce-com-2-upstream-adaptations' || github.head_ref == 'audit/doobr-audit-1-inventory-20261009' || github.head_ref == 'review/high-country-complete-audit-20261009' || github.head_ref == 'qualification/highcountry-r03-main-merge-20261010' || github.head_ref == 'qualification/bnb-phase3-level3-20261013' || github.head_ref == 'qualification/highcountry-r04-level3-main-20261013' || github.head_ref == 'audit/highcountry-r06-1-browser-shell-20261014'))
    needs: level3-shards
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: ci
      FOUNDRY_SPARSE_MODE: 'true'
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Download all four mandatory shard inventories
        uses: actions/download-artifact@v4
        with:
          pattern: foundry-level3-shard-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/contracts/shards
          merge-multiple: true
      - name: Verify complete and unique primary inventory
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/contracts
          find src test script -type f -name '*.sol' | LC_ALL=C sort > ../artifacts/contracts/expected-inventory.txt
          for shard in 0 1 2 3; do
            test -s "../artifacts/contracts/shards/shard-${shard}-targets.txt"
          done
          cat ../artifacts/contracts/shards/shard-*-targets.txt | LC_ALL=C sort > ../artifacts/contracts/qualified-inventory.txt
          diff -u ../artifacts/contracts/expected-inventory.txt ../artifacts/contracts/qualified-inventory.txt
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Decision #10 deploy/seed harness
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/contracts
          forge script script/Decision10DeploySeed420.s.sol:Decision10DeploySeed420 --sig "run()" -vvv
          test -s ../artifacts/contracts/creative-kernel-v1.fixture.json
          jq -e '
            .schema == "420.creative.kernel.fixture.v1"
            and .workId == 1
            and .originalRecordingId == 1
            and .remixRecordingId == 2
            and .remixOfferId == 1
            and .remixLicenseId == 1
            and .rightsTransferId == 1
            and .scheduleVersion == 1
            and .workRightsVersion == 1
            and .originalRightsVersion == 2
            and .remixRightsVersion == 1
            and .expectedWorkPoolWei == "30000000000000000000"
            and .expectedOriginalPoolWei == "151000000000000000000"
            and .expectedRemixPoolWei == "72500000000000000000"
            and .expectedTreasuryWei == "6500000000000000000"
            and .expectedVaultBalanceWei == "260000000000000000000"
          ' ../artifacts/contracts/creative-kernel-v1.fixture.json

      - name: Upload Decision #10 fixture manifest
        uses: actions/upload-artifact@v4
        with:
          name: creative-kernel-v1-fixture
          path: artifacts/contracts/creative-kernel-v1.fixture.json
          if-no-files-found: error

      - name: Verify and aggregate all four mandatory coverage partitions
        run: python3 contracts/scripts/merge-coverage.py artifacts/contracts/shards artifacts/contracts/coverage
      - name: Retain mandatory coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/contracts/coverage
          if-no-files-found: error
          retention-days: 30


  # Main/push uses the same bounded canonical inventory and Decision #10 fixture.
  # Pull requests must not also run the monolithic build in this job.
  foundry:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: ci
      FOUNDRY_SPARSE_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Tool versions
        working-directory: contracts
        run: |
          forge --version
          cast --version
          forge config

      - name: Complete bounded main compilation and test inventory
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/contracts
          for shard in 0 1 2 3; do
            bash scripts/qualify-foundry-shard.sh "$shard" 4 2>&1 | tee "../artifacts/contracts/shard-${shard}.log"
          done
          find src test script -type f -name '*.sol' | LC_ALL=C sort > ../artifacts/contracts/expected-inventory.txt
          cat ../artifacts/contracts/shard-*-targets.txt | LC_ALL=C sort > ../artifacts/contracts/qualified-inventory.txt
          diff -u ../artifacts/contracts/expected-inventory.txt ../artifacts/contracts/qualified-inventory.txt

      - name: Upload Foundry diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-diagnostics-${{ github.sha }}
          path: |
            artifacts/contracts/shard-*.log
            artifacts/contracts/shard-*-targets.txt
            artifacts/contracts/primary-inventory-shard-*.txt
            artifacts/contracts/compilation-graph-shard-*.json
            artifacts/contracts/expected-inventory.txt
            artifacts/contracts/qualified-inventory.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Decision #10 deploy/seed harness
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/contracts
          forge script script/Decision10DeploySeed420.s.sol:Decision10DeploySeed420 --sig "run()" -vvv
          test -s ../artifacts/contracts/creative-kernel-v1.fixture.json
          jq -e '
            .schema == "420.creative.kernel.fixture.v1"
            and .workId == 1
            and .originalRecordingId == 1
            and .remixRecordingId == 2
            and .remixOfferId == 1
            and .remixLicenseId == 1
            and .rightsTransferId == 1
            and .scheduleVersion == 1
            and .workRightsVersion == 1
            and .originalRightsVersion == 2
            and .remixRightsVersion == 1
            and .expectedWorkPoolWei == "30000000000000000000"
            and .expectedOriginalPoolWei == "151000000000000000000"
            and .expectedRemixPoolWei == "72500000000000000000"
            and .expectedTreasuryWei == "6500000000000000000"
            and .expectedVaultBalanceWei == "260000000000000000000"
          ' ../artifacts/contracts/creative-kernel-v1.fixture.json

      - name: Upload Decision #10 fixture manifest
        uses: actions/upload-artifact@v4
        with:
          name: creative-kernel-v1-fixture
          path: artifacts/contracts/creative-kernel-v1.fixture.json
          if-no-files-found: error

      - name: Coverage
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-coverage-solc.py
          python3 scripts/test-coverage-partition.py
          for shard in 0 1 2 3; do
            python3 scripts/coverage-foundry-shard.py "$shard" 4
          done
          python3 scripts/merge-coverage.py ../artifacts/contracts ../artifacts/contracts/coverage
      - name: Retain mandatory coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/contracts/coverage
            artifacts/contracts/coverage-shard-*
          if-no-files-found: error
          retention-days: 30
