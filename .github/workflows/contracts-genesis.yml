name: 420 Genesis Contract Verification

on:
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - "scripts/contracts-*.sh"
      - "scripts/export-contract-manifest.py"
      - ".github/workflows/contracts-genesis.yml"
      - "Dockerfile.contracts"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: ci

    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Bootstrap
        run: bash ./scripts/contracts-bootstrap.sh

      - name: Full contract verification
        continue-on-error: true
        run: bash ./scripts/contracts-ci.sh

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 420-contract-verification
          path: artifacts/contracts/
          if-no-files-found: warn
