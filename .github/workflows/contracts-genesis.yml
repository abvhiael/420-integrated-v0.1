name: 420 Genesis Contract Verification

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: 420-integrated-v0.1-interface-adapted

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "420-integrated-v0.1-interface-adapted/go.mod"

      - name: Tool versions
        run: |
          forge --version
          cast --version
          anvil --version
          python3 --version
          go version

      - name: Bootstrap contract environment
        run: bash ./scripts/contracts-bootstrap.sh

      - name: Full Pay / Swap / Bridge verification
        run: bash ./scripts/contracts-ci.sh

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 420-contract-verification
          path: 420-integrated-v0.1-interface-adapted/artifacts/contracts/
          if-no-files-found: warn
