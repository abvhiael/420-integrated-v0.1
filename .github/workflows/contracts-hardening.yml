      - '!contracts/test/VerifierRotationHardening420.t.sol'
      - '!contracts/src/bridge/BridgeAssetRegistry.sol'
      - '!contracts/src/bridge/EthereumDepositGateway420.sol'
      - '!contracts/src/bridge/adapters/EthereumBridgeAdapter420.sol'
      - '!contracts/src/bridge/tokens/**'
      - '!contracts/src/bridge/verifiers/Ethereum*.sol'
      - '!contracts/src/bridge/verifiers/vendor/sp1/**'
      - '!contracts/src/interfaces/IBridgeTokenRoutePolicy420.sol'
      - '!contracts/src/interfaces/IBridgeVerifiedSourceContext420.sol'
      - '!contracts/src/interfaces/IBitcoinWithdrawal420.sol'
      - '!contracts/src/interfaces/ISolanaOutboundMessage420.sol'
      - '!contracts/src/interfaces/IEthereumOutboundMessage420.sol'
      - '!contracts/src/interfaces/IEthereumSourceGatewaySettlement420.sol'
      - '!contracts/src/interfaces/IEthereumFinalityVerifier420.sol'
      - '!contracts/src/interfaces/IEthereumGatewayMessageVerifier420.sol'
      - '!contracts/test/SupportedTokenRoutes420.t.sol'
      - '!contracts/test/TokenGateway*420.t.sol'
      - '!contracts/test/helpers/Token*420.sol'
      - '!contracts/test/helpers/EthereumProofFixture420.sol'
      - '!contracts/test/fixtures/token-routes/**'
      - '!contracts/config/bridge/supported-token-routes-v1.json'
      - '!contracts/config/bridge/token-route-dependencies/**'
  pull_request:
    paths:
      - "contracts/config/compute-market/cmp-6.8-phase-closeout.json"
      - "contracts/config/compute-market/cmp-7.10-phase-closeout.json"
      - "contracts/config/compute-market/cmp-8-phase-closeout.json"
      - "docs/compute-market/CMP-8-PHASE-CLOSEOUT.md"
      - "scripts/verify-cmp-8-closeout.py"
      - "docs/compute-market/CMP-7.10-PHASE-CLOSEOUT.md"
      - "scripts/verify-cmp-7-10-closeout.py"
      - "docs/compute-market/CMP-6.8-PHASE-CLOSEOUT.md"
      - "scripts/verify-cmp-6-8-closeout.py"
      - "docs/audit/DOOBTUBE-PHASE-CLOSEOUT.md"
      - ".github/workflows/contracts-hardening.yml"
  workflow_dispatch:

concurrency:
  group: contract-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      FOUNDRY_PROFILE: hardening
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Foundry with retry
        shell: bash
        run: |
          set -euo pipefail
          curl -L https://foundry.paradigm.xyz | bash

          if [ -x "$HOME/.config/.foundry/bin/foundryup" ]; then
            FOUNDRY_BIN="$HOME/.config/.foundry/bin"
          elif [ -x "$HOME/.foundry/bin/foundryup" ]; then
            FOUNDRY_BIN="$HOME/.foundry/bin"
          else
            echo "foundryup was not installed in a known location." >&2
            find "$HOME" -maxdepth 4 -type f -name foundryup -print || true
            exit 1
          fi

          export PATH="$FOUNDRY_BIN:$PATH"
          echo "$FOUNDRY_BIN" >> "$GITHUB_PATH"

          for attempt in 1 2 3 4; do
            if "$FOUNDRY_BIN/foundryup"; then
              forge --version
              cast --version
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Foundry installation failed after 4 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Slither
        run: python -m pip install --disable-pip-version-check slither-analyzer

      - name: Capture toolchain
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/hardening
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "foundry_profile=${FOUNDRY_PROFILE}"
            forge --version
            cast --version
            python --version
            slither --version
            forge config
          } | tee ../artifacts/hardening/toolchain.txt

      - name: Frozen compiler profile check
        working-directory: contracts
        run: |
          CONFIG="$(forge config)"
          grep -q 'solc = "0.8.24"' <<<"$CONFIG" || grep -q 'solc_version = "0.8.24"' <<<"$CONFIG"
          grep -q 'evm_version = "cancun"' <<<"$CONFIG"
          grep -q 'optimizer = true' <<<"$CONFIG"
          grep -q 'optimizer_runs = 200' <<<"$CONFIG"
          grep -q 'via_ir = true' <<<"$CONFIG"

      - name: Dangerous authority and opcode scan
        working-directory: contracts
        run: |
          mkdir -p ../artifacts/hardening
          set +e
          grep -RInE --include='*.sol' '\btx\.origin\b|\bselfdestruct\s*\(|\.delegatecall\s*\(' src \
            | tee ../artifacts/hardening/dangerous-opcodes.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "Forbidden authority/opcode primitive found in production Solidity." >&2
            exit 1
          fi
          if [ "$STATUS" -gt 1 ]; then
            exit "$STATUS"
          fi
          : > ../artifacts/hardening/dangerous-opcodes.txt

      - name: Hardening size build
        working-directory: contracts
        # Size qualification applies to deployable production contracts. Tests and
        # scripts are compiled by the dedicated campaigns below; including them in
        # this build needlessly expands the via-IR graph and has repeatedly caused
        # hosted-runner shutdowns before qualification can proceed.
        run: forge build --sizes --skip test --skip script 2>&1 | tee ../artifacts/hardening/build.txt

      - name: AI package fuzz campaign
        working-directory: contracts
        run: forge test --match-path 'test/AI*.t.sol' -vvv 2>&1 | tee ../artifacts/hardening/ai-tests.txt

      - name: Genesis invariant campaign
        working-directory: contracts
        run: forge test --match-path 'test/*Invariant*.t.sol' -vv 2>&1 | tee ../artifacts/hardening/invariants.txt

      - name: AI gas and denial-of-service review evidence
        working-directory: contracts
        run: forge test --match-path 'test/AI*.t.sol' --gas-report 2>&1 | tee ../artifacts/hardening/gas-report.txt

      - name: Slither high-severity gate
        working-directory: contracts
        run: |
          set +e
          slither . --exclude-dependencies --json ../artifacts/hardening/slither.json \
            2>&1 | tee ../artifacts/hardening/slither.txt
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "slither_exit_status=$STATUS" >> ../artifacts/hardening/slither.txt

          python - <<'PY'
          import json
          import sys

          path = "../artifacts/hardening/slither.json"
          with open(path, encoding="utf-8") as handle:
              report = json.load(handle)

          if report.get("success") is not True:
              print(
                  f"Slither analysis failed: {report.get('error') or 'unknown error'}",
                  file=sys.stderr,
              )
              sys.exit(1)

          def exact_arbitrary_send(detector, *, contract, function, signature, filename, call_fragment):
              if detector.get("check") != "arbitrary-send-eth":
                  return False
              description = detector.get("description", "")
              if f"{contract}.{signature}" not in description:
                  return False

              exact_function = False
              exact_send = False
              for element in detector.get("elements", []):
                  source = element.get("source_mapping", {})
                  fields = element.get("type_specific_fields", {})
                  parent = fields.get("parent", {})
                  parent_name = parent.get("name") if isinstance(parent, dict) else parent

                  if (
                      element.get("type") == "function"
                      and element.get("name") == function
                      and source.get("filename_relative") == filename
                      and parent_name == contract
                      and fields.get("signature") == signature
                  ):
                      exact_function = True

                  if (
                      element.get("type") == "node"
                      and source.get("filename_relative") == filename
                      and call_fragment in element.get("name", "")
                  ):
                      node_parent = fields.get("parent", {})
                      node_parent_name = node_parent.get("name") if isinstance(node_parent, dict) else node_parent
                      if node_parent_name == function:
                          exact_send = True

              return exact_function and exact_send

          high = []
          for detector in report.get("results", {}).get("detectors", []):
              if detector.get("impact") != "High":
                  continue

              allowed = exact_arbitrary_send(
                  detector,
                  contract="SmartAccount420",
                  function="_call",
                  signature="_call(address,uint256,bytes)",
                  filename="src/accounts/SmartAccount420.sol",
                  call_fragment="target.call{value: value}(data)",
              )

              if not allowed:
                  allowed = exact_arbitrary_send(
                      detector,
                      contract="RoyaltyVault420",
                      function="claim",
                      signature="claim(bytes32,CreatorId,address)",
                      filename="src/creative/economics/RoyaltyVault420.sol",
                      call_fragment="recipient.call{value: amount}()",
                  )

              if detector.get("check") == "reentrancy-balance":
                  description = detector.get("description", "")
                  exact_function = False
                  exact_balance_use = False
                  for element in detector.get("elements", []):
                      source = element.get("source_mapping", {})
                      fields = element.get("type_specific_fields", {})
                      parent = fields.get("parent", {})
                      parent_name = parent.get("name") if isinstance(parent, dict) else parent
                      if (
                          element.get("type") == "function"
                          and element.get("name") == "routeTokenFee"
                          and source.get("filename_relative") == "src/exchange/ExchangeFeeRouter420.sol"
                          and parent_name == "ExchangeFeeRouter420"
                      ):
                          exact_function = True
                      if (
                          source.get("filename_relative") == "src/exchange/ExchangeFeeRouter420.sol"
                          and element.get("additional_fields", {}).get("underlying_type") == "stale_balance_use"
                          and element.get("additional_fields", {}).get("variable_name") == "balanceBefore"
                      ):
                          exact_balance_use = True

                  if (
                      exact_function
                      and exact_balance_use
                      and "ExchangeFeeRouter420.routeTokenFee(bytes32,address,uint256)" in description
                  ):
                      allowed = True

              # Exact repository-reviewed Slither exceptions. These are deliberately
              # detector + source + symbol scoped; new findings in the same detector
              # class remain fatal.
              description = detector.get("description", "")
              exact_reviewed = (
                  (
                      detector.get("check") == "arbitrary-send-erc20"
                      and "SettlementRouter420.executeDirectTokenSplit(bytes32,address,address,uint256,address[],uint16[],uint8)" in description
                      and "src/pay/SettlementRouter420.sol" in description
                      and "token.transferFrom(payer,address(this),amount)" in description
                  )
                  or (
                      detector.get("check") == "reentrancy-balance"
                      and "SettlementRouter420._distributeToken(bytes32,IERC20PaySplit420,uint256,address[],uint16[],uint8,uint256)" in description
                      and "src/pay/SettlementRouter420.sol" in description
                  )
                  or (
                      detector.get("check") == "reentrancy-balance"
                      and "SettlementRouter420.executeDirectTokenSplit(bytes32,address,address,uint256,address[],uint16[],uint8)" in description
                      and "src/pay/SettlementRouter420.sol" in description
                  )
                  or (
                      detector.get("check") == "reentrancy-balance"
                      and "PublicBatchAuction._pullExact(address,address,uint256)" in description
                      and "src/swap/PublicBatchAuction.sol" in description
                  )
                  or (
                      detector.get("check") == "reentrancy-balance"
                      and "PublicBatchAuction._pushExact(address,address,uint256)" in description
                      and "src/swap/PublicBatchAuction.sol" in description
                  )
                  or (
                      detector.get("check") == "reentrancy-eth"
                      and "ComputeStakeVerifierCollateral420.stake(bytes32,bytes32)" in description
                      and "src/compute/ComputeStakeVerifierCollateral420.sol" in description
                  )
                  or (
                      detector.get("check") == "reentrancy-eth"
                      and "ComputeStakeWorkerCollateral420.stake(bytes32,bytes32)" in description
                      and "src/compute/ComputeStakeWorkerCollateral420.sol" in description
                  )
                  or (
                      detector.get("check") == "reentrancy-eth"
                      and "ComputeJobPayerCustody420.refundExpiredUnmatched(bytes32)" in description
                      and "src/compute/ComputeJobPayerCustody420.sol" in description
                  )
                  or (
                      detector.get("check") == "reentrancy-eth"
                      and "ComputeEscrowFunding420.fund(bytes32)" in description
                      and "src/compute/ComputeEscrowFunding420.sol" in description
                  )
                  or (
                      detector.get("check") == "uninitialized-state"
                      and "LaunchpadCrowdfundingIntegration420._paymentIds" in description
                      and "src/launchpad/LaunchpadCrowdfundingIntegration420.sol" in description
                  )
                  or (
                      detector.get("check") == "uninitialized-state"
                      and "Identity420._credentialCandidates" in description
                      and "src/apps/Identity420.sol" in description
                  )
              )
              if exact_reviewed:
                  allowed = True

              if not allowed:
                  high.append(detector)

          if high:
              print("Unallowlisted high-severity Slither findings:", file=sys.stderr)
              for detector in high:
                  print(
                      f"- {detector.get('check')}: {detector.get('description', '').splitlines()[0]}",
                      file=sys.stderr,
                  )
              sys.exit(1)

          print("No unallowlisted high-severity Slither findings.")
          PY

      - name: Upload hardening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-hardening-${{ github.sha }}
          path: artifacts/hardening
          if-no-files-found: warn
          retention-days: 30
