      - '!contracts/config/bridge/dobbscoin-mainnet-v12.5.10.json'
      - '!contracts/src/bridge/verifiers/PirateChainFinalityVerifier420.sol'
      - '!contracts/src/bridge/verifiers/pirate/**'
      - '!contracts/src/bridge/adapters/PirateChainBridgeAdapter420.sol'
