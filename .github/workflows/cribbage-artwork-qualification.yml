name: Cribbage artwork qualification
on:
  pull_request:
    paths:
      - 'bong-goggles/web/assets/games/cribbage/**'
      - 'bong-goggles/web/core/cribbage-board.js'
      - 'bong-goggles/web/scripts/verify-cribbage-artwork.py'
      - '.github/workflows/cribbage-artwork-qualification.yml'
  push:
    branches: ['fix/cribbage-live-gameplay']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 opencv-python-headless==4.12.0.88
      - name: Verify and generate evidence
        run: python bong-goggles/web/scripts/verify-cribbage-artwork.py --output cribbage-artwork-evidence
      - name: Retain survey evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cribbage-artwork-${{ github.event.pull_request.head.sha || github.sha }}
          path: cribbage-artwork-evidence/
          retention-days: 90
          if-no-files-found: error
  archive:
    needs: survey
    if: ${{ always() && needs.survey.result == 'success' && github.event_name == 'push' && github.repository == 'abvhiael/420-integrated-v0.1' && github.ref == 'refs/heads/fix/cribbage-live-gameplay' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: cribbage-artwork-${{ github.sha }}
          path: cribbage-artwork-evidence
      - name: Permanently archive exact-source evidence in Git
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -c 'import json,os; r=json.load(open("cribbage-artwork-evidence/qualification.json")); assert r["qualification_pass"] and r["source_commit"] == os.environ["SOURCE_SHA"]'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE="$(mktemp -u)"
          git read-tree --empty
          git add -f cribbage-artwork-evidence/
          tree="$(git write-tree)"
          commit="$(printf 'Cribbage artwork qualification evidence for %s\n' "$SOURCE_SHA" | git commit-tree "$tree")"
          ref="refs/heads/evidence/cribbage-artwork/$SOURCE_SHA"
          if git ls-remote --exit-code origin "$ref" >/dev/null; then
            echo "Evidence ref already exists; refusing overwrite."
            exit 1
          fi
          git push origin "$commit:$ref"
