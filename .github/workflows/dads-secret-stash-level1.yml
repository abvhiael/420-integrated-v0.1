name: Dad's Secret Stash targeted Level 1
on:
  pull_request:
    paths:
      - 'clients/420bet-lobby/src/dads-secret-stash-*'
      - 'clients/420bet-lobby/public/assets/420bet/dads-secret-stash/**'
      - 'clients/420bet-lobby/src/slots-lobby.js'
      - 'clients/420bet-lobby/tests/dads-secret-stash.test.mjs'
      - '.github/workflows/dads-secret-stash-level1.yml'
  workflow_dispatch:
jobs:
  dads-secret-stash-level1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/420bet-lobby
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Targeted Slot 3 and lobby tests
        run: node --test tests/dads-secret-stash.test.mjs tests/slots-lobby.test.mjs
      - name: Vite production build (static practice site only)
        run: npm run build
