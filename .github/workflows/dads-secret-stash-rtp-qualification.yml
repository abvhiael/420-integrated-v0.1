name: Dad's Secret Stash targeted RTP qualification
on:
  pull_request:
    paths:
      - 'clients/420bet-lobby/src/dads-secret-stash-engine.js'
      - 'clients/420bet-lobby/src/dads-secret-stash-ui.js'
      - 'clients/420bet-lobby/scripts/dads-secret-stash-exact-free.mjs'
      - 'clients/420bet-lobby/scripts/dads-secret-stash-tail-audit.mjs'
      - '.github/workflows/dads-secret-stash-rtp-qualification.yml'
jobs:
  audited-rtp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact free-spin mathematical expectation
        run: node clients/420bet-lobby/scripts/dads-secret-stash-exact-free.mjs
      - name: Actual slot engine - independent seed A - 8M rounds
        run: node clients/420bet-lobby/scripts/dads-secret-stash-tail-audit.mjs 8000000 20261106 150000
      - name: Actual slot engine - independent seed B - 8M rounds
        run: node clients/420bet-lobby/scripts/dads-secret-stash-tail-audit.mjs 8000000 4202026 150000
      - name: Actual slot engine - independent seed C - 8M rounds
        run: node clients/420bet-lobby/scripts/dads-secret-stash-tail-audit.mjs 8000000 987654321 150000
