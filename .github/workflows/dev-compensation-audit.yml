name: Dev Compensation Vault Audit Qualification

on:
  pull_request:
    paths:
      - "contracts/src/revenue/DevelopmentCompensationVault420.sol"
      - "contracts/src/revenue/DevelopmentCompensationIds420.sol"
      - "contracts/test/DevelopmentCompensationVault420.t.sol"
      - "contracts/test/DevelopmentCompensationAdversarial420.t.sol"
      - "contracts/test/DevelopmentCompensationGenesis420.t.sol"
      - "contracts/test/FounderWalletClaimsAndCompensation420.t.sol"
      - "contracts/src/revenue/FoundingDeveloperCompensationSplitter420.sol"
      - "contracts/src/governance/FoundingWalletClaims420.sol"
      - "contracts/config/application-revenue-policy-v1.json"
      - "contracts/config/genesis-dapp-contract-map.json"
      - "contracts/src/libraries/ServiceIds420.sol"
      - "docs/DEVELOPMENT-COMPENSATION-VAULT.md"
      - "docs/audit/DEVCOMP-*"
      - ".github/workflows/dev-compensation-audit.yml"
      - "scripts/prepare-devcomp-foundry-scope.py"
      # Shared authorization, discovery, build and deployment dependencies.
      - "contracts/src/system/CapabilityRegistry420.sol"
      - "contracts/src/interfaces/genesis/ICapabilityRegistry420.sol"
      - "contracts/src/interfaces/genesis/ICapabilityRegistryExtended420.sol"
      - "contracts/src/apps/ProtocolRegistry.sol"
      - "contracts/src/interfaces/genesis/IProtocolRegistry420.sol"
      - "contracts/src/interfaces/genesis/Types420.sol"
      - "contracts/src/interfaces/I420System.sol"
      - "contracts/src/system/SystemAccess.sol"
      - "contracts/test/CapabilityRegistry420.t.sol"
      - "contracts/foundry.toml"
      - "contracts/remappings.txt"
      - "remappings.txt"
      - "contracts/forge-std/**"
      - "contracts/config/founder-wallet-reservations.json"
      - "contracts/config/founding-genesis-integration-v1.json"
      - "contracts/config/genesis-config-commitment.json"
      - "contracts/config/genesis-canonical-addresses.json"
      - "contracts/config/system-addresses.json"
      - "contracts/config/predeploy/storage-init.json"
      - "contracts/config/predeploy/ProtocolRegistry-predeploy-state.json"
      - "contracts/config/treasury/founding-financial-policy-provisional.json"
      - "config/genesis-allocations.json"
      - "config/protocol.json"
      - "genesis/allocations-template.csv"
      - "contracts/src/system/FounderVestingRegistry.sol"
      - "scripts/prepare-founder-financial-deployment.py"
      - "scripts/prepare-founder-claims-deployment.py"
      - "scripts/verify-founder-wallet-reservations.py"
      - "scripts/enroll-founder-wallets.py"
      - "scripts/requirements-founder-wallets.txt"
      - "scripts/test-founder-wallet-enrollment.py"
      - "scripts/verify-founding-financial-policy.py"
      - "scripts/verify-founding-genesis-integration.py"
      - "scripts/verify-genesis-config-commitment.py"
  workflow_dispatch:

concurrency:
  group: dev-compensation-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check focused Solidity formatting
        working-directory: contracts
        run: forge fmt --check src/revenue/DevelopmentCompensationVault420.sol src/revenue/DevelopmentCompensationIds420.sol test/DevelopmentCompensationVault420.t.sol test/DevelopmentCompensationGenesis420.t.sol

      - name: Stage exact Vault/Genesis Solidity source closure
        shell: bash
        run: |
          set -euo pipefail
          export DEVCOMP_SCOPE_ROOT="$RUNNER_TEMP/devcomp-scope"
          python3 scripts/prepare-devcomp-foundry-scope.py --output "$DEVCOMP_SCOPE_ROOT"
          echo "DEVCOMP_SCOPE_ROOT=$DEVCOMP_SCOPE_ROOT" >> "$GITHUB_ENV"

      - name: Build revenue contract family
        run: forge build --root "$DEVCOMP_SCOPE_ROOT" src/revenue --sizes

      - name: Run Dev Compensation Vault regressions
        run: forge test --root "$DEVCOMP_SCOPE_ROOT" --match-path 'test/DevelopmentCompensationVault420.t.sol' -vvvv

      - name: Run Dev Compensation Genesis registration regression
        run: forge test --root "$DEVCOMP_SCOPE_ROOT" --match-path 'test/DevelopmentCompensationGenesis420.t.sol' -vvvv

      - name: Run founder claims and compensation lifecycle regressions
        run: forge test --root "$DEVCOMP_SCOPE_ROOT" --match-path 'test/FounderWalletClaimsAndCompensation420.t.sol' -vvvv

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Stage exact Vault/Genesis Solidity source closure
        shell: bash
        run: |
          set -euo pipefail
          export DEVCOMP_SCOPE_ROOT="$RUNNER_TEMP/devcomp-scope"
          python3 scripts/prepare-devcomp-foundry-scope.py --output "$DEVCOMP_SCOPE_ROOT"
          echo "DEVCOMP_SCOPE_ROOT=$DEVCOMP_SCOPE_ROOT" >> "$GITHUB_ENV"

      - name: Reject dangerous revenue-vault and splitter primitives
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[^[:alnum:]_])(delegatecall|selfdestruct|tx[.]origin)([^[:alnum:]_]|$)' contracts/src/revenue/DevelopmentCompensationVault420.sol contracts/src/revenue/FoundingDeveloperCompensationSplitter420.sol; then
            echo "Forbidden primitive found in compensation contracts." >&2
            exit 1
          fi

      - name: Re-run focused tests under hardening profile
        env:
          FOUNDRY_PROFILE: hardening
        run: forge test --root "$DEVCOMP_SCOPE_ROOT" --match-path 'test/DevelopmentCompensationVault420.t.sol' -vvvv

      - name: Re-run founder claims and compensation under hardening profile
        env:
          FOUNDRY_PROFILE: hardening
        run: forge test --root "$DEVCOMP_SCOPE_ROOT" --match-path 'test/FounderWalletClaimsAndCompensation420.t.sol' -vvvv

      - name: Run real-registry and mixed-asset adversarial qualification
        env:
          FOUNDRY_PROFILE: hardening
        run: forge test --root "$DEVCOMP_SCOPE_ROOT" --match-path 'test/DevelopmentCompensationAdversarial420.t.sol' -vv

      - name: Install Slither
        run: python -m pip install --disable-pip-version-check slither-analyzer

      - name: Targeted Slither high-severity gate
        working-directory: ${{ env.DEVCOMP_SCOPE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          slither src/revenue/DevelopmentCompensationVault420.sol --json /tmp/devcomp-slither.json >/tmp/devcomp-slither.txt 2>&1 || true
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("/tmp/devcomp-slither.json")
          log_path = Path("/tmp/devcomp-slither.txt")
          if not report_path.exists():
              print(log_path.read_text(errors="replace"))
              raise SystemExit("Slither did not produce JSON output")
          report = json.loads(report_path.read_text())
          if report.get("success") is not True:
              print(log_path.read_text(errors="replace"))
              raise SystemExit(f"Slither analysis failed: {report.get('error') or 'unknown error'}")
          high = [
              {
                  "check": d.get("check"),
                  "impact": d.get("impact"),
                  "confidence": d.get("confidence"),
                  "description": d.get("description", "").splitlines()[0],
              }
              for d in report.get("results", {}).get("detectors", [])
              if d.get("impact") == "High"
          ]
          print(json.dumps({"highSeverity": high}, indent=2))
          if high:
              raise SystemExit("High-severity Slither finding in Development Compensation Vault")
          PY

      - name: Founder splitter Slither high-severity gate
        working-directory: ${{ env.DEVCOMP_SCOPE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          slither src/revenue/FoundingDeveloperCompensationSplitter420.sol --json /tmp/devcomp-splitter-slither.json >/tmp/devcomp-splitter-slither.txt 2>&1 || true
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("/tmp/devcomp-splitter-slither.json")
          log_path = Path("/tmp/devcomp-splitter-slither.txt")
          if not report_path.exists():
              print(log_path.read_text(errors="replace"))
              raise SystemExit("Slither did not produce JSON output")
          report = json.loads(report_path.read_text())
          if report.get("success") is not True:
              print(log_path.read_text(errors="replace"))
              raise SystemExit(f"Slither analysis failed: {report.get('error') or 'unknown error'}")
          high = [
              {
                  "check": d.get("check"),
                  "impact": d.get("impact"),
                  "confidence": d.get("confidence"),
                  "description": d.get("description", "").splitlines()[0],
              }
              for d in report.get("results", {}).get("detectors", [])
              if d.get("impact") == "High"
          ]
          print(json.dumps({"highSeverity": high}, indent=2))
          if high:
              raise SystemExit("High-severity Slither finding in Founder Compensation Splitter")
          PY
