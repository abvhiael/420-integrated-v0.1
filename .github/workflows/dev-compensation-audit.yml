name: Dev Compensation Vault Audit Qualification

on:
  pull_request:
    paths:
      - "contracts/src/revenue/DevelopmentCompensationVault420.sol"
      - "contracts/src/revenue/DevelopmentCompensationIds420.sol"
      - "contracts/test/DevelopmentCompensationVault420.t.sol"
      - "contracts/test/DevelopmentCompensationGenesis420.t.sol"
      - "contracts/config/application-revenue-policy-v1.json"
      - "contracts/config/genesis-dapp-contract-map.json"
      - "contracts/src/libraries/ServiceIds420.sol"
      - "docs/DEVELOPMENT-COMPENSATION-VAULT.md"
      - "docs/audit/DEVCOMP-*"
      - ".github/workflows/dev-compensation-audit.yml"
  workflow_dispatch:

concurrency:
  group: dev-compensation-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Emit Forge-formatted focused sources
        working-directory: contracts
        shell: bash
        run: |
          forge fmt src/revenue/DevelopmentCompensationVault420.sol src/revenue/DevelopmentCompensationIds420.sol test/DevelopmentCompensationVault420.t.sol test/DevelopmentCompensationGenesis420.t.sol
          echo "__DEVCOMP_CONTRACT_BEGIN__"
          cat src/revenue/DevelopmentCompensationVault420.sol
          echo "__DEVCOMP_CONTRACT_END__"
          echo "__DEVCOMP_TEST_BEGIN__"
          cat test/DevelopmentCompensationVault420.t.sol
          echo "__DEVCOMP_TEST_END__"
          exit 1

      - name: Build revenue contract family
        working-directory: contracts
        run: forge build src/revenue --sizes

      - name: Run Dev Compensation Vault regressions
        working-directory: contracts
        run: forge test --match-path 'test/DevelopmentCompensationVault420.t.sol' -vvvv

      - name: Run Dev Compensation Genesis registration regression
        working-directory: contracts
        run: forge test --match-path 'test/DevelopmentCompensationGenesis420.t.sol' -vvvv

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Reject dangerous revenue-vault primitives
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '\\b(delegatecall|selfdestruct|tx\\.origin)\\b' contracts/src/revenue/DevelopmentCompensationVault420.sol; then
            echo "Forbidden primitive found in Development Compensation Vault." >&2
            exit 1
          fi

      - name: Re-run focused tests under hardening profile
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: hardening
        run: forge test --match-path 'test/DevelopmentCompensationVault420.t.sol' -vvvv

      - name: Install Slither
        run: python -m pip install --disable-pip-version-check slither-analyzer

      - name: Targeted Slither high-severity gate
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          slither src/revenue/DevelopmentCompensationVault420.sol --json /tmp/devcomp-slither.json >/tmp/devcomp-slither.txt 2>&1 || true
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("/tmp/devcomp-slither.json")
          log_path = Path("/tmp/devcomp-slither.txt")
          if not report_path.exists():
              print(log_path.read_text(errors="replace"))
              raise SystemExit("Slither did not produce JSON output")
          report = json.loads(report_path.read_text())
          if report.get("success") is not True:
              print(log_path.read_text(errors="replace"))
              raise SystemExit(f"Slither analysis failed: {report.get('error') or 'unknown error'}")
          high = [
              {
                  "check": d.get("check"),
                  "impact": d.get("impact"),
                  "confidence": d.get("confidence"),
                  "description": d.get("description", "").splitlines()[0],
              }
              for d in report.get("results", {}).get("detectors", [])
              if d.get("impact") == "High"
          ]
          print(json.dumps({"highSeverity": high}, indent=2))
          if high:
              raise SystemExit("High-severity Slither finding in Development Compensation Vault")
          PY
