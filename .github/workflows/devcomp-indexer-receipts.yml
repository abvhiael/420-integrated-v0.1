name: DEVCOMP Indexer receipt qualification
on:
  pull_request:
    paths:
      - '420-indexer/**'
      - 'explorer/**'
      - 'analytics/**'
      - 'clients/420bet-fantasy/**'
      - 'contracts/src/bet/**'
      - 'contracts/src/oracle/**'
      - 'contracts/src/randomness/**'
      - 'contracts/src/apps/Identity420.sol'
      - 'contracts/src/token/ERC20Template420.sol'
      - 'contracts/script/fantasy/**'
      - 'scripts/fantasy/**'
      - 'go.mod'
      - 'go.sum'
      - 'contracts/test/ExchangeFeeSettlement420.t.sol'
      - 'contracts/src/revenue/**'
      - 'contracts/src/exchange/**'
      - 'contracts/src/apps/ProtocolRegistry.sol'
      - 'contracts/src/system/CapabilityRegistry420.sol'
      - 'contracts/src/system/SystemAccess.sol'
      - 'contracts/src/libraries/ServiceIds420.sol'
      - 'contracts/src/interfaces/**'
      - 'contracts/foundry.toml'
      - 'scripts/prepare-devcomp-foundry-scope.py'
      - '.github/workflows/devcomp-indexer-receipts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: indexer420
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d indexer420"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - name: Build exact compensation and Indexer sources
        env:
          QUALIFICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$QUALIFICATION_SHA"
          python scripts/prepare-devcomp-foundry-scope.py --output "$RUNNER_TEMP/devcomp-receipts" --include-exchange
          mkdir -p "$RUNNER_TEMP/devcomp-receipts/src/exchange"
          cp contracts/src/exchange/Wrapped420.sol "$RUNNER_TEMP/devcomp-receipts/src/exchange/"
          forge build --root "$RUNNER_TEMP/devcomp-receipts"
          go build -buildvcs=false -o "$RUNNER_TEMP/devcomp-explorer" ./explorer/cmd/explorer420
          go build -buildvcs=false -o "$RUNNER_TEMP/devcomp-analytics" ./analytics/cmd/analytics420
          npm --prefix 420-indexer ci
          npm --prefix 420-indexer run build
          cd 420-indexer
          node --test dist/test/compensation-indexer.test.js dist/test/compensation-report.test.js
      - name: Run the Exchange swap through both consumers and recover a reorganization
        env:
          DEVCOMP_LOCAL_RPC: http://127.0.0.1:18548
          INDEXER_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/indexer420
        run: |
          set -euo pipefail
          export DEVCOMP_FOUNDRY_OUT="$RUNNER_TEMP/devcomp-receipts/out"
          export DEVCOMP_EXPLORER_BIN="$RUNNER_TEMP/devcomp-explorer"
          export DEVCOMP_ANALYTICS_BIN="$RUNNER_TEMP/devcomp-analytics"
          anvil --host 127.0.0.1 --port 18548 --chain-id 420 --slots-in-an-epoch 32 --silent &
          anvil_pid=$!
          trap 'kill "$anvil_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if cast chain-id --rpc-url "$DEVCOMP_LOCAL_RPC" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node 420-indexer/scripts/qualify-compensation-receipts.mjs
      - name: Settle funded Fantasy formats and seasons through both consumers
        env:
          INDEXER_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/indexer420
        run: |
          set -euo pipefail
          python -m pip install -r clients/420bet-fantasy/formats/requirements.txt
          export DEVCOMP_EXPLORER_BIN="$RUNNER_TEMP/devcomp-explorer"
          export DEVCOMP_ANALYTICS_BIN="$RUNNER_TEMP/devcomp-analytics"
          export FOUNDRY_OUT="$RUNNER_TEMP/devcomp-fantasy-build"
          export FOUNDRY_CACHE_PATH="$RUNNER_TEMP/devcomp-fantasy-cache"
          (
            cd contracts
            FOUNDRY_PROFILE=pr FOUNDRY_VIA_IR=true FOUNDRY_SRC=script/fantasy \
              FOUNDRY_SCRIPT=script/fantasy FOUNDRY_TEST=test/__approved_empty__ forge build --use 0.8.30
          )
          python scripts/fantasy/diagnose-approved-formats.py --anvil "$(command -v anvil)" \
            --build "$FOUNDRY_OUT" --output "$RUNNER_TEMP/devcomp-fantasy-formats"
          python scripts/fantasy/diagnose-approved-seasons.py --anvil "$(command -v anvil)" \
            --build "$FOUNDRY_OUT" --output "$RUNNER_TEMP/devcomp-fantasy-seasons" --all-modes
      - name: Run the daily Fantasy browser settlement through both consumers
        env:
          INDEXER_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/indexer420
        run: |
          set -euo pipefail
          python -m pip install -r clients/420bet-fantasy/daily/requirements.txt
          pnpm --dir clients/420bet-fantasy/daily install --frozen-lockfile --ignore-scripts
          pnpm --dir clients/420bet-fantasy/daily exec playwright install --with-deps chromium
          node clients/420bet-fantasy/daily/build.mjs
          export DEVCOMP_EXPLORER_BIN="$RUNNER_TEMP/devcomp-explorer"
          export DEVCOMP_ANALYTICS_BIN="$RUNNER_TEMP/devcomp-analytics"
          python scripts/fantasy/qualify-daily-application.py --output "$RUNNER_TEMP/devcomp-fantasy-daily"
      - uses: actions/upload-artifact@v4
        with:
          name: devcomp-funded-fantasy-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/devcomp-fantasy-formats/compensation-consumers.json
            ${{ runner.temp }}/devcomp-fantasy-seasons/compensation-consumers.json
            ${{ runner.temp }}/devcomp-fantasy-daily/compensation-consumers.json
          if-no-files-found: error
