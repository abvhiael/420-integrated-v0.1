name: 420 Developer Hub

on:
  pull_request:
    paths:
      - 'developer-hub/**'
      - 'packages/420-sdk/**'
      - 'packages/420-cli/**'
      - 'docs/DEVELOPER-HUB-DEVHUB-*.md'
      - '.github/workflows/developer-hub.yml'
  push:
    branches:
      - main
    paths:
      - 'developer-hub/**'
      - 'packages/420-sdk/**'
      - 'packages/420-cli/**'
      - 'docs/DEVELOPER-HUB-DEVHUB-*.md'
      - '.github/workflows/developer-hub.yml'

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Developer Hub runtime
        working-directory: developer-hub
        run: npm test
      - name: Install SDK build dependency
        working-directory: packages/420-sdk
        run: npm install --no-audit --no-fund
      - name: Test shared TypeScript SDK
        working-directory: packages/420-sdk
        run: npm test
      - name: Install CLI dependencies
        working-directory: packages/420-cli
        run: npm install --no-audit --no-fund
      - name: Test 420 CLI
        working-directory: packages/420-cli
        run: npm test
