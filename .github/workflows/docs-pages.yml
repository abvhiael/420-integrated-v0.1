# GitHub Pages publishing is managed by this workflow.
name: 420Docs Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'README.md'
      - 'scripts/qualify-documentation.py'
      - 'scripts/validate-doc-pages-publication.py'
      - 'scripts/validate-doc-canonical-publication.py'
      - 'scripts/inject-doc-canonical-links.py'
      - 'scripts/validate-doc-canonical-render.py'
      - 'scripts/validate-doc-repository-integration.py'
      - 'scripts/qualify-docs.py'
      - 'scripts/render-doc-version-context.py'
      - 'scripts/inject-doc-version-selector.py'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Qualify 420Docs for publication
        run: python scripts/qualify-documentation.py

      - name: Record publication commit
        env:
          PUBLICATION_SHA: ${{ github.sha }}
          PUBLICATION_REPOSITORY: ${{ github.repository }}
          PUBLICATION_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "source_commit": os.environ["PUBLICATION_SHA"],
              "repository": os.environ["PUBLICATION_REPOSITORY"],
              "ref": os.environ["PUBLICATION_REF"],
              "qualified": True,
          }
          Path("site/publication.json").write_text(json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
