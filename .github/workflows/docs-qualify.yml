name: 420Docs Qualification

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'README.md'
      - 'scripts/qualify-docs.py'
      - 'scripts/generate-reference-docs.py'
      - 'scripts/qualify-generated-reference.py'
      - 'scripts/reference_*_renderer.py'
      - 'contracts/src/**'
      - '420-rpc/src/**'
      - '420-indexer/src/**'
      - 'packages/420-sdk/**'
      - 'packages/420-cli/**'
      - 'developer-hub/manifests/**'
      - 'developer-hub/schema/network-manifest.schema.json'
      - 'developer-hub/catalogue/**'
      - 'developer-hub/deployment/**'
      - 'developer-hub/release/**'
      - 'developer-hub/src/network-discovery.mjs'
      - 'developer-hub/src/contract-catalogue.mjs'
      - 'developer-hub/src/deployment-control.mjs'
      - 'developer-hub/src/verification-control.mjs'
      - '.github/workflows/docs-qualify.yml'
      - '.github/workflows/docs-pages.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'README.md'
      - 'scripts/qualify-docs.py'
      - 'scripts/generate-reference-docs.py'
      - 'scripts/qualify-generated-reference.py'
      - 'scripts/reference_*_renderer.py'
      - 'contracts/src/**'
      - '420-rpc/src/**'
      - '420-indexer/src/**'
      - 'packages/420-sdk/**'
      - 'packages/420-cli/**'
      - 'developer-hub/manifests/**'
      - 'developer-hub/schema/network-manifest.schema.json'
      - 'developer-hub/catalogue/**'
      - 'developer-hub/deployment/**'
      - 'developer-hub/release/**'
      - 'developer-hub/src/network-discovery.mjs'
      - 'developer-hub/src/contract-catalogue.mjs'
      - 'developer-hub/src/deployment-control.mjs'
      - 'developer-hub/src/verification-control.mjs'
      - '.github/workflows/docs-qualify.yml'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Qualify generated reference freshness
        run: python scripts/qualify-generated-reference.py --check

      - name: Build 420Docs strictly
        run: mkdocs build --strict

      - name: Qualify search and navigation
        run: python scripts/qualify-docs.py
