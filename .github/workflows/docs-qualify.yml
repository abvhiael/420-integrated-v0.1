      - '!docs/audit/BRIDGE-AUDIT-3-V-14-CCTP.md'
      - '!docs/audit/cctp-qualification/**'
      - '!contracts/src/bridge/adapters/USDCCCTPAdapter.sol'
      - '!contracts/src/bridge/verifiers/cctp/**'
      - '!contracts/src/interfaces/ICircleCCTPV2420.sol'
      - '!docs/audit/BRIDGE-AUDIT-3-V-15-CADC.md'
      - '!docs/audit/cadc-qualification/**'
      - '!contracts/src/bridge/adapters/CADCLayerZeroAdapter.sol'
      - '!contracts/src/interfaces/bridge/ILayerZeroCADC420.sol'
      - '!docs/audit/BRIDGE-AUDIT-3-V-16-TOKEN-ROUTES.md'
      - '!docs/audit/token-route-qualification/**'
      - '!contracts/src/bridge/BridgeAssetRegistry.sol'
      - '!contracts/src/bridge/tokens/**'
      - '!contracts/src/bridge/verifiers/Ethereum*.sol'
      - '!contracts/src/interfaces/IBridgeTokenRoutePolicy420.sol'
      - '!contracts/src/interfaces/IBridgeVerifiedSourceContext420.sol'
      - '!contracts/src/interfaces/IBitcoinWithdrawal420.sol'
      - '!contracts/src/interfaces/ISolanaOutboundMessage420.sol'
      - '!contracts/src/interfaces/IEthereumOutboundMessage420.sol'
      - '!contracts/src/interfaces/IEthereumSourceGatewaySettlement420.sol'
      - '!docs/audit/BRIDGE-AUDIT-3-V-18-ADVERSARIAL.md'
      - '!docs/audit/adversarial-qualification/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'audit/') || contains(github.head_ref, '-audit-')) || github.head_ref == 'audit/420launchpad-remediation' || github.head_ref == 'audit/420verify-20261003' || github.head_ref == 'audit/420token-complete-20261004' || github.head_ref == 'audit/420town-complete-20261004' || github.head_ref == 'audit/420media-complete-20261006' || github.head_ref == 'audit/doobtube-baseline-20261006' || github.head_ref == 'audit/420commerce-com-2-upstream-adaptations' || github.head_ref == 'audit/doobr-audit-1-inventory-20261009' || github.head_ref == 'review/high-country-complete-audit-20261009' || github.head_ref == 'audit/highcountry-r06-1-browser-shell-20261014' || startsWith(github.head_ref, 'audit/420governance-rec-6-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Run documentation qualification
        run: python scripts/qualify-documentation.py

      - name: Verify CMP-1.3 invariant evidence matrix
        run: python scripts/verify-cmp-1-3-14-invariants.py

      - name: Verify CMP-1.3 historical deployment package readiness
        run: python scripts/verify-cmp-1-3-7-deployment.py --repository-ready

      - name: Verify CMP-1.3.15 release-candidate readiness
        run: python scripts/verify-cmp-1-3-15-release-candidate.py --repository-ready

      - name: Verify CMP-1.3 deferred closeout migration
        run: python scripts/verify-cmp-1-3-deferred-closeout.py

      - name: Verify CMP-1.3.16 phase closeout reconciliation
        run: python scripts/verify-cmp-1-3-16-closeout.py

      - name: Verify CMP-1.4.0 verifier architecture reconciliation
        run: python scripts/verify-cmp-1-4-0-verifier-architecture.py

      - name: Verify CMP-1.4.4 signed verdict provenance
        run: python scripts/verify-cmp-1-4-4-signed-verdict-provenance.py

      - name: Verify CMP-1.4.12 verifier phase closeout
        run: python scripts/verify-cmp-1-4-12-closeout.py

      - name: Verify CMP-1.5.13 ComputeStake phase closeout
        run: python scripts/verify-cmp-1-5-13-closeout.py
