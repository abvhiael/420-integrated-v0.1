name: DOOBR Audit Level 1
on:
  push:
    branches:
      - audit/doobr-audit-1-inventory-20261009
    paths:
      - '.github/workflows/doobr-audit-1-level1.yml'
      - 'docs/audits/doobr/**'
      - 'scripts/verify-doobr-audit-2.py'
      - 'scripts/verify-doobr-audit-5.py'
      - 'scripts/verify-doobr-audit-6.py'
      - 'scripts/verify-doobr-audit-8.py'
      - 'genesis/svc3/travelapp/doobr_audit3_test.go'
      - 'genesis/svc3/travelapp/doobr_audit7_security_test.go'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-qualification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate audit Python syntax
        run: python3 -m py_compile scripts/verify-doobr-audit-2.py scripts/validate-gen-svc-0.py scripts/validate-gen-svc-3.py
      - name: GEN-SVC-0 shared Genesis architecture validator
        run: python3 scripts/validate-gen-svc-0.py
      - name: GEN-SVC-3 canonical validator
        run: python3 scripts/validate-gen-svc-3.py
      - name: DOOBR architecture authority verification
        run: python3 scripts/verify-doobr-audit-2.py
      - name: DOOBR AUDIT-5 integration and governance verifier
        run: python3 scripts/verify-doobr-audit-5.py
      - name: DOOBR AUDIT-6 approved-scope verifier
        run: python3 scripts/verify-doobr-audit-6.py
      - name: DOOBR AUDIT-8 deployment and documentation verifier
        run: python3 scripts/verify-doobr-audit-8.py
      - name: Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: DOOBR noncached compatibility and fail-closed regressions
        run: |
          go test -count=1 ./genesis/svc3/travelapp -run '^(TestGenesisCompatibilitySchemas|TestGenesisTransactionMethodsAlwaysDisabled|TestDOOBRAudit3BoundaryMatrix|TestDOOBRAudit3GatewayCannotBeEnabledByInput)$' -v
      - name: DOOBR AUDIT-7 security adversarial and recovery matrix
        run: go test -count=1 ./genesis/svc3/travelapp -run '^TestDOOBRAudit7' -v
      - name: GEN-SVC-3 scoped tests
        run: go test ./genesis/svc3/... ./cmd/420travel/...
      - name: GEN-SVC-3 scoped vet
        run: go vet ./genesis/svc3/... ./cmd/420travel/...
      - name: GEN-SVC-3 scoped build
        run: go build -o /tmp/420travel ./cmd/420travel
      - name: Assert exact checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
