name: DOOBR R01 Level 1
on:
  pull_request:
    paths:
      - 'docs/doobr/**'
      - 'scripts/verify-doobr-r01-1.py'
      - '.github/workflows/doobr-r01-level1.yml'
      - 'config/genesis-applications.json'
      - 'config/genesis-consumer-services.json'
      - 'config/420travel-genesis.json'
      - 'genesis/svc3/travelapp/compatibility.go'
  push:
    branches:
      - 'roadmap/doobr-bc-vancouver-infrastructure'
    paths:
      - 'docs/doobr/**'
      - 'scripts/verify-doobr-r01-1.py'
      - '.github/workflows/doobr-r01-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head or push SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scoped schema parser
        run: python3 -m pip install 'PyYAML==6.0.2'
      - name: Check scoped Python syntax
        run: python3 -m py_compile scripts/verify-doobr-r01-1.py scripts/verify-doobr-audit-2.py scripts/validate-gen-svc-3.py
      - name: Verify DOOBR R01.1 inventory and canonical authority
        run: python3 scripts/verify-doobr-r01-1.py
      - name: Verify prior DOOBR compatibility boundary
        run: python3 scripts/verify-doobr-audit-2.py
      - name: Verify GEN-SVC-3 configuration and disabled Travel boundary
        run: python3 scripts/validate-gen-svc-3.py
