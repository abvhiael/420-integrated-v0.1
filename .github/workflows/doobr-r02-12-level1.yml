name: DOOBR R02.12 Operations Level 1
on:
  push:
    branches: [roadmap/doobr-bc-vancouver-infrastructure]
    paths: ['doobr/operations.py','doobr/storage/migrations/0011_operations.up.sql','doobr/storage/tests/test_pg_operations.py','docs/doobr/DOOBR-R02-12-*','.github/workflows/doobr-r02-12-level1.yml']
  pull_request:
    paths: ['doobr/operations.py','doobr/storage/migrations/0011_operations.up.sql','doobr/storage/tests/test_pg_operations.py','docs/doobr/DOOBR-R02-12-*','.github/workflows/doobr-r02-12-level1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: postgres
          POSTGRES_DB: doobr_r02_12
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d doobr_r02_12"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: doobr_r02_12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact SHA before
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python3 -m py_compile doobr/operations.py doobr/storage/tests/test_pg_operations.py
      - name: Install PostgreSQL client
        run: python3 -m pip install 'psycopg[binary]==3.2.4'
      - name: Canonical migrations 0001-0011
        run: |
          for num in 0001_initial 0002_identity 0003_retailer 0004_courier 0005_presence 0006_order_commands 0007_dispatch 0008_tracking 0009_return_cases 0010_outbox 0011_operations; do
            psql -v ON_ERROR_STOP=1 -f "doobr/storage/migrations/${num}.up.sql"
          done
      - name: Real PostgreSQL tenant-isolated health and audit
        run: python3 -m unittest discover -s doobr/storage/tests -p test_pg_operations.py -v
      - name: Isolated full backup and restore acceptance
        run: |
          set -euo pipefail
          umask 077
          pg_dump -Fc --no-owner --no-acl -f /tmp/doobr-r0212.dump doobr_r02_12
          createdb doobr_r02_12_restored
          pg_restore --exit-on-error --no-owner --no-acl -d doobr_r02_12_restored /tmp/doobr-r0212.dump
          psql -v ON_ERROR_STOP=1 -d doobr_r02_12_restored -c "DO \\\$\\\$ BEGIN IF (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='doobr_private' AND c.relname IN ('operation_audit','event_outbox','return_cases','custody_evidence') AND c.relrowsecurity AND c.relforcerowsecurity)<>4 THEN RAISE EXCEPTION 'restore lost private RLS'; END IF; END \\\$\\\$;"
          rm -f /tmp/doobr-r0212.dump
      - name: Exact SHA after
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
