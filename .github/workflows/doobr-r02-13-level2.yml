name: DOOBR R02.13 Backend Level 2
on:
  push:
    branches: [roadmap/doobr-bc-vancouver-infrastructure]
    paths:
      - 'doobr/**'
      - 'docs/doobr/DOOBR-R02-13-*'
      - '.github/workflows/doobr-r02-13-level2.yml'
  pull_request:
    paths:
      - 'doobr/**'
      - 'docs/doobr/DOOBR-R02-13-*'
      - '.github/workflows/doobr-r02-13-level2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile retained app and lint recovery scripts
        run: |
          python3 -m compileall -q doobr
          bash -n doobr/ops/backup_encrypted.sh doobr/ops/restore_isolated.sh
      - name: Install isolated PostgreSQL driver
        run: python3 -m pip install 'psycopg[binary]==3.2.4'
      - name: Retained unit/negative/security regressions
        run: |
          set -euo pipefail
          for file in doobr/storage/tests/test_*.py; do
            case "$(basename "$file")" in test_pg_*) continue ;; esac
            python3 -m unittest discover -s doobr/storage/tests -p "$(basename "$file")" -v
          done
      - name: Full-schema real PostgreSQL cross-step integration
        run: |
          set -euo pipefail
          tests=(test_pg_auth.py test_pg_admission.py test_pg_order_commands.py test_pg_dispatch.py test_pg_tracking.py test_pg_custody.py test_pg_returns.py test_pg_outbox.py test_pg_operations.py)
          dbs=(doobr_r02_2 doobr_r02_3 doobr_r02_6 doobr_r02_7 doobr_r02_8 doobr_r02_9 doobr_r02_10 doobr_r02_11 doobr_r02_12)
          migrations=(0001_initial 0002_identity 0003_retailer 0004_courier 0005_presence 0006_order_commands 0007_dispatch 0008_tracking 0009_return_cases 0010_outbox 0011_operations)
          for i in "${!tests[@]}"; do
            db="${dbs[$i]}"
            createdb "$db"
            for migration in "${migrations[@]}"; do
              PGDATABASE="$db" psql -X -v ON_ERROR_STOP=1 -q -f "doobr/storage/migrations/${migration}.up.sql" >/dev/null
            done
            PGDATABASE="$db" python3 -m unittest discover -s doobr/storage/tests -p "${tests[$i]}" -v
          done
      - name: Restore retained operations recovery test
        run: |
          set -euo pipefail
          PGDATABASE=doobr_r02_12 pg_dump -Fc --no-owner --no-acl -f /tmp/doobr-l2.dump doobr_r02_12
          createdb doobr_l2_restored
          pg_restore --exit-on-error --no-owner --no-acl -d doobr_l2_restored /tmp/doobr-l2.dump
          test "$(psql -d doobr_l2_restored -Atqc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='doobr_private' AND c.relname IN ('operation_audit','event_outbox','return_cases','custody_evidence') AND c.relrowsecurity AND c.relforcerowsecurity")" = 4
          rm -f /tmp/doobr-l2.dump
      - name: Verify final implementation SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
