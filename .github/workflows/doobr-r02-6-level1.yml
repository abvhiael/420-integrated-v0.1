name: DOOBR R02.6 Order Commands Level 1
on:
  push:
    branches: [roadmap/doobr-bc-vancouver-infrastructure]
    paths:
      - 'doobr/order_commands.py'
      - 'doobr/auth.py'
      - 'doobr/storage/migrations/0006_order_commands.up.sql'
      - 'doobr/storage/tests/test_pg_order_commands.py'
      - 'doobr/storage/tests/test_order_commands.py'
      - 'docs/doobr/DOOBR-R02-6-*'
      - '.github/workflows/doobr-r02-6-level1.yml'
  pull_request:
    paths:
      - 'doobr/order_commands.py'
      - 'doobr/auth.py'
      - 'doobr/storage/migrations/0006_order_commands.up.sql'
      - 'doobr/storage/tests/test_pg_order_commands.py'
      - 'doobr/storage/tests/test_order_commands.py'
      - 'docs/doobr/DOOBR-R02-6-*'
      - '.github/workflows/doobr-r02-6-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  order-commands:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: postgres
          POSTGRES_DB: doobr_r02_6
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d doobr_r02_6"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: doobr_r02_6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact implementation SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile command engine and authorization
        run: python3 -m py_compile doobr/order_commands.py doobr/auth.py doobr/storage/tests/test_pg_order_commands.py
      - name: State machine and invalid command negative cases
        run: python3 -m unittest discover -s doobr/storage/tests -p test_order_commands.py -v
      - name: Install restricted PostgreSQL test client
        run: python3 -m pip install 'psycopg[binary]==3.2.4'
      - name: Apply canonical R02 migrations
        run: |
          for num in 0001_initial 0002_identity 0003_retailer 0004_courier 0005_presence 0006_order_commands; do
            psql -v ON_ERROR_STOP=1 -f "doobr/storage/migrations/${num}.up.sql"
          done
      - name: Real PostgreSQL concurrency and rollback test
        run: python3 -m unittest discover -s doobr/storage/tests -p test_pg_order_commands.py -v
      - name: Verify exact implementation SHA after tests
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
