name: DOOBR R02.8 Tracking Level 1
on:
  push:
    branches: [roadmap/doobr-bc-vancouver-infrastructure]
    paths: ['doobr/tracking.py','doobr/auth.py','doobr/storage/migrations/0008_tracking.up.sql','doobr/storage/tests/test_tracking.py','doobr/storage/tests/test_pg_tracking.py','docs/doobr/DOOBR-R02-8-*','.github/workflows/doobr-r02-8-level1.yml']
  pull_request:
    paths: ['doobr/tracking.py','doobr/auth.py','doobr/storage/migrations/0008_tracking.up.sql','doobr/storage/tests/test_tracking.py','doobr/storage/tests/test_pg_tracking.py','docs/doobr/DOOBR-R02-8-*','.github/workflows/doobr-r02-8-level1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tracking:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: postgres
          POSTGRES_DB: doobr_r02_8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d doobr_r02_8"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: doobr_r02_8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify implementation SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and negative tracking cases
        run: |
          python3 -m py_compile doobr/tracking.py doobr/storage/tests/test_tracking.py doobr/auth.py
          python3 -m unittest discover -s doobr/storage/tests -p test_tracking.py -v
      - name: Install PostgreSQL client
        run: python3 -m pip install 'psycopg[binary]==3.2.4'
      - name: Apply all R02 migrations
        run: |
          for num in 0001_initial 0002_identity 0003_retailer 0004_courier 0005_presence 0006_order_commands 0007_dispatch 0008_tracking; do
            psql -v ON_ERROR_STOP=1 -f "doobr/storage/migrations/${num}.up.sql"
          done
      - name: Validate location tables forced RLS
        run: |
          psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='doobr_private' AND c.relname IN ('location_permissions','location_samples') AND c.relrowsecurity AND c.relforcerowsecurity)<>2 THEN RAISE EXCEPTION 'location RLS absent'; END IF; END \$\$;"
      - name: Verify real tracking grant sample revocation lifecycle
        run: python3 -m unittest discover -s doobr/storage/tests -p test_pg_tracking.py -v
      - name: Verify final SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
