name: DOOBR R02.9 Custody Level 1
on:
  push:
    branches: [roadmap/doobr-bc-vancouver-infrastructure]
    paths: ['doobr/custody.py','doobr/storage/tests/test_custody.py','docs/doobr/DOOBR-R02-9-*','.github/workflows/doobr-r02-9-level1.yml']
  pull_request:
    paths: ['doobr/custody.py','doobr/storage/tests/test_custody.py','docs/doobr/DOOBR-R02-9-*','.github/workflows/doobr-r02-9-level1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  custody:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: postgres
          POSTGRES_DB: doobr_r02_9
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d doobr_r02_9"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: doobr_r02_9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact SHA before
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Custody unit regressions
        run: |
          python3 -m py_compile doobr/custody.py doobr/storage/tests/test_custody.py
          python3 -m unittest discover -s doobr/storage/tests -p test_custody.py -v
      - name: PostgreSQL migrations
        run: |
          for num in 0001_initial 0002_identity 0003_retailer 0004_courier 0005_presence 0006_order_commands 0007_dispatch 0008_tracking; do
            psql -v ON_ERROR_STOP=1 -f "doobr/storage/migrations/${num}.up.sql"
          done
      - name: Verify tenant-private custody RLS
        run: |
          psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS(SELECT 1 FROM pg_class c JOIN pg_namespace n ON c.relnamespace=n.oid WHERE n.nspname='doobr_private' AND c.relname='custody_evidence' AND c.relrowsecurity AND c.relforcerowsecurity) THEN RAISE EXCEPTION 'custody RLS missing'; END IF; END \$\$;"
      - name: Exact SHA after
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
