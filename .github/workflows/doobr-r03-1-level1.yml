name: DOOBR R03.1 Site Shell Level 1
on:
  push:
    branches: [roadmap/doobr-bc-vancouver-infrastructure]
    paths: ['web/doobr/**','docs/doobr/DOOBR-R03-1-*','.github/workflows/doobr-r03-1-level1.yml']
  pull_request:
    paths: ['web/doobr/**','docs/doobr/DOOBR-R03-1-*','.github/workflows/doobr-r03-1-level1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact implementation SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Approved logo SHA, accessibility, no-checkout and static build
        run: |
          cd web/doobr
          npm run check
          npm run build
          test -f dist/index.html
          test -f dist/assets/doobr-official-logo.png
      - name: Verify exact final SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
