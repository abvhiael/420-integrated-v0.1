name: DOOBR R03.8 Mobile Level 1
on:
  push:
    branches: [roadmap/doobr-bc-vancouver-infrastructure]
    paths: ['mobile/doobr/**','doobr/mobile_security.py','doobr/storage/tests/test_mobile_security.py','.github/workflows/doobr-r03-8-level1.yml']
  pull_request:
    paths: ['mobile/doobr/**','doobr/mobile_security.py','doobr/storage/tests/test_mobile_security.py','.github/workflows/doobr-r03-8-level1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mobile permission and notification adversarial tests
        run: |
          python3 -m py_compile doobr/mobile_security.py
          python3 -m unittest discover -s doobr/storage/tests -p test_mobile_security.py -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK and install pinned packages
        run: |
          test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager" || test -x "$SDK/cmdline-tools/16.0/bin/sdkmanager"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$MANAGER" ]; then MANAGER="$SDK/cmdline-tools/16.0/bin/sdkmanager"; fi
          "$MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android debug compile
        run: gradle -p mobile/doobr/android :app:assembleDebug --no-daemon
      - name: Native manifest and privacy guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          android=Path('mobile/doobr/android/app/src/main/AndroidManifest.xml').read_text()
          ios=Path('mobile/doobr/ios/Info.plist').read_text()
          assert 'android:allowBackup="false"' in android
          assert 'android:usesCleartextTraffic="false"' in android
          assert 'ACCESS_BACKGROUND_LOCATION' not in android
          assert 'FOREGROUND_SERVICE_LOCATION' not in android
          assert 'NSLocationAlwaysAndWhenInUseUsageDescription' not in ios
          assert '<array/>' in ios
          assert 'NSLocationWhenInUseUsageDescription' in ios
          PY
      - name: Exact SHA after
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"

  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact iOS implementation SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: iOS simulator compile (unsigned)
        run: |
          xcodebuild -project mobile/doobr/ios/DOOBr.xcodeproj -scheme DOOBr -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Exact SHA after
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
