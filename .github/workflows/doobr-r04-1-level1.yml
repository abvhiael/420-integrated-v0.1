name: DOOBR R04.1 Authority Reuse Level 1
on:
  push:
    branches: [roadmap/doobr-bc-vancouver-infrastructure]
    paths: ['scripts/verify-doobr-r04-1.py','.github/workflows/doobr-r04-1-level1.yml','docs/doobr/DOOBR-R04-1-AUTHORITY-INVENTORY.md']
  pull_request:
    paths: ['scripts/verify-doobr-r04-1.py','.github/workflows/doobr-r04-1-level1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact implementation SHA before
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical manifest and disabled gateway guard
        run: |
          python3 -m py_compile scripts/verify-doobr-r04-1.py
          python3 scripts/verify-doobr-r04-1.py
      - name: Exact SHA after
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
