name: DOOBR R04.10 Protocol Security Level 1
on:
  push:
    branches: [roadmap/doobr-bc-vancouver-infrastructure]
    paths: ['doobr/storage/tests/test_r04_10_protocol_security.py','.github/workflows/doobr-r04-10-level1.yml']
  pull_request:
    paths: ['doobr/storage/tests/test_r04_10_protocol_security.py','.github/workflows/doobr-r04-10-level1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact SHA before
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Interface invariants deterministic fuzz and retained app adversarial tests
        run: |
          python3 -m compileall -q doobr
          python3 -m unittest discover -s doobr/storage/tests -p test_r04_10_protocol_security.py -v
          for suite in test_payment_conservation.py test_wallet_consent.py test_provenance_adapter.py test_compliance_discovery_adapter.py test_canonical_routing.py test_pay_receipt_adapter.py test_provider_registry_adapter.py test_auth.py test_travel_card.py; do
            python3 -m unittest discover -s doobr/storage/tests -p "$suite" -v
          done
          python3 scripts/verify-doobr-r04-1.py
      - name: Exact SHA after
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
