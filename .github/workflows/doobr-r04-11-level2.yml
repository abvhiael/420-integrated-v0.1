name: DOOBR R04.11 Protocol Integration Level 2
on:
  push:
    branches: [roadmap/doobr-bc-vancouver-infrastructure]
    paths:
      - '.github/workflows/doobr-r04-11-level2.yml'
      - 'doobr/**'
      - 'web/doobr/**'
      - 'web/travel/**'
  pull_request:
    paths:
      - '.github/workflows/doobr-r04-11-level2.yml'
      - 'doobr/**'
      - 'web/doobr/**'
      - 'web/travel/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact SHA before
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: All retained R04 adapter and adversarial regression suites
        run: |
          set -euo pipefail
          python3 -m compileall -q doobr
          for suite in test_provider_registry_adapter.py test_delivery_commitment.py test_pay_receipt_adapter.py test_wallet_consent.py test_provenance_adapter.py test_compliance_discovery_adapter.py test_canonical_routing.py test_payment_conservation.py test_r04_10_protocol_security.py test_retailer.py test_auth.py test_travel_card.py test_mobile_replay_api.py test_outbox.py; do
            python3 -m unittest discover -s doobr/storage/tests -p "$suite" -v
          done
          python3 scripts/verify-doobr-r04-1.py
      - name: Verify exact SHA after
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
  public-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public site and read-only Travel contract
        run: |
          set -euo pipefail
          node web/doobr/scripts/qualify.mjs
          node web/doobr/scripts/build.mjs
          python3 - <<'PY'
          from pathlib import Path
          page=Path("web/travel/index.html").read_text()
          assert 'id="doobr-coarse-presence"' in page
          assert 'DOOBr checkout · Unavailable</button>' in page
          assert 'https://doobr.420integrated.org/coverage' in page
          PY
      - name: Verify exact SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
