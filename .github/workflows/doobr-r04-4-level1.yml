name: DOOBR R04.4 Pay Receipt Level 1
on:
  push:
    branches: [roadmap/doobr-bc-vancouver-infrastructure]
    paths: ['doobr/pay_receipt_adapter.py','doobr/storage/tests/test_pay_receipt_adapter.py','.github/workflows/doobr-r04-4-level1.yml']
  pull_request:
    paths: ['doobr/pay_receipt_adapter.py','doobr/storage/tests/test_pay_receipt_adapter.py','.github/workflows/doobr-r04-4-level1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pay-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact SHA before
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pay receipt and retailer authorizations
        run: |
          python3 -m py_compile doobr/pay_receipt_adapter.py
          python3 -m unittest discover -s doobr/storage/tests -p test_pay_receipt_adapter.py -v
          python3 -m unittest discover -s doobr/storage/tests -p test_retailer.py -v
          python3 scripts/verify-doobr-r04-1.py
      - name: Exact SHA after
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
