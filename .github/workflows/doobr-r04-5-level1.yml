name: DOOBR R04.5 Wallet Consent Level 1
on:
  push:
    branches: [roadmap/doobr-bc-vancouver-infrastructure]
    paths: ['doobr/wallet_consent.py','doobr/storage/tests/test_wallet_consent.py','.github/workflows/doobr-r04-5-level1.yml']
  pull_request:
    paths: ['doobr/wallet_consent.py','doobr/storage/tests/test_wallet_consent.py','.github/workflows/doobr-r04-5-level1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact SHA before
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wallet consent and retained identity/replay security tests
        run: |
          python3 -m py_compile doobr/wallet_consent.py
          python3 -m unittest discover -s doobr/storage/tests -p test_wallet_consent.py -v
          python3 -m unittest discover -s doobr/storage/tests -p test_auth.py -v
          python3 -m unittest discover -s doobr/storage/tests -p test_mobile_replay_api.py -v
          python3 scripts/verify-doobr-r04-1.py
      - name: Verify exact SHA after
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
