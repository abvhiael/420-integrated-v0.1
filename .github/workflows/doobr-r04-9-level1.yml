name: DOOBR R04.9 Payment Conservation Level 1
on:
  push:
    branches: [roadmap/doobr-bc-vancouver-infrastructure]
    paths: ['doobr/payment_conservation.py','doobr/storage/tests/test_payment_conservation.py','.github/workflows/doobr-r04-9-level1.yml']
  pull_request:
    paths: ['doobr/payment_conservation.py','doobr/storage/tests/test_payment_conservation.py','.github/workflows/doobr-r04-9-level1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conservation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact SHA before
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pay conservation and retained retailer proof tests
        run: |
          python3 -m py_compile doobr/payment_conservation.py
          python3 -m unittest discover -s doobr/storage/tests -p test_payment_conservation.py -v
          python3 -m unittest discover -s doobr/storage/tests -p test_pay_receipt_adapter.py -v
          python3 -m unittest discover -s doobr/storage/tests -p test_retailer.py -v
          python3 scripts/verify-doobr-r04-1.py
      - name: Exact SHA after
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
