name: DOOBR R05.2 Privacy Retention Level 1
on:
  push:
    branches: [roadmap/doobr-bc-vancouver-infrastructure]
    paths: ['doobr/privacy_retention.py','doobr/storage/tests/test_r05_2_privacy_retention.py','.github/workflows/doobr-r05-2-level1.yml']
  pull_request:
    paths: ['doobr/privacy_retention.py','doobr/storage/tests/test_r05_2_privacy_retention.py','.github/workflows/doobr-r05-2-level1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact SHA before
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Privacy retention and retained location tests
        run: |
          set -euo pipefail
          python3 -m py_compile doobr/privacy_retention.py
          for suite in test_r05_2_privacy_retention.py test_travel_card.py test_compliance_discovery_adapter.py test_mobile_security.py test_mobile_offline.py; do
            python3 -m unittest discover -s doobr/storage/tests -p "$suite" -v
          done
          python3 scripts/verify-doobr-r04-1.py
      - name: Verify exact SHA after
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
