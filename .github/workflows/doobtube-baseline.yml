name: DoobTube baseline audit

on:
  pull_request:
    paths:
      - "docs/DOOBTUBE-*"
      - "docs/audit/DOOBTUBE-*"
      - "scripts/verify-doobtube-baseline.py"
      - "scripts/verify-doobtube-level2.py"
      - "doobtube/**"
      - ".github/workflows/doobtube-baseline.yml"
      - ".github/workflows/doobtube-integration.yml"
      - "config/genesis-consumer-services.json"
      - "config/genesis-applications.json"
  workflow_dispatch:

concurrency:
  group: doobtube-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact implementation SHA
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile DoobTube adapter policy
        run: python3 -m compileall -q doobtube
      - name: Test DoobTube protocol adapters
        run: python3 -m unittest -v doobtube.tests.test_doobtube_adapters
      - name: Test DoobTube backend control plane
        run: python3 -m unittest -v doobtube.tests.test_doobtube_backend
      - name: Test DoobTube media integration
        run: python3 -m unittest -v doobtube.tests.test_doobtube_media
      - name: Qualify DoobTube web application
        run: npm --prefix doobtube/web run qualify
      - name: Verify DoobTube audit baseline
        run: python3 scripts/verify-doobtube-baseline.py
