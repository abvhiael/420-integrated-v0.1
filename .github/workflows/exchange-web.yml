name: 420Exchange Web Verification

on:
  push:
    paths:
      - "exchange/web/**"
      - ".github/workflows/exchange-web.yml"
  pull_request:
    paths:
      - "exchange/web/**"
      - ".github/workflows/exchange-web.yml"
  workflow_dispatch:

jobs:
  verify-exchange-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static Exchange checks
        working-directory: exchange/web
        run: npm run check
      - name: Exchange web unit tests
        working-directory: exchange/web
        run: npm test
      - name: Build and verify PRE-02 deployable browser artifact (qualification only)
        working-directory: exchange/web
        env:
          EXCHANGE_DEPLOYMENT_MODE: qualification
          EXCHANGE_BUILD_SHA: ${{ github.sha }}
        run: |
          npm run build
          node scripts/verify-pre02-artifact.mjs
      - name: Install Chromium browser test runner
        working-directory: exchange/web
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: PRE-02 built-preview Chromium acceptance (simulated EIP-1193 only)
        working-directory: exchange/web
        env:
          EXCHANGE_BUILD_SHA: ${{ github.sha }}
        run: node scripts/pre02-chromium-acceptance.mjs
      - name: Preserve PRE-02 browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exchange-pre02-chromium-${{ github.sha }}
          path: exchange/web/acceptance-evidence/pre02-chromium.json
          if-no-files-found: warn
      - name: Frontend secret scan
        working-directory: exchange/web
        run: |
          ! grep -RniE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|mnemonic[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']+|seed[_ -]?phrase[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']+|private[_-]?key[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']+'             --exclude-dir=node_modules             --exclude-dir=test             --exclude='v14.*-qualification.json'             --exclude='check.mjs'             .
