name: EXP-1.7 Cross-Layer Traceability Qualification

on:
  pull_request:
    paths:
      - 'indexer/**'
      - 'consensus/storage/**'
      - 'explorer/**'
      - 'config/420indexer-v1.json'
      - 'testnet/public-services/indexer/readiness.json'
      - 'docs/audit/EXP-1.7-cross-layer-traceability.*'
      - 'scripts/verify-exp-1-7-cross-layer-traceability.py'
      - '.github/workflows/explorer-exp-1-7.yml'

concurrency:
  group: exp-1-7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Go test Indexer
        run: go test ./indexer/...
      - name: Go vet Indexer
        run: go vet ./indexer/...
      - name: Go test Explorer
        run: go test ./explorer/...
      - name: Go vet Explorer
        run: go vet ./explorer/...
      - name: Retained Indexer readiness contract
        run: python scripts/verify-420indexer.py
      - name: Retained EXP-1.1
        run: python scripts/verify-exp-1-1-runtime-authority.py
      - name: Retained EXP-1.2
        run: python scripts/verify-exp-1-2-rpc-binding.py
      - name: Retained EXP-1.3
        run: python scripts/verify-exp-1-3-canonical-indexing.py
      - name: Retained EXP-1.4
        run: python scripts/verify-exp-1-4-indexer-runtime.py
      - name: Retained EXP-1.5
        run: python scripts/verify-exp-1-5-consensus-provider.py
      - name: Retained EXP-1.6
        run: python scripts/verify-exp-1-6-historical-producer.py
      - name: EXP-1.7 cross-layer traceability
        run: python scripts/verify-exp-1-7-cross-layer-traceability.py
      - name: Build production Indexer binary
        run: go build ./indexer/cmd/indexer420
      - name: Build production Indexer container
        run: docker build -f docker/Dockerfile.420indexer -t 420indexer:exp-1.7 .
      - name: Validate deployment manifest
        env:
          INDEXER_RPC_URL: https://rpc.invalid.example
          INDEXER_CONSENSUS_STATUS_DIR: /tmp/420consensus
        run: |
          mkdir -p /tmp/420consensus
          printf '{}\n' > /tmp/420consensus/status.json
          docker compose -f deployments/indexer/docker-compose.yml config >/dev/null
      - name: Upload EXP-1.7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp-1-7-cross-layer-traceability-dedicated
          path: exp-1-7-evidence/
          if-no-files-found: error
