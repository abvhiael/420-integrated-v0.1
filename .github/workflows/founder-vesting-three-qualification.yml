name: Three-founder Genesis vesting qualification
on:
  pull_request:
    paths:
      - 'contracts/src/system/FounderVestingRegistry.sol'
      - 'contracts/test/FounderVestingThree420.t.sol'
      - 'contracts/config/founder-wallet-reservations.json'
      - 'contracts/config/predeploy/storage-init.json'
      - 'config/genesis-allocations.json'
      - 'config/protocol.json'
      - 'genesis/allocations-template.csv'
      - 'scripts/verify-founder-vesting-three.py'
      - 'scripts/verify-step6-contracts.py'
      - '.github/workflows/founder-vesting-three-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: three-founder-vesting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact Git head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify three-founder allocation, conservation and fail-closed old Genesis commitment
        run: |
          set -euo pipefail
          python3 scripts/verify-founder-vesting-three.py
          if python3 scripts/verify-founder-vesting-three.py --require-release; then
            echo "ERROR: missing founder signatures or stale V3 Genesis commitment were accepted" >&2
            exit 1
          fi
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare exact Solidity import closure
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          export VESTING_ROOT="$RUNNER_TEMP/founder-vesting-three"
          python3 - <<'PY'
          import hashlib,json,os,re,shutil
          from pathlib import Path
          source=Path.cwd().resolve()
          dest=Path(os.environ["VESTING_ROOT"])
          pending=[source/"test/FounderVestingThree420.t.sol"]
          seen=set()
          pattern=re.compile(r'\bimport\s+(?:[^;]*?\bfrom\s+)?["\x27]([^"\x27]+)["\x27]\s*;')
          while pending:
              p=pending.pop().resolve()
              if p in seen: continue
              if not p.is_relative_to(source) or not p.is_file(): raise RuntimeError(f"missing import {p}")
              seen.add(p)
              for name in pattern.findall(p.read_text()):
                  pending.append(source/name if name.startswith("forge-std/") else p.parent/name)
          for p in sorted(seen):
              q=dest/p.relative_to(source)
              q.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(p,q)
              assert q.read_bytes()==p.read_bytes()
          shutil.copyfile(source/"foundry.toml",dest/"foundry.toml")
          (dest/"remappings.txt").write_text("forge-std/=forge-std/\n")
          print(json.dumps({str(p.relative_to(source)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(seen)},sort_keys=True))
          PY
          echo "VESTING_ROOT=$VESTING_ROOT" >> "$GITHUB_ENV"
      - name: Execute three founder 13-step vesting and anti-capture tests
        run: forge test --root "$VESTING_ROOT" --match-path test/FounderVestingThree420.t.sol -vvv
