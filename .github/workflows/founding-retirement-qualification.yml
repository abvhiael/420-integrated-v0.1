name: Founding governance transition qualification
on:
  pull_request:
    paths:
      - 'contracts/src/governance/FoundingRetirementVerifier420.sol'
      - 'contracts/src/governance/FoundingCommitteeMembership420.sol'
      - 'contracts/src/governance/CivicGovernor420.sol'
      - 'contracts/src/system/ValidatorRegistry.sol'
      - 'contracts/test/FoundingRetirementVerifier420.t.sol'
      - '.github/workflows/founding-retirement-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: founding-retirement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Construct exact Solidity import closure
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          export RETIRE_ROOT="$RUNNER_TEMP/founding-retirement"
          python3 - <<'PY'
          import hashlib,json,os,re,shutil
          from pathlib import Path
          root=Path.cwd().resolve()
          dest=Path(os.environ["RETIRE_ROOT"])
          pending=[root/"test/FoundingRetirementVerifier420.t.sol"]
          seen=set()
          pattern=re.compile(r'\bimport\s+(?:[^;]*?\bfrom\s+)?["\x27]([^"\x27]+)["\x27]\s*;')
          while pending:
              p=pending.pop().resolve()
              if p in seen: continue
              if not p.is_relative_to(root) or not p.is_file(): raise RuntimeError(f"missing import: {p}")
              seen.add(p)
              for imported in pattern.findall(p.read_text()):
                  pending.append(root/imported if imported.startswith("forge-std/") else p.parent/imported)
          for p in sorted(seen):
              q=dest/p.relative_to(root)
              q.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(p,q)
              assert q.read_bytes()==p.read_bytes()
          shutil.copyfile(root/"foundry.toml",dest/"foundry.toml")
          (dest/"remappings.txt").write_text("forge-std/=forge-std/\n")
          print(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(seen)},sort_keys=True))
          PY
          echo "RETIRE_ROOT=$RETIRE_ROOT" >> "$GITHUB_ENV"
      - name: Qualification of 60/15/30 readiness, Civic approvals and retirement
        run: forge test --root "$RETIRE_ROOT" --match-path test/FoundingRetirementVerifier420.t.sol -vvv
