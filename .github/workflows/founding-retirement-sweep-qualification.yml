name: Founding community retirement Vault settlement
on:
  pull_request:
    paths:
      - 'contracts/src/treasury/FoundingCommunityRetirementSweep420.sol'
      - 'contracts/test/FoundingCommunityRetirementSweep420.t.sol'
      - '.github/workflows/founding-retirement-sweep-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: founding-retirement-sweep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare exact source closure
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          export SWEEP_ROOT="$RUNNER_TEMP/founding-retirement-sweep"
          python3 - <<'PY'
          import hashlib,json,os,re,shutil
          from pathlib import Path
          source=Path.cwd().resolve()
          dest=Path(os.environ["SWEEP_ROOT"])
          pending=[source/"test/FoundingCommunityRetirementSweep420.t.sol"]
          seen=set()
          pattern=re.compile(r'\bimport\s+(?:[^;]*?\bfrom\s+)?["\x27]([^"\x27]+)["\x27]\s*;')
          while pending:
              p=pending.pop().resolve()
              if p in seen:continue
              if not p.is_relative_to(source) or not p.is_file():raise RuntimeError(f"missing actual source import: {p}")
              seen.add(p)
              for name in pattern.findall(p.read_text()):
                  pending.append(source/name if name.startswith("forge-std/") else p.parent/name)
          for p in sorted(seen):
              q=dest/p.relative_to(source)
              q.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(p,q)
              assert q.read_bytes()==p.read_bytes()
          shutil.copyfile(source/"foundry.toml",dest/"foundry.toml")
          (dest/"remappings.txt").write_text("forge-std/=forge-std/\n")
          print(json.dumps({str(p.relative_to(source)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(seen)},sort_keys=True))
          PY
          echo "SWEEP_ROOT=$SWEEP_ROOT" >> "$GITHUB_ENV"
      - name: Run real AssetVault route-scoped retirement tests
        run: forge test --root "$SWEEP_ROOT" --match-path test/FoundingCommunityRetirementSweep420.t.sol -vvv
