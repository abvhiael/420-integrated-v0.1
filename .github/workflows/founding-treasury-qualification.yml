name: Founding Treasury bounded authorization

on:
  pull_request:
    paths:
      - 'contracts/src/treasury/FoundingTreasuryAuthority420.sol'
      - 'contracts/src/treasury/TreasuryBudgetRegistry420.sol'
      - 'contracts/src/treasury/TreasuryPolicyRegistry420.sol'
      - 'contracts/src/treasury/TreasuryDisbursementRegistry420.sol'
      - 'contracts/src/treasury/TreasuryReleaseExecutor420.sol'
      - 'contracts/test/FoundingTreasurySettlement420.t.sol'
      - 'contracts/config/treasury/founding-financial-policy-provisional.json'
      - 'contracts/test/FoundingTreasuryAuthority420.t.sol'
      - '.github/workflows/founding-treasury-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: founding-treasury-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare only the audited founding Treasury test import closure
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          export FOUNDING_ROOT="$RUNNER_TEMP/founding-treasury"
          python3 - <<'PY'
          import hashlib,json,os,re,shutil
          from pathlib import Path
          root=Path.cwd().resolve()
          dest=Path(os.environ["FOUNDING_ROOT"])
          pending=[root/"test/FoundingTreasuryAuthority420.t.sol",
                   root/"test/FoundingTreasurySettlement420.t.sol"]
          seen=set()
          pat=re.compile(r'\bimport\s+(?:[^;]*?\bfrom\s+)?["\x27]([^"\x27]+)["\x27]\s*;')
          while pending:
              p=pending.pop().resolve()
              if p in seen: continue
              if not p.is_relative_to(root) or not p.is_file(): raise RuntimeError(f"missing actual import {p}")
              seen.add(p)
              for imported in pat.findall(p.read_text()):
                  if imported.startswith("forge-std/"): pending.append(root/imported)
                  else: pending.append(p.parent/imported)
          for p in sorted(seen):
              out=dest/p.relative_to(root)
              out.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(p,out)
              assert p.read_bytes()==out.read_bytes()
          shutil.copyfile(root/"foundry.toml",dest/"foundry.toml")
          (dest/"remappings.txt").write_text("forge-std/=forge-std/\n")
          print(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(seen)},sort_keys=True))
          PY
          echo "FOUNDING_ROOT=$FOUNDING_ROOT" >> "$GITHUB_ENV"
      - name: Compile and run founding financial authority regressions
        run: |
          forge test --root "$FOUNDING_ROOT" --match-path test/FoundingTreasuryAuthority420.t.sol -vvv
          forge test --root "$FOUNDING_ROOT" --match-path test/FoundingTreasurySettlement420.t.sol -vvv
