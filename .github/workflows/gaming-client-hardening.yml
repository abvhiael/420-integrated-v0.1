name: 420 Gaming Client Hardening

on:
  pull_request:
    paths:
      - "packages/420-gaming-sdk/**"
      - "packages/420-gaming-client-hardening/**"
      - "clients/highcountry-access-v1/**"
      - "scripts/migration/stage-mig-4-game-consumers.sh"
      - ".github/workflows/gaming-client-hardening.yml"
      - "docs/gaming/420GP-16-SECURITY-PRIVACY.md"

jobs:
  hostile-client-state:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Stage pinned external consumers
        run: bash scripts/migration/stage-mig-4-game-consumers.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run GP-16.4 hostile client-state qualification
        working-directory: packages/420-gaming-client-hardening
        run: npm test
