name: GEN-SVC-1 Implementation

on:
  pull_request:
    paths:
      - 'reputation/**'
      - 'sdk/reputation420/**'
      - 'reputation/ui/**'
      - '.github/workflows/gen-svc-1-implementation.yml'
  push:
    branches: [main]
    paths:
      - 'reputation/**'
      - 'sdk/reputation420/**'
      - 'reputation/ui/**'
      - '.github/workflows/gen-svc-1-implementation.yml'

permissions:
  contents: read

jobs:
  reputation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: go test ./reputation/... ./sdk/reputation420/...
      - run: go test -race ./reputation/... ./sdk/reputation420/...
      - run: go vet ./reputation/... ./sdk/reputation420/...
      - run: node --test reputation/ui/components.test.mjs
