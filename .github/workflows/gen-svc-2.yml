name: GEN-SVC-2 Location and Events

on:
  pull_request:
    paths:
      - 'config/420location-events-genesis.json'
      - 'docs/genesis-services/GEN-SVC-2-LOCATION-EVENTS.md'
      - 'scripts/validate-gen-svc-2.py'
      - '.github/workflows/gen-svc-2.yml'
  push:
    branches: [main]
    paths:
      - 'config/420location-events-genesis.json'
      - 'docs/genesis-services/GEN-SVC-2-LOCATION-EVENTS.md'
      - 'scripts/validate-gen-svc-2.py'
      - '.github/workflows/gen-svc-2.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate-gen-svc-2.py
