name: GEN-SVC-4 Classifieds

on:
  pull_request:
    paths:
      - 'config/420classifieds-genesis.json'
      - 'docs/genesis-services/GEN-SVC-4-CLASSIFIEDS.md'
      - 'scripts/validate-gen-svc-4.py'
      - '.github/workflows/gen-svc-4.yml'
  push:
    branches: [main]
    paths:
      - 'config/420classifieds-genesis.json'
      - 'docs/genesis-services/GEN-SVC-4-CLASSIFIEDS.md'
      - 'scripts/validate-gen-svc-4.py'
      - '.github/workflows/gen-svc-4.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate-gen-svc-4.py
