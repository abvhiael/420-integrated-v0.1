name: Genesis Address Authority
on:
  push:
    branches:
      - 'fix/genesis-address-authority-main-20260920'
    paths:
      - 'contracts/config/**'
      - 'config/**'
      - 'wallet/deployment-inventory.json'
      - 'scripts/verify-genesis-canonical-addresses.py'
      - 'scripts/verify-reg-audit-4-genesis-address-namespace.py'
      - 'scripts/test-reg-audit-4-genesis-address-namespace.py'
      - 'scripts/audit-genesis-address-collisions.py'
      - 'scripts/verify-genesis-predeploy-authority.py'
      - 'scripts/verify-wallet-w14-7-1-namespace.py'
      - 'scripts/test-wallet-w14-7-1-namespace.py'
      - 'scripts/audit-wallet-w14-7-4-consumers.py'
      - 'scripts/test-wallet-w14-7-4-consumers.py'
      - '.github/workflows/genesis-address-authority.yml'
  pull_request:
    paths:
      - 'contracts/config/**'
      - 'config/**'
      - 'wallet/deployment-inventory.json'
      - 'scripts/verify-genesis-canonical-addresses.py'
      - 'scripts/verify-reg-audit-4-genesis-address-namespace.py'
      - 'scripts/test-reg-audit-4-genesis-address-namespace.py'
      - 'scripts/audit-genesis-address-collisions.py'
      - 'scripts/verify-genesis-predeploy-authority.py'
      - 'scripts/verify-wallet-w14-7-1-namespace.py'
      - 'scripts/test-wallet-w14-7-1-namespace.py'
      - '.github/workflows/genesis-address-authority.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genesis-address-authority-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Genesis owns address/namespace/predeploy authority qualification only.
  # Canonical full Foundry qualification is owned once by Solidity Contracts.
  cross-manifest-authority:
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'audit/') || contains(github.head_ref, '-audit-'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check canonical frozen owners and proposed application claims
        run: python scripts/verify-genesis-canonical-addresses.py
      - name: REG-AUDIT-4 complete namespace authority
        run: python scripts/verify-reg-audit-4-genesis-address-namespace.py
      - name: REG-AUDIT-4 adversarial namespace regressions
        run: python scripts/test-reg-audit-4-genesis-address-namespace.py
      - name: Active namespace collision audit
        run: python scripts/audit-genesis-address-collisions.py
      - name: Check physical predeploy/deployment parity and reject retired claims
        run: python scripts/verify-genesis-predeploy-authority.py
      - name: Validate actual current frozen namespace and unapproved candidates
        run: python scripts/verify-wallet-w14-7-1-namespace.py
      - name: W14.7.1 actual-authority namespace regression fixtures
        run: python scripts/test-wallet-w14-7-1-namespace.py
      - name: W14.7.4 historical-claim regression tests
        run: python scripts/test-wallet-w14-7-4-consumers.py
      - name: W14.7.4 source-consumer inventory (evidence, not active-address attestation)
        run: python scripts/audit-wallet-w14-7-4-consumers.py > address-consumer-inventory.json
      - name: Upload address-consumer inventory
        uses: actions/upload-artifact@v4
        with:
          name: address-consumers-${{ github.sha }}
          path: address-consumer-inventory.json
          retention-days: 30
