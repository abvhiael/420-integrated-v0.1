name: Genesis Arcade Deferral Reconciliation Level 1
on:
  pull_request:
    paths:
      - 'config/genesis-applications.json'
      - 'docs/audit/genesis-contract-documentation-inventory.json'
      - 'scripts/migration/verify-genesis-arcade-deferral.py'
      - '.github/workflows/genesis-arcade-deferral-reconcile.yml'
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/migration/verify-genesis-arcade-deferral.py
      - run: python scripts/validate-doc-genesis-contract-inventory.py
