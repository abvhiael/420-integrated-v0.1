name: Global Level 3 Artifact Preflight
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/verify-level3-artifact-paths.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-evidence-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate evidence output and artifact directory wiring
        run: |
          python3 .github/scripts/verify-level3-artifact-paths.py .github/workflows/liftd-l02-13-level3.yml
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" |
              grep -E '^\.github/workflows/.*\.ya?ml$' |
              while IFS= read -r workflow; do
                python3 .github/scripts/verify-level3-artifact-paths.py "$workflow"
              done
          fi
