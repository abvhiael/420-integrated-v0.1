name: GOV-PRE-04 native rewards and accounting
on:
  pull_request:
    paths:
      - 'consensus/accounting/**'
      - 'consensus/systemcall/**'
      - 'indexer/api/stake.go'
      - 'indexer/api/stake_test.go'
      - '420-indexer/descriptors/stake420-v3.json'
      - '.github/workflows/gov-pre-04-native-rewards.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gov-pre-04-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  go-native-conservation:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Only certified issuance/accounting/Indexer API regressions
        run: |
          go test ./consensus/systemcall ./consensus/accounting ./indexer/api -count=1
