name: GOV-PRE-06 final formatting cleanup
on:
  push:
    branches: ['audit/420governance-gov-pre-06-*']
    paths:
      - '.github/workflows/gov-pre-06-fmt-final.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Format exact new Solidity code and proof test
        run: |
          cd contracts
          forge fmt src/governance/CivicInitialElectorateEnrollment420.sol test-governance-audit-6/GovPre06Electorate420.t.sol
          cd ..
          git add contracts/src/governance/CivicInitialElectorateEnrollment420.sol contracts/test-governance-audit-6/GovPre06Electorate420.t.sol
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(governance): format approved issuer hardening and adversarial tests"
          git fetch origin ${{ github.ref_name }}
          git rebase origin/${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
