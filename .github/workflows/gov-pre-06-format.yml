name: GOV-PRE-06 one-time source formatting
on:
  push:
    branches: ['audit/420governance-gov-pre-06-*']
    paths:
      - '.github/workflows/gov-pre-06-format.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Apply canonical Solidity formatter
        run: |
          cd contracts
          forge fmt src/governance test-governance-audit-6/GovPre06Electorate420.t.sol
          cd ..
          git add contracts/src/governance contracts/test-governance-audit-6/GovPre06Electorate420.t.sol
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(governance): finalize GOV-PRE-06 canonical Solidity formatting"
          git push origin HEAD:${{ github.ref_name }}
