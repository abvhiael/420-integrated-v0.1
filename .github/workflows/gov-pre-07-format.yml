name: GOV-PRE-07 one-time canonical formatting

on:
  push:
    branches:
      - 'audit/420governance-gov-pre-07-*'
    paths:
      - '.github/workflows/gov-pre-07-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Normalize only modified Solidity contracts and tests
        run: |
          cd contracts
          forge fmt src/governance/CivicGovernor420.sol src/governance/FoundingRetirementVerifier420.sol src/treasury/FoundingTreasuryAuthority420.sol src/treasury/FoundingCommunityRetirementSweep420.sol test/FoundingRetirementVerifier420.t.sol test/FoundingCommunityRetirementSweep420.t.sol test/FoundingTreasuryAuthority420.t.sol test/FoundingTreasurySettlement420.t.sol test/GovernanceRec4Lifecycle420.t.sol
          cd ..
          git add contracts/src/governance/CivicGovernor420.sol contracts/src/governance/FoundingRetirementVerifier420.sol contracts/src/treasury/FoundingTreasuryAuthority420.sol contracts/src/treasury/FoundingCommunityRetirementSweep420.sol contracts/test/FoundingRetirementVerifier420.t.sol contracts/test/FoundingCommunityRetirementSweep420.t.sol contracts/test/FoundingTreasuryAuthority420.t.sol contracts/test/FoundingTreasurySettlement420.t.sol contracts/test/GovernanceRec4Lifecycle420.t.sol
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(governance): format GOV-PRE-07 retirement and sweep regressions"
          git fetch origin ${{ github.ref_name }}
          git rebase origin/${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
