name: GOV-PRE-07 transient-context canonical materialization
on:
  push:
    branches: ['audit/420governance-gov-pre-07-*']
    paths:
      - '.github/workflows/gov-pre-07-transient-artifacts.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Format then compile exact canonical source
        working-directory: contracts
        run: |
          forge fmt src/governance/GovernanceTimelock.sol
          forge build src/governance
          forge build src/apps/ProtocolRegistry.sol
      - name: Materialize and verify canonical execution artifacts
        run: python3 scripts/generate-governance-audit-6-artifacts.py --write --check --print
      - name: Preserve only changed source and generated runtime; leave V3 signatures frozen
        run: |
          git add contracts/src/governance/GovernanceTimelock.sol contracts/artifacts/GovernanceTimelock.json contracts/artifacts/Governance420.json contracts/artifacts/CivicConstitution420.json contracts/artifacts/CivicProposalRegistry420.json contracts/artifacts/CivicElectorateRegistry420.json contracts/artifacts/CivicVoting420.json contracts/artifacts/CivicGovernor420.json contracts/artifacts/CivicMerkleElectorateSource420.json contracts/config/predeploy/GovernanceTimelock-predeploy-state.json contracts/config/predeploy/Governance420-predeploy-state.json contracts/config/governance-deployment-v1.json contracts/config/predeploy/predeploy-plan.json contracts/config/deployment-manifest.json
          if git diff --cached --quiet; then echo "Artifacts already matched"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(governance): format and retain transaction-local GOV-PRE-07 execution runtime"
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
