name: 420Governance audit qualification

on:
  push:
    branches:
      - 'audit/420governance-*'
    paths:
      - 'contracts/src/governance/**'
      - 'contracts/config/interfaces/dependency-matrix.json'
      - 'contracts/config/interfaces/governance-dependency-model.json'
      - 'contracts/config/governance-deployment-v1.json'
      - 'contracts/config/genesis-canonical-addresses.json'
      - 'contracts/config/genesis-address-namespace.json'
      - 'contracts/config/predeploy/storage-init.json'
      - 'scripts/verify-governance-audit-1.py'
      - 'scripts/verify-governance-audit-2.py'
      - 'scripts/verify-governance-audit-3.py'
      - 'scripts/verify-governance-audit-4.py'
      - 'scripts/verify-governance-audit-6.py'
      - 'scripts/verify-genesis-interface-layer.py'
      - 'docs/architecture/decisions/GOV-AUDIT-1-AUTHORITY-DEPENDENCY-CANCELLATION.md'
      - 'contracts/test/Civic*.t.sol'
      - 'contracts/test/Governance*.t.sol'
      - '420-indexer/src/abi-manifest.ts'
      - '420-indexer/src/governance-descriptors.ts'
      - '420-indexer/src/lifecycle-reducer.ts'
      - '420-indexer/src/protocol-object-service.ts'
      - '420-indexer/src/protocol-projections.ts'
      - '420-indexer/src/query-service.ts'
      - '420-indexer/src/event-stream.ts'
      - '420-indexer/src/index.ts'
      - '420-indexer/sql/005-genesis-state-views.sql'
      - '420-indexer/descriptors/governance-civic-v1.json'
      - '420-indexer/test/abi-manifest.test.ts'
      - '420-indexer/test/governance-descriptors.test.ts'
      - '420-indexer/test/lifecycle-reducer.test.ts'
      - '420-indexer/test/protocol-projections.test.ts'
      - '420-indexer/test/protocol-object-service.test.ts'
      - '420-indexer/test/query-service.test.ts'
      - '420-indexer/test/event-stream.test.ts'
      - '420-indexer/test/event-subscription.test.ts'
      - 'docs/apps/governance/**'
      - 'docs/audit/420GOVERNANCE-*'
      - '.github/workflows/governance-audit.yml'
  pull_request:
    paths:
      - 'contracts/src/governance/**'
      - 'contracts/config/interfaces/dependency-matrix.json'
      - 'contracts/config/interfaces/governance-dependency-model.json'
      - 'contracts/config/governance-deployment-v1.json'
      - 'contracts/config/genesis-canonical-addresses.json'
      - 'contracts/config/genesis-address-namespace.json'
      - 'contracts/config/predeploy/storage-init.json'
      - 'scripts/verify-governance-audit-1.py'
      - 'scripts/verify-governance-audit-2.py'
      - 'scripts/verify-governance-audit-3.py'
      - 'scripts/verify-governance-audit-4.py'
      - 'scripts/verify-governance-audit-6.py'
      - 'scripts/verify-genesis-interface-layer.py'
      - 'docs/architecture/decisions/GOV-AUDIT-1-AUTHORITY-DEPENDENCY-CANCELLATION.md'
      - 'contracts/test/Civic*.t.sol'
      - 'contracts/test/Governance*.t.sol'
      - '420-indexer/src/abi-manifest.ts'
      - '420-indexer/src/governance-descriptors.ts'
      - '420-indexer/src/lifecycle-reducer.ts'
      - '420-indexer/src/protocol-object-service.ts'
      - '420-indexer/src/protocol-projections.ts'
      - '420-indexer/src/query-service.ts'
      - '420-indexer/src/event-stream.ts'
      - '420-indexer/src/index.ts'
      - '420-indexer/sql/005-genesis-state-views.sql'
      - '420-indexer/descriptors/governance-civic-v1.json'
      - '420-indexer/test/abi-manifest.test.ts'
      - '420-indexer/test/governance-descriptors.test.ts'
      - '420-indexer/test/lifecycle-reducer.test.ts'
      - '420-indexer/test/protocol-projections.test.ts'
      - '420-indexer/test/protocol-object-service.test.ts'
      - '420-indexer/test/query-service.test.ts'
      - '420-indexer/test/event-stream.test.ts'
      - '420-indexer/test/event-subscription.test.ts'
      - 'docs/apps/governance/**'
      - 'docs/audit/420GOVERNANCE-*'
      - '.github/workflows/governance-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'audit/420governance-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOUNDRY_PROFILE: pr

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify Governance audit authority and hardening model
        run: |
          python scripts/verify-governance-audit-1.py
          python scripts/verify-governance-audit-2.py
          python scripts/verify-governance-audit-3.py
          python scripts/verify-governance-audit-6.py
          python scripts/verify-genesis-interface-layer.py

      - name: Check Governance Solidity formatting
        working-directory: contracts
        run: forge fmt --check src/governance test/CivicFoundation420.t.sol test/CivicElectorateRegistry420.t.sol test/CivicVoting420.t.sol test/CivicGovernor420.t.sol test/CivicTimelockExecution420.t.sol test/Governance420Retirement.t.sol test/GovernanceAudit420.t.sol test/GovernanceAudit2Hardening420.t.sol test/GovernanceAudit3Adversarial420.t.sol test/GovernanceAudit6Deployment420.t.sol

      - name: Build canonical Governance contracts
        working-directory: contracts
        run: forge build src/governance

      - name: Verify GOV-AUDIT-4 exact Civic artifacts and Indexer contract
        run: python scripts/verify-governance-audit-4.py

      - name: GOV-AUDIT-6 deterministic deployment simulation
        working-directory: contracts
        run: forge test --match-path test/GovernanceAudit6Deployment420.t.sol -vvv

      - name: Run Civic contract qualification
        working-directory: contracts
        run: |
          forge test --match-path 'test/Civic*.t.sol' -vvv
          forge test --match-path 'test/Governance*.t.sol' -vvv

      - name: Governance forbidden primitive scan
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '\btx\.origin\b|\bselfdestruct\s*\(|\.delegatecall\s*\(' src/governance; then
            echo 'Forbidden authority/opcode primitive found in Governance sources' >&2
            exit 1
          fi

      - name: Build and test Governance Indexer mappings
        working-directory: 420-indexer
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run build
          node --test --test-concurrency=1 \
            dist/test/abi-manifest.test.js \
            dist/test/governance-descriptors.test.js \
            dist/test/lifecycle-reducer.test.js \
            dist/test/protocol-projections.test.js \
            dist/test/protocol-object-service.test.js \
            dist/test/query-service.test.js \
            dist/test/event-stream.test.js \
            dist/test/event-subscription.test.js