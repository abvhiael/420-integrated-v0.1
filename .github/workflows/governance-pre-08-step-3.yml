name: GOV-PRE-08 Step 3 unsigned V4 materialization and local recovery

on:
  pull_request:
    paths:
      - 'scripts/gov-pre-08/**'
      - 'contracts/config/candidates/genesis-config-commitment-v4-unsigned.json'
      - 'contracts/src/governance/Founding*.sol'
      - 'contracts/src/treasury/**'
      - 'contracts/src/revenue/**'
      - 'contracts/src/vault/**'
      - '.github/workflows/governance-pre-08-step-3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gov-pre-08-step3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Reuse the actual node420 release gate at this identical git HEAD: pinned
  # patched Geth, authenticated Engine JWT, native RewardController settlement,
  # consensus certified-settlement, TLS-backed protected signer and recovery.
  # Its fixture evidence is NOT approval of the independent V4 ceremony.
  authenticated-node420-settlement:
    uses: ./.github/workflows/node420-release-gate.yml

  # The third job does not replay independent simulations. It imports the
  # actually funded local contract state into patched Geth and observes an
  # authenticated BLS-certified 420 block through real indexer/Explorer APIs.
  unified-native-application-chain:
    needs: [materialize-replay-recover, authenticated-node420-settlement]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      INDEXER_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 420-indexer/package-lock.json
      - name: Build real PostgreSQL Indexer for the single certified chain
        run: |
          (cd 420-indexer && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
      - name: Download exact-head funded local V4-shaped contract state
        uses: actions/download-artifact@v4
        with:
          name: govpre08-step3-unsigned-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/govpre08-source
      - name: Download already-qualified patched native binaries (no second Geth rebuild)
        uses: actions/download-artifact@v4
        with:
          name: govpre08-native-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Prove signed source head and binary SHA before execution
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          sha256sum -c artifacts/node420-release-gate/unified-local-executables.sha256
          chmod +x bin/node420 bin/upstream/geth-v1.17.5-420 bin/fourtwentyd bin/settlement-fixture bin/indexer420
          go test ./indexer/rpc -run 'TestBundle(HashOnlyCanonicalLookup|RejectsMalformedHashOnlyTransaction)' -count=1
          go build -o bin/explorer420 ./explorer/cmd/explorer420
      - name: Certify one actual node420 execution ledger across founder/Treasury/Registry/Stake/consensus/Indexer/Explorer
        run: |
          python3 scripts/gov-pre-08/qualify-unified-local-node420.py \
            --genesis "$RUNNER_TEMP/govpre08-source/govpre08-step3-unified-local-node420-genesis.json" \
            --graph "$RUNNER_TEMP/govpre08-source/govpre08-step3-graph-a.json" \
            --bindings "$RUNNER_TEMP/govpre08-source/govpre08-step3-native-bindings-a.json" \
            --workdir "$RUNNER_TEMP/govpre08-unified-chain-420" \
            --output "$RUNNER_TEMP/govpre08-unified-local-report.json"
      - name: Retain exact-head authentic local-chain receipts, native logs and service checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govpre08-unified-local-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/govpre08-unified-local-report.json
            ${{ runner.temp }}/govpre08-unified-chain-420/*.json
            ${{ runner.temp }}/govpre08-unified-chain-420/*.log
            ${{ runner.temp }}/govpre08-unified-chain-420/consensus/*.json

  materialize-replay-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOUNDRY_PROFILE: pr
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      INDEXER_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 420-indexer/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Materialize canonical unsigned V4 and prove local cold-start, replay and recovery
        run: bash scripts/gov-pre-08/qualify-step3.sh
      - name: Retain exact-head unsigned source and local receipt/state witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govpre08-step3-unsigned-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/govpre08-step3-v4-a/
            ${{ runner.temp }}/govpre08-step3-genesis.json
            ${{ runner.temp }}/govpre08-step3-genesis-source.json
            ${{ runner.temp }}/govpre08-step3-imports.json
            ${{ runner.temp }}/govpre08-step3-foundry-*.log
            ${{ runner.temp }}/govpre08-step3-state-*.json
            ${{ runner.temp }}/govpre08-step3-native-bindings-*.json
            ${{ runner.temp }}/govpre08-step3-unified-local-node420-*.json
            ${{ runner.temp }}/govpre08-step3-funding-*.json
            ${{ runner.temp }}/govpre08-step3-graph-*.json
            ${{ runner.temp }}/govpre08-step3-indexer-*.json
            ${{ runner.temp }}/govpre08-step3-descriptors-*.json
            ${{ runner.temp }}/govpre08-step3-postgres-*.json
            ${{ runner.temp }}/govpre08-step3-wallet-*.json
            ${{ runner.temp }}/govpre08-step3-explorer-*.json
            ${{ runner.temp }}/govpre08-step3-explorer-*.log
            ${{ runner.temp }}/govpre08-step3-explorer-html-*.html
            ${{ runner.temp }}/govpre08-step3-bridge-*.log
            ${{ runner.temp }}/govpre08-consensus/
            ${{ runner.temp }}/govpre08-step3-local-*.json
            ${{ runner.temp }}/govpre08-step3-recovery-*.json
            ${{ runner.temp }}/govpre08-step3-node-*.log
            ${{ runner.temp }}/govpre08-step3-restarted-*.log
