name: 420Governance GOV-REC-5 Wallet and Ecosystem Requalification

on:
  push:
    branches:
      - 'audit/420governance-rec-5-*'
    paths:
      - 'wallet/web/core/governance-management.js'
      - 'wallet/web/governance-management-ui.js'
      - 'wallet/web/test/governance-management*.test.js'
      - '420-indexer/**'
      - 'contracts/config/interfaces/governance-cross-protocol-integration.json'
      - 'scripts/verify-governance-audit-7.py'
      - '.github/workflows/governance-rec-5.yml'
  pull_request:
    paths:
      - 'wallet/web/core/governance-management.js'
      - 'wallet/web/governance-management-ui.js'
      - 'wallet/web/test/governance-management*.test.js'
      - '420-indexer/**'
      - '.github/workflows/governance-rec-5.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-rec-5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ecosystem:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'audit/420governance-rec-5-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Rebuild canonical Governance ABI and reconcile Indexer event descriptors
        run: |
          (cd contracts && forge build src/governance)
          python3 scripts/verify-governance-audit-4.py
          python3 scripts/verify-governance-audit-6.py --require-ready
      - name: Verify Registry, Stake, Treasury, Vault and derived-consumer authority boundaries
        run: python3 scripts/verify-governance-audit-7.py
      - name: Governance Indexer ABI, lifecycle, replay, reorg, subscriptions and projections
        working-directory: 420-indexer
        run: |
          npm install
          npm run build
          node --test --test-concurrency=1 \
            dist/test/abi-manifest.test.js \
            dist/test/governance-descriptors.test.js \
            dist/test/lifecycle-reducer.test.js \
            dist/test/protocol-projections.test.js \
            dist/test/protocol-object-service.test.js \
            dist/test/query-service.test.js \
            dist/test/event-stream.test.js \
            dist/test/event-subscription.test.js
