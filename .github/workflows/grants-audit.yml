name: 420Grants Audit Qualification

on:
  pull_request:
    paths:
      - "contracts/src/grants/**"
      - "contracts/test/GrantsGenesis420.t.sol"
      - "contracts/config/420grants-genesis.json"
      - "docs/audit/420GRANTS-*"
      - "scripts/verify-grants-audit.py"
      - ".github/workflows/grants-audit.yml"
  workflow_dispatch:

concurrency:
  group: grants-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  grants-contract-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify Grants audit model
        run: python3 scripts/verify-grants-audit.py

      - name: Check Grants Solidity formatting
        working-directory: contracts
        run: forge fmt --check src/grants/GrantProgramRegistry420.sol src/grants/GrantApplicationRegistry420.sol src/grants/GrantAwardRegistry420.sol src/grants/GrantMilestoneRegistry420.sol test/GrantsGenesis420.t.sol

      - name: Build Grants contract family
        working-directory: contracts
        run: forge build src/grants --sizes

      - name: Run Grants lifecycle and adversarial regressions
        working-directory: contracts
        run: forge test --match-path 'test/GrantsGenesis420.t.sol' -vvv

  grants-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Reject dangerous Grants primitives
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '\b(delegatecall|selfdestruct|tx\.origin)\b' contracts/src/grants; then
            echo "Forbidden authority/opcode primitive found in 420Grants." >&2
            exit 1
          fi

      - name: Re-run Grants tests under hardening profile
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: hardening
        run: forge test --match-path 'test/GrantsGenesis420.t.sol' -vvv

      - name: Install Slither for Grants security qualification
        run: python -m pip install --disable-pip-version-check slither-analyzer

      - name: Targeted Grants Slither high-severity gate
        working-directory: contracts
        shell: bash
        run: |
          cat > GrantsAuditSlitherTarget.sol <<'SOL'
          // SPDX-License-Identifier: GPL-3.0
          pragma solidity ^0.8.24;
          import "./src/grants/GrantIds420.sol";
          import "./src/grants/GrantAuthorization420.sol";
          import "./src/grants/GrantProgramRegistry420.sol";
          import "./src/grants/GrantApplicationRegistry420.sol";
          import "./src/grants/GrantAwardRegistry420.sol";
          import "./src/grants/GrantMilestoneRegistry420.sol";
          import "./src/grants/GrantRouter420.sol";
          SOL
          set +e
          slither GrantsAuditSlitherTarget.sol --json /tmp/grants-slither.json >/tmp/grants-slither.txt 2>&1
          STATUS=$?
          set -e
          rm -f GrantsAuditSlitherTarget.sol
          python - <<'PY'
          import json
          import pathlib

          report_path = pathlib.Path("/tmp/grants-slither.json")
          log_path = pathlib.Path("/tmp/grants-slither.txt")
          if not report_path.exists():
              print(log_path.read_text(errors="replace"))
              raise SystemExit("Slither did not produce JSON output")

          report = json.loads(report_path.read_text())
          if report.get("success") is not True:
              print(log_path.read_text(errors="replace"))
              raise SystemExit(f"Slither analysis failed: {report.get('error') or 'unknown error'}")

          findings = []
          high = []
          for detector in report.get("results", {}).get("detectors", []):
              grant_elements = [
                  element for element in detector.get("elements", [])
                  if element.get("source_mapping", {}).get("filename_relative", "").startswith("src/grants/")
              ]
              if not grant_elements:
                  continue
              item = {
                  "check": detector.get("check"),
                  "impact": detector.get("impact"),
                  "confidence": detector.get("confidence"),
                  "description": detector.get("description", "").splitlines()[0],
              }
              findings.append(item)
              if detector.get("impact") == "High":
                  high.append(item)

          print(json.dumps({"grantsFindings": findings, "highSeverity": high}, indent=2))
          if high:
              raise SystemExit("High-severity Slither finding in Grants source")
          PY
