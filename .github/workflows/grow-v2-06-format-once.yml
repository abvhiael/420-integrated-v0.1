name: 420Grow V2-06 temporary Go formatting
on:
  push:
    branches: [audit/420grow-v2-01-product-decision-20261008]
    paths: [.github/workflows/grow-v2-06-format-once.yml]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/420grow-v2-01-product-decision-20261008
          persist-credentials: true
      - name: Format telemetry source
        run: |
          gofmt -w grow/telemetry/*.go
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grow/telemetry
          if ! git diff --cached --quiet; then
            git commit -m "style(grow): format V2-06 telemetry sources"
            git push origin HEAD:audit/420grow-v2-01-product-decision-20261008
          fi
