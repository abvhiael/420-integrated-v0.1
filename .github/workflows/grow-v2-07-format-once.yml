name: Grow V2-07 one-time formatter
on:
  push:
    branches: [audit/420grow-v2-01-product-decision-20261008]
    paths: [.github/workflows/grow-v2-07-format-once.yml]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/420grow-v2-01-product-decision-20261008
          persist-credentials: true
      - name: Format V2-07 equipment Go files
        run: |
          gofmt -w grow/equipment/*.go
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grow/equipment
          if ! git diff --cached --quiet; then
            git commit -m "style(grow): gofmt equipment safety Go files"
            git push origin HEAD:audit/420grow-v2-01-product-decision-20261008
          fi
