name: 420Grow V2 one-time Go formatter
on:
  push:
    branches:
      - audit/420grow-v2-01-product-decision-20261008
    paths:
      - .github/workflows/grow-v2-format-once.yml
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/420grow-v2-01-product-decision-20261008
          persist-credentials: true
      - name: Format changed Grow Go sources on audit branch
        run: |
          gofmt -w grow/facility/service.go grow/facility/postgres.go grow/facility/service_test.go
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grow/facility/service.go grow/facility/postgres.go grow/facility/service_test.go
          if ! git diff --cached --quiet; then
            git commit -m "style(grow): gofmt V2-04 facility Go sources"
            git push origin HEAD:audit/420grow-v2-01-product-decision-20261008
          fi
