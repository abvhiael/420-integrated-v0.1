name: Temporary Grow Inventory gofmt
on:
  push:
    branches:
      - audit/420grow-v2-01-product-decision-20261008
    paths:
      - '.github/workflows/grow-v2-format-once.yml'
      - 'grow/inventory/**'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/420grow-v2-01-product-decision-20261008
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Strict formatter repair only
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w grow/inventory/*.go
          if ! git diff --quiet -- grow/inventory; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add grow/inventory/*.go
            git commit -m "style(grow): apply gofmt to inventory implementation and tests"
            git push origin HEAD:audit/420grow-v2-01-product-decision-20261008
          fi
