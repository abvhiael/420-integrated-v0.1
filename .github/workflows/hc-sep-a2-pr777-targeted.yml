name: HC-SEP-A2 PR777 targeted seed rollback
on:
  push:
    paths:
      - '.github/workflows/hc-sep-a2-pr777-targeted.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Exact PR777 regression only
        working-directory: contracts
        run: forge test --match-path 'test/highcountry/integration/PlantSourceConsumption.t.sol' --match-test testPublicSeedAdmissionFailureRetainsAllocationConsentAndAllowsRetry -vv
