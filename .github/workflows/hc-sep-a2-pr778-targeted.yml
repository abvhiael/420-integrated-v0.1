name: HC-SEP-A2 PR778 targeted phenotype provenance
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hc-sep-a2-pr778-targeted.yml'
permissions:
  contents: read
jobs:
  exact-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Exact PR778 regression only
        working-directory: contracts
        run: forge test --match-path 'test/highcountry/integration/PhenotypeProvenance.t.sol' --match-test testCultivationRegisteredIdentityOfflineCatchupAndBoundedExpression -vv
