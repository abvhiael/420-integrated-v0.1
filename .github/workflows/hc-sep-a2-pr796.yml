name: HC-SEP-A2 PR796 authenticated economy isolated
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hc-sep-a2-pr796.yml'
permissions:
  contents: read
jobs:
  focused-economy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: highcountry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install economy service dependencies
        working-directory: services/highcountry-economy
        run: npm ci --ignore-scripts
      - name: PR796 affected unit and canonical settlement tests
        working-directory: services/highcountry-economy
        run: node --test test/authenticated-service.test.js test/canonical-settlement.test.js test/postgres-store.test.js test/runtime-integration.test.js
      - name: PR796 live PostgreSQL conservation and concurrency tests
        working-directory: services/highcountry-economy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/highcountry
          HC_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/highcountry
        run: node --test test/postgres-live.integration.mjs
