name: HC-SEP-A2 PR843 textile catalogue isolated
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hc-sep-a2-pr843.yml'
permissions:
  contents: read
jobs:
  textile-marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Affected textile and marketplace syntax
        run: |
          node --check apps/highcountry-web/src/textile-catalogue.js
          node --check apps/highcountry-web/src/marketplace.js
      - name: PR843 textile and affected marketplace regression
        run: node --test apps/highcountry-web/test/textile-catalogue.test.js apps/highcountry-web/test/hc-next-4-4-marketplace.test.mjs
      - name: Affected HighCountry static web build
        working-directory: apps/highcountry-web
        run: node scripts/build.mjs
