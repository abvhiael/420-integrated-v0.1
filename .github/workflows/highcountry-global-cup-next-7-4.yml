name: High Country HC-NEXT-7.4 Cup Projection Level 1
on:
  pull_request:
    paths:
      - 'services/420-gaming-player-profile/src/highcountry-global-cup.js'
      - 'services/420-gaming-player-profile/test/highcountry-global-cup.test.js'
      - 'services/420-gaming-player-profile/src/highcountry-cup-*.js'
      - 'services/420-gaming-player-profile/test/highcountry-cup-*.test.js'
      - 'services/420-gaming-player-profile/src/highcountry-cloud-http.js'
      - 'services/420-gaming-player-profile/migrations/011_highcountry_cup_achievements.up.sql'
      - 'services/420-gaming-player-profile/test/highcountry-cup-postgres.integration.mjs'
      - 'apps/highcountry-web/src/cloud.js'
      - 'apps/highcountry-web/src/account.js'
      - '.github/workflows/highcountry-global-cup-next-7-4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cup-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: hc_cup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hc_cup_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HIGHCOUNTRY_CUP_POSTGRES_TEST_URL: postgresql://postgres:test-only@127.0.0.1:5432/hc_cup_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Confirm exact implementation SHA
        env:
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install service dependencies
        working-directory: services/420-gaming-player-profile
        run: npm ci --ignore-scripts
      - name: Test strict finalized Cup projection and adversarial cases
        working-directory: services/420-gaming-player-profile
        run: |
          node --test test/highcountry-global-cup.test.js test/highcountry-cup-integration.test.js
          node --test test/highcountry-cup-postgres.integration.mjs
