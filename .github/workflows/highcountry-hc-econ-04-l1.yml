name: HighCountry HC-ECON-04 Creator Studio Level 1
on:
  pull_request:
    paths:
      - 'services/highcountry-economy/src/creator-studio.js'
      - 'services/highcountry-economy/test/creator-studio.test.js'
      - 'services/highcountry-economy/src/postgres-store.js'
      - 'services/highcountry-economy/test/postgres-store.test.js'
      - '.github/workflows/highcountry-hc-econ-04-l1.yml'
permissions:
  contents: read
jobs:
  creator-studio-level1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HC-ECON-04 and changed serialization
        run: node --test services/highcountry-economy/test/creator-studio.test.js services/highcountry-economy/test/postgres-store.test.js
      - name: Verify exact candidate SHA
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
