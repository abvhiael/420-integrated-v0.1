name: HighCountry HC-ECON-05 Reviewer Certification Level 1
on:
  pull_request:
    paths:
      - 'services/highcountry-economy/src/reviewer-certification.js'
      - 'services/highcountry-economy/test/reviewer-certification.test.js'
      - 'services/highcountry-economy/src/item-issuance.js'
      - 'services/highcountry-economy/test/item-issuance.test.js'
      - 'services/highcountry-economy/src/postgres-store.js'
      - '.github/workflows/highcountry-hc-econ-05-l1.yml'
permissions:
  contents: read
jobs:
  reviewer-certification-level1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test signed reviewer authority and issuance integration
        run: node --test services/highcountry-economy/test/reviewer-certification.test.js services/highcountry-economy/test/item-issuance.test.js services/highcountry-economy/test/postgres-store.test.js
      - name: Verify exact candidate SHA
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
