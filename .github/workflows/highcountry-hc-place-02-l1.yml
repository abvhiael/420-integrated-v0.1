name: HighCountry HC-PLACE-02 Model Level 1
on:
  pull_request:
    paths:
      - 'services/highcountry-economy/src/placement-contract.js'
      - 'services/highcountry-economy/test/placement-contract.test.mjs'
      - '.github/workflows/highcountry-hc-place-02-l1.yml'
      - 'docs/highcountry/HC-PLACE-02-*'
  workflow_dispatch:
jobs:
  placement-model-l1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate typed record and geometry contracts
        run: node --test services/highcountry-economy/test/placement-contract.test.mjs
