name: HighCountry HC-PLACE-03-B1 Custody Level 1
on:
  pull_request:
    paths:
      - 'services/highcountry-economy/src/custody-records.js'
      - 'services/highcountry-economy/src/postgres-store.js'
      - 'services/highcountry-economy/test/custody-records.test.mjs'
      - '.github/workflows/highcountry-hc-place-03b1-l1.yml'
      - 'docs/highcountry/HC-PLACE-03-B1-*'
  workflow_dispatch:
jobs:
  custody-l1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic custody and adversarial invariants
        run: node --test services/highcountry-economy/test/custody-records.test.mjs
