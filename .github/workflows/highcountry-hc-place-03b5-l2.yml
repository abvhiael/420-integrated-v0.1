name: HighCountry HC-PLACE-03-B5 PostgreSQL Cross-Module Level 2
on:
  pull_request:
    paths:
      - 'services/highcountry-economy/src/placement-transactions.js'
      - 'services/highcountry-economy/src/custody-records.js'
      - 'services/highcountry-economy/src/market.js'
      - 'services/highcountry-economy/src/postgres-store.js'
      - 'services/highcountry-economy/test/placement-market-postgres.test.mjs'
      - '.github/workflows/highcountry-hc-place-03b5-l2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-module-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: highcountry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      HC_PLACE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/highcountry_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bounded economy dependencies
        working-directory: services/highcountry-economy
        run: npm install --ignore-scripts --no-package-lock --no-save
      - name: Create isolated database table
        run: psql "$HC_PLACE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE TABLE highcountry_buds_state (namespace text PRIMARY KEY, state jsonb NOT NULL)'
      - name: PostgreSQL cross-module custody, replay, concurrency and restart
        run: node --test services/highcountry-economy/test/placement-market-postgres.test.mjs
