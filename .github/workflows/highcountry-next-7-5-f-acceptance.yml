name: High Country HC-NEXT-7.5-F Authoritative Player Journey Acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/highcountry-next-7-5-f-acceptance.yml'
      - 'scripts/highcountry/hc-next-7-5-f-acceptance.sh'
      - 'services/420-gaming-player-profile/test/highcountry-cup-anvil.integration.mjs'
      - 'services/420-gaming-player-profile/test/highcountry-ordinary-postgres.integration.mjs'
      - 'contracts/test/highcountry/integration/R04CanonicalCompetition.t.sol'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authoritative-player-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: hc_cup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hc_cup_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HIGHCOUNTRY_CUP_POSTGRES_TEST_URL: postgresql://postgres:test-only@127.0.0.1:5432/hc_cup_ci
      HIGHCOUNTRY_EXHIBITIONS_POSTGRES_TEST_URL: postgresql://postgres:test-only@127.0.0.1:5432/hc_exhibition_ci
      FOUNDRY_SRC: src/highcountry
      FOUNDRY_TEST: test/highcountry
      FOUNDRY_SCRIPT: script/highcountry
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact implementation SHA
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scoped application dependencies
        working-directory: services/420-gaming-player-profile
        run: npm ci --ignore-scripts
      - name: Combined actual EVM, canonical harvest, issuer account, HTTP, PostgreSQL and recovery acceptance
        run: bash scripts/highcountry/hc-next-7-5-f-acceptance.sh
