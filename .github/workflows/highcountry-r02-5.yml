name: High Country R02.5 Targeted Qualification
on:
  pull_request:
    paths:
      - 'contracts/src/highcountry/**'
      - 'contracts/test/highcountry/**'
      - 'docs/highcountry/qualification/R02.5-level1.json'
      - 'docs/highcountry/R02.5-MOTHER-CLONE-CONSUMPTION.md'
      - 'docs/highcountry/DEPLOYMENT-AND-TRUST.md'
      - 'scripts/highcountry/verify-r01.py'
      - '.github/workflows/highcountry-r02-5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r02-5:
    if: github.head_ref != 'qualification/highcountry-r04-level3-main-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOUNDRY_SRC: src/highcountry
      FOUNDRY_TEST: test/highcountry
      FOUNDRY_SCRIPT: script/highcountry
      FOUNDRY_FUZZ_RUNS: 256
      FOUNDRY_INVARIANT_RUNS: 128
      FOUNDRY_INVARIANT_DEPTH: 64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Pin tested source
        shell: bash
        run: |
          echo "implementationSha=$(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          git status --porcelain
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Contract build and sizes
        working-directory: contracts
        run: forge build src/highcountry --sizes
      - name: Format
        working-directory: contracts
        run: forge fmt --check src/highcountry test/highcountry
      - name: Security lint
        working-directory: contracts
        run: forge lint src/highcountry --severity high med low
      - name: Mother cutting/clone issuance provenance and rollback
        working-directory: contracts
        run: forge test --match-path 'test/highcountry/integration/MotherCloneConsumption.t.sol' -vv
      - name: Affected High Country suites and invariants
        working-directory: contracts
        run: forge test --match-path 'test/highcountry/**/*.t.sol' -vv
      - name: High Country source/specification catalogue
        run: python3 scripts/highcountry/verify-r01.py
      - name: Verify ABI artifacts and source semantics
        working-directory: contracts
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          out=pathlib.Path('out')
          def abi(name):
              p=list(out.glob('**/'+name+'.json'))
              assert len(p)==1, (name,[str(x) for x in p])
              return json.loads(p[0].read_text())['abi']
          def entry(xs,kind,name=None):
              z=[x for x in xs if x['type']==kind and (name is None or x.get('name')==name)]
              assert len(z)==1,(kind,name)
              return z[0]
          def types(x,k):return [i['type'] for i in x.get(k,[])]
          plant=abi('PlantRegistry');seed=abi('SeedRegistry');clone=abi('CloneRegistry');consumer=abi('IPlantSourceConsumer')
          assert types(entry(plant,'constructor'),'inputs')==['address']*6
          assert types(entry(plant,'function','registerPlantFromSource'),'inputs')==['uint64','bytes32','address','uint64','uint64','uint8','uint64']
          for old in ('registerPlant','registerPublicPlant'):
              assert types(entry(plant,'function',old),'inputs')==['uint64','bytes32','address','uint64']
          for x in consumer:
              if x['type']=='function':
                  y=entry(plant,'function',x['name'])
                  assert types(x,'inputs')==types(y,'inputs') and types(x,'outputs')==types(y,'outputs')
          for registry in (seed,clone):
              for name,n in [('approvePlant',4),('revokePlantApproval',2),('consumeForPlant',2)]:
                  assert types(entry(registry,'function',name),'inputs')==['uint64']*n
              assert types(entry(registry,'function','bindPlantRegistry'),'inputs')==['address']
          for n in ('SeedConsumed','SeedLotRegistered'):entry(seed,'event',n)
          for n in ('CloneConsumed','CloneRegistered'):entry(clone,'event',n)
          entry(plant,'event','PlantSourceConsumed')
          mother=abi('MotherRegistry')
          assert types(entry(mother,'function','bindCloneRegistry'),'inputs')==['address']
          assert types(entry(mother,'function','consumeForClone'),'inputs')==['uint64','uint64']
          assert types(entry(clone,'function','cloneContext'),'outputs')==['uint64','bytes32','address']
          entry(mother,'event','CloneCuttingConsumed')
          print('R02.5 ABI checks PASS')
          PY
      - name: Upload targeted qualification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highcountry-r02-5-${{ github.run_id }}
          path: |
            contracts/out/highcountry/**
          retention-days: 14


  r05-level3-format-once:
    if: github.event_name == 'pull_request' && github.head_ref == 'qualification/highcountry-r05-level3-main-20261014'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qualification/highcountry-r05-level3-main-20261014
          persist-credentials: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Format only High Country Solidity
        working-directory: contracts
        run: |
          forge fmt src/highcountry test/highcountry
          forge fmt --check src/highcountry test/highcountry
      - name: Assert scope and push formatter only
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only > /tmp/highcountry-format-files
          if grep -Ev '^contracts/(src|test)/highcountry/.*\\.sol$' /tmp/highcountry-format-files; then
            echo 'Formatter changed a file outside High Country Solidity' >&2
            exit 1
          fi
          if [ -s /tmp/highcountry-format-files ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add contracts/src/highcountry contracts/test/highcountry
            git commit -m 'style(highcountry): apply forge fmt to R05 Level 3 candidate [skip ci]'
            git push origin HEAD:qualification/highcountry-r05-level3-main-20261014
          fi
