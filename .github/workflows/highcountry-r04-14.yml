name: High Country R04.14 Level 1 Qualification
on:
  pull_request:
    paths:
      - 'contracts/src/highcountry/upgrades/UpgradeCoordinator.sol'
      - 'contracts/src/highcountry/security/SecurityCouncilController.sol'
      - 'contracts/test/highcountry/unit/security/R0414Authority.t.sol'
      - '.github/workflows/highcountry-r04-14.yml'
      - 'docs/highcountry/R04.14-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FOUNDRY_SRC: src/highcountry
      FOUNDRY_TEST: test/highcountry
      FOUNDRY_SCRIPT: script/highcountry
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact implementation SHA
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Affected build and bytecode limits
        working-directory: contracts
        run: forge build src/highcountry --sizes
      - name: Upgrade and emergency formatting
        working-directory: contracts
        run: forge fmt --check src/highcountry/upgrades/UpgradeCoordinator.sol src/highcountry/security/SecurityCouncilController.sol test/highcountry/unit/security/R0414Authority.t.sol
      - name: Upgrade and emergency security lint
        working-directory: contracts
        run: forge lint src/highcountry/upgrades/UpgradeCoordinator.sol src/highcountry/security/SecurityCouncilController.sol --severity high med low
      - name: Upgrade and emergency authority adversarial suite
        working-directory: contracts
        run: forge test --match-path 'test/highcountry/unit/security/R0414Authority.t.sol' -vv
      - name: Canonical High Country verifier
        run: python3 scripts/highcountry/verify-r01.py
