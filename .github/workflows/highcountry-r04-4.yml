name: High Country R04.4 Level 1 Qualification
on:
  pull_request:
    paths:
      - 'contracts/src/highcountry/equipment/**'
      - 'contracts/test/highcountry/unit/equipment/**'
      - '.github/workflows/highcountry-r04-4.yml'
      - 'docs/highcountry/R04.4-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r04-4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOUNDRY_SRC: src/highcountry
      FOUNDRY_TEST: test/highcountry
      FOUNDRY_SCRIPT: script/highcountry
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact implementation SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build and production sizes
        working-directory: contracts
        run: forge build src/highcountry --sizes
      - name: Format
        working-directory: contracts
        run: forge fmt --check src/highcountry/equipment test/highcountry/unit/equipment
      - name: Security lint
        working-directory: contracts
        run: forge lint src/highcountry/equipment --severity high med low
      - name: Lifecycle and equipment adversarial regressions
        working-directory: contracts
        run: forge test --match-path 'test/highcountry/unit/equipment/*.t.sol' -vv
      - name: Retained R04.1 and R04.3 accounting regressions
        working-directory: contracts
        run: |
          forge test --match-path 'test/highcountry/unit/inventory/*.t.sol' -vv
          forge test --match-path 'test/highcountry/unit/manufacturing/*.t.sol' -vv
      - name: Lifecycle ABI
        working-directory: contracts
        run: |
          python3 - <<'PY'
          import json,pathlib
          for name,expected in {
            'EquipmentLifecycleEngine':{'registerPolicy','recordUse','repair','retire','recycle','condition','policy'},
            'EquipmentRegistry':{'bindLifecycleController','setLifecycleDisabled','retireEquipment','effectiveEffects'}
          }.items():
            a=list(pathlib.Path('out').glob('**/'+name+'.json'))
            assert len(a)==1,a
            names={x['name'] for x in json.loads(a[0].read_text())['abi'] if x['type']=='function'}
            assert expected<=names,(name,expected-names)
          PY
      - name: Canonical High Country verifier
        run: python3 scripts/highcountry/verify-r01.py
