name: High Country R04 Level 2 App Integration
on:
  pull_request:
    paths:
      - '.github/workflows/highcountry-r04-level2.yml'
      - 'contracts/src/highcountry/**'
      - 'contracts/test/highcountry/**'
      - 'services/highcountry-economy/**'
      - 'scripts/highcountry/**'
      - 'docs/highcountry/R04-LEVEL2-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retained-app:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      FOUNDRY_SRC: src/highcountry
      FOUNDRY_TEST: test/highcountry
      FOUNDRY_SCRIPT: script/highcountry
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact candidate SHA
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: High Country app build and sizes
        working-directory: contracts
        run: forge build src/highcountry --sizes
      - name: Retained R04 integration and adversarial coverage
        working-directory: contracts
        run: forge test --match-path 'test/highcountry/**/*.t.sol' -vvv
      - name: Canonical High Country verifier
        run: python3 scripts/highcountry/verify-r01.py

  economy-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact implementation SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retained economic runtime security and settlement regressions
        working-directory: services/highcountry-economy
        run: npm test

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: hc_ci_only
          POSTGRES_DB: hc_economy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hc_economy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact implementation SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned PostgreSQL runtime driver
        working-directory: services/highcountry-economy
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Actual SERIALIZABLE contention, replay, persistence and settlement
        working-directory: services/highcountry-economy
        env:
          HC_TEST_POSTGRES_URL: postgresql://postgres:hc_ci_only@127.0.0.1:5432/hc_economy
        run: node test/postgres-live.integration.mjs


  runtime-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FOUNDRY_SRC: src/highcountry
      FOUNDRY_TEST: test/highcountry
      FOUNDRY_SCRIPT: script/highcountry
      FOUNDRY_EVM_VERSION: cancun
      FOUNDRY_DYNAMIC_TEST_LINKING: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: hc_ci_only
          POSTGRES_DB: hc_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hc_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact implementation SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build disposable real-contract runtime fixture
        working-directory: contracts
        run: forge build --no-dynamic-test-linking --evm-version cancun test/highcountry/integration/R04RuntimeDeployment.sol
      - name: Install pinned PostgreSQL runtime driver
        working-directory: services/highcountry-economy
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Actual local-chain PostgreSQL authenticated HTTP and worker integration
        env:
          HC_TEST_POSTGRES_URL: postgresql://postgres:hc_ci_only@127.0.0.1:5432/hc_runtime
          HC_TEST_RPC_URL: http://127.0.0.1:8545
        run: |
          anvil --network ethereum --chain-id 420 --port 8545 --hardfork cancun --code-size-limit 600000 --gas-limit 200000000 > "$RUNNER_TEMP/hc-anvil.log" 2>&1 &
          HC_ANVIL_PID=$!
          trap 'kill "$HC_ANVIL_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          if ! cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then
            cat "$RUNNER_TEMP/hc-anvil.log"
            exit 1
          fi
          node services/highcountry-economy/test/runtime-canonical.integration.mjs

  security-client-config:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'qualification/highcountry-r04-level3-main-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FOUNDRY_SRC: src/highcountry
      FOUNDRY_TEST: test/highcountry
      FOUNDRY_SCRIPT: script/highcountry
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate and reconciled main ancestry
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git merge-base --is-ancestor 959288c8bd33b6da0325b6a5d060e00e7bcf0e48 HEAD
          git merge-base --is-ancestor 1cd1a94eec5783e8cd59f3671efbc99d13c0560a HEAD
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: High Country formatting
        working-directory: contracts
        run: forge fmt --check src/highcountry test/highcountry
      - name: High Country static security lint
        working-directory: contracts
        run: forge lint src/highcountry --severity high med low
      - name: Retained client SDK and shared service security acceptance
        run: |
          node --test clients/highcountry-access-v1/test/*.test.js packages/420-gaming-sdk/test/*.test.js packages/420-gaming-client-hardening/test/*.test.js packages/420-gaming-cross-game-qualification/test/*.test.js services/420-gaming-player-profile/test/*.test.js services/420-gaming-query/test/*.test.js
      - name: Validate deployment configuration template
        run: node scripts/gaming/verify-runtime-manifest.mjs deployments/gaming/testnet.runtime.json
      - name: Syntax check economic runtime and tests
        run: |
          for file in services/highcountry-economy/src/*.js services/highcountry-economy/test/*.js services/highcountry-economy/test/*.mjs; do
            node --check "$file"
          done
      - name: Whitespace and clean source checkout
        run: |
          git diff --check 959288c8bd33b6da0325b6a5d060e00e7bcf0e48 HEAD
          test -z "$(git status --porcelain)"
