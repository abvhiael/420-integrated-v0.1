name: High Country R05.2 Level 1 Authenticated Wallet Linking
on:
  pull_request:
    paths:
      - 'services/420-gaming-player-profile/**'
      - '.github/workflows/highcountry-r05-2.yml'
      - 'docs/highcountry/R05.2-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authenticated-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: hc_ci_only
          POSTGRES_DB: r051_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d r051_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GAMING_DATASTORE_TEST_URL: postgres://postgres:hc_ci_only@localhost:5432/r051_ci
      GAMING_WALLET_TEST_URL: postgres://postgres:hc_ci_only@localhost:5432/r052_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Assert exact implementation SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked service dependencies
        working-directory: services/420-gaming-player-profile
        run: npm ci --ignore-scripts
      - name: Build isolated wallet integration database
        env:
          PGPASSWORD: hc_ci_only
        run: psql -h localhost -U postgres -d r051_ci -v ON_ERROR_STOP=1 -c 'CREATE DATABASE r052_ci'
      - name: Authenticated service unit and HTTP regressions
        working-directory: services/420-gaming-player-profile
        run: npm test
      - name: Retained R05.1 PostgreSQL regression
        working-directory: services/420-gaming-player-profile
        run: npm run test:postgres
      - name: R05.2 real PostgreSQL replay consent and recovery integration
        working-directory: services/420-gaming-player-profile
        run: node --test test/wallet-postgres.integration.mjs
      - name: Retained affected High Country runtime authorization
        working-directory: services/highcountry-economy
        run: npm test
      - name: Syntax, migration, diff integrity and exact SHA
        shell: bash
        run: |
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find services/420-gaming-player-profile/src services/420-gaming-player-profile/test -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          git diff --check 6b716762962b5a08e0d191a6cfbede1b5f33d757 HEAD
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
