name: High Country R05.6 Level 1 Gaming Events
on:
  pull_request:
    paths:
      - 'services/420-gaming-player-profile/**'
      - '.github/workflows/highcountry-r05-6.yml'
      - 'docs/highcountry/R05.6-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: hc_ci_only
          POSTGRES_DB: r056_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d r056_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GAMING_EVENTS_TEST_URL: postgres://postgres:hc_ci_only@localhost:5432/r056_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked driver
        working-directory: services/420-gaming-player-profile
        run: npm ci --ignore-scripts
      - name: Actual PostgreSQL cursor, RLS, reorg and finality qualification
        working-directory: services/420-gaming-player-profile
        run: node --test test/events-postgres.integration.mjs
      - name: Event ABI and source adversarial tests
        working-directory: services/420-gaming-player-profile
        run: node --test test/gaming-event-abi.test.js test/pinned-gaming-event-rpc.test.js
      - name: Retained profile unit suite
        working-directory: services/420-gaming-player-profile
        run: npm test
      - name: Affected Gaming SDK/client tests
        run: node --test packages/420-gaming-sdk/test/*.test.js clients/highcountry-access-v1/test/*.test.js
      - name: Syntax and exact SHA integrity
        run: |
          node --check services/420-gaming-player-profile/src/gaming-event-abi.js
          node --check services/420-gaming-player-profile/src/durable-gaming-event-indexer.js
          node --check services/420-gaming-player-profile/src/pinned-gaming-event-rpc.js
          node --check services/420-gaming-player-profile/src/gaming-event-scope-resolver.js
          node --check services/420-gaming-player-profile/src/gaming-event-http.js
          node --check services/420-gaming-player-profile/src/event-ingestion-migrations.js
          git diff --check "$(git merge-base HEAD origin/main)" HEAD
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
  actual-emitted-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FOUNDRY_SRC: src/highcountry
      FOUNDRY_TEST: test/highcountry
      FOUNDRY_SCRIPT: script/highcountry
      FOUNDRY_EVM_VERSION: cancun
      FOUNDRY_DYNAMIC_TEST_LINKING: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build only R05.4 actual event fixture
        working-directory: contracts
        run: forge build --no-dynamic-test-linking --evm-version cancun test/highcountry/integration/R05MigrationDeployment.sol
      - name: Run actual contract event log and pinned-source journey
        env:
          HC_TEST_RPC_URL: http://127.0.0.1:8545
        run: |
          anvil --network ethereum --chain-id 420 --port 8545 --hardfork cancun --code-size-limit 600000 --gas-limit 200000000 > "$RUNNER_TEMP/r056-anvil.log" 2>&1 &
          ANVIL_PID=$!
          trap 'kill "$ANVIL_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          test "$(cast chain-id --rpc-url http://127.0.0.1:8545)" = 420
          node services/420-gaming-player-profile/test/events-anvil.integration.mjs
