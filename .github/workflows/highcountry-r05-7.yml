name: High Country R05.7 Level 1 Canonical Finality
on:
  pull_request:
    paths:
      - 'services/420-gaming-player-profile/**'
      - '.github/workflows/highcountry-r05-7.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-finality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact SHA
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: R05.7 forged RPC/finality and high risk adversarial tests
        run: node --test services/420-gaming-player-profile/test/canonical-gaming-finality.test.js
      - name: Retained R05.4 GameClaims adapter and coordinator regression
        working-directory: services/420-gaming-player-profile
        run: node --test test/gameclaims-adapter.test.js test/gameclaims-coordinator-bridge.test.js
      - name: Retained player profile and SDK checks
        run: |
          cd services/420-gaming-player-profile && npm test && cd ../..
          node --test packages/420-gaming-sdk/test/*.test.js clients/highcountry-access-v1/test/*.test.js
      - name: Syntax and checked exact SHA
        run: |
          node --check services/420-gaming-player-profile/src/canonical-gaming-finality.js
          git diff --check f2dceb4fbcd3fb623e2fed6d051ae70af914c7ba HEAD
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
