name: High Country R07.2 Deterministic Genesis Rehearsal
on:
  pull_request:
    paths:
      - 'deployments/highcountry/r07-2.dev-seed.json'
      - 'scripts/highcountry/r07_2_rehearsal.py'
      - 'scripts/highcountry/test_r07_2_rehearsal.py'
      - '.github/workflows/highcountry-r07-2-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pycryptodome==3.21.0
      - run: python -m unittest discover -s scripts/highcountry -p test_r07_2_rehearsal.py -v
      - run: python scripts/highcountry/r07_2_rehearsal.py > /tmp/r07-2-output.json
      - run: |
          python - <<'PY'
          import json
          data=json.load(open('/tmp/r07-2-output.json'))
          assert len(data['roots'])==6
          assert data['prefinalization']['allLandProofsVerify']
          assert not data['prefinalization']['finalizationAuthorized']
          print('Development-only deterministic Genesis rehearsal passed; live approval not claimed')
          PY
