name: High Country Rewards Level 1
on:
  pull_request:
    paths:
      - 'services/highcountry-economy/**'
      - '.github/workflows/highcountry-rewards.yml'
  workflow_dispatch:
jobs:
  rewards-level-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scoped economy dependencies
        working-directory: services/highcountry-economy
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Exactly-once collection and audit Level 1
        working-directory: services/highcountry-economy
        run: node --test test/discovery-integration.test.js
      - name: Affected economy regression Level 2
        working-directory: services/highcountry-economy
        run: npm test
