name: HighCountry seed catalogue qualification
on:
  pull_request:
    paths:
      - 'services/highcountry-economy/**'
      - 'apps/highcountry-web/**'
      - 'deployments/highcountry/**'
      - 'scripts/highcountry/build_seed_catalogue.mjs'
      - '.github/workflows/highcountry-seed-catalogue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: seed05_disposable_only
          POSTGRES_DB: seed05_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HC_TEST_POSTGRES_URL: postgresql://postgres:seed05_disposable_only@localhost:5432/seed05_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scoped test dependencies
        run: |
          python -m pip install pycryptodome==3.23.0
          npm install --prefix /tmp/hc-seed05 --no-save pg@8.16.3 jsdom@26.1.0 playwright@1.56.1
          ln -s /tmp/hc-seed05/node_modules node_modules
          /tmp/hc-seed05/node_modules/.bin/playwright install --with-deps chromium
      - name: L1 catalogue, authority, HTTP and browser component tests
        run: node --test services/highcountry-economy/test/seed-catalogue*.test.js apps/highcountry-web/test/seed-catalogue.test.mjs services/highcountry-economy/test/postgres-store.test.js services/highcountry-economy/test/runtime-integration.test.js services/highcountry-economy/test/r064-browser-runtime-http.test.js
      - name: L2 durable PostgreSQL and restricted-role integration
        run: node services/highcountry-economy/test/seed-catalogue-postgres.integration.mjs
      - name: Build and verify public projection
        run: |
          node apps/highcountry-web/scripts/build.mjs
          node scripts/highcountry/build_seed_catalogue.mjs
          git diff --exit-code -- apps/highcountry-web/public/assets/highcountry/seed-catalogue.v1.json
      - name: L2 actual browser against built app
        run: node apps/highcountry-web/test/seed-catalogue-browser.integration.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hc-seed-05-browser-evidence
          path: artifacts/highcountry/hc-seed-05-*.png
          if-no-files-found: warn
