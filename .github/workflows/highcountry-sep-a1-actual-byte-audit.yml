name: HC-SEP-A1 Actual Asset Bytes
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/highcountry/hc_sep_a1_verify.py'
jobs:
  verify-frozen-asset-bytes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch archived immutable head refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/hc-separation/archive/*:refs/heads/hc-separation/archive/*'
          git cat-file -e '78a4befa01bd08693aabfd576a6fe8fba2e2677b^{commit}'
      - name: Recalculate every inventoried asset blob
        id: audit
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/highcountry/hc_sep_a1_verify.py \
            --frozen-main 78a4befa01bd08693aabfd576a6fe8fba2e2677b \
            --pr-heads docs/highcountry/separation/PHASE-A-OPEN-PR-HEADS.json \
            --output hc-sep-a1-asset-audit.json 2>&1 | tee hc-sep-a1-console.log
      - name: Upload asset audit and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hc-sep-a1-actual-byte-verification
          path: |
            hc-sep-a1-asset-audit.json
            hc-sep-a1-console.log
          if-no-files-found: warn
