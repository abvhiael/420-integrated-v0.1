name: High Country SOC-5D Recovery Level 2
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/highcountry-economy/src/social-recovery-worker.js'
      - 'services/highcountry-economy/src/canonical-social-*'
      - 'services/highcountry-economy/src/runtime-service.js'
      - 'services/highcountry-economy/src/start-runtime.js'
      - 'services/highcountry-economy/migrations/011-social-recovery.sql'
      - 'services/highcountry-economy/scripts/provision-social-role.mjs'
      - 'services/highcountry-economy/qualification/social-recovery.integration.test.mjs'
      - 'services/highcountry-economy/qualification/social-recovery-anvil.test.mjs'
      - '.github/workflows/highcountry-soc-5d.yml'
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: hc5d
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      HC_SOC5D_ANVIL_URL: http://127.0.0.1:8545
      HC_SOC5D_TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/hc5d
      HC_MIGRATION_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/hc5d
      PGPASSWORD: testpassword
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Verify exact SHA
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Install scoped runtime dependencies
        run: npm install --prefix services/highcountry-economy --ignore-scripts --no-audit --no-fund
      - name: Apply complete social schema and restricted tenant role
        run: |
          for migration in 007-social-operations 008-social-rls 009-social-intents 010-social-events 011-social-recovery; do
            psql -h localhost -U postgres -d hc5d -v ON_ERROR_STOP=1 -f "services/highcountry-economy/migrations/$migration.sql"
          done
          psql -h localhost -U postgres -d hc5d -v ON_ERROR_STOP=1 -c "CREATE ROLE hc_social_test_runtime NOLOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS"
          node services/highcountry-economy/scripts/provision-social-role.mjs hc5d hc_social_test_runtime
      - name: Durable restart, race, journal authenticity and canonical-reorg Level 2 tests
        run: node --test services/highcountry-economy/qualification/social-recovery.integration.test.mjs
      - name: Launch actual Anvil chain
        run: |
          anvil --chain-id 420 --host 127.0.0.1 --port 8545 > /tmp/soc5d-anvil.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 | grep -q '0x1a4'; then exit 0; fi
            sleep 1
          done
          cat /tmp/soc5d-anvil.log
          exit 1
      - name: Genuine Anvil restart recovery and evm_revert reorganization
        run: node --test services/highcountry-economy/qualification/social-recovery-anvil.test.mjs
      - name: Retained gateway adversarial suite
        run: node --test services/highcountry-economy/test/canonical-social-gateway.test.js
      - name: Syntax and runtime bootstrap integration
        run: |
          node --check services/highcountry-economy/src/social-recovery-worker.js
          node --check services/highcountry-economy/src/runtime-service.js
          node --check services/highcountry-economy/src/start-runtime.js
