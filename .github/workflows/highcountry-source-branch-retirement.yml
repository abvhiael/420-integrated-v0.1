name: Retire verified migrated HighCountry source branches
on:
  push:
    branches: [main]
    paths:
      - scripts/repository/highcountry-source-branch-retirement.mjs
      - .github/workflows/highcountry-source-branch-retirement.yml
  workflow_dispatch:
jobs:
  safe-retirement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify closure, preserved destination, branch ownership and no open PR then delete
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/repository/highcountry-source-branch-retirement.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: highcountry-source-branch-retirement-evidence
          path: highcountry-source-branch-retirement.json
          if-no-files-found: error
          retention-days: 90
