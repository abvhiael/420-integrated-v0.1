name: 420Identity ID-AUDIT-5

on:
  pull_request:
    paths:
      - "contracts/src/apps/Identity420.sol"
      - "contracts/src/system/SystemAccess.sol"
      - "contracts/artifacts/Identity420.json"
      - "contracts/config/predeploy/Identity420-predeploy-state.json"
      - "contracts/config/predeploy/predeploy-plan.json"
      - "contracts/config/predeploy/storage-init.json"
      - "contracts/config/deployment-manifest.json"
      - "contracts/config/genesis-address-namespace.json"
      - "contracts/config/system-addresses.json"
      - "contracts/config/genesis-canonical-addresses.json"
      - "contracts/foundry.toml"
      - "contracts/config/security/toolchain.json"
      - "scripts/generate-id-audit-4-identity-artifact.py"
      - "scripts/generate-id-audit-5-identity-predeploy.py"
      - "scripts/test-id-audit-5-identity-predeploy.py"
      - "scripts/verify-id-audit-5-identity-predeploy.py"
      - "scripts/verify-genesis-canonical-addresses.py"
      - "scripts/audit-genesis-address-collisions.py"
      - "scripts/verify-genesis-predeploy-authority.py"
      - "docs/audit/ID-AUDIT-5-FROZEN-PREDEPLOY-MATERIALIZATION.md"
      - ".github/workflows/identity-id-audit-5.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: identity-id-audit-5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify pinned compiler settings
        working-directory: contracts
        run: |
          set -euo pipefail
          CONFIG="$(forge config)"
          grep -q 'solc = "0.8.24"' <<<"$CONFIG" || grep -q 'solc_version = "0.8.24"' <<<"$CONFIG"
          grep -q 'evm_version = "cancun"' <<<"$CONFIG"
          grep -q 'optimizer = true' <<<"$CONFIG"
          grep -q 'optimizer_runs = 200' <<<"$CONFIG"
          grep -q 'via_ir = true' <<<"$CONFIG"

      - name: Compile exact Identity420 candidate
        working-directory: contracts
        run: forge build --force src/apps/Identity420.sol

      - name: Verify retained ID-AUDIT-4 build artifact
        run: |
          set -euo pipefail
          python3 scripts/generate-id-audit-4-identity-artifact.py --check
          python3 scripts/verify-id-audit-4-artifact.py

      - name: Materialize frozen Identity predeploy state
        run: python3 scripts/generate-id-audit-5-identity-predeploy.py --write --print

      - name: Verify deterministic Identity predeploy state
        run: |
          set -euo pipefail
          python3 scripts/generate-id-audit-5-identity-predeploy.py --check
          python3 scripts/verify-id-audit-5-identity-predeploy.py

      - name: ID-AUDIT-5 adversarial materialization tests
        run: python3 scripts/test-id-audit-5-identity-predeploy.py

      - name: Verify frozen namespace and collision authority
        run: |
          set -euo pipefail
          python3 scripts/verify-genesis-canonical-addresses.py
          python3 scripts/audit-genesis-address-collisions.py
          python3 scripts/verify-genesis-predeploy-authority.py

      - name: Identity runtime regression tests
        working-directory: contracts
        run: |
          set -euo pipefail
          forge test --match-path 'test/Identity420Audit.t.sol' -vv
          forge test --match-path 'test/Identity420Compatibility.t.sol' -vv
          forge test --match-path 'test/RegistryIdentityNames420.t.sol' -vv

      - name: Commit generated ID-AUDIT-5 Genesis outputs when absent or stale
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(git status --porcelain --             contracts/config/predeploy/Identity420-predeploy-state.json             contracts/config/predeploy/predeploy-plan.json             contracts/config/deployment-manifest.json)"
          if [ -z "$STATUS" ]; then
            echo "Generated Identity predeploy outputs already current."
            exit 0
          fi
          echo "$STATUS"
          git config user.name "420 Integrated CI"
          git config user.email "actions@users.noreply.github.com"
          git add             contracts/config/predeploy/Identity420-predeploy-state.json             contracts/config/predeploy/predeploy-plan.json             contracts/config/deployment-manifest.json
          git commit -m "Identity: materialize ID-AUDIT-5 frozen predeploy"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload ID-AUDIT-5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-id-audit-5-${{ github.sha }}
          path: |
            contracts/artifacts/Identity420.json
            contracts/config/predeploy/Identity420-predeploy-state.json
            contracts/config/predeploy/predeploy-plan.json
            contracts/config/deployment-manifest.json
          if-no-files-found: warn
          retention-days: 30
