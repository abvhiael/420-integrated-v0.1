name: LIFTd L02.2 Level 1
on:
  pull_request:
    paths:
      - 'rideshare/src/auth.mjs'
      - 'rideshare/src/rider-preferences.mjs'
      - 'rideshare/test/rider-preferences.test.mjs'
      - '.github/workflows/liftd-l02-2-level1.yml'
  push:
    branches: ['build/liftd-l02-2-rider-account-preferences']
    paths:
      - 'rideshare/src/auth.mjs'
      - 'rideshare/src/rider-preferences.mjs'
      - 'rideshare/test/rider-preferences.test.mjs'
      - '.github/workflows/liftd-l02-2-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rider-preferences:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact implementation SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scoped rider preferences and retained web routing regressions
        run: |
          node --check rideshare/src/rider-preferences.mjs
          node --test rideshare/test/rider-preferences.test.mjs rideshare/test/auth.test.mjs
          cd rideshare/web && npm run check
