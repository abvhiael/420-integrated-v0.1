name: LIFTd L02.7 Level 1
on:
  pull_request:
    paths:
      - 'rideshare/web/driver-availability-**'
      - 'rideshare/web/app.mjs'
      - 'rideshare/src/**'
      - 'rideshare/test/postgres/driver-offers.test.mjs'
      - 'rideshare/test/postgres/dispatch-fixture.mjs'
      - 'rideshare/migrations/009_driver_offers.sql'
      - '.github/workflows/liftd-l02-7-level1.yml'
  push:
    branches: ['build/liftd-l02-7-driver-availability-offers']
    paths:
      - 'rideshare/web/driver-availability-**'
      - 'rideshare/web/app.mjs'
      - '.github/workflows/liftd-l02-7-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  driver-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: liftd_qualification
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d liftd_qualification"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LIFTD_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/liftd_qualification
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked app dependencies
        run: npm ci --prefix rideshare --ignore-scripts
      - name: Driver availability, expiry, replay and retained browser tests
        run: |
          for f in rideshare/web/driver-availability-{policy,controller,api,view}.mjs; do node --check "$f"; done
          for f in rideshare/src/{driver-offers,dispatch,auth,trip,service,http,postgres-store}.mjs; do node --check "$f"; done
          npm run check --prefix rideshare/web
          node --test rideshare/test/postgres/driver-offers.test.mjs
