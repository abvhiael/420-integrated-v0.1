name: LIFTd L02.8 Level 1
on:
  pull_request:
    paths:
      - 'rideshare/web/driver-trip-**'
      - 'rideshare/web/test/driver-trip-controls.test.mjs'
      - 'rideshare/web/app.mjs'
      - 'rideshare/src/**'
      - 'rideshare/migrations/**'
      - 'rideshare/test/**'
      - '.github/workflows/liftd-l02-8-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  driver-trip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: liftd_qualification
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d liftd_qualification"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LIFTD_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/liftd_qualification
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact implementation SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --prefix rideshare --ignore-scripts
      - name: Static and client security preflight
        run: |
          for f in rideshare/web/driver-trip-{policy,api,controller,view}.mjs rideshare/web/app.mjs; do node --check "$f"; done
          node --test rideshare/web/test/driver-trip-controls.test.mjs
          npm run check --prefix rideshare/web
      - name: Retained authenticated backend and PostgreSQL regressions
        run: |
          npm test --prefix rideshare
          node --test rideshare/test/postgres/store.test.mjs
          node --test rideshare/test/postgres/dispatch.test.mjs
          node --test rideshare/test/postgres/driver-offers.test.mjs
          node --test rideshare/test/postgres/quotes.test.mjs
          node --test rideshare/test/postgres/payments.test.mjs
          node --test rideshare/test/postgres/safety.test.mjs
