name: LIFTd L03.4 Level 1
on:
  pull_request:
    paths:
      - 'rideshare/src/economic-reconciliation.mjs'
      - 'rideshare/src/auth.mjs'
      - 'rideshare/src/http.mjs'
      - 'rideshare/test/postgres/economic-reconciliation.test.mjs'
      - '.github/workflows/liftd-l03-4-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liftd-l03-4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  economic-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: liftd_qualification
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d liftd_qualification"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      LIFTD_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/liftd_qualification
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact implementation SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked rideshare dependencies
        run: npm ci --prefix rideshare --ignore-scripts
      - name: Syntax check affected app and test
        run: |
          node --check rideshare/src/economic-reconciliation.mjs
          node --check rideshare/src/auth.mjs
          node --check rideshare/src/http.mjs
          node --check rideshare/test/postgres/economic-reconciliation.test.mjs
      - name: Existing rideshare domain tests
        run: npm test --prefix rideshare
      - name: Real PostgreSQL economics, payments, quotes and trips
        run: |
          for file in rideshare/test/postgres/{economic-reconciliation,payments,quotes,store}.test.mjs; do
            node --test "$file"
          done
