name: LIFTd L03.9 Repository Level 1
on:
  pull_request:
    paths:
      - 'rideshare/src/jurisdiction-acceptance.mjs'
      - 'rideshare/src/launch-gate-service.mjs'
      - 'rideshare/test/launch-gate-service.test.mjs'
      - 'rideshare/test/jurisdiction-acceptance.test.mjs'
      - '.github/workflows/liftd-l03-9-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jurisdiction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retained LIFTd tests and jurisdiction checks
        run: |
          npm ci --prefix rideshare --ignore-scripts
          node --check rideshare/src/jurisdiction-acceptance.mjs
          node --check rideshare/src/launch-gate-service.mjs
          npm test --prefix rideshare
