name: LIFTd MBL-1 Android iOS Level 1
on:
  pull_request:
    paths:
      - 'rideshare/mobile/**'
      - '.github/workflows/liftd-mobile-mbl1-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-contracts:
    permissions:
      contents: write
    name: mobile-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scoped mobile dependencies
        working-directory: rideshare/mobile
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Export deterministic dependency lockfile
        working-directory: rideshare/mobile
        run: |
          test -f package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "const l=require('./package-lock.json');if(l.lockfileVersion<3)process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: liftd-mbl6-npm-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: rideshare/mobile/package-lock.json
          if-no-files-found: error
      - name: Commit validated lockfile to scoped PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 766
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$TARGET_BRANCH" = 'feat/liftd-mbl6-mobile-hardening-20261019'
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          if git cat-file -e HEAD:rideshare/mobile/package-lock.json 2>/dev/null; then
            echo 'Lockfile already committed at checked-out SHA'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rideshare/mobile/package-lock.json
          git commit -m 'MBL-6: pin verified mobile npm dependency lockfile'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: MBL-1 route security, configuration, typecheck
        working-directory: rideshare/mobile
        run: npm run check
  android-debug:
    name: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: mobile-contracts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK availability
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          test -d "$ANDROID_HOME/build-tools"
      - name: Install dependency and generate Android debug project
        working-directory: rideshare/mobile
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx expo prebuild --platform android --non-interactive --no-install
      - name: Compile unsigned nonproduction Android debug APK
        working-directory: rideshare/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Audit packaged Android permission set
        run: |
          python3 - <<'PY'
          import subprocess
          apk='rideshare/mobile/android/app/build/outputs/apk/debug/app-debug.apk'
          sdk=subprocess.check_output(['bash','-lc','echo "$ANDROID_HOME"'],text=True).strip()
          import os,glob
          tool=sorted(glob.glob(os.path.join(sdk,'cmdline-tools','*','bin','apkanalyzer')))
          if not tool: raise SystemExit('ANDROID_MANIFEST_AUDITOR_UNAVAILABLE')
          permissions=subprocess.check_output([tool[-1],'manifest','permissions',apk],text=True)
          print(permissions)
          prohibited=('ACCESS_BACKGROUND_LOCATION','READ_CONTACTS','READ_SMS','RECORD_AUDIO','CAMERA','MANAGE_EXTERNAL_STORAGE','QUERY_ALL_PACKAGES')
          if any(p in permissions for p in prohibited): raise SystemExit('UNEXPECTED_SENSITIVE_PERMISSION')
          PY
      - name: Upload nonproduction APK and exact source SHA
        run: |
          mkdir -p liftd-mobile-evidence
          git rev-parse HEAD > liftd-mobile-evidence/implementation-sha.txt
          cp rideshare/mobile/android/app/build/outputs/apk/debug/app-debug.apk liftd-mobile-evidence/liftd-mbl1-debug.apk
          sha256sum liftd-mobile-evidence/liftd-mbl1-debug.apk > liftd-mobile-evidence/android-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: liftd-mbl1-android-${{ github.event.pull_request.head.sha || github.sha }}
          path: liftd-mobile-evidence/
          if-no-files-found: error
  ios-simulator:
    name: ios-simulator
    runs-on: macos-15
    timeout-minutes: 45
    needs: mobile-contracts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependency and generate iOS simulator project
        working-directory: rideshare/mobile
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx expo prebuild --platform ios --non-interactive --no-install
      - name: Install iOS native dependencies
        working-directory: rideshare/mobile/ios
        run: pod install
      - name: Compile unsigned/nonproduction iOS simulator app
        working-directory: rideshare/mobile
        run: |
          set -o pipefail
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          xcodebuild -workspace "$workspace" -scheme "$(basename "$workspace" .xcworkspace)" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > ios-build.log 2>&1 || { tail -n 120 ios-build.log; exit 1; }
          git rev-parse HEAD
          app=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/*.app' -maxdepth 7 -type d -print -quit)
          test -n "$app"
          mkdir -p liftd-ios-evidence
          git rev-parse HEAD > liftd-ios-evidence/implementation-sha.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist" | grep -Fx org.integrated420.liftd.preview
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$app/Info.plist" && exit 1 || true
          ditto -c -k --sequesterRsrc --keepParent "$app" liftd-ios-evidence/liftd-preview-simulator.zip
          shasum -a 256 liftd-ios-evidence/liftd-preview-simulator.zip > liftd-ios-evidence/ios-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: liftd-ios-simulator-${{ github.event.pull_request.head.sha || github.sha }}
          path: rideshare/mobile/liftd-ios-evidence/
          if-no-files-found: error
