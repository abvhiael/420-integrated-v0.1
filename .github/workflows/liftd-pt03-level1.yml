name: LIFTd PT-03 Pay Level 1
on:
  pull_request:
    paths:
      - 'rideshare/src/pay-authority.mjs'
      - 'rideshare/test/pay-authority-isolation.test.mjs'
      - '.github/workflows/liftd-pt03-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pay-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: liftd_qualification
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d liftd_qualification"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LIFTD_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/liftd_qualification
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact SHA, app Pay and PostgreSQL accounting qualification
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --check rideshare/src/pay-authority.mjs
          npm ci --prefix rideshare --ignore-scripts
          npm test --prefix rideshare
          node --test rideshare/test/postgres/payments.test.mjs
