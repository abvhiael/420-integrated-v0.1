name: LIFTd PT-05 Messaging Notifications Level 1
on:
  pull_request:
    paths:
      - 'rideshare/src/trip-communications.mjs'
      - 'rideshare/test/trip-communications.test.mjs'
      - '.github/workflows/liftd-pt05-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  communications:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact SHA and retained LIFTd security regression
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          npm ci --prefix rideshare --ignore-scripts
          node --check rideshare/src/trip-communications.mjs
          npm test --prefix rideshare
