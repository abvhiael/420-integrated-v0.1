name: LIFTd PT-07 Pilot Configuration Level 1
on:
  pull_request:
    paths:
      - 'rideshare/src/pilot-configuration.mjs'
      - 'rideshare/test/pilot-configuration.test.mjs'
      - '.github/workflows/liftd-pt07-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-SHA pilot readiness and retained LIFTd tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          npm ci --prefix rideshare --ignore-scripts
          node --check rideshare/src/pilot-configuration.mjs
          npm test --prefix rideshare
