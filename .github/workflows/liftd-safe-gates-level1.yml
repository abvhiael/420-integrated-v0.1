name: LIFTd SAFE Gates Repository Execution Level 1
on:
  pull_request:
    paths:
      - 'rideshare/src/safe-gates-execution.mjs'
      - 'rideshare/test/safe-gates-execution.test.mjs'
      - '.github/workflows/liftd-safe-gates-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scoped tests and existing retained security tests
        run: |
          npm ci --prefix rideshare --ignore-scripts
          node --check rideshare/src/safe-gates-execution.mjs
          npm test --prefix rideshare
