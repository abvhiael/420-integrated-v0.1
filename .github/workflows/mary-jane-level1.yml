name: Mary Jane Sticky Wilds targeted Level 1
on:
  pull_request:
    paths:
      - 'clients/420bet-lobby/src/mary-jane-*.js'
      - 'clients/420bet-lobby/src/slots-lobby.js'
      - 'clients/420bet-lobby/tests/mary-jane.test.mjs'
      - 'clients/420bet-lobby/tests/slots-lobby.test.mjs'
      - '.github/workflows/mary-jane-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mary-jane-level1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scoped lobby dependencies
        working-directory: clients/420bet-lobby
        run: npm install --no-audit --no-fund
      - name: Run affected Mary Jane and slots navigation tests only
        working-directory: clients/420bet-lobby
        run: node --test tests/mary-jane.test.mjs tests/slots-lobby.test.mjs
