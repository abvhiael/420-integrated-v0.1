name: MIG-0.1 Ownership Inventory Level 1
on:
  pull_request:
    paths:
      - 'docs/migration/MIG-0.1-ownership-inventory.json'
      - 'scripts/migration/verify-mig-0-1.mjs'
      - '.github/workflows/mig-0-1-ownership.yml'
  workflow_dispatch:
jobs:
  ownership-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate classified ownership boundaries
        run: node scripts/migration/verify-mig-0-1.mjs
