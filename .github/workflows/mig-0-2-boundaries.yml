name: MIG-0.2 Shared Dependency Level 1
on:
  pull_request:
    paths:
      - 'docs/migration/MIG-0.2-boundaries.json'
      - 'scripts/migration/verify-mig-0-2.mjs'
      - '.github/workflows/mig-0-2-boundaries.yml'
  workflow_dispatch:
jobs:
  dependency-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/migration/verify-mig-0-2.mjs
