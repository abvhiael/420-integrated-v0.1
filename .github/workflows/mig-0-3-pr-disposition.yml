name: MIG-0.3 Active PR Disposition Level 1
on:
  pull_request:
    paths:
      - 'docs/migration/MIG-0.3-pr-disposition.json'
      - 'scripts/migration/verify-mig-0-3.mjs'
      - '.github/workflows/mig-0-3-pr-disposition.yml'
  workflow_dispatch:
jobs:
  pr-disposition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/migration/verify-mig-0-3.mjs
