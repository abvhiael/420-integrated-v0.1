name: MIG-0.4 MadBuds Source Reconciliation Level 1
on:
  pull_request:
    paths:
      - 'docs/migration/MIG-0.4-madbuds-reconciliation.json'
      - 'scripts/migration/verify-mig-0-4.mjs'
      - '.github/workflows/mig-0-4-madbuds.yml'
  workflow_dispatch:
jobs:
  source-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/migration/verify-mig-0-4.mjs
