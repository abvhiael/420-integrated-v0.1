name: MIG-0.5 Audit Consolidation Level 1
on:
  pull_request:
    paths:
      - 'docs/migration/MIG-0.*'
      - 'scripts/migration/verify-mig-0-5.mjs'
      - '.github/workflows/mig-0-5-closeout.yml'
  workflow_dispatch:
jobs:
  audit-consolidation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/migration/verify-mig-0-5.mjs
