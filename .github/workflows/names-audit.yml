      - 'contracts/test/Names420Hardening.t.sol'
      - 'contracts/test/Names420Invariant.t.sol'
      - 'contracts/config/interfaces/dependency-matrix.json'
      - 'contracts/config/interfaces/names-dependency-model.json'
      - 'contracts/artifacts/Names420.json'
      - 'contracts/config/predeploy/predeploy-plan.json'
      - 'contracts/config/predeploy/storage-init.json'
      - 'contracts/config/predeploy/Names420-predeploy-state.json'
      - 'contracts/config/deployment-manifest.json'
      - 'wallet/web/core/names-client.js'
      - 'wallet/web/core/names-send.js'
      - 'wallet/web/core/names-guided-send.js'
      - 'wallet/web/core/names-management.js'
      - 'wallet/web/names-management-ui.js'
      - 'wallet/web/index.html'
      - 'wallet/web/styles.css'
