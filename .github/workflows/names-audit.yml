              print(pathlib.Path("/tmp/names-slither.txt").read_text(), file=sys.stderr)
              raise SystemExit("Slither did not produce JSON output")

          report = json.loads(path.read_text())
          if report.get("success") is not True:
              raise SystemExit(f"Slither analysis failed: {report.get('error') or 'unknown error'}")

          target = "src/apps/Names420.sol"
          high = []
          findings = []
          for detector in report.get("results", {}).get("detectors", []):
              if not any(
                  element.get("source_mapping", {}).get("filename_relative") == target
                  for element in detector.get("elements", [])
              ):
                  continue
              item = {
                  "check": detector.get("check"),
                  "impact": detector.get("impact"),
                  "confidence": detector.get("confidence"),
                  "description": detector.get("description", "").splitlines()[0],
              }
              findings.append(item)
              if detector.get("impact") == "High":
                  high.append(item)

          print(json.dumps({"target": target, "findings": findings}, indent=2))
          if high:
              for item in high:
                  print(f"- {item['check']}: {item['description']}", file=sys.stderr)
              raise SystemExit("Unresolved high-severity Names420 Slither findings")
          print("No high-severity Slither findings in Names420.sol.")
          PY
          echo "slither_exit_status=$STATUS"

      - name: Generate and verify NAMES-AUDIT-5 compiler artifact
        shell: bash
        run: |
          set -euo pipefail
          (cd contracts && forge build src/apps/Names420.sol)
          python scripts/generate-names-audit-5-artifact.py --check
          python scripts/test-names-audit-5-artifact.py

      - name: Generate and verify NAMES-AUDIT-6 deterministic Genesis state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate-names-audit-6-genesis-state.py --write --print
          python scripts/test-names-audit-6-genesis-state.py
          git status --porcelain -- contracts/artifacts/Names420.json contracts/config/predeploy/Names420-predeploy-state.json | tee /tmp/names-genesis-status.txt
          if [ -s /tmp/names-genesis-status.txt ]; then
            echo "Committed Names420 Genesis materialization/state is missing or stale." >&2
            exit 1
          fi
          python scripts/generate-names-audit-6-genesis-state.py --check

      - name: Qualify NAMES-AUDIT-7 Indexer/Search artifact reconciliation
        if: ${{ env.NAMES_INDEXER_SEARCH_CHANGED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          (
            cd 420-indexer
            npm install
            node scripts/generate-names420-descriptor.mjs --write --print
            git status --porcelain -- descriptors/names420-v3.json | tee /tmp/names420-descriptor-status.txt
            if [ -s /tmp/names420-descriptor-status.txt ]; then
              echo "Committed Names420 release descriptor is missing or stale." >&2
              exit 1
            fi
            npm run build
            node --test \
              dist/test/names420-release-descriptor.test.js \
              dist/test/abi-manifest.test.js \
              dist/test/lifecycle-reducer.test.js \
              dist/test/query-layer.test.js
            node scripts/generate-names420-descriptor.mjs --check
          )
          go test ./search/discovery ./search/indexerclient

      - name: Run Wallet Names integration and management tests
        working-directory: wallet/web
        run: node --test test/names-client.test.js test/names-send.test.js test/names-guided-send.test.js test/names-management.test.js test/names-management-ui.test.js

      - name: Run Wallet Names static qualification
        working-directory: wallet/web
        run: node scripts/check-names.mjs

      - name: Names static authority/opcode scan
        working-directory: contracts
        run: |
          set -euo pipefail
          if grep -nE '\btx\.origin\b|\bselfdestruct\s*\(|\.delegatecall\s*\(' src/apps/Names420.sol; then
            echo "Forbidden authority/opcode primitive found in Names420.sol" >&2
            exit 1
          fi
          grep -q 'COMMITMENT_DOMAIN' src/apps/Names420.sol
          grep -q 'pendingOwner' src/apps/Names420.sol
          grep -q 'reverseResolve' src/apps/Names420.sol
