name: 420Names audit qualification

on:
  pull_request:
    paths:
      - 'contracts/src/apps/Names420.sol'
      - 'contracts/src/interfaces/genesis/INames420.sol'
      - 'contracts/test/Names420Audit.t.sol'
      - 'contracts/test/RegistryIdentityNames420.t.sol'
      - 'wallet/web/core/names-client.js'
      - 'wallet/web/test/names-client.test.js'
      - 'docs/apps/names/**'
      - 'docs/audit/420NAMES-*'
      - 'scripts/verify-genesis-interface-layer.py'
      - '.github/workflows/names-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: names-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify Genesis interface-layer inventory
        run: python scripts/verify-genesis-interface-layer.py

      - name: Check Names Solidity formatting
        working-directory: contracts
        run: forge fmt --check src/interfaces/genesis/INames420.sol test/Names420Audit.t.sol

      - name: Build Names420 implementation, interface and retained integration suite
        working-directory: contracts
        run: |
          forge build --force --sizes             src/apps/Names420.sol             src/interfaces/genesis/INames420.sol             test/Names420Audit.t.sol             test/RegistryIdentityNames420.t.sol

      - name: Run 420Names audit tests
        working-directory: contracts
        run: forge test --match-path 'test/Names420Audit.t.sol' -vvv

      - name: Run retained Registry/Identity/Names integration tests
        working-directory: contracts
        run: forge test --match-path 'test/RegistryIdentityNames420.t.sol' -vvv

      - name: Run Wallet Names client tests
        working-directory: wallet/web
        run: node --test test/names-client.test.js

      - name: Names static authority/opcode scan
        working-directory: contracts
        run: |
          set -euo pipefail
          if grep -nE '\btx\.origin\b|\bselfdestruct\s*\(|\.delegatecall\s*\(' src/apps/Names420.sol; then
            echo "Forbidden authority/opcode primitive found in Names420.sol" >&2
            exit 1
          fi
          grep -q 'COMMITMENT_DOMAIN' src/apps/Names420.sol
          grep -q 'pendingOwner' src/apps/Names420.sol
          grep -q 'reverseResolve' src/apps/Names420.sol
