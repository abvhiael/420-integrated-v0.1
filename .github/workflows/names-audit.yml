name: 420Names audit qualification

on:
  pull_request:
    paths:
      - 'contracts/src/apps/Names420.sol'
      - 'contracts/foundry.toml'
      - 'contracts/src/interfaces/genesis/INames420.sol'
      - 'contracts/test/Names420Audit.t.sol'
      - 'contracts/test/RegistryIdentityNames420.t.sol'
      - 'contracts/test/Names420DependencyModel.t.sol'
      - 'contracts/test/Names420Hardening.t.sol'
      - 'contracts/test/Names420Invariant.t.sol'
      - 'contracts/config/interfaces/dependency-matrix.json'
      - 'contracts/config/interfaces/names-dependency-model.json'
      - 'wallet/web/core/names-client.js'
      - 'wallet/web/test/names-client.test.js'
      - 'docs/apps/names/**'
      - 'docs/audit/420NAMES-*'
      - 'scripts/verify-genesis-interface-layer.py'
      - 'scripts/verify-names-dependency-model.py'
      - 'docs/architecture/decisions/NAMES-AUDIT-2-DEPENDENCY-MODEL.md'
      - '.github/workflows/names-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: names-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOUNDRY_PROFILE: pr
      FOUNDRY_SPARSE_MODE: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect NAMES-AUDIT-3 hardening changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD^ HEAD > /tmp/names-changed.txt
          if grep -Eq '^(contracts/src/apps/Names420\.sol|contracts/foundry\.toml|contracts/test/Names420Hardening\.t\.sol|contracts/test/Names420Invariant\.t\.sol|\.github/workflows/names-audit\.yml)$' /tmp/names-changed.txt; then
            echo "NAMES_HARDENING_CHANGED=true" >> "$GITHUB_ENV"
          else
            echo "NAMES_HARDENING_CHANGED=false" >> "$GITHUB_ENV"
          fi

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify Genesis interface-layer inventory
        run: python scripts/verify-genesis-interface-layer.py

      - name: Verify 420Names dependency model
        run: python scripts/verify-names-dependency-model.py

      - name: Check Names Solidity formatting
        working-directory: contracts
        run: forge fmt --check src/interfaces/genesis/INames420.sol test/Names420Audit.t.sol test/Names420DependencyModel.t.sol test/Names420Hardening.t.sol test/Names420Invariant.t.sol

      - name: Build and run 420Names Level 1 Solidity suite
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          if [ "$NAMES_HARDENING_CHANGED" = "true" ]; then
            forge test --match-contract '^(Names420AuditTest|Names420DependencyModelTest|RegistryIdentityNames420Test|Names420HardeningTest|Names420InvariantTest)$' -vvv
          else
            forge test --match-contract '^(Names420AuditTest|Names420DependencyModelTest|RegistryIdentityNames420Test)$' -vvv
          fi

      - name: Install Slither for NAMES-AUDIT-3
        if: env.NAMES_HARDENING_CHANGED == 'true'
        run: python -m pip install --disable-pip-version-check slither-analyzer

      - name: NAMES-AUDIT-3 targeted Slither gate
        if: env.NAMES_HARDENING_CHANGED == 'true'
        working-directory: contracts
        run: |
          set +e
          slither . --exclude-dependencies --json /tmp/names-slither.json >/tmp/names-slither.txt 2>&1
          STATUS=$?
          set -e
          python - <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path("/tmp/names-slither.json")
          if not path.exists():
              print(pathlib.Path("/tmp/names-slither.txt").read_text(), file=sys.stderr)
              raise SystemExit("Slither did not produce JSON output")
          report = json.loads(path.read_text())
          if report.get("success") is not True:
              raise SystemExit(f"Slither analysis failed: {report.get('error') or 'unknown error'}")

          target = "src/apps/Names420.sol"
          findings = []
          high = []
          for detector in report.get("results", {}).get("detectors", []):
              touches_names = any(
                  element.get("source_mapping", {}).get("filename_relative") == target
                  for element in detector.get("elements", [])
              )
              if not touches_names:
                  continue
              item = {
                  "check": detector.get("check"),
                  "impact": detector.get("impact"),
                  "confidence": detector.get("confidence"),
                  "description": detector.get("description", "").splitlines()[0],
              }
              findings.append(item)
              if detector.get("impact") == "High":
                  high.append(item)

          print(json.dumps({"target": target, "findings": findings}, indent=2))
          if high:
              print("Unresolved high-severity Names420 Slither findings:", file=sys.stderr)
              for item in high:
                  print(f"- {item['check']}: {item['description']}", file=sys.stderr)
              sys.exit(1)
          print("No high-severity Slither findings in Names420.sol.")
          PY
          echo "slither_exit_status=$STATUS"

      - name: Run Wallet Names integration tests
        working-directory: wallet/web
        run: node --test test/names-client.test.js test/names-send.test.js test/names-guided-send.test.js

      - name: Names static authority/opcode scan
        working-directory: contracts
        run: |
          set -euo pipefail
          if grep -nE '\btx\.origin\b|\bselfdestruct\s*\(|\.delegatecall\s*\(' src/apps/Names420.sol; then
            echo "Forbidden authority/opcode primitive found in Names420.sol" >&2
            exit 1
          fi
          grep -q 'COMMITMENT_DOMAIN' src/apps/Names420.sol
          grep -q 'pendingOwner' src/apps/Names420.sol
          grep -q 'reverseResolve' src/apps/Names420.sol
