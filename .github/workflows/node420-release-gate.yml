name: node420 Release Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "execution/**"
      - "consensus/systemcall/**"
      - "consensus/engine/**"
      - "scripts/build-node420-upstream.sh"
      - ".github/workflows/node420-release-gate.yml"

jobs:
  geth-v1-17-5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qualify patched Geth
        run: bash ./scripts/build-node420-upstream.sh

      - name: Verify node420 wrapper against patched binary
        run: |
          go build -o bin/node420 ./execution/cmd/node420
          ./bin/node420 --geth ./bin/upstream/geth-v1.17.5-420 --verify-geth

      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node420-geth-v1.17.5-release-gate
          path: |
            artifacts/node420-release-gate/
            execution/geth-v1.17.5.commit
            execution/geth-v1.17.5-420.patch.sha256
            execution/geth-v1.17.5-420.binary.sha256
          if-no-files-found: error
