name: node420 Release Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "execution/**"
      - "consensus/systemcall/**"
      - "consensus/engine/**"
      - "consensus/recovery/**"
      - "consensus/cmd/fourtwentyd/settlement.go"
      - "integration/cmd/settlement-fixture/**"
      - "scripts/settlement_process_scenarios.py"
      - "go.mod"
      - "go.sum"
      - "scripts/build-node420-upstream.sh"
      - "scripts/qualify-execution-recovery.py"
      - "scripts/qualify-stake-isolated.py"

jobs:
  geth-v1-17-5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qualify patched Geth
        run: bash ./scripts/build-node420-upstream.sh

      - name: Verify node420 wrapper against patched binary
        run: |
          go build -o bin/node420 ./execution/cmd/node420
          ./bin/node420 --geth ./bin/upstream/geth-v1.17.5-420 --verify-geth

      - name: Install pinned Solidity compiler for real gateway fixture
        run: |
          curl -fL https://github.com/ethereum/solidity/releases/download/v0.8.24/solc-static-linux -o "$RUNNER_TEMP/solc-0.8.24"
          echo "fb03a29a517452b9f12bcf459ef37d0a543765bb3bbc911e70a87d6a37c30d5f  $RUNNER_TEMP/solc-0.8.24" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/solc-0.8.24"

      - name: Real execution crash, reconstruction and batch atomicity
        run: python3 scripts/qualify-execution-recovery.py --solc "$RUNNER_TEMP/solc-0.8.24" --output "$RUNNER_TEMP/execution-recovery"

      - name: Build certified consensus settlement runtime and local qualification producer
        run: |
          go build -tags blst -o bin/fourtwentyd ./consensus/cmd/fourtwentyd
          go build -tags 'blst recoveryfault' -o bin/fourtwentyd-recovery-fault ./consensus/cmd/fourtwentyd
          go build -tags blst -o bin/settlement-fixture ./integration/cmd/settlement-fixture

      - name: Production consensus and execution process recovery qualification
        run: python3 scripts/qualify-execution-recovery.py --consensus --solc "$RUNNER_TEMP/solc-0.8.24" --output "$RUNNER_TEMP/consensus-recovery"

      - name: Retain process evidence without copying execution databases
        if: always()
        run: |
          mkdir -p artifacts/node420-release-gate/recovery
          for evidence in "$RUNNER_TEMP"/execution-recovery/*.json "$RUNNER_TEMP"/execution-recovery/*.log; do
            [ ! -f "$evidence" ] || cp "$evidence" artifacts/node420-release-gate/recovery/
          done
          mkdir -p artifacts/node420-release-gate/consensus-recovery
          for evidence in "$RUNNER_TEMP"/consensus-recovery/*.json "$RUNNER_TEMP"/consensus-recovery/*.log; do
            [ ! -f "$evidence" ] || cp "$evidence" artifacts/node420-release-gate/consensus-recovery/
          done
          for state in consensus truncated-consensus invalid-import-consensus native-failure-consensus; do
            if [ -d "$RUNNER_TEMP/consensus-recovery/$state" ]; then
              mkdir -p "artifacts/node420-release-gate/consensus-recovery/$state"
              cp "$RUNNER_TEMP/consensus-recovery/$state/"*.json "artifacts/node420-release-gate/consensus-recovery/$state/"
            fi
          done

      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node420-geth-v1.17.5-release-gate
          path: |
            artifacts/node420-release-gate/
            execution/geth-v1.17.5.commit
            execution/geth-v1.17.5-420.patch.sha256
            execution/geth-v1.17.5-420.binary.sha256
          if-no-files-found: error
