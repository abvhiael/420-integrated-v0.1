name: PAY-APP Android qualification
on:
  pull_request:
    paths:
      - 'pay/android/**'
      - 'pay/web/payment-intent.js'
      - 'pay/web/package-lock.json'
      - 'packages/420-pay-sdk/**'
      - '.github/workflows/pay-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify revision and build shared SDK
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          npm ci --prefix packages/420-pay-sdk --ignore-scripts --no-audit --no-fund
          npm ci --prefix pay/web --ignore-scripts --no-audit --no-fund
          npm run build --prefix packages/420-pay-sdk
          cd pay/android
          node --test web/sdk.test.mjs
      - name: Build unsigned Android release APK and bundle
        working-directory: pay/android
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android device flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: pay/android
          script: gradle :app:connectedDebugAndroidTest -PpayChainId=420 -PwalletHost=wallet.example.test --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: 420pay-android-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            pay/android/app/build/outputs/apk/release/*.apk
            pay/android/app/build/outputs/bundle/release/*.aab
            pay/android/app/build/reports/androidTests/connected/
