name: Poker Room UI targeted Level 1
on:
  pull_request:
    paths:
      - 'clients/420bet-lobby/src/poker-room*'
      - 'clients/420bet-lobby/tests/poker-room.test.mjs'
      - 'clients/420bet-lobby/src/main.js'
      - '.github/workflows/poker-room-ui-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  poker-room-level1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lobby dependencies
        working-directory: clients/420bet-lobby
        run: npm install --no-audit --no-fund
      - name: Poker Room preview safety and UI test
        working-directory: clients/420bet-lobby
        run: node --test tests/poker-room.test.mjs
      - name: Build 420Bet lobby
        working-directory: clients/420bet-lobby
        run: npm run build
