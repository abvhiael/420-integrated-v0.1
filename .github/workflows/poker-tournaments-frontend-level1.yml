name: Poker tournaments frontend targeted Level 1
on:
  pull_request:
    paths:
      - 'clients/420bet-lobby/src/poker-tournaments*'
      - 'clients/420bet-lobby/tests/poker-tournaments.test.mjs'
      - 'clients/420bet-lobby/src/main.js'
      - '.github/workflows/poker-tournaments-frontend-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  poker-tournaments-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lobby dependencies
        working-directory: clients/420bet-lobby
        run: npm install --no-audit --no-fund
      - name: Tournament UI and preview safety tests
        working-directory: clients/420bet-lobby
        run: node --test tests/poker-tournaments.test.mjs
      - name: Vite lobby build
        working-directory: clients/420bet-lobby
        run: npm run build
