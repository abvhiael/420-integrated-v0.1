name: PRE-02 one-off reconcile main (guarded)
on:
  push:
    branches:
      - feature/420exchange-v15.1-testnet-binding
    paths:
      - .github/workflows/pre02-oneoff-reconcile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify expected branch and reconcile with main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/feature/420exchange-v15.1-testnet-binding'
          git fetch origin main
          git config user.name '420Exchange reconciliation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-commit --no-ff origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Unmerged paths: %s\n' "${conflicts[*]}"
            test "${#conflicts[@]}" -eq 1
            test "${conflicts[0]}" = 'exchange/web/scripts/build.mjs'
            git checkout --ours -- exchange/web/scripts/build.mjs
            git add -- exchange/web/scripts/build.mjs
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'merge: reconcile main into 420Exchange PRE-02 while retaining combined build'
          else
            # --no-commit may stage an empty merge if trees already match.
            git commit --allow-empty -m 'merge: reconcile main into 420Exchange PRE-02'
          fi
          git merge-base --is-ancestor origin/main HEAD
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          git push origin HEAD:refs/heads/feature/420exchange-v15.1-testnet-binding
