name: PuffBuddies PB-0 Qualification

on:
  push:
    branches:
      - "puffbuddies-pb0-foundation-20261004"
    paths:
      - "docs/puffbuddies/**"
      - "scripts/verify-puffbuddies-pb0.py"
      - ".github/workflows/puffbuddies-pb0.yml"
  pull_request:
    paths:
      - "docs/puffbuddies/**"
      - "scripts/verify-puffbuddies-pb0.py"
      - ".github/workflows/puffbuddies-pb0.yml"
  workflow_dispatch:

concurrency:
  group: puffbuddies-pb0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pb0-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify PB-0 canonical foundation
        run: python3 scripts/verify-puffbuddies-pb0.py

      - name: Run PB-0 documentation invariant mutation tests
        run: python3 scripts/test-puffbuddies-pb0-invariants.py

      - name: Reject implementation paths not yet authorized by current roadmap
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            "contracts/src/puffbuddies"
            "contracts/src/apps/PuffBuddies"
            "puffbuddies/matching"
            "puffbuddies/profile"
          )
          for path in "${forbidden[@]}"; do
            if [ -e "$path" ]; then
              echo "PuffBuddies roadmap has not authorized implementation path: $path" >&2
              exit 1
            fi
          done
