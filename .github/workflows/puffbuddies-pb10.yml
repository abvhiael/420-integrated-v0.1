name: PuffBuddies PB-10 Qualification

on:
  pull_request:
    paths:
      - "puffbuddies/**"
      - "docs/puffbuddies/**"
      - ".github/workflows/puffbuddies-pb10.yml"
  push:
    branches: ["puffbuddies-pb10-payments-premium-20261006"]
    paths:
      - "puffbuddies/**"
      - "docs/puffbuddies/**"
      - ".github/workflows/puffbuddies-pb10.yml"

permissions:
  contents: read

jobs:
  pb10:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile PuffBuddies
        run: python3 -m compileall -q puffbuddies
      - name: PB-10 Level 1 targeted premium entitlements
        run: python3 -m unittest puffbuddies.tests.test_pb_10_premium_entitlements -v
      - name: PB-10 Level 2 420Pay entitlement integration milestone
        run: python3 -m unittest puffbuddies.tests.test_pb_10_integration -v
      - name: Retained PuffBuddies regressions
        run: python3 -m unittest discover -s puffbuddies/tests -p 'test_*.py' -v
      - name: Verify PB-0 economic and consent authority
        run: python3 scripts/verify-puffbuddies-pb0.py
      - name: Verify canonical 420Pay dependency interface
        run: python3 scripts/verify-420pay-audit.py
      - name: Premium privacy and purchased-authority negative gate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e contracts/src/puffbuddies
          ! grep -RIE '(payment_ref|invoice_ref|payer_ref|wallet_address|receipt_hash|settlement_asset_ref|settlement_amount|transaction_hash|payment_history)[[:space:]]*[:=]' puffbuddies/domain/premium_entitlements.py
          ! grep -RIE '(block_override|force_match|force_unblock|force_rematch|messaging_authorized|private_profile_access|message_access|location_access|safety_override)[[:space:]]*[:=]' puffbuddies/domain/premium_entitlements.py
          ! grep -RIE '(wallet_balance|token_balance|staking_balance|payment_volume|desirability_score|reputation_score)[[:space:]]*[:=]' puffbuddies/domain/premium_entitlements.py
