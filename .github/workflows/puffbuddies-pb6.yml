name: PuffBuddies PB-6 Qualification

on:
  pull_request:
    paths:
      - "puffbuddies/**"
      - "docs/puffbuddies/**"
      - ".github/workflows/puffbuddies-pb6.yml"
  push:
    branches: ["puffbuddies-pb6-messenger-integration-20261006"]
    paths:
      - "puffbuddies/**"
      - "docs/puffbuddies/**"
      - ".github/workflows/puffbuddies-pb6.yml"

permissions:
  contents: read

jobs:
  pb6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile PuffBuddies
        run: python3 -m compileall -q puffbuddies
      - name: PB-6 Level 1 targeted Messenger integration
        run: python3 -m unittest puffbuddies.tests.test_pb_6_messenger_integration -v
      - name: Retained PuffBuddies regressions
        run: python3 -m unittest discover -s puffbuddies/tests -p 'test_*.py' -v
      - name: PB-6 Level 2 PB-5/PB-6 integration milestone
        run: python3 -m unittest puffbuddies.tests.test_pb_6_integration -v
      - name: Canonical 420Messenger dependency verifier
        run: python3 scripts/verify-420messenger-audit.py
      - name: Messenger boundary and privacy negative gate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e contracts/src/puffbuddies
          ! grep -RIE '(wallet_address|public_profile|public_match_graph|plaintext|ciphertext_body|private_key|decryption_key)[[:space:]]*[:=]' puffbuddies/domain/messenger_integration.py
          ! grep -RIE '(commitEnvelope|markDelivered|markRead|setEndpoint|setBlocked)' puffbuddies/domain/messenger_integration.py
