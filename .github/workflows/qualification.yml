      - 'docs/compute-market/CMP-7.10-PHASE-CLOSEOUT.md'
      - 'docs/compute-market/CMP-8-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-6-8-closeout.py'
      - 'scripts/verify-cmp-7-10-closeout.py'
      - 'scripts/verify-cmp-8-closeout.py'
      - 'docs/audit/420LAUNCHPAD-PHASE-CLOSEOUT.md'
      - 'docs/audit/420MEDIA-PHASE-CLOSEOUT.md'
      - 'docs/audit/DOOBTUBE-PHASE-CLOSEOUT.md'
      - 'docs/audit/DOOBR-PHASE-CLOSEOUT.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-core:
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'audit/') || contains(github.head_ref, '-audit-')) || github.head_ref == 'audit/exchange-pretestnet-phase-20260930' || github.head_ref == 'audit/420launchpad-remediation' || github.head_ref == 'audit/420verify-20261003' || github.head_ref == 'audit/420token-complete-20261004' || github.head_ref == 'audit/420town-complete-20261004' || github.head_ref == 'audit/420media-complete-20261006' || github.head_ref == 'audit/doobtube-baseline-20261006' || github.head_ref == 'audit/420commerce-com-2-upstream-adaptations' || github.head_ref == 'audit/doobr-audit-1-inventory-20261009'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9cdc324a1b5bd22a2dd9f343931fef05e934b8b2
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: 9cdc324a1b5bd22a2dd9f343931fef05e934b8b2
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go test ./...
      - run: go build ./consensus/cmd/fourtwentyd
      - run: go build ./execution/cmd/node420

  production-dependencies:
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'audit/') || contains(github.head_ref, '-audit-')) || github.head_ref == 'audit/exchange-pretestnet-phase-20260930' || github.head_ref == 'audit/420launchpad-remediation' || github.head_ref == 'audit/420verify-20261003' || github.head_ref == 'audit/420token-complete-20261004' || github.head_ref == 'audit/420town-complete-20261004' || github.head_ref == 'audit/420media-complete-20261006' || github.head_ref == 'audit/doobtube-baseline-20261006' || github.head_ref == 'audit/420commerce-com-2-upstream-adaptations' || github.head_ref == 'audit/doobr-audit-1-inventory-20261009'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9cdc324a1b5bd22a2dd9f343931fef05e934b8b2
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: 9cdc324a1b5bd22a2dd9f343931fef05e934b8b2
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: bash ./scripts/install-production-deps.sh

  geth-engine:
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'audit/') || contains(github.head_ref, '-audit-')) || github.head_ref == 'audit/exchange-pretestnet-phase-20260930' || github.head_ref == 'audit/420launchpad-remediation' || github.head_ref == 'audit/420verify-20261003' || github.head_ref == 'audit/420token-complete-20261004' || github.head_ref == 'audit/420town-complete-20261004' || github.head_ref == 'audit/420media-complete-20261006' || github.head_ref == 'audit/doobtube-baseline-20261006' || github.head_ref == 'audit/420commerce-com-2-upstream-adaptations' || github.head_ref == 'audit/doobr-audit-1-inventory-20261009'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9cdc324a1b5bd22a2dd9f343931fef05e934b8b2
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: 9cdc324a1b5bd22a2dd9f343931fef05e934b8b2
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: make build
      - name: Build pinned Geth
        run: |
          rm -rf .cache/go-ethereum
          bash ./scripts/build-node420-upstream.sh
      - run: go build -o bin/engine-live-smoke ./integration/cmd/engine-live-smoke
      - run: bash ./scripts/live-engine-smoke.sh

  fault-matrix:
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'audit/') || contains(github.head_ref, '-audit-')) || github.head_ref == 'audit/exchange-pretestnet-phase-20260930' || github.head_ref == 'audit/420launchpad-remediation' || github.head_ref == 'audit/420verify-20261003' || github.head_ref == 'audit/420token-complete-20261004' || github.head_ref == 'audit/420town-complete-20261004' || github.head_ref == 'audit/420media-complete-20261006' || github.head_ref == 'audit/doobtube-baseline-20261006' || github.head_ref == 'audit/420commerce-com-2-upstream-adaptations' || github.head_ref == 'audit/doobr-audit-1-inventory-20261009'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9cdc324a1b5bd22a2dd9f343931fef05e934b8b2
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: 9cdc324a1b5bd22a2dd9f343931fef05e934b8b2
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: make build
      - run: python3 scripts/run-fault-matrix.py
      - run: python3 scripts/run-soak.py --slots 120 --slot-ms 35
  bnb-travel-exact:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact BnB implementation
        uses: actions/checkout@v4
        with:
          ref: 9cdc324a1b5bd22a2dd9f343931fef05e934b8b2
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: 9cdc324a1b5bd22a2dd9f343931fef05e934b8b2
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical retained BnB architecture validators
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-bnb-1-1.py
          python3 scripts/validate-bnb-1-2.py
          python3 scripts/validate-bnb-1-3.py
          python3 scripts/validate-bnb-1-4.py
          python3 scripts/validate-bnb-1-5.py
          python3 scripts/validate-bnb-1-6.py
          python3 scripts/validate-bnb-1-7.py
          python3 scripts/validate-bnb-1-8.py
          python3 scripts/validate-bnb-1-9.py
      - name: Canonical Travel and shared authority validators
        run: |
          python3 scripts/validate-gen-svc-3.py
          python3 scripts/validate-gen-svc-0.py
          python3 scripts/verify-doobr-audit-2.py
          python3 scripts/travel-postgres-migrate.py plan
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Noncached Travel and DOOBR compatibility regressions
        run: |
          go test -count=1 ./genesis/svc3/travelapp -run '^(TestGenesisCompatibilitySchemas|TestGenesisTransactionMethodsAlwaysDisabled|TestDOOBRAudit3BoundaryMatrix|TestDOOBRAudit3GatewayCannotBeEnabledByInput)$' -v
          go test -count=1 ./genesis/svc3/... ./cmd/420travel/...
      - name: Travel static analysis and server build
        run: |
          go vet ./genesis/svc3/... ./cmd/420travel/...
          go build -o /tmp/420travel ./cmd/420travel
