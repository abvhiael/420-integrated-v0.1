
name: 420 Integrated Qualification

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  offline-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go test ./...
      - run: go build ./consensus/cmd/fourtwentyd
      - run: go build ./execution/cmd/node420

  production-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: bash ./scripts/install-production-deps.sh

  geth-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: make build
      - run: bash ./scripts/build-node420-upstream.sh
      - run: go build -o bin/engine-live-smoke ./integration/cmd/engine-live-smoke
      - run: ./scripts/live-engine-smoke.sh

  fault-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: make build
      - run: python3 scripts/run-fault-matrix.py
      - run: python3 scripts/run-soak.py --slots 120 --slot-ms 35
