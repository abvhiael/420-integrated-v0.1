      - 'contracts/config/compute-market/cmp-2.8-phase-closeout.json'
      - 'docs/compute-market/CMP-2.8-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-2-8-phase-closeout.py'
      - 'contracts/config/compute-market/cmp-3.14-phase-closeout.json'
      - 'docs/compute-market/CMP-3.14-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-3-14-closeout.py'
      - 'contracts/config/compute-market/cmp-4.10-phase-closeout.json'
      - 'docs/compute-market/CMP-4.10-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-4-10-closeout.py'
      - 'contracts/config/compute-market/cmp-5.8-phase-closeout.json'
      - 'docs/compute-market/CMP-5.8-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-5-8-closeout.py'
      - 'contracts/config/compute-market/cmp-5.8-phase-closeout.json'
      - 'docs/compute-market/CMP-5.8-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-5-8-closeout.py'
      - 'contracts/config/compute-market/cmp-6.8-phase-closeout.json'
      - 'contracts/config/compute-market/cmp-7.10-phase-closeout.json'
      - 'contracts/config/compute-market/cmp-8-phase-closeout.json'
      - 'docs/compute-market/CMP-6.8-PHASE-CLOSEOUT.md'
      - 'docs/compute-market/CMP-7.10-PHASE-CLOSEOUT.md'
      - 'docs/compute-market/CMP-8-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-6-8-closeout.py'
      - 'scripts/verify-cmp-7-10-closeout.py'
      - 'scripts/verify-cmp-8-closeout.py'
      - 'docs/audit/420LAUNCHPAD-PHASE-CLOSEOUT.md'
      - 'docs/audit/420VERIFY-PHASE-CLOSEOUT.md'
      - 'docs/audit/420MEDIA-PHASE-CLOSEOUT.md'
      - 'docs/audit/DOOBTUBE-PHASE-CLOSEOUT.md'
      - 'docs/audit/DOOBR-PHASE-CLOSEOUT.md'
  pull_request:
    paths:
      - 'consensus/**'
      - 'execution/**'
      - 'integration/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/install-production-deps.sh'
      - 'scripts/build-node420-upstream.sh'
      - 'scripts/live-engine-smoke.sh'
      - 'scripts/run-fault-matrix.py'
      - 'scripts/run-soak.py'
      - '.github/workflows/qualification.yml'
      - 'exchange/**'
      - 'docs/420EXCHANGE-*.md'
      - '.github/workflows/exchange-web.yml'
      - 'contracts/config/compute-market/cmp-1.4.12-phase-closeout.json'
      - 'docs/compute-market/CMP-1.4.12-VERIFIER-REGISTRY-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-1-4-12-closeout.py'
      - 'contracts/config/compute-market/cmp-1.5.13-phase-closeout.json'
      - 'docs/compute-market/CMP-1.5.13-PHASE-CLOSEOUT.md'
