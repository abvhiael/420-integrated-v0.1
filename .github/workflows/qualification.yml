      - 'scripts/verify-cmp-2-8-phase-closeout.py'
      - 'contracts/config/compute-market/cmp-3.14-phase-closeout.json'
      - 'docs/compute-market/CMP-3.14-PHASE-CLOSEOUT.md'
      - 'scripts/verify-cmp-3-14-closeout.py'
      - 'contracts/config/compute-market/cmp-4.10-phase-closeout.json'
      - 'docs/compute-market/CMP-4.10-PHASE-CLOSEOUT.md'
