
name: 420 Integrated Qualification

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'consensus/**'
      - 'execution/**'
      - 'integration/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/install-production-deps.sh'
      - 'scripts/build-node420-upstream.sh'
      - 'scripts/live-engine-smoke.sh'
      - 'scripts/run-fault-matrix.py'
      - 'scripts/run-soak.py'
      - '.github/workflows/qualification.yml'
  pull_request:
    paths:
      - 'consensus/**'
      - 'execution/**'
      - 'integration/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/install-production-deps.sh'
      - 'scripts/build-node420-upstream.sh'
      - 'scripts/live-engine-smoke.sh'
      - 'scripts/run-fault-matrix.py'
      - 'scripts/run-soak.py'
      - '.github/workflows/qualification.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-core:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'audit/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go test ./...
      - run: go build ./consensus/cmd/fourtwentyd
      - run: go build ./execution/cmd/node420

  production-dependencies:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'audit/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: bash ./scripts/install-production-deps.sh

  geth-engine:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'audit/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: make build
      - name: Build pinned Geth
        run: |
          rm -rf .cache/go-ethereum
          bash ./scripts/build-node420-upstream.sh
      - run: go build -o bin/engine-live-smoke ./integration/cmd/engine-live-smoke
      - run: bash ./scripts/live-engine-smoke.sh

  fault-matrix:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'audit/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: make build
      - run: python3 scripts/run-fault-matrix.py
      - run: python3 scripts/run-soak.py --slots 120 --slot-ms 35
