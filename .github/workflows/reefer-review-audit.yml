name: Reefer Review Audit
on:
  pull_request:
    paths:
      - 'reefer-review/**'
      - 'cmd/reefer-review/**'
      - 'config/reefer-review.json'
      - 'config/genesis-consumer-services.json'
      - 'config/genesis-applications.json'
      - 'docs/audit/REEFER-REVIEW-**'
      - 'scripts/verify-reefer-review-audit.py'
      - '.github/workflows/reefer-review-audit.yml'
  push:
    branches: [main]
    paths:
      - 'reefer-review/**'
      - 'cmd/reefer-review/**'
      - 'config/reefer-review.json'
      - 'docs/audit/REEFER-REVIEW-**'
      - 'scripts/verify-reefer-review-audit.py'
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Go format
        run: test -z "$(gofmt -l reefer-review cmd/reefer-review)"
      - name: Go tests
        run: go test ./reefer-review/... ./cmd/reefer-review/...
      - name: Static audit verifier
        run: python3 scripts/verify-reefer-review-audit.py
      - name: Shared GEN-SVC validator
        run: python3 scripts/validate-gen-svc-0.py
