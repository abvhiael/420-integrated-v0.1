name: Reefer Review RR-1

on:
  pull_request:
    paths:
      - 'reefer-review/**'
      - 'cmd/reefer-review/**'
      - 'cmd/reefer-news-sync/**'
      - 'config/reefer-review-news-sources.json'
      - 'docs/reefer-review/RR-**'
      - 'scripts/verify-reefer-review-rr1.py'
      - '.github/workflows/reefer-review-rr1.yml'
  workflow_dispatch:

concurrency:
  group: reefer-rr1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Go format
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l reefer-review cmd/reefer-review cmd/reefer-news-sync)"
          if [ -n "$files" ]; then
            printf 'gofmt required for:\n%s\n' "$files" >&2
            gofmt -d $files
            exit 1
          fi

      - name: RR-1 unit and integration tests
        run: go test ./reefer-review/... ./cmd/reefer-review/... ./cmd/reefer-news-sync/...

      - name: RR-1 race qualification
        run: go test -race ./reefer-review/...

      - name: RR-1 vet
        run: go vet ./reefer-review/... ./cmd/reefer-review/... ./cmd/reefer-news-sync/...

      - name: RR-1 static verifier
        run: python3 scripts/verify-reefer-review-rr1.py

      - name: Retain Reefer Review audit regression
        run: python3 scripts/verify-reefer-review-audit.py
