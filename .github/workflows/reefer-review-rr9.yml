name: Reefer Review RR-9

on:
  pull_request:
    paths:
      - 'reefer-review/**'
      - 'cmd/reefer-review/**'
      - 'cmd/reefer-news-sync/**'
      - 'docs/reefer-review/RR-9-**'
      - 'docs/reefer-review/RR-ROADMAP.md'
      - 'docs/audit/REEFER-REVIEW-SECURITY.md'
      - 'docs/audit/REEFER-REVIEW-AUDIT-REMEDIATION-ROADMAP.md'
      - 'scripts/verify-reefer-review-rr9.py'
      - '.github/workflows/reefer-review-rr9.yml'
  workflow_dispatch:

concurrency:
  group: reefer-rr9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Go format
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l reefer-review cmd/reefer-review cmd/reefer-news-sync cmd/reefer-backup)"
          if [ -n "$files" ]; then
            printf 'gofmt required for:\n%s\n' "$files" >&2
            gofmt -d $files
            exit 1
          fi

      - name: RR-9 newsfeed and app regression tests
        run: go test ./reefer-review/... ./cmd/reefer-review/... ./cmd/reefer-news-sync/... ./cmd/reefer-backup/...

      - name: RR-9 race qualification
        run: go test -race ./reefer-review/...

      - name: RR-9 vet
        run: go vet ./reefer-review/... ./cmd/reefer-review/... ./cmd/reefer-news-sync/... ./cmd/reefer-backup/...

      - name: Frontend JavaScript syntax
        run: node --check reefer-review/web/app.js

      - name: Install browser qualification dependencies
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1 @axe-core/playwright@4.11.0
          npx playwright install --with-deps chromium

      - name: RR-9 real-browser E2E and accessibility
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory reefer-review/web >/tmp/reefer-rr9-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          npx playwright test reefer-review/web/rr9.e2e.spec.cjs --workers=1 --reporter=line

      - name: RR-9 verifier
        run: python3 scripts/verify-reefer-review-rr9.py

      - name: Retained RR-8 verifier
        run: python3 scripts/verify-reefer-review-rr8.py

      - name: Retained RR-7 verifier
        run: python3 scripts/verify-reefer-review-rr7.py

      - name: Retained RR-6 verifier
        run: python3 scripts/verify-reefer-review-rr6.py

      - name: Retained RR-5 verifier
        run: python3 scripts/verify-reefer-review-rr5.py

      - name: Retained RR-4 verifier
        run: python3 scripts/verify-reefer-review-rr4.py

      - name: Retained RR-3 verifier
        run: python3 scripts/verify-reefer-review-rr3.py

      - name: Retained RR-2 verifier
        run: python3 scripts/verify-reefer-review-rr2.py

      - name: Retained RR-1 verifier
        run: python3 scripts/verify-reefer-review-rr1.py

      - name: Retained Reefer Review audit verifier
        run: python3 scripts/verify-reefer-review-audit.py
