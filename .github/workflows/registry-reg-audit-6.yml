name: 420Registry REG-AUDIT-6

on:
  pull_request:
    paths:
      - 'developer-hub/catalogue/**'
      - 'developer-hub/manifests/**'
      - 'developer-hub/src/contract-catalogue.mjs'
      - 'developer-hub/test/**'
      - 'packages/420-sdk/**'
      - 'contracts/artifacts/ProtocolRegistry.json'
      - 'contracts/src/interfaces/genesis/IProtocolRegistry420.sol'
      - 'contracts/config/predeploy/ProtocolRegistry-predeploy-state.json'
      - 'docs/reference/generated/**'
      - 'scripts/generate-reference-docs.py'
      - 'scripts/reference_deployment_renderer.py'
      - 'scripts/qualify-generated-reference.py'
      - 'scripts/verify-reg-audit-6-generated-metadata.py'
      - 'docs/audit/REG-AUDIT-6-*'
      - '.github/workflows/registry-reg-audit-6.yml'
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact qualification head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Verify REG-AUDIT-6 metadata invariants
        run: python3 scripts/verify-reg-audit-6-generated-metadata.py

      - name: Verify deterministic generated reference
        run: python3 scripts/qualify-generated-reference.py --check

      - name: Test Developer Hub catalogue and network discovery
        working-directory: developer-hub
        run: npm test

      - name: Test shared SDK catalogue consumption
        working-directory: packages/420-sdk
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Confirm no generated-reference drift
        run: |
          set -euo pipefail
          python3 scripts/qualify-generated-reference.py --write
          test -z "$(git status --porcelain -- docs/reference/generated)"
