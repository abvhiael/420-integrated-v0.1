name: Archive verified Resource 8A1 evidence
on:
  push:
    branches: [audit/resource-8a1-baseline-reconciliation]
    paths: ['.github/workflows/resource-8a1-archive-once.yml']
permissions:
  actions: read
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    if: github.repository == 'abvhiael/420-integrated-v0.1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Retain original verified artifact without regeneration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=docs/audit/resource-8a1-evidence
          mkdir -p "$path"
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/15063838751/zip > "$path/compiler-evidence.zip"
          echo "7a1c84a06fc077f5e1d347b10327470bd1673049f12edd90530ffbec92e701d6  $path/compiler-evidence.zip" | sha256sum -c -
          unzip -t "$path/compiler-evidence.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path/compiler-evidence.zip"
          git rm .github/workflows/resource-8a1-archive-once.yml
          git commit -m "Permanently retain verified Resource 8A1 compiler evidence"
          git push origin HEAD:refs/heads/audit/resource-8a1-baseline-reconciliation
