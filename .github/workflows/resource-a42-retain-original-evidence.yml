name: Resource A4.2 retain original evidence
on:
  push:
    branches: [audit/resource-8a3-a42-administration]
    paths: ['.github/workflows/resource-a42-retain-original-evidence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retain:
    if: github.ref == 'refs/heads/audit/resource-8a3-a42-administration'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify and permanently retain original A4.2 archives
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          archive=docs/audit/420RESOURCE-8A3-A4.2-original-artifacts
          mkdir -p "$archive"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15171230866/zip" > "$archive/resource-8a3-compiler-evidence.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15170164943/zip" > "$archive/resource-8a2-compiler-evidence.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15170618318/zip" > "$archive/resource-8a2-indexer-qualification.zip"
          cd "$archive"
          cat > SHA256SUMS <<'EOF'
          7a6450061cb4e8cffd178087f2080560ded20127352146cff45a344fdec705ea  resource-8a3-compiler-evidence.zip
          f3d43d5e04cd8b6ef0b03e38a59c43f46c80ef1de2121435613e5e3c8b36960b  resource-8a2-compiler-evidence.zip
          ab7e69f181f34c560ab189a549b5965a1d490f985c642340738587930e9c2374  resource-8a2-indexer-qualification.zip
          EOF
          sha256sum -c SHA256SUMS
          test "$(wc -c < resource-8a3-compiler-evidence.zip)" -eq 67011
          test "$(wc -c < resource-8a2-compiler-evidence.zip)" -eq 44821
          test "$(wc -c < resource-8a2-indexer-qualification.zip)" -eq 510
          for f in *.zip; do unzip -t "$f"; done
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "$archive"
          if git diff --cached --quiet; then exit 0; fi
          test "$(git ls-remote origin refs/heads/audit/resource-8a3-a42-administration | cut -f1)" = "$EXPECTED_HEAD"
          git commit -m "Retain original verified A4.2 qualification ZIP archives"
          git push origin HEAD:refs/heads/audit/resource-8a3-a42-administration
