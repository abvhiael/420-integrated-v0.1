name: Resource A4.4 retain original evidence
on:
  push:
    branches: [audit/resource-8a3-a44-adversarial]
    paths: ['.github/workflows/resource-a44-retain-original-evidence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retain:
    if: github.ref == 'refs/heads/audit/resource-8a3-a44-adversarial'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Retain and verify original A4.4 qualification logs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          archive=docs/audit/420RESOURCE-8A3-A4.4-original-evidence
          mkdir -p "$archive"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46059379099" > "$archive/run.json"
          jq -e '.head_sha == "fd2cf521bb1001fe43037db5653d03b152617d35" and .conclusion == "success"' "$archive/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46059379099/logs" > "$archive/resource-qualification-46059379099.zip"
          cd "$archive"
          unzip -t resource-qualification-46059379099.zip
          sha256sum resource-qualification-46059379099.zip run.json > SHA256SUMS
          sha256sum -c SHA256SUMS
          unzip -p resource-qualification-46059379099.zip > /tmp/resource-a44-original.log
          for test in testA44DelegateCannotModifyAnotherProvider testA44DelegateUpdatesAuthorizedProvider testA44DisciplinarySuspendedProviderCannotActivate testA44DisqualifiedProviderCannotReinstate testA44MetadataGrantCannotRetireProvider testA44ProviderACannotModifyProviderB testA44RevokedDelegateCannotUpdateProvider testA44UnauthorizedCollateralSponsorRejected; do
            test "$(grep -Fc "[PASS] $test()" /tmp/resource-a44-original.log)" -ge 2
          done
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "$archive"
          if git diff --cached --quiet; then exit 0; fi
          test "$(git ls-remote origin refs/heads/audit/resource-8a3-a44-adversarial | cut -f1)" = "$EXPECTED_HEAD"
          git commit -m "Retain verified original A4.4 qualification run logs"
          git push origin HEAD:refs/heads/audit/resource-8a3-a44-adversarial
