name: Royal Kush Video Poker targeted Level 1
on:
  pull_request:
    paths:
      - 'clients/420bet-lobby/src/royal-kush*'
      - 'clients/420bet-lobby/public/assets/420bet/royal-kush/**'
      - 'clients/420bet-lobby/tests/royal-kush.test.mjs'
      - 'clients/420bet-lobby/src/main.js'
      - 'clients/420bet-lobby/src/catalogue.js'
      - '.github/workflows/royal-kush-level1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  royal-kush-level1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lobby dependencies
        working-directory: clients/420bet-lobby
        run: npm install --no-audit --no-fund
      - name: Royal Kush engine and UI qualification
        working-directory: clients/420bet-lobby
        run: node --test tests/royal-kush.test.mjs
      - name: Vite lobby build
        working-directory: clients/420bet-lobby
        run: npm run build
