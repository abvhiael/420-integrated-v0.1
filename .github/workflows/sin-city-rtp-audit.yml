name: Sin City RTP Monte Carlo qualification
on:
  push:
    branches:
      - calibrate/sin-city-ashtray-94-95
    paths:
      - 'clients/420bet-lobby/tests/sin-city-rtp-audit.mjs'
      - 'clients/420bet-lobby/src/sin-city-engine.js'
      - '.github/workflows/sin-city-rtp-audit.yml'
  workflow_dispatch:
jobs:
  rtp-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/420bet-lobby
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run seeded full-feature RTP Monte Carlo against unchanged engine
        env:
          SPINS_PER_SEED: '500000'
          RTP_SEEDS: '420,1337,20261106,314159,271828'
        run: node tests/sin-city-rtp-audit.mjs | tee /tmp/sin-city-rtp-audit.log
      - name: Save RTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sin-city-rtp-evidence
          path: /tmp/sin-city-rtp-audit.log
          if-no-files-found: ignore
