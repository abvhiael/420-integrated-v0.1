name: 420Stake STAKE-AUDIT-9.2 recovery
on:
  pull_request:
    paths:
      - 'consensus/engine/**'
      - 'consensus/recovery/**'
      - 'consensus/cmd/fourtwentyd/settlement.go'
      - 'go.mod'
      - 'go.sum'
      - 'consensus/systemcall/**'
      - 'consensus/storage/**'
      - 'consensus/devnet/**'
      - 'consensus/finality/tracker.go'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Verify exact head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Targeted recovery qualification
        run: |
          go test ./consensus/recovery
          go test -race -tags blst -count=1 -v ./consensus/recovery ./consensus/crypto/bls ./consensus/engine ./consensus/systemcall ./consensus/storage ./consensus/devnet ./consensus/finality ./execution/systemcall/...
      - name: Build consensus daemon
        run: go build -tags blst -o bin/fourtwentyd ./consensus/cmd/fourtwentyd
