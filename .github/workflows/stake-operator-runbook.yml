name: 420Stake operator runbook qualification
on:
  pull_request:
    paths:
      - 'docs/STAKE-AUDIT-9.7-VALIDATOR-OPERATOR-RUNBOOK.md'
      - 'docs/apps/stake/index.md'
      - 'consensus/cmd/stake-operator-init/**'
      - 'scripts/verify-stake-operator-runbook.py'
      - '.github/workflows/stake-operator-runbook.yml'
      - 'docs/STAKE-AUDIT-9.8-OPERATIONAL-*'
      - 'docs/STAKE-TESTNET-OPERATIONAL-ACCEPTANCE.md'
      - 'deployments/stake-operations/**'
      - 'scripts/qualify-stake-closeout.py'
      - 'scripts/stake-live-operations.py'
      - 'scripts/test-stake-live-operations.py'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Fetch exact comparison base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --filter=blob:none --no-tags origin "$BASE_SHA"
      - name: Route only changed operational qualifications
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PYROUTE'
          import os,re,subprocess
          paths=subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA'],'HEAD'],text=True).splitlines()
          operator=any(p.startswith('consensus/cmd/stake-operator-init/') or p in {'docs/STAKE-AUDIT-9.7-VALIDATOR-OPERATOR-RUNBOOK.md','docs/apps/stake/index.md','scripts/verify-stake-operator-runbook.py'} for p in paths)
          closeout=any(p.startswith(('docs/STAKE-AUDIT-9.8-OPERATIONAL-','deployments/stake-operations/')) or p in {'docs/STAKE-TESTNET-OPERATIONAL-ACCEPTANCE.md','scripts/qualify-stake-closeout.py','scripts/stake-live-operations.py','scripts/test-stake-live-operations.py'} for p in paths)
          if '.github/workflows/stake-operator-runbook.yml' in paths and not closeout:operator=True
          doc='docs/STAKE-AUDIT-9.7-VALIDATOR-OPERATOR-RUNBOOK.md'
          other_operator=any(p.startswith('consensus/cmd/stake-operator-init/') or p in {'docs/apps/stake/index.md','scripts/verify-stake-operator-runbook.py'} for p in paths)
          if doc in paths and not other_operator:
              old=subprocess.check_output(['git','show',os.environ['BASE_SHA']+':'+doc],text=True)
              new=open(doc).read()
              commands=lambda text:re.findall(r'```(?:bash|sh|shell)\n(.*?)```',text,re.S)
              if commands(old)==commands(new) and commands(new):
                  operator=False
                  os.makedirs('stake-operator-evidence',exist_ok=True)
                  open('stake-operator-evidence/prose-only.txt','w').write('All previously qualified shell blocks unchanged; prose is reviewed by the changed-scope owner.\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('OPERATOR_CHANGED='+str(operator).lower()+'\nCLOSEOUT_CHANGED='+str(closeout).lower()+'\nSTAKE_EVIDENCE_STEP='+('9-8' if closeout else '9-7')+'\n')
          PYROUTE
      - uses: actions/setup-go@v5
        if: env.OPERATOR_CHANGED == 'true'
        with:
          go-version: '1.25.3'
          cache: true
      - name: Qualify documented interfaces and first-use initializer
        if: env.OPERATOR_CHANGED == 'true'
        run: |
          set -euo pipefail
          mkdir -p stake-operator-evidence
          go test -race -tags blst -count=1 -v ./consensus/cmd/stake-operator-init 2>&1 | tee stake-operator-evidence/initializer-tests.log
          go vet -tags blst ./consensus/cmd/stake-operator-init
          python3 scripts/verify-stake-operator-runbook.py --output stake-operator-evidence > stake-operator-evidence/commands.log
      - name: Qualify exact-head operational closeout and inherited evidence
        if: env.CLOSEOUT_CHANGED == 'true'
        run: |
          mkdir -p stake-operator-evidence
          python3 - <<'PYFETCH'
          import json,re,subprocess
          ledger=json.load(open('docs/STAKE-AUDIT-9.8-OPERATIONAL-QUALIFICATION.json'))
          refs={ledger['baseMain']}|{r['qualifiedSource'] for r in ledger['evidence']}
          assert all(re.fullmatch('[0-9a-f]{40}',r) for r in refs)
          subprocess.run(['git','fetch','--filter=blob:none','--no-tags','origin',*sorted(refs)],check=True)
          PYFETCH
          python3 scripts/qualify-stake-closeout.py --output stake-operator-evidence > stake-operator-evidence/closeout.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stake-audit-${{ env.STAKE_EVIDENCE_STEP }}-operator-${{ github.event.pull_request.head.sha }}
          path: stake-operator-evidence/
          if-no-files-found: error
