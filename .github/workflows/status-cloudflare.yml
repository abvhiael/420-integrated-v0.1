name: 420Status Cloudflare

on:
  pull_request:
    paths:
      - 'status/web/**'
      - 'status/cloudflare/**'
      - '.github/workflows/status-cloudflare.yml'
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy status.420integrated.org after qualification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify branded Status assets
        run: |
          grep -q 'INTEGRATED' status/web/static/index.html
          grep -qi 'status.420integrated.org' status/cloudflare/README.md
          grep -q '#45b84a' status/web/static/app.css
          grep -q '#273b9c' status/web/static/app.css
      - name: Install pinned Cloudflare dependencies
        working-directory: status/cloudflare
        run: npm install --no-audit --no-fund
      - name: Check Cloudflare Worker syntax
        working-directory: status/cloudflare
        run: npm run check
      - name: Test Cloudflare edge behavior
        working-directory: status/cloudflare
        run: npm test
      - name: Validate Wrangler project and static asset bundle
        working-directory: status/cloudflare
        run: npx wrangler deploy --dry-run --outdir /tmp/420status-worker
      - name: Test Status
        run: go test ./status/...
      - name: Vet Status
        run: go vet ./status/...
      - name: Build Status
        run: go build ./status/cmd/status420

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true
    needs: qualify
    runs-on: ubuntu-latest
    environment: status-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Install pinned project dependencies
        working-directory: status/cloudflare
        run: npm install --no-audit --no-fund
      - name: Configure optional Status origin
        working-directory: status/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STATUS_ORIGIN: ${{ secrets.STATUS_ORIGIN }}
        run: |
          if [ -z "$STATUS_ORIGIN" ]; then
            echo "Deploying branded Status shell without backend origin; API routes will fail closed with 503."
            exit 0
          fi
          case "$STATUS_ORIGIN" in
            https://*) ;;
            *) echo "STATUS_ORIGIN must use https" >&2; exit 1 ;;
          esac
          printf '%s' "$STATUS_ORIGIN" | npx wrangler secret put STATUS_ORIGIN
      - name: Deploy status.420integrated.org
        working-directory: status/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
