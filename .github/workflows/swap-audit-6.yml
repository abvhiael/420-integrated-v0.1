name: 420Swap SWAP-AUDIT-6 Predeploy Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/src/swap/GenesisDEXFactory.sol"
      - "contracts/src/swap/PublicBatchAuction.sol"
      - "contracts/src/swap/TWAPOracle.sol"
      - "contracts/src/swap/ApprovedQuoteAssetRegistry.sol"
      - "contracts/src/swap/CanonicalSwapExecutor420.sol"
      - "contracts/src/swap/CanonicalConstantProductPool420.sol"
      - "contracts/src/system/GenesisResidentAccess420.sol"
      - "contracts/src/system/SystemAccess.sol"
      - "contracts/test/SwapGenesisDEXFactory420.t.sol"
      - "contracts/test/SwapGenesisIntegration420.t.sol"
      - "contracts/artifacts/GenesisDEXFactory.json"
      - "contracts/artifacts/PublicBatchAuction.json"
      - "contracts/artifacts/TWAPOracle.json"
      - "contracts/artifacts/ApprovedQuoteAssetRegistry.json"
      - "contracts/artifacts/CanonicalSwapExecutor420.json"
      - "contracts/artifacts/CanonicalConstantProductPool420.json"
      - "contracts/config/predeploy/GenesisDEXFactory-predeploy-state.json"
      - "contracts/config/predeploy/PublicBatchAuction-predeploy-state.json"
      - "contracts/config/predeploy/TWAPOracle-predeploy-state.json"
      - "contracts/config/predeploy/ApprovedQuoteAssetRegistry-predeploy-state.json"
      - "contracts/config/predeploy/predeploy-plan.json"
      - "contracts/config/predeploy/storage-init.json"
      - "contracts/config/deployment-manifest.json"
      - "contracts/config/genesis-address-namespace.json"
      - "contracts/foundry.toml"
      - "contracts/config/security/toolchain.json"
      - "scripts/generate-swap-audit-6-predeploy.py"
      - "scripts/verify-swap-audit-6-predeploy.py"
      - ".github/workflows/swap-audit-6.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swap-audit-6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify pinned compiler settings
        working-directory: contracts
        run: |
          set -euo pipefail
          CONFIG="$(forge config)"
          grep -q 'solc = "0.8.24"' <<<"$CONFIG" || grep -q 'solc_version = "0.8.24"' <<<"$CONFIG"
          grep -q 'evm_version = "cancun"' <<<"$CONFIG"
          grep -q 'optimizer = true' <<<"$CONFIG"
          grep -q 'optimizer_runs = 200' <<<"$CONFIG"
          grep -q 'via_ir = true' <<<"$CONFIG"

      - name: Compile exact Swap predeploy candidates
        working-directory: contracts
        run: |
          forge build \
            src/system/SystemAccess.sol \
            src/system/GenesisResidentAccess420.sol \
            src/swap/GenesisDEXFactory.sol \
            src/swap/PublicBatchAuction.sol \
            src/swap/TWAPOracle.sol \
            src/swap/ApprovedQuoteAssetRegistry.sol \
            src/swap/CanonicalSwapExecutor420.sol \
            src/swap/CanonicalConstantProductPool420.sol \
            test/SwapGenesisDEXFactory420.t.sol \
            test/SwapGenesisIntegration420.t.sol \
            --sizes

      - name: Generate deterministic Swap compiler/predeploy evidence
        run: python3 scripts/generate-swap-audit-6-predeploy.py --write --print

      - name: Verify reproducible Swap predeploy evidence
        run: |
          set -euo pipefail
          python3 scripts/generate-swap-audit-6-predeploy.py --check
          python3 scripts/verify-swap-audit-6-predeploy.py

      - name: Genesis DEX deterministic-predeploy regression
        working-directory: contracts
        run: forge test --match-path test/SwapGenesisDEXFactory420.t.sol -vvv

      - name: Swap Genesis integration regression
        working-directory: contracts
        run: forge test --match-path test/SwapGenesisIntegration420.t.sol -vvv

      - name: Commit generated SWAP-AUDIT-6 outputs when absent or stale
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          PATHS=(
            contracts/artifacts/GenesisDEXFactory.json
            contracts/artifacts/PublicBatchAuction.json
            contracts/artifacts/TWAPOracle.json
            contracts/artifacts/ApprovedQuoteAssetRegistry.json
            contracts/artifacts/CanonicalSwapExecutor420.json
            contracts/artifacts/CanonicalConstantProductPool420.json
            contracts/config/predeploy/GenesisDEXFactory-predeploy-state.json
            contracts/config/predeploy/PublicBatchAuction-predeploy-state.json
            contracts/config/predeploy/TWAPOracle-predeploy-state.json
            contracts/config/predeploy/ApprovedQuoteAssetRegistry-predeploy-state.json
            contracts/config/predeploy/predeploy-plan.json
            contracts/config/deployment-manifest.json
          )
          STATUS="$(git status --porcelain -- "${PATHS[@]}")"
          if [ -z "$STATUS" ]; then
            echo "Generated SWAP-AUDIT-6 outputs already current."
            exit 0
          fi
          echo "$STATUS"
          git config user.name "420 Integrated CI"
          git config user.email "actions@users.noreply.github.com"
          git add "${PATHS[@]}"
          git commit -m "Swap: retain SWAP-AUDIT-6 deterministic artifacts"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload SWAP-AUDIT-6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swap-audit-6-${{ github.sha }}
          path: |
            contracts/artifacts/GenesisDEXFactory.json
            contracts/artifacts/PublicBatchAuction.json
            contracts/artifacts/TWAPOracle.json
            contracts/artifacts/ApprovedQuoteAssetRegistry.json
            contracts/artifacts/CanonicalSwapExecutor420.json
            contracts/artifacts/CanonicalConstantProductPool420.json
            contracts/config/predeploy/GenesisDEXFactory-predeploy-state.json
            contracts/config/predeploy/PublicBatchAuction-predeploy-state.json
            contracts/config/predeploy/TWAPOracle-predeploy-state.json
            contracts/config/predeploy/ApprovedQuoteAssetRegistry-predeploy-state.json
            contracts/config/predeploy/predeploy-plan.json
            contracts/config/deployment-manifest.json
          if-no-files-found: warn
          retention-days: 30
