name: 420Swap Audit Qualification

on:
  push:
    branches:
      - audit/420swap-complete-20261001
    paths:
      - "contracts/src/swap/**"
      - "contracts/test/Swap*.t.sol"
      - "contracts/test/CanonicalConstantProductPool420.t.sol"
      - "contracts/test/PaySwap*.t.sol"
      - "contracts/config/swap/**"
      - "contracts/config/genesis-dapp-contract-map.json"
      - "scripts/verify-420swap-interface-v1.py"
      - "scripts/verify-genesis-dapps.py"
      - "exchange/web/**"
      - "docs/apps/swap/**"
      - ".github/workflows/swap-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "contracts/src/swap/**"
      - "contracts/test/Swap*.t.sol"
      - "contracts/test/CanonicalConstantProductPool420.t.sol"
      - "contracts/test/PaySwap*.t.sol"
      - "contracts/config/swap/**"
      - "contracts/config/genesis-dapp-contract-map.json"
      - "scripts/verify-420swap-interface-v1.py"
      - "scripts/verify-genesis-dapps.py"
      - "exchange/web/**"
      - "docs/apps/swap/**"
      - ".github/workflows/swap-audit.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swap-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Swap static verification
        run: python3 scripts/verify-420swap-interface-v1.py
      - name: Build swap contracts and tests
        working-directory: contracts
        run: |
          forge build src/swap test/CanonicalConstantProductPool420.t.sol test/SwapGenesisIntegration420.t.sol test/SwapFuzz420.t.sol test/SwapInvariant420.t.sol test/PaySwapGenesisIntegration420.t.sol test/PaySwapBridgeGenesisIntegration420.t.sol --force --sizes
      - name: Canonical pool tests
        working-directory: contracts
        run: forge test --match-path test/CanonicalConstantProductPool420.t.sol -vvv
      - name: Swap integration tests
        working-directory: contracts
        run: forge test --match-path test/SwapGenesisIntegration420.t.sol -vvv
      - name: Swap fuzz tests
        working-directory: contracts
        run: forge test --match-path test/SwapFuzz420.t.sol -vvv
      - name: Swap invariant tests
        working-directory: contracts
        run: forge test --match-path test/SwapInvariant420.t.sol -vvv
      - name: Pay/Swap integration tests
        working-directory: contracts
        run: |
          forge test --match-path test/PaySwapGenesisIntegration420.t.sol -vvv
          forge test --match-path test/PaySwapBridgeGenesisIntegration420.t.sol -vvv

  swap-user-surface:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: exchange/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          EXCHANGE_DEPLOYMENT_MODE: qualification
