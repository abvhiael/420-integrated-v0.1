name: 420Treasury audit qualification

on:
  pull_request:
    paths:
      - 'contracts/src/treasury/**'
      - 'contracts/test/Treasury*.t.sol'
      - 'contracts/test/GrantsGenesis420.t.sol'
      - 'contracts/src/grants/GrantMilestoneRegistry420.sol'
      - 'contracts/config/420treasury-genesis.json'
      - 'contracts/config/treasury/treasury-audit-6-release-materialization.json'
      - 'contracts/test/TreasuryDeploymentBinding420.t.sol'
      - 'scripts/verify-treasury-audit-6-release.py'
      - 'contracts/config/genesis-canonical-addresses.json'
      - 'contracts/config/genesis-address-namespace.json'
      - '420-indexer/descriptors/treasury420-v1.json'
      - '420-indexer/src/treasury-descriptors.ts'
      - '420-indexer/src/treasury-read-model.ts'
      - '420-indexer/src/api-surface.ts'
      - '420-indexer/src/http-transport.ts'
      - '420-indexer/src/index.ts'
      - '420-indexer/test/treasury420-integration.test.ts'
      - '420-indexer/test/http-transport.test.ts'
      - 'analytics/indexerclient/client.go'
      - 'analytics/indexerclient/client_test.go'
      - 'analytics/metrics/economic.go'
      - 'analytics/metrics/economic_test.go'
      - 'scripts/verify-treasury-audit-5-descriptor.py'
      - 'docs/architecture/protocols/stake-governance-treasury-grants.md'
      - 'docs/architecture/decisions/TREASURY-AUDIT-4-VAULT-RELEASE-EVIDENCE-MODEL.md'
      - '.github/workflows/treasury-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: treasury-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'audit/420treasury-')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FOUNDRY_PROFILE: pr

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact qualification head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Check Treasury Solidity formatting
        working-directory: contracts
        run: |
          forge fmt --check \
            src/treasury/TreasuryPolicyRegistry420.sol \
            src/treasury/TreasuryDisbursementRegistry420.sol \
            src/treasury/TreasuryRouter420.sol

      - name: Build Treasury contracts and affected Grants consumer tests
        working-directory: contracts
        run: forge build src/treasury src/grants/GrantMilestoneRegistry420.sol test/TreasuryGenesis420.t.sol test/TreasurySecurityProperties420.t.sol test/GrantsGenesis420.t.sol

      - name: Verify modern Treasury descriptor against compiled ABI
        run: python3 scripts/verify-treasury-audit-5-descriptor.py

      - name: Verify TREASURY-AUDIT-6 release materialization
        run: python3 scripts/verify-treasury-audit-6-release.py

      - name: Retain Treasury compiled artifact identities
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          names = [
              "TreasuryAuthorization420",
              "TreasuryPolicyRegistry420",
              "TreasuryBudgetRegistry420",
              "TreasuryDisbursementRegistry420",
              "TreasuryRouter420",
          ]
          records = []
          for name in names:
              path = Path("contracts/out") / f"{name}.sol" / f"{name}.json"
              payload = path.read_bytes()
              artifact = json.loads(payload)
              deployed = artifact.get("deployedBytecode", {}).get("object", "")
              if deployed.startswith("0x"):
                  deployed = deployed[2:]
              records.append({
                  "contract": name,
                  "artifact_sha256": hashlib.sha256(payload).hexdigest(),
                  "compiler_runtime_template_sha256": hashlib.sha256(bytes.fromhex(deployed)).hexdigest() if deployed else None,
              })
          print("TREASURY_AUDIT_6_ARTIFACT_IDENTITIES=" + json.dumps(records, sort_keys=True))
          PY

      - name: Run Treasury deployment and Registry binding qualification
        working-directory: contracts
        run: forge test --match-path test/TreasuryDeploymentBinding420.t.sol -vvvv

      - name: Run Treasury lifecycle regression suite
        working-directory: contracts
        run: forge test --match-path test/TreasuryGenesis420.t.sol -vvv

      - name: Run Treasury security/property suite
        working-directory: contracts
        run: forge test --match-path test/TreasurySecurityProperties420.t.sol -vvv

      - name: Run affected Grants release-evidence consumer suite
        working-directory: contracts
        run: forge test --match-path test/GrantsGenesis420.t.sol -vvv

      - name: Build affected 420Indexer integration surface
        working-directory: 420-indexer
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run build

      - name: Run Treasury Indexer descriptor/read/reorg/API qualification
        working-directory: 420-indexer
        run: node --test --test-concurrency=1 dist/test/treasury420-integration.test.js dist/test/http-transport.test.js dist/test/api-surface.test.js

      - name: Run affected Analytics Treasury boundary qualification
        run: go test ./analytics/indexerclient ./analytics/metrics

      - name: Verify Treasury canonical authority/config boundary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          treasury = json.loads((root / "contracts/config/420treasury-genesis.json").read_text())
          namespace = json.loads((root / "contracts/config/genesis-address-namespace.json").read_text())

          errors = []
          def need(condition, message):
              if not condition:
                  errors.append(message)

          need(treasury.get("schema") == "420treasury-genesis-v1", "Treasury schema drift")
          need(treasury.get("suite") == "420 Treasury", "Treasury suite identity drift")
          need(treasury.get("new_frozen_predeploy_required") is False, "Treasury unexpectedly requires a new frozen predeploy")
          need("420Vault VAULT_TREASURY" in treasury.get("custody_model", ""), "Treasury/420Vault custody boundary drift")
          need("GovernanceTimelock/Civic-controlled" in treasury.get("governance_model", ""), "Treasury governance boundary drift")

          evidence = treasury.get("vault_release_evidence_model", {})
          need(evidence.get("version") == "420/TREASURY/VAULT_RELEASE_COMMITMENT/V1", "Vault release evidence model version drift")
          need(evidence.get("mode") == "AUTHORIZED_EXECUTOR_COMMITMENT_ONLY", "Vault release evidence model mode drift")
          need(evidence.get("treasury_verifies_vault_release") is False, "Treasury must not claim cryptographic Vault verification")
          need(evidence.get("custody_authority") == "420Vault VAULT_TREASURY", "Vault custody authority drift")
          need("not independent cryptographic proof" in evidence.get("consumer_rule", ""), "consumer evidence semantics drift")

          invariants = treasury.get("invariants", [])
          for n in range(1, 11):
              prefix = f"TREASURY-INV-{n:03d}:"
              need(any(x.startswith(prefix) for x in invariants), f"missing {prefix[:-1]}")

          resolved = {x.get("id"): x for x in namespace.get("registryResolved", [])}
          router = resolved.get("treasury-router")
          need(router is not None, "treasury-router missing from registry-resolved namespace")
          if router is not None:
              need(router.get("contract") == "TreasuryRouter420.sol", "treasury-router contract binding drift")
              need(router.get("status") == "REGISTRY_RESOLVED_NO_FIXED_GENESIS_ADDRESS", "treasury-router registry status drift")

          fixed_names = {x.get("name") for x in namespace.get("fixedAssignments", [])}
          need("TreasuryRouter420" not in fixed_names and "TreasuryRouter" not in fixed_names, "TreasuryRouter unexpectedly became a fixed Genesis predeploy")

          if errors:
              print(json.dumps({"pass": False, "errors": errors}, indent=2))
              raise SystemExit(2)
          print(json.dumps({"pass": True, "invariants": len(invariants), "treasuryRouter": router}, indent=2))
          PY

      - name: Verify Vault release evidence consumer inventory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("contracts/src")
          users = []
          for path in sorted(root.rglob("*.sol")):
              text = path.read_text(encoding="utf-8")
              if "vaultReleaseHash" in text:
                  users.append(path.as_posix())

          expected = {
              "contracts/src/treasury/TreasuryDisbursementRegistry420.sol",
              "contracts/src/grants/GrantMilestoneRegistry420.sol",
          }
          if set(users) != expected:
              raise SystemExit(f"unqualified vaultReleaseHash consumer inventory drift: {users}")

          grants = Path("contracts/src/grants/GrantMilestoneRegistry420.sol").read_text(encoding="utf-8")
          required = [
              "d.state!=ITreasuryDisbursementGrant420.State.EXECUTED",
              "d.vaultReleaseHash==bytes32(0)",
          ]
          missing = [item for item in required if item not in grants]
          if missing:
              raise SystemExit(f"Grants release-evidence gate drift: {missing}")

          print("Vault release evidence consumer inventory PASS")
          print("\n".join(users))
          PY

      - name: Install Slither for Treasury security qualification
        run: python -m pip install --disable-pip-version-check slither-analyzer

      - name: Targeted Treasury Slither high-severity gate
        working-directory: contracts
        shell: bash
        run: |
          cat > TreasuryAuditSlitherTarget.sol <<'SOL'
          // SPDX-License-Identifier: GPL-3.0
          pragma solidity ^0.8.24;
          import "./src/treasury/TreasuryIds420.sol";
          import "./src/treasury/TreasuryAuthorization420.sol";
          import "./src/treasury/TreasuryPolicyRegistry420.sol";
          import "./src/treasury/TreasuryBudgetRegistry420.sol";
          import "./src/treasury/TreasuryDisbursementRegistry420.sol";
          import "./src/treasury/TreasuryRouter420.sol";
          SOL
          set +e
          slither TreasuryAuditSlitherTarget.sol --json /tmp/treasury-slither.json >/tmp/treasury-slither.txt 2>&1
          STATUS=$?
          set -e
          rm -f TreasuryAuditSlitherTarget.sol
          python - <<'PY'
          import json
          import pathlib

          report_path = pathlib.Path("/tmp/treasury-slither.json")
          log_path = pathlib.Path("/tmp/treasury-slither.txt")
          if not report_path.exists():
              print(log_path.read_text(errors="replace"))
              raise SystemExit("Slither did not produce JSON output")

          report = json.loads(report_path.read_text())
          if report.get("success") is not True:
              print(log_path.read_text(errors="replace"))
              raise SystemExit(f"Slither analysis failed: {report.get('error') or 'unknown error'}")

          findings = []
          high = []
          for detector in report.get("results", {}).get("detectors", []):
              treasury_elements = [
                  element for element in detector.get("elements", [])
                  if element.get("source_mapping", {}).get("filename_relative", "").startswith("src/treasury/")
              ]
              if not treasury_elements:
                  continue
              item = {
                  "check": detector.get("check"),
                  "impact": detector.get("impact"),
                  "confidence": detector.get("confidence"),
                  "description": detector.get("description", "").splitlines()[0],
              }
              findings.append(item)
              if detector.get("impact") == "High":
                  high.append(item)

          print(json.dumps({"treasuryFindings": findings, "highSeverity": high}, indent=2))
          if high:
              raise SystemExit("High-severity Slither finding in Treasury source")
          PY

      - name: Treasury forbidden primitive scan
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path("contracts/src/treasury")
          patterns = {
              "tx.origin": re.compile(r"\btx\.origin\b"),
              "selfdestruct": re.compile(r"\bselfdestruct\s*\("),
              "delegatecall": re.compile(r"\.delegatecall\s*\("),
          }
          hits = []
          for path in sorted(root.glob("*.sol")):
              text = path.read_text(encoding="utf-8")
              for name, pattern in patterns.items():
                  for match in pattern.finditer(text):
                      line = text.count("\\n", 0, match.start()) + 1
                      hits.append(f"{path}:{line}: {name}")
          if hits:
              print("Forbidden authority/opcode primitive found in Treasury sources:")
              print("\\n".join(hits))
              raise SystemExit(1)
          print("Treasury forbidden primitive scan PASS")
          PY
