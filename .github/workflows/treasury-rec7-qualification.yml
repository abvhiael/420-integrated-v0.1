name: Treasury REC-7 qualification
on:
  pull_request:
    paths:
      - '420-indexer/**'
      - 'analytics/indexerclient/**'
      - 'explorer/indexerclient/**'
      - 'indexer/treasuryread/**'
      - 'indexer/api/**'
      - 'indexer/store/**'
      - 'indexer/cmd/indexer420/**'
      - 'explorer/service/**'
      - 'explorer/api/**'
      - 'scripts/verify-exp-0-1-2-indexer-dependencies.py'
      - 'packages/420-sdk/src/treasury*'
      - 'analytics/metrics/economic.go'
      - 'scripts/verify-treasury-audit-5-descriptor.py'
      - '.github/workflows/treasury-rec7-qualification.yml'
permissions:
  contents: read
jobs:
  qualify:
    if: startsWith(github.head_ref, 'audit/treasury-rec-7') && github.head_ref != 'audit/treasury-rec-7-runtime'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      INDEXER_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Compile Treasury event contracts
        working-directory: contracts
        run: forge build src/treasury/TreasuryPolicyRegistry420.sol src/treasury/TreasuryBudgetRegistry420.sol src/treasury/TreasuryDisbursementRegistry420.sol
      - run: python3 scripts/verify-treasury-audit-5-descriptor.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: 420-indexer
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run build
          node --test dist/test/treasury420-integration.test.js dist/test/http-transport.test.js dist/test/api-contract.test.js dist/test/treasury-recovery-postgres.test.js
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./indexer/treasuryread ./analytics/indexerclient ./explorer/indexerclient ./explorer/service ./explorer/api ./analytics/metrics -run Treasury -count=1
      - working-directory: packages/420-sdk
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npx tsc -p tsconfig.json
          node --test test/treasury-projection.test.mjs
  runtime:
    if: github.head_ref == 'audit/treasury-rec-7-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Treasury runtime, Explorer and Analytics regressions
        run: go test -v ./indexer/... ./explorer/... ./analytics/indexerclient ./analytics/metrics -count=1
      - name: Treasury and Explorer race qualification
        run: go test -race ./indexer/treasuryread ./indexer/api ./indexer/store ./explorer/service ./explorer/api -run Treasury -count=1
      - name: Explorer source inventory
        run: python3 scripts/verify-exp-0-1-2-indexer-dependencies.py
      - name: Go static checks
        run: go vet ./indexer/... ./explorer/... ./analytics/indexerclient ./analytics/metrics
