name: 420Treasury release executor qualification
on:
  pull_request:
    paths:
      - 'contracts/src/treasury/TreasuryReleaseExecutor420.sol'
      - 'contracts/src/treasury/TreasuryVaultBinding420.sol'
      - 'contracts/test/TreasuryReleaseTestFixtures420.sol'
      - 'scripts/treasury/**'
      - 'contracts/config/treasury/treasury-release-executor.json'
      - '.github/workflows/treasury-release-executor-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: treasury-release-executor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FOUNDRY_PROFILE: pr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Prepare exact-source isolated Treasury import closure
        working-directory: contracts
        shell: bash
        run: |
          set -euo pipefail
          export TREASURY_ROOT="$RUNNER_TEMP/treasury-release-executor"
          python3 - <<'PY'
          import hashlib, json, os, re, shutil
          from pathlib import Path
          source = Path.cwd().resolve()
          dest = Path(os.environ["TREASURY_ROOT"])
          owners = [
              "test/TreasuryReleaseTestFixtures420.sol",
          ]
          pending = [source / x for x in owners]
          seen = set()
          pattern = re.compile(r'\bimport\s+(?:[^;]*?\bfrom\s+)?["\x27]([^"\x27]+)["\x27]\s*;')
          while pending:
              p = pending.pop().resolve()
              if p in seen:
                  continue
              if not p.is_relative_to(source) or not p.is_file():
                  raise RuntimeError(f"missing or external import: {p}")
              seen.add(p)
              for name in pattern.findall(p.read_text()):
                  if name.startswith("forge-std/"):
                      pending.append(source / name)
                  else:
                      pending.append(p.parent / name)
          dest.mkdir(parents=True, exist_ok=True)
          for p in sorted(seen):
              target = dest / p.relative_to(source)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(p, target)
              assert target.read_bytes() == p.read_bytes()
          shutil.copyfile(source / "foundry.toml", dest / "foundry.toml")
          (dest / "remappings.txt").write_text("forge-std/=forge-std/\n")
          print("Exact import closure:", json.dumps({
              "owners": owners,
              "source_sha256": {str(p.relative_to(source)): hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(seen)},
              "foundry_config_sha256": hashlib.sha256((source / "foundry.toml").read_bytes()).hexdigest(),
          }, sort_keys=True))
          PY
          echo "TREASURY_ROOT=$TREASURY_ROOT" >> "$GITHUB_ENV"
      - name: Compile real executor and dependency closure
        run: forge build --root "$TREASURY_ROOT" --extra-output storageLayout
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 420-indexer/package-lock.json
      - name: Install locked receipt utility dependency
        run: npm ci --prefix 420-indexer
      - name: Actual Anvil receipt and atomicity qualification
        shell: bash
        run: |
          set -euo pipefail
          anvil --host 127.0.0.1 --port 18545 --chain-id 31337 --silent > "$RUNNER_TEMP/treasury-anvil.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          export TREASURY_RPC_URL=http://127.0.0.1:18545
          for i in $(seq 1 60); do
            if cast chain-id --rpc-url "$TREASURY_RPC_URL" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test "$(cast chain-id --rpc-url "$TREASURY_RPC_URL")" = 31337
          node --test scripts/treasury/release-executor.integration.test.mjs
      - name: Check retained release and documentation commitments
        run: |
          python3 scripts/verify-treasury-audit-6-release.py
          python3 scripts/verify-treasury-audit-7-docs.py
      - name: Retain executor compiled identity
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ["TREASURY_ROOT"])/"out/TreasuryReleaseExecutor420.sol/TreasuryReleaseExecutor420.json"
          a=json.loads(p.read_text())
          print("executor artifact sha256:",hashlib.sha256(p.read_bytes()).hexdigest())
          print("executor runtime template sha256:",hashlib.sha256(bytes.fromhex(a["deployedBytecode"]["object"].removeprefix("0x"))).hexdigest())
          print("executor ABI:",json.dumps(a["abi"],sort_keys=True))
          PY
