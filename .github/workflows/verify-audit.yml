name: 420Verify Audit Qualification

on:
  pull_request:
    paths:
      - 'verify/**'
      - 'docs/420VERIFY*'
      - 'docs/apps/verify/**'
      - 'docs/audit/420VERIFY-AUDIT*'
      - 'contracts/config/420verify-genesis.json'
      - '.github/workflows/verify-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "qualified_sha=$actual"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Enforce 420Verify gofmt
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find verify -type f -name '*.go' -print | sort)
          unformatted="$(gofmt -l "${files[@]}")"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            gofmt -w "${files[@]}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add verify
            git commit -m "chore(verify): apply gofmt across audited Go surface"
            git push origin HEAD:${{ github.head_ref }}
            echo "Applied and pushed gofmt repair; this qualification run is superseded."
            exit 1
          fi

      - name: Run 420Verify tests
        run: go test ./verify/...

      - name: Vet 420Verify
        run: go vet ./verify/...

      - name: Build 420Verify service
        run: go build ./verify/cmd/verify420
