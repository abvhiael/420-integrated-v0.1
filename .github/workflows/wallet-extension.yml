name: 420 Wallet Extension Verification

on:
  push:
    paths:
      - "wallet/extension/**"
      - "wallet/web/**"
      - ".github/workflows/wallet-extension.yml"
  pull_request:
    paths:
      - "wallet/extension/**"
      - "wallet/web/**"
      - ".github/workflows/wallet-extension.yml"
  workflow_dispatch:

jobs:
  verify-wallet-extension:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wallet web/core qualification
        working-directory: wallet/web
        run: |
          npm run check
          npm test
      - name: Extension release qualification
        working-directory: wallet/extension
        run: node scripts/check-release.mjs
