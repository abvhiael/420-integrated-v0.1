name: 420 Wallet Mobile Verification

on:
  push:
    paths:
      - "wallet/mobile/**"
      - "wallet/web/**"
      - ".github/workflows/wallet-mobile.yml"
  pull_request:
    paths:
      - "wallet/mobile/**"
      - "wallet/web/**"
      - ".github/workflows/wallet-mobile.yml"
  workflow_dispatch:

jobs:
  verify-wallet-mobile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Mobile static checks
        working-directory: wallet/mobile
        run: npm run check
      - name: Mobile runtime tests
        working-directory: wallet/mobile
        run: npm test
      - name: Mobile release qualification
        working-directory: wallet/mobile
        run: npm run release:check
      - name: Shared wallet core regression
        working-directory: wallet/web
        run: |
          npm run check
          npm test

  build-android-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run Android native unit tests
        working-directory: wallet/mobile/android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile Android debug application
        working-directory: wallet/mobile/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

  build-ios-native:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: wallet/mobile/ios
        run: xcodegen generate
      - name: Run iOS native unit tests
        working-directory: wallet/mobile/ios
        run: |
          xcodebuild \
            -project Wallet420.xcodeproj \
            -scheme Wallet420 \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Compile iOS simulator application
        working-directory: wallet/mobile/ios
        run: |
          xcodebuild \
            -project Wallet420.xcodeproj \
            -scheme Wallet420 \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
