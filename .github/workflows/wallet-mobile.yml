name: 420 Wallet Mobile Verification

on:
  push:
    paths:
      - "wallet/mobile/**"
      - "wallet/web/**"
      - ".github/workflows/wallet-mobile.yml"
  pull_request:
    paths:
      - "wallet/mobile/**"
      - "wallet/web/**"
      - ".github/workflows/wallet-mobile.yml"
  workflow_dispatch:

jobs:
  verify-wallet-mobile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Mobile static checks
        working-directory: wallet/mobile
        run: npm run check
      - name: Mobile runtime tests
        working-directory: wallet/mobile
        run: npm test
      - name: Mobile release qualification
        working-directory: wallet/mobile
        run: npm run release:check
      - name: Shared wallet core regression
        working-directory: wallet/web
        run: |
          npm run check
          npm test

  build-android-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run Android native unit tests
        working-directory: wallet/mobile/android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile Android debug application
        working-directory: wallet/mobile/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Build unsigned Android release APK and AAB
        working-directory: wallet/mobile/android
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wallet420-android-release-${{ github.sha }}
          if-no-files-found: error
          path: |
            wallet/mobile/android/app/build/outputs/apk/release/*.apk
            wallet/mobile/android/app/build/outputs/bundle/release/*.aab
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: wallet/mobile/android
          script: gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace

  build-ios-native:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: wallet/mobile/ios
        run: xcodegen generate
      - name: Create and boot available iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          runtimes = [r for r in data.get("runtimes", []) if r.get("isAvailable") and r.get("platform") == "iOS"]
          if not runtimes:
              raise SystemExit("no available iOS simulator runtime")
          runtimes.sort(key=lambda r: tuple(int(x) for x in r.get("version", "0").split(".")), reverse=True)
          print(runtimes[0]["identifier"])
          ')"
          DEVICE_TYPE_ID="$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          types = json.load(sys.stdin).get("devicetypes", [])
          preferred = ["iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro", "iPhone 15"]
          by_name = {d.get("name"): d.get("identifier") for d in types}
          for name in preferred:
              if by_name.get(name):
                  print(by_name[name])
                  break
          else:
              fallback = next((d.get("identifier") for d in types if str(d.get("name", "")).startswith("iPhone")), None)
              if not fallback:
                  raise SystemExit("no available iPhone simulator device type")
              print(fallback)
          ')"
          UDID="$(xcrun simctl create Wallet420-CI "$DEVICE_TYPE_ID" "$RUNTIME_ID")"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "IOS_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using iOS simulator runtime $RUNTIME_ID, device type $DEVICE_TYPE_ID, UDID $UDID"
      - name: Run iOS native unit + UI simulator tests
        working-directory: wallet/mobile/ios
        run: |
          xcodebuild \
            -project Wallet420.xcodeproj \
            -scheme Wallet420 \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Compile iOS simulator application
        working-directory: wallet/mobile/ios
        run: |
          xcodebuild \
            -project Wallet420.xcodeproj \
            -scheme Wallet420 \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build unsigned iOS generic-device archive
        working-directory: wallet/mobile/ios
        run: |
          rm -rf build/Wallet420.xcarchive
          xcodebuild \
            -project Wallet420.xcodeproj \
            -scheme Wallet420 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Wallet420.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive
          test -d build/Wallet420.xcarchive
          test -f "build/Wallet420.xcarchive/Info.plist"
      - name: Upload iOS unsigned archive
        uses: actions/upload-artifact@v4
        with:
          name: wallet420-ios-unsigned-archive-${{ github.sha }}
          if-no-files-found: error
          path: wallet/mobile/ios/build/Wallet420.xcarchive
