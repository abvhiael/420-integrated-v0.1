name: 420Wallet W15.6-M12 Reproducible Browser Packages
on:
  pull_request:
    paths:
      - "wallet/extension/scripts/build-firefox.mjs"
      - "wallet/extension/scripts/qualify-reproducible.mjs"
      - "wallet/extension/scripts/qualify-firefox.py"
      - "wallet/extension/scripts/build.mjs"
      - "wallet/extension/package.json"
      - "wallet/extension/manifest.json"
      - ".github/workflows/wallet-security-m12.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser SDK toolchains
        working-directory: wallet/extension
        run: npm ci --no-audit --no-fund
      - name: Byte-reproduce Chromium package, isolate Firefox event page and verify identical source payload
        working-directory: wallet/extension
        env:
          WALLET_HARDWARE_RELEASE: '1'
          WALLET_CONNECT_RELEASE: '1'
          WALLET_FIREFOX_EXTENSION_ID: "ci-qualification@420integrated.invalid"
        run: node scripts/qualify-reproducible.mjs
      - name: Firefox Manifest V3 browser schema lint only (not live Firefox runtime acceptance)
        working-directory: wallet/extension
        run: npm exec --yes --package=web-ext@10.8.0 -- web-ext lint --source-dir dist-firefox --self-hosted --warnings-as-errors
      - name: Real Firefox MV3 temporary extension and EIP-1193 deny-by-default smoke
        working-directory: wallet/extension
        run: |
          firefox --version
          python3 -m pip install --disable-pip-version-check --quiet selenium==4.52.0
          python3 scripts/qualify-firefox.py
