name: 420Wallet W15.2 Scoped Solidity Static Security

on:
  pull_request:
    paths:
      - 'contracts/src/accounts/**'
      - 'contracts/src/system/CapabilityRegistry420.sol'
      - '.github/workflows/wallet-w15-2-static-security.yml'

permissions:
  contents: read

jobs:
  wallet-static:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact reviewed source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Slither and Solidity compiler
        run: |
          python -m pip install --disable-pip-version-check slither-analyzer==0.11.6
          solc-select install 0.8.24
          solc-select use 0.8.24
          slither --version
          solc --version
      - name: Analyze focused Wallet authority and gas boundaries
        shell: bash
        working-directory: contracts
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/wallet-w15-2-static
          targets=(
            src/accounts/SmartAccount420.sol
            src/accounts/SmartAccountFactory420.sol
            src/accounts/EntryPoint420.sol
            src/accounts/Paymaster420.sol
            src/accounts/P256WebAuthnVerifier420.sol
            src/accounts/Rip7212P256Verifier420.sol
            src/accounts/SponsorshipPolicy420.sol
            src/system/CapabilityRegistry420.sol
          )
          for target in "${targets[@]}"; do
            name="$(basename "$target" .sol)"
            echo "::group::Analyze $target"
            set +e
            slither "$target" --compile-force-framework solc \
              --solc-args '--optimize --optimize-runs 200 --via-ir --evm-version cancun' \
              --json "../artifacts/wallet-w15-2-static/$name.json" \
              > "../artifacts/wallet-w15-2-static/$name.log" 2>&1
            result=$?
            set -e
            echo "$result" > "../artifacts/wallet-w15-2-static/$name.exit"
            test -s "../artifacts/wallet-w15-2-static/$name.json" || {
              tail -100 "../artifacts/wallet-w15-2-static/$name.log"
              exit 1
            }
            echo "::endgroup::"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("../artifacts/wallet-w15-2-static")
          summary = []
          severe = []
          for path in sorted(root.glob("*.json")):
              data = json.loads(path.read_text())
              if not data.get("success"):
                  raise SystemExit(f"Static analysis did not complete for {path.name}: {data.get('error')}")
              detectors = (data.get("results") or {}).get("detectors") or []
              for d in detectors:
                  record = {"file":path.name,"check":d.get("check"),"impact":d.get("impact"),
                            "confidence":d.get("confidence"),"description":d.get("description","")[:1200]}
                  summary.append(record)
                  if d.get("impact") in ("High","Medium"):
                      severe.append(record)
          (root/"findings.json").write_text(json.dumps({"findings":summary,"high_medium":severe},indent=2))
          print(f"Analyzed {len(list(root.glob('*.json')))-1} Wallet targets; {len(summary)} findings; {len(severe)} high/medium findings")
          for item in severe:
              print(f"{item['file']}: [{item['impact']}/{item['confidence']}] {item['check']}: {item['description'][:250]}")
          if severe:
              raise SystemExit("Untriaged Wallet high/medium static-security findings")
          PY
      - name: Preserve static security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-w15-2-static-security
          path: artifacts/wallet-w15-2-static/
          retention-days: 90
          if-no-files-found: warn
