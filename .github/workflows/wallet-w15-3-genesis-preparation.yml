name: 420Wallet W15.3 Offline Genesis Deployment Artifacts
on:
  pull_request:
    paths:
      - 'scripts/prepare-wallet-w15-3.py'
      - 'scripts/test-wallet-w15-3.py'
      - 'docs/wallet/W15.3-GENESIS-DEPLOYMENT-PREPARATION.md'
      - 'contracts/config/genesis-address-namespace.json'
      - 'contracts/config/genesis-canonical-addresses.json'
      - 'contracts/config/system-addresses.json'
      - 'config/system-addresses.json'
      - 'contracts/config/predeploy/predeploy-plan.json'
      - 'contracts/config/deployment-manifest.json'
      - 'contracts/config/420wallet-genesis.json'
      - 'wallet/deployment-inventory.json'
      - 'contracts/foundry.toml'
      - 'contracts/src/accounts/**'
      - 'contracts/src/system/CapabilityRegistry420.sol'
      - '.github/workflows/wallet-w15-3-genesis-preparation.yml'
permissions:
  contents: read
jobs:
  offline-wallet-genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOUNDRY_PROFILE: default
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - name: Install independent pinned Keccak
        run: python -m pip install --disable-pip-version-check pycryptodome==3.23.0
      - name: Verify frozen namespace and retired address tests
        run: |
          python scripts/test-wallet-w15-3.py
          python scripts/prepare-wallet-w15-3.py --namespace-only
      - name: Compile eight scoped Wallet contract artifacts
        working-directory: contracts
        run: |
          forge build src/accounts/EntryPoint420.sol src/system/CapabilityRegistry420.sol src/accounts/SmartAccountFactory420.sol src/accounts/SmartAccount420.sol src/accounts/SponsorshipPolicy420.sol src/accounts/Paymaster420.sol src/accounts/Rip7212P256Verifier420.sol src/accounts/P256WebAuthnVerifier420.sol
      - name: Generate and independently verify deterministic offline bundle
        run: |
          python scripts/prepare-wallet-w15-3.py --output artifacts/wallet-w15-3
          python scripts/prepare-wallet-w15-3.py --verify-only --output artifacts/wallet-w15-3
      - name: Upload reproducible bytecode, ABIs and unsigned deployment templates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-w15-3-offline-genesis
          path: artifacts/wallet-w15-3/
          if-no-files-found: warn
          retention-days: 90
