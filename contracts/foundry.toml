[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = [
  { access = "read-write", path = "./out" },
  { access = "read-write", path = "../artifacts/contracts" }
]

fuzz = { runs = 10000, max_test_rejects = 65536, seed = "0x420" }

[invariant]
runs = 512
depth = 128
fail_on_revert = true
call_override = false
dictionary_weight = 80
include_storage = true
include_push_bytes = true

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"

[profile.ci]
fuzz = { runs = 50000, max_test_rejects = 131072, seed = "0x420" }

[profile.ci.invariant]
runs = 2048
depth = 256
fail_on_revert = true
dictionary_weight = 80
include_storage = true
include_push_bytes = true

[profile.coverage]
fuzz = { runs = 256, max_test_rejects = 65536, seed = "0x420" }

[profile.coverage.invariant]
runs = 64
depth = 64
fail_on_revert = true
dictionary_weight = 80
include_storage = true
include_push_bytes = true
