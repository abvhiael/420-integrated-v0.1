[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
fs_permissions = [
  { access = "read-write", path = "./out" },
  { access = "read-write", path = "../artifacts/contracts" },
  { access = "read", path = "../clients/420bet-poker/zkshuffle/fixtures/ws8" }
]

fuzz = { runs = 10000, max_test_rejects = 65536, seed = "0x420" }

[invariant]
runs = 512
depth = 128
fail_on_revert = true
call_override = false
dictionary_weight = 80
include_storage = true
include_push_bytes = true

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"

# Fast pull-request qualification. This catches regressions on every development
# commit without paying the full Genesis hardening cost. Full `ci` and
# `hardening` profiles remain the merge/closeout qualification gates.
[profile.pr]
fuzz = { runs = 2500, max_test_rejects = 65536, seed = "0x420" }

[profile.pr.invariant]
runs = 128
depth = 64
fail_on_revert = true
call_override = false
dictionary_weight = 80
include_storage = true
include_push_bytes = true

[profile.ci]
fuzz = { runs = 50000, max_test_rejects = 131072, seed = "0x420" }

[profile.ci.invariant]
runs = 2048
depth = 256
fail_on_revert = true
dictionary_weight = 80
include_storage = true
include_push_bytes = true

[profile.hardening]
fuzz = { runs = 100000, max_test_rejects = 262144, seed = "0x420420" }

# Isolated tournament integration owner. Existing profiles and their permissions remain unchanged.
[profile.tournament5c5]
src = "src/bet/tournament"
test = "test/tournament-5c5"
script = "script/__empty__"
solc_version = "0.8.30"
via_ir = true
fuzz = { runs = 2500, max_test_rejects = 65536, seed = "0x420" }
fs_permissions = [
  { access = "read", path = "../clients/420bet-poker/zkshuffle/fixtures/ws8" },
  { access = "read", path = "../clients/420bet-poker/zkshuffle/fixtures/tournament-5c5" }
]

[profile.hardening.invariant]
runs = 4096
depth = 384
fail_on_revert = true
call_override = false
dictionary_weight = 90
include_storage = true
include_push_bytes = true

[profile.coverage]
fuzz = { runs = 256, max_test_rejects = 65536, seed = "0x420" }

[profile.coverage.invariant]
runs = 64
depth = 64
fail_on_revert = true
dictionary_weight = 80
include_storage = true
include_push_bytes = true

