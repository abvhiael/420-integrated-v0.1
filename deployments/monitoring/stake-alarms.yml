groups:
  - name: stake-operational-observation
    rules:
      - alert: StakeMonitorUnavailable
        expr: up{job="stake-monitor"} == 0
        for: 45s
        labels: {severity: CRITICAL}
        annotations: {summary: 'Stake observer unavailable; inspect categorical persistence/startup failure'}
      - alert: StakeOperationalCondition
        expr: stake_alarm_active > 0
        labels:
          severity: '{{ $labels.severity }}'
        annotations: {summary: 'Stake operational condition; projections do not authorize settlement'}
      - alert: StakeObservationUnknown
        expr: stake_signal_known == 0
        for: 45s
        labels: {severity: MAJOR}
        annotations: {summary: 'Stake evidence unavailable; retain existing incidents until known healthy'}
