<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">420Mail</title>
<desc id="desc">Gold and teal orbital mail emblem with cannabis leaf and 420Mail wordmark.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="72%">
    <stop offset="0" stop-color="#063933"/>
    <stop offset=".38" stop-color="#032822"/>
    <stop offset="1" stop-color="#020909"/>
  </radialGradient>
  <linearGradient id="goldTeal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff9df"/>
    <stop offset=".18" stop-color="#ffd769"/>
    <stop offset=".44" stop-color="#dcae36"/>
    <stop offset=".62" stop-color="#ffffff"/>
    <stop offset=".8" stop-color="#54fff2"/>
    <stop offset="1" stop-color="#00b8ae"/>
  </linearGradient>
  <linearGradient id="envFill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06352e"/>
    <stop offset=".55" stop-color="#075443"/>
    <stop offset="1" stop-color="#0a2f2b"/>
  </linearGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d3fff8"/>
    <stop offset=".3" stop-color="#52ffcf"/>
    <stop offset=".7" stop-color="#04d08e"/>
    <stop offset="1" stop-color="#009d73"/>
  </linearGradient>
  <linearGradient id="wordGold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff6cf"/>
    <stop offset=".32" stop-color="#ffd46b"/>
    <stop offset=".68" stop-color="#efa826"/>
    <stop offset="1" stop-color="#f7c45a"/>
  </linearGradient>
  <linearGradient id="wordSilver" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".55" stop-color="#f7f7f7"/>
    <stop offset="1" stop-color="#cfd9df"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="smallGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".55"/>
  </filter>
</defs>

<rect width="1200" height="1200" rx="70" fill="url(#bg)"/>
<ellipse cx="600" cy="455" rx="430" ry="305" fill="none" stroke="#18f4df" stroke-width="9" opacity=".85" transform="rotate(-14 600 455)" filter="url(#smallGlow)"/>
<ellipse cx="600" cy="455" rx="470" ry="250" fill="none" stroke="#d6a93f" stroke-width="6" opacity=".58" transform="rotate(19 600 455)"/>
<ellipse cx="600" cy="455" rx="385" ry="345" fill="none" stroke="#0bbfb3" stroke-width="7" opacity=".34" transform="rotate(27 600 455)"/>

<g filter="url(#shadow)">
  <path d="M325 322 Q325 288 360 282 L855 245 Q895 242 905 280 L910 610 Q910 645 873 651 L356 713 Q320 718 315 680 Z" fill="url(#envFill)" stroke="url(#goldTeal)" stroke-width="24" stroke-linejoin="round"/>
  <path d="M342 321 L602 528 Q623 544 646 526 L886 279" fill="none" stroke="url(#goldTeal)" stroke-width="25" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M337 685 L545 489" fill="none" stroke="#0de7ca" stroke-width="6" opacity=".85"/>
  <path d="M892 620 L699 487" fill="none" stroke="#0de7ca" stroke-width="6" opacity=".75"/>

  <g transform="translate(618 430)">
    <path d="M0-102 C18-68 20-32 0 8 C-20-32-18-68 0-102Z" fill="url(#leaf)"/>
    <path d="M-19-42 C-58-69-88-66-108-55 C-78-20-48-8-10-7Z" fill="url(#leaf)"/>
    <path d="M19-42 C58-69 88-66 108-55 C78-20 48-8 10-7Z" fill="url(#leaf)"/>
    <path d="M-14-10 C-50-28-81-18-98-2 C-64 20-36 22-8 12Z" fill="url(#leaf)"/>
    <path d="M14-10 C50-28 81-18 98-2 C64 20 36 22 8 12Z" fill="url(#leaf)"/>
    <path d="M-5 8 C-32 5-50 17-61 31 C-34 42-18 39-2 26Z" fill="url(#leaf)"/>
    <path d="M5 8 C32 5 50 17 61 31 C34 42 18 39 2 26Z" fill="url(#leaf)"/>
    <rect x="-5" y="6" width="10" height="55" rx="5" fill="#09d6a2"/>
  </g>
</g>

<g filter="url(#glow)">
  <circle cx="338" cy="206" r="27" fill="#fff4bf" stroke="#ffdc63" stroke-width="7"/>
  <circle cx="905" cy="170" r="26" fill="#d8ffff" stroke="#54fff2" stroke-width="7"/>
  <circle cx="259" cy="695" r="28" fill="#ddffff" stroke="#23f3e2" stroke-width="8"/>
  <circle cx="967" cy="624" r="19" fill="#fff5c8" stroke="#ffd44d" stroke-width="6"/>
  <circle cx="854" cy="760" r="15" fill="#fff4c8" stroke="#ffd44d" stroke-width="5"/>
  <circle cx="257" cy="382" r="10" fill="#fff3c2" stroke="#ffc831" stroke-width="4"/>
</g>

<g font-family="Inter,Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle" filter="url(#smallGlow)">
  <text x="495" y="1012" font-size="205" fill="url(#wordGold)">420</text>
  <text x="790" y="1012" font-size="205" fill="url(#wordSilver)">Mail</text>
</g>
</svg>