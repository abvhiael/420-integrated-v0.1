<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>420Mail</title>
<link rel="icon" type="image/webp" href="./420mail-logo.webp">
<style>:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#101310;color:#f4f6f4}body{margin:0;max-width:980px;padding:2rem;margin-inline:auto;background:radial-gradient(circle at 50% 0,#0d2420 0,#101310 38%)}header{display:flex;gap:1rem;align-items:center;margin-bottom:1rem}.header-icon{display:block;width:72px;height:72px;object-fit:contain;flex:0 0 auto}h1{margin:.1rem 0}.brand-hero{display:flex;justify-content:center;align-items:center;width:100%;margin:0 auto 1.75rem;text-align:center}.brand-hero img{display:block;width:min(420px,82vw);max-width:100%;height:auto;margin:0 auto;object-fit:contain}main{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:1rem}.panel{border:1px solid #4c554c;border-radius:12px;padding:1rem;background:rgba(16,19,16,.78);backdrop-filter:blur(4px)}button,input,textarea{font:inherit}button{padding:.65rem .9rem}input,textarea{width:100%;box-sizing:border-box;padding:.65rem;margin:.25rem 0 .75rem;background:#151915;color:inherit;border:1px solid #667066;border-radius:8px}.message{display:block;width:100%;text-align:left;margin:.35rem 0;padding:.7rem;background:transparent;color:inherit;border:1px solid #4c554c;border-radius:8px}.small{opacity:.72;font-size:.9rem}.error{color:#ffb4ab}@media(max-width:700px){body{padding:1rem}main{grid-template-columns:1fr}.header-icon{width:64px;height:64px}.brand-hero img{width:min(360px,90vw)}}</style></head>
<body><header><img class="header-icon" src="./420mail-logo.webp" width="1254" height="1254" alt="420Mail logo"><div><h1>420Mail</h1><div class="small">identity-addressed ecosystem inbox</div></div></header>
<div class="brand-hero"><img src="./420mail-logo.webp" width="1254" height="1254" alt="420Mail logo"></div><main><section class="panel" aria-labelledby="inbox-title"><h2 id="inbox-title">Inbox</h2><button id="refresh">Refresh</button><div id="status" role="status"></div><div id="inbox"></div></section>
<section class="panel"><h2>Compose</h2><form id="compose"><label>Recipient<input name="recipient" autocomplete="off"></label><label>Subject<input name="subject" maxlength="200"></label><label>Message<textarea name="body" rows="8"></textarea></label><div class="small" id="draft-status" role="status">Draft not saved</div><button type="submit">Send</button> <button type="button" id="discard-draft">Discard draft</button></form><hr><h3>Drafts</h3><button type="button" id="refresh-drafts">Refresh drafts</button><div id="drafts"></div><hr><article id="reader"><p class="small">Select a message to read it.</p></article></section>
</main><script>
const statusEl=document.querySelector('#status'),inboxEl=document.querySelector('#inbox'),reader=document.querySelector('#reader'),draftsEl=document.querySelector('#drafts'),draftStatusEl=document.querySelector('#draft-status'),compose=document.querySelector('#compose');let draftId='',draftVersion=0,draftKey=crypto.randomUUID(),draftTimer=0,draftSaving=false;function status(s,bad=false){statusEl.textContent=s;statusEl.className=bad?'error':''}function draftStatus(s,bad=false){draftStatusEl.textContent=s;draftStatusEl.className=bad?'small error':'small'}async function api(path,opts={}){const r=await fetch(path,{headers:{'content-type':'application/json',...(opts.headers||{})},...opts});if(!r.ok){let e={};try{e=await r.json()}catch{}const err=new Error(e.message||('HTTP '+r.status));err.status=r.status;err.code=e.code||'';throw err}if(r.status===204)return null;return r.json()}function draftPayload(){const f=new FormData(compose);return{recipient:String(f.get('recipient')||''),subject:String(f.get('subject')||''),body:String(f.get('body')||''),source:'420/service/mail/v1'}}async function autosaveDraft(){if(draftSaving)return;draftSaving=true;try{const p=draftPayload();let view;if(!draftId){view=await api('/v1/drafts',{method:'POST',body:JSON.stringify({autosave_key:draftKey,...p})})}else{view=await api('/v1/drafts/'+encodeURIComponent(draftId),{method:'PUT',body:JSON.stringify({expected_version:draftVersion,...p})})}draftId=view.draft.id;draftVersion=view.draft.version;draftStatus('Draft saved · v'+draftVersion);await loadDrafts()}catch(err){if(err.status===409)draftStatus('Draft changed on another device. Recover the latest copy before saving again.',true);else draftStatus(err.message,true)}finally{draftSaving=false}}function scheduleDraft(){clearTimeout(draftTimer);draftStatus('Saving…');draftTimer=setTimeout(autosaveDraft,800)}async function loadDrafts(){try{const items=await api('/v1/drafts');draftsEl.replaceChildren(...items.map(d=>{const b=document.createElement('button');b.type='button';b.className='message';b.textContent=(d.subject||'(untitled)')+' · v'+d.version;b.onclick=()=>recoverDraft(d.id);return b}))}catch(err){draftStatus(err.message,true)}}async function recoverDraft(id){try{const v=await api('/v1/drafts/'+encodeURIComponent(id));compose.elements.recipient.value=v.draft.recipient||'';compose.elements.subject.value=v.draft.subject||'';compose.elements.body.value=v.body||'';draftId=v.draft.id;draftVersion=v.draft.version;draftKey=crypto.randomUUID();draftStatus('Recovered draft · v'+draftVersion)}catch(err){draftStatus(err.message,true)}}async function discardDraft(){if(!draftId){compose.reset();draftStatus('Draft not saved');return}try{await api('/v1/drafts/'+encodeURIComponent(draftId)+'?expected_version='+draftVersion,{method:'DELETE'});compose.reset();draftId='';draftVersion=0;draftKey=crypto.randomUUID();draftStatus('Draft discarded');await loadDrafts()}catch(err){draftStatus(err.status===409?'Draft changed on another device. Recover latest before discarding.':err.message,true)}}async function load(){status('Loading…');try{const p=await api('/v1/inbox');inboxEl.replaceChildren(...p.items.map(m=>{const b=document.createElement('button');b.className='message';b.textContent=m.subject+' — '+m.sender;b.onclick=()=>read(m.id);return b}));status(p.items.length?p.items.length+' message(s)':'Inbox empty')}catch(e){status(e.message,true)}}async function read(id){try{const d=await api('/v1/messages/'+encodeURIComponent(id));reader.innerHTML='';const h=document.createElement('h3');h.textContent=d.message.subject;const meta=document.createElement('p');meta.className='small';meta.textContent='from '+d.message.sender;const body=document.createElement('pre');body.style.whiteSpace='pre-wrap';body.textContent=d.body;reader.append(h,meta,body);await api('/v1/messages/'+encodeURIComponent(id)+'/read',{method:'POST'})}catch(e){status(e.message,true)}}document.querySelector('#refresh').onclick=load;document.querySelector('#refresh-drafts').onclick=loadDrafts;document.querySelector('#discard-draft').onclick=discardDraft;compose.addEventListener('input',scheduleDraft);compose.onsubmit=async e=>{e.preventDefault();clearTimeout(draftTimer);const f=new FormData(e.target);try{await api('/v1/messages',{method:'POST',body:JSON.stringify({idempotency_key:crypto.randomUUID(),sender:window.__420_IDENTITY__||'',recipient:f.get('recipient'),subject:f.get('subject'),body:f.get('body'),source:'420/service/mail/v1'})});if(draftId){try{await api('/v1/drafts/'+encodeURIComponent(draftId)+'?expected_version='+draftVersion,{method:'DELETE'})}catch{}}e.target.reset();draftId='';draftVersion=0;draftKey=crypto.randomUUID();draftStatus('Draft not saved');status('Sent');await Promise.all([load(),loadDrafts()])}catch(err){status(err.message,true)}};load();loadDrafts();
</script></body></html>
