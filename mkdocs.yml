site_name: 420Docs
site_description: Canonical documentation for the 420 Integrated ecosystem
repo_url: https://github.com/abvhiael/420-integrated-v0.1
repo_name: abvhiael/420-integrated-v0.1
edit_uri: edit/main/docs/
docs_dir: docs

site_dir: site

nav:
  - Home: index.md
  - Get Started:
      - Overview: getting-started/index.md
  - Use:
      - Overview: users/index.md
      - 420 Wallet:
          - Onboarding: users/wallet/index.md
          - Setup, Import & Protection: users/wallet/setup-import-and-protection.md
          - Send, Receive & Activity: users/wallet/send-receive-and-activity.md
          - Connect Applications: users/wallet/dapp-connections.md
          - Signing & Transaction Review: users/wallet/signing-and-transaction-review.md
          - Permissions & Sessions: users/wallet/permissions-and-sessions.md
          - Recovery & Device Safety: users/wallet/recovery-and-device-safety.md
          - Troubleshooting: users/wallet/troubleshooting.md
  - Build:
      - Overview: developers/index.md
  - Operate:
      - Overview: operators/index.md
  - Architecture:
      - Overview: architecture/index.md
      - System Overview: architecture/system-overview.md
      - Design Principles: architecture/design-principles.md
      - Genesis Architecture: architecture/genesis-architecture.md
      - Dependency Map: architecture/dependency-map.md
      - Trust Boundaries: architecture/trust-boundary-model.md
      - Chain:
          - Overview: architecture/chain/index.md
          - Execution Layer: architecture/chain/execution-layer.md
          - Accounts: architecture/chain/accounts.md
          - Transactions: architecture/chain/transactions.md
          - Blocks & State: architecture/chain/blocks-and-state.md
          - Gas, Fees & Native $420: architecture/chain/gas-fees-native-420.md
          - Network Identity & Configuration: architecture/chain/network-identity-and-configuration.md
      - Consensus:
          - Overview: architecture/consensus/index.md
          - Consensus Overview: architecture/consensus/consensus-overview.md
          - Validator Lifecycle: architecture/consensus/validator-lifecycle.md
          - Proposer Selection, Cohorts & Rotation: architecture/consensus/proposer-selection-cohorts-rotation.md
          - Epochs, Fork Choice, QCs & Finality: architecture/consensus/epochs-fork-choice-qcs-finality.md
          - Rewards & Issuance: architecture/consensus/rewards-and-issuance.md
          - Slashing & Safety: architecture/consensus/slashing-and-safety.md
          - Failure, Recovery & Operator Safety: architecture/consensus/failure-recovery-operator-safety.md
      - Infrastructure:
          - Overview: architecture/infrastructure/index.md
          - Infrastructure Overview: architecture/infrastructure/infrastructure-overview.md
          - fourtwentyd: architecture/infrastructure/fourtwentyd.md
          - node420: architecture/infrastructure/node420.md
          - 420Indexer: architecture/infrastructure/420indexer.md
          - RPC, Gateways & Network Ingress: architecture/infrastructure/rpc-gateways-network-ingress.md
          - Storage & Resource Infrastructure: architecture/infrastructure/storage-resource-infrastructure.md
          - 420AI Compute Infrastructure: architecture/infrastructure/420ai-compute-infrastructure.md
          - Oracle & External-Provider Infrastructure: architecture/infrastructure/oracle-external-provider-infrastructure.md
          - Observability, Status & Operator Services: architecture/infrastructure/observability-status-operator-services.md
      - Architecture Decisions: architecture/decisions/README.md
  - Reference:
      - Overview: reference/index.md
  - Troubleshooting:
      - Overview: troubleshooting/index.md
  - Documentation Project:
      - Roadmap: DOCS-ROADMAP.md
      - Contribution Policy: contributing/documentation.md
      - Application Documentation Contract: contributing/app-documentation-contract.md
      - Style Guide: contributing/style-guide.md
      - Diagram Conventions: contributing/diagrams.md

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  generator: false
