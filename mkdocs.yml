site_name: 420Docs
site_description: Canonical documentation for the 420 Integrated ecosystem
repo_url: https://github.com/abvhiael/420-integrated-v0.1
repo_name: abvhiael/420-integrated-v0.1
edit_uri: edit/main/docs/
docs_dir: docs

site_dir: site

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/index.md
      - Architecture Decisions: architecture/decisions/README.md
  - Documentation Project:
      - Roadmap: DOCS-ROADMAP.md
      - Contribution Policy: contributing/documentation.md
      - Application Documentation Contract: contributing/app-documentation-contract.md
      - Style Guide: contributing/style-guide.md
      - Diagram Conventions: contributing/diagrams.md

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  generator: false
