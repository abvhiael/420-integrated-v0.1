plugins { id 'com.android.application' version '8.8.2' }

def payHost = providers.gradleProperty('payHost').orElse('pay.420integrated.org').get()
def walletHost = providers.gradleProperty('walletHost').orElse('').get()
def chainId = providers.gradleProperty('payChainId').orElse('').get()
if (!(payHost ==~ /[a-z0-9.-]+\.[a-z]{2,}/) || (walletHost && !(walletHost ==~ /[a-z0-9.-]+\.[a-z]{2,}/)) ||
    (chainId && !(chainId ==~ /[1-9][0-9]{0,77}/))) {
    throw new GradleException('Invalid Pay Android deployment binding')
}

android {
    namespace 'io.fourtwenty.pay'
    compileSdk 35

    defaultConfig {
        applicationId 'io.fourtwenty.pay'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '0.13.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [payHost: payHost]
        buildConfigField 'String', 'PAY_HOST', '"' + payHost + '"'
        buildConfigField 'String', 'WALLET_HOST', '"' + walletHost + '"'
        buildConfigField 'String', 'CHAIN_ID', '"' + chainId + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/pay-assets')
}

tasks.register('bundlePaySdk', Exec) {
    workingDir rootProject.projectDir
    inputs.files(fileTree('../../web') { include 'payment-intent.js', 'package-lock.json' },
        fileTree('../../../packages/420-pay-sdk/src'), file('../../../packages/420-pay-sdk/package-lock.json'),
        file('../web/sdk.js'), file('../build-sdk.mjs'))
    outputs.file(layout.buildDirectory.file('generated/pay-assets/sdk.js'))
    commandLine 'node', 'build-sdk.mjs', layout.buildDirectory.file('generated/pay-assets/sdk.js').get().asFile.absolutePath
}
tasks.named('preBuild').configure { dependsOn 'bundlePaySdk' }

dependencies {
    implementation 'androidx.activity:activity:1.10.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
