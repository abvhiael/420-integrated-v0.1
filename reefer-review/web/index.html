<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reefer Review</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:3rem auto;padding:0 1rem;background:#111;color:#eee}a{color:#9ddc9d}.card{border:1px solid #444;border-radius:12px;padding:1rem;margin:1rem 0}input,textarea,select,button{font:inherit;padding:.7rem;margin:.3rem 0;width:100%;box-sizing:border-box}button{cursor:pointer}small{color:#aaa}</style></head><body><h1>Reefer Review</h1><p>Editorial news & independent publishing for the 420Integrated ecosystem.</p><small>Repository MVP. Paid external newsletters are disabled. Production identity, rights, storage, search, notification & mail adapters must be qualified before release.</small><section><h2>Published</h2><div id="feed"></div></section><section><h2>Draft</h2><input id="actor" placeholder="development actor, e.g. writer.420"><input id="title" placeholder="title"><textarea id="body" rows="8" placeholder="article"></textarea><select id="visibility"><option>PUBLIC</option><option>UNLISTED</option><option>FOLLOWERS</option><option>PRIVATE</option></select><button id="save">Create draft</button><pre id="status"></pre></section><script>
async function feed(){const r=await fetch('/v1/publications?limit=20');const j=await r.json();document.querySelector('#feed').innerHTML=(j.items||[]).map(x=>'<article class="card"><h3>'+esc(x.title)+'</h3><small>'+esc(x.author)+'</small><p>'+esc(x.summary||'')+'</p></article>').join('')||'<p>No public articles yet.</p>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.querySelector('#save').onclick=async()=>{const actor=document.querySelector('#actor').value;const payload={idempotency_key:crypto.randomUUID(),title:document.querySelector('#title').value,body:document.querySelector('#body').value,visibility:document.querySelector('#visibility').value};const r=await fetch('/v1/publications',{method:'POST',headers:{'content-type':'application/json','X-420-Actor':actor},body:JSON.stringify(payload)});document.querySelector('#status').textContent=JSON.stringify(await r.json(),null,2)};feed();
</script></body></html>
