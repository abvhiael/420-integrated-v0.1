zcash_proofs          = { git = "https://github.com/piratenetwork/librustzcash.git",           rev = "cc3c11cf57944fd56ec61674f6794f6f38fa43bf" }
zcash_history         = { git = "https://github.com/piratenetwork/librustzcash.git",           rev = "cc3c11cf57944fd56ec61674f6794f6f38fa43bf" }
zcash_transparent     = { git = "https://github.com/piratenetwork/librustzcash.git",           rev = "cc3c11cf57944fd56ec61674f6794f6f38fa43bf" }
