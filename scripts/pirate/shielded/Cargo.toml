[package]
name="pirate-shielded420"
version="0.1.0"
edition="2021"
[dependencies]
zcash_primitives={version="=0.29.0",features=["temporary-zcashd","transparent-inputs"]}
zcash_protocol="=0.10.0"
zcash_proofs="=0.29.0"
sapling-crypto="0.7"
orchard="=0.15.4"
zcash_note_encryption="0.4.1"
rand_core={version="0.6",features=["getrandom"]}
serde={version="1",features=["derive"]}
serde_json="1"
hex="0.4"
zeroize={version="1",features=["zeroize_derive"]}
blake2b_simd="1"
sha2="0.10"
zcash_transparent="=0.9.0"
incrementalmerkletree={version="0.8",features=["legacy-api"]}
libc="0.2"
redjubjub="=0.8.0"
[patch.crates-io]
sapling-crypto        = { git = "https://github.com/piratenetwork/sapling-crypto.git",        rev = "62fcf59a4d933244ee6280182c6cd3e5290e8a90" }
zcash_note_encryption = { git = "https://github.com/PirateNetwork/zcash_note_encryption.git", rev = "a8c90d1ce3737cc5898e0bf232ea325a5a61ec9f" }
orchard               = { git = "https://github.com/PirateNetwork/orchard.git",                rev = "c0545158b15259805e31ea1953867d6a507c08e4" } # main, orchard 0.15.4
halo2_gadgets         = { git = "https://github.com/PirateNetwork/halo2.git",                 rev = "261faaccd5a30c19bb8468600841a0dac305adf5" }
halo2_proofs          = { git = "https://github.com/PirateNetwork/halo2.git",                 rev = "261faaccd5a30c19bb8468600841a0dac305adf5" }
halo2_poseidon        = { git = "https://github.com/PirateNetwork/halo2.git",                 rev = "261faaccd5a30c19bb8468600841a0dac305adf5" }
# main
zcash_address         = { git = "https://github.com/piratenetwork/librustzcash.git",           rev = "cc3c11cf57944fd56ec61674f6794f6f38fa43bf" }
