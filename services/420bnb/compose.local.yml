# Local/staging-only infrastructure. No production credentials or booking launch authorization.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bnb
      POSTGRES_USER: bnb
      POSTGRES_PASSWORD: ${BNB_LOCAL_DB_PASSWORD:?set-test-only-db-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bnb -d bnb"]
      interval: 5s
      retries: 10
    volumes: ["bnb_data:/var/lib/postgresql/data"]
  api:
    build:
      context: ../..
      dockerfile: services/420bnb/Dockerfile
    environment:
      BNB_DATABASE_URL: postgresql://bnb:${BNB_LOCAL_DB_PASSWORD:?required}@postgres:5432/bnb
      BNB_IDENTITY_ASSERTION_SECRET: ${BNB_IDENTITY_ASSERTION_SECRET:?required-minimum-32-chars}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:8080:8080"]
volumes:
  bnb_data:
