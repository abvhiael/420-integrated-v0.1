<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>420Compliance — private independent review</title><script defer src="/private/review/console.js"></script><style>body{font:1rem/1.5 system-ui;max-width:62rem;margin:auto;padding:1rem;background:#f8f9fa;color:#171717}textarea,input,select,button{font:inherit;max-width:100%}textarea{width:100%;min-height:7rem}label{display:block;margin:1rem 0}button{padding:.6rem} :focus-visible{outline:3px solid #0645ad}</style></head><body><a href="#main">Skip to review</a><header><strong>420Compliance — private independent review</strong><button id="logout" disabled>End reviewer session</button></header><main id="main"><h1>Review a pinned draft</h1><p>This console records findings, impact evidence, conflict queues and candidate review signatures. It cannot publish, activate or legally approve policy.</p><p id="session" role="status">Checking reviewer authorization…</p><p id="status" role="alert"></p><form id="form"><fieldset disabled id="fields"><legend>Independent review</legend><label>Draft identifier<input name="draft_id" required pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,79}"></label><button type="button" id="inspect">Inspect current private draft</button><pre id="draft" aria-live="polite"></pre><label>Findings JSON array<textarea name="findings" spellcheck="false">[]</textarea></label><label>Verified impact evidence JSON<textarea name="impact" required spellcheck="false"></textarea></label><label>Conflicting rule IDs JSON array<textarea name="conflict_ids" spellcheck="false">[]</textarea></label><label>Review decision<select name="decision"><option value="FINDINGS_OPEN">Findings open</option><option value="CONFLICT_QUEUE">Conflict queue</option><option value="CONFLICT_RESOLVED">Resolve exact previously queued conflicts</option><option value="APPROVED_CANDIDATE">Signed review candidate — not legal approval</option></select></label><label>Expected review revision<input name="expected_review_revision" type="number" min="0" value="0" required></label><label>External signature proof JSON (required for review candidate)<textarea name="signature" spellcheck="false">{}</textarea></label><button type="submit">Record independent review</button></fieldset></form><pre id="receipt" aria-live="polite"></pre><noscript>This private console requires JavaScript; no review may be submitted without an authenticated reviewer session.</noscript></main></body></html>
