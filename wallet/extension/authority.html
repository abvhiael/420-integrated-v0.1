<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>420 Wallet Authority</title>
</head>
<body>
  <main>
    <h1>420 Wallet</h1>
    <p id="status">Preparing local wallet authority…</p>
    <section id="request" hidden>
      <strong id="kind"></strong>
      <div id="origin"></div>
      <pre id="details"></pre>
    </section>
    <form id="eoa-authority" hidden>
      <p>This transaction will be signed locally with your encrypted EOA key. Its password and key never leave this extension window.</p>
      <label for="eoa-password">Wallet password</label>
      <input id="eoa-password" type="password" autocomplete="current-password" required minlength="12">
      <button id="eoa-authorize" type="submit">Sign and broadcast this exact transaction</button>
    </form>
  </main>
  <script type="module" src="authority.js"></script>
</body>
</html>
